<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Test</title>
<style>
  body {
    margin: 0;
    padding: 2rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #14161a;
    color: #f2f4f8;
  }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  .boxes { display: flex; flex-wrap: wrap; gap: 1rem; }
  .box {
    width: 140px;
    height: 140px;
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    padding: 0.75rem;
    box-sizing: border-box;
    font-size: 0.8rem;
    font-weight: 600;
    color: #14161a;
  }
</style>
</head>
<body>
  <h1>Color Test</h1>
  <div class="boxes">
    <div class="box" style="background:#e2574c">#E2574C</div>
    <div class="box" style="background:#f0b429">#F0B429</div>
    <div class="box" style="background:#3fb27f">#3FB27F</div>
    <div class="box" style="background:#5b8def">#5B8DEF</div>
  </div>
</body>
</html>
