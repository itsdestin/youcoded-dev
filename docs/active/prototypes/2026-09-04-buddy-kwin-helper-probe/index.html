<meta charset="utf-8">
<title>KWin helper probe</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font:13px/1.45 system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #mascot{position:absolute;left:50%;top:26px;transform:translateX(-50%);
    width:130px;height:130px;border-radius:34px;cursor:grab;touch-action:none;
    background:radial-gradient(circle at 34% 30%,#7fd7ff,#2f6bd8 62%,#1b3f8f);
    box-shadow:0 12px 34px #0007, inset 0 -8px 20px #0004;
    display:grid;place-items:center;font-size:34px}
  #mascot.drag{cursor:grabbing;filter:brightness(1.12)}
  #panel{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 12px;
    background:#0e1430e8;border:1px solid #ffffff26;border-radius:12px}
  code{color:#8fe6b0;font:12px ui-monospace,monospace}
  .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  button{flex:1;min-width:64px;padding:7px 4px;border:0;border-radius:8px;
    background:#3355cc;color:#fff;font:600 12px system-ui;cursor:pointer;touch-action:manipulation}
  button.q{background:#8c2f3f}
  h4{margin:0 0 2px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#9fb2ff}
</style>

<div id="mascot">🙂</div>
<div id="panel">
  <h4>Drag me · then try the buttons</h4>
  <div>pos <code id="pos">—</code> · moves <code id="n">0</code></div>
  <div class="row">
    <button id="tl">↖ snap</button>
    <button id="br">snap ↘</button>
    <button id="ctr">centre</button>
    <button id="quit" class="q">quit</button>
  </div>
</div>

<script>
let pos = {x:0,y:0}, size = {w:300,h:300}, scr = {width:1707,height:1067}, n = 0;
const posEl = document.getElementById('pos'), nEl = document.getElementById('n');
const mascot = document.getElementById('mascot');

const draw = () => { posEl.textContent = `${Math.round(pos.x)}, ${Math.round(pos.y)}`; nEl.textContent = n; };
const moveTo = (x,y) => { pos.x = x; pos.y = y; n++; window.probe.move(x,y); draw(); };

window.probe.onInit(d => { pos = {...d.start}; size = d.win; scr = d.screen; draw(); });

// WHY this drag maths: we have no global cursor position on Wayland
// (getCursorScreenPoint() returns 0,0). But we DO know where our own window is,
// because we put it there. So: cursor-in-screen = windowPos + cursor-in-window.
// Keeping the grab point under the finger means newWindowPos = pos + (client - grab).
// The window chases the finger and the error self-corrects each frame — works
// identically for touch and touchpad, no movementX/pointer-lock needed.
let grab = null;
mascot.addEventListener('pointerdown', e => {
  grab = { x: e.clientX, y: e.clientY };
  window.probe.log(`pointerdown type=${e.pointerType} at ${e.clientX},${e.clientY}`);
  mascot.setPointerCapture(e.pointerId);
  mascot.classList.add('drag');
});
mascot.addEventListener('pointermove', e => {
  if (!grab) return;
  moveTo(pos.x + (e.clientX - grab.x), pos.y + (e.clientY - grab.y));
});
const end = e => { if (grab) window.probe.log('pointerup'); grab = null; mascot.classList.remove('drag'); };
mascot.addEventListener('pointerup', end);
mascot.addEventListener('pointercancel', end);

document.getElementById('tl').onclick  = () => moveTo(0, 0);
document.getElementById('br').onclick  = () => moveTo(scr.width - size.w, scr.height - size.h);
document.getElementById('ctr').onclick = () => moveTo((scr.width-size.w)/2, (scr.height-size.h)/2);
document.getElementById('quit').onclick = () => window.probe.quit();
</script>
