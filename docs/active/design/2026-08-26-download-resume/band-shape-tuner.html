<!doctype html><html><head><meta charset=utf-8><title>Band shape tuner</title>
<style>
 body{background:#B9CBB4;font-family:'Cascadia Mono',ui-monospace,monospace;margin:0;padding:22px;color:#222c26}
 .stage{width:560px}
 .card{background:#DCE7D8;border:1px solid rgba(255,152,0,.45);border-radius:12px;overflow:hidden}
 .bandbox{position:relative}
 .bandbox svg{display:block;width:100%}
 .lbl{position:absolute;left:0;right:0;top:3px;text-align:center;font-size:9px;line-height:1;
      font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#000}
 .body{padding:9px 12px 12px;font-size:12px}
 .sub{font-size:10px;color:#5c6b60;margin-top:2px}
 .rowline{display:flex;justify-content:center;font-size:10px;color:#5c6b60;margin-top:7px}
 .bar{height:6px;border-radius:3px;background:#c9d4c4;margin-top:4px;overflow:hidden}
 .bar i{display:block;height:100%;width:66%;background:#3b3b36}
 .panel{margin-top:22px;width:560px;background:#EDF2EA;border-radius:10px;padding:14px 16px}
 label{display:block;font-size:12px;margin:11px 0 3px}
 input[type=range]{width:100%}
 .val{float:right;font-weight:700}
 .out{margin-top:16px;padding:10px 12px;background:#25302a;color:#d8e6d4;border-radius:7px;
      font-size:13px;line-height:1.6;user-select:all}
 h2{font-size:14px;margin:0 0 4px}
 p.hint{font-size:11px;color:#5a6a5e;margin:2px 0 0}
</style></head><body>

<div class=stage>
 <div class=card>
  <div class=bandbox>
   <svg id=svg preserveAspectRatio="none"><path id=p fill="#FF9800"></path></svg>
   <div class=lbl>Download interrupted</div>
  </div>
  <div class=body>Qwen3.8-Flash-Next
   <div class=sub>UD-Q4_K_XL · Balanced quality and size — recommended</div>
   <div class=rowline>66% — 74.2 of 113.0 GB</div>
   <div class=bar><i></i></div>
  </div>
 </div>
</div>

<div class=panel>
 <h2>Drag until it looks right</h2>
 <p class=hint>Then read me the three numbers at the bottom — that's all I need.</p>

 <label>Sweep length — how far in from each end the curve starts <span class=val id=vR>60</span></label>
 <input type=range id=R min=8 max=240 value=60>

 <label>Depth — how far the ends drop below the flat part <span class=val id=vD>8</span></label>
 <input type=range id=D min=0 max=26 value=8>

 <label>Flat height — thickness of the band across the middle <span class=val id=vH>11</span></label>
 <input type=range id=H min=8 max=28 value=11>

 <label>Curve shape — 0 = straight ramp, 100 = very round <span class=val id=vT>55</span></label>
 <input type=range id=T min=0 max=100 value=55>

 <div class=out id=out></div>
</div>

<script>
 const W=558;
 const $=id=>document.getElementById(id);
 function draw(){
   const R=+$('R').value, D=+$('D').value, H=+$('H').value, T=+$('T').value;
   $('vR').textContent=R; $('vD').textContent=D; $('vH').textContent=H; $('vT').textContent=T;
   const total=H+D, t=T/100;
   // cubic on each side: tangent horizontal where it leaves the flat run,
   // tangent vertical as it meets the card edge
   const c1=R*(1-t), c2=R*t;
   const d=[
     `M0,0 H${W} V${total}`,
     `C${W-c1},${total} ${W-R+c2},${H} ${W-R},${H}`,
     `H${R}`,
     `C${c2},${H} ${c1},${total} 0,${total}`,
     'Z'
   ].join(' ');
   $('p').setAttribute('d',d);
   $('svg').setAttribute('viewBox',`0 0 ${W} ${total}`);
   $('svg').setAttribute('height',total);
   $('out').textContent=`sweep ${R} · depth ${D} · flat height ${H} · curve ${T}`;
 }
 ['R','D','H','T'].forEach(k=>$(k).addEventListener('input',draw));
 draw();
</script>
</body></html>
