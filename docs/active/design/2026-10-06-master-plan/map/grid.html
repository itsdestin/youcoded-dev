<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1600">
<title>YouCoded system grid</title>
<style>
:root{--bg:#14161a;--panel:#1b1e24;--cell:#20242b;--line:#2f343d;--fg:#e6e8ec;--dim:#9aa3b0;--accent:#6aa4ff;
--pill:#2b3top;--pill-bg:#2c313a;--pill-hot:#6b4a1c;--pill-hot-fg:#ffe2b0;--flag:#e5484d;
--c-import:#4f9dff;--c-channel:#3ecf8e;--c-cochange:#ff9f43;--c-event:#c084fc;--tint:106,164,255}
*{box-sizing:border-box}
body{margin:0;width:1600px;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 20px 8px;display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.meta{color:var(--dim);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 20px 10px;color:var(--dim);align-items:center}
.sw{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
#wrap{position:relative;margin:0 20px 20px}
#grid{display:grid;grid-template-columns:40px repeat(6,minmax(0,1fr)) minmax(0,.85fr) minmax(0,.6fr);gap:6px;position:relative;z-index:1}
.colh{font-weight:600;padding:4px 6px;text-align:center;background:var(--panel);border-radius:6px;font-size:14px}
.colh small{display:block;color:var(--dim);font-weight:400;font-size:13px}
.rowh{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;color:var(--dim);font-weight:600;background:var(--panel);border-radius:6px;padding:6px}
.cell{background:linear-gradient(0deg,rgba(var(--tint),var(--a,0)),rgba(var(--tint),var(--a,0))),var(--cell);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:56px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;position:relative}
.cell.empty{opacity:.45}
.pill{background:var(--pill-bg);border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:13px;white-space:nowrap;flex:none;display:inline-flex;gap:5px;align-items:center;max-width:100%}
.pill b{font-weight:500;color:var(--dim)}
.pill.cpl{border-color:var(--c-cochange);border-width:2px}
.pill.col{border-color:var(--flag);border-width:2px}
.pill.cpl.col{border-color:var(--flag);box-shadow:0 0 0 1px var(--c-cochange)}
.pill>span:first-child{max-width:190px;overflow:hidden;text-overflow:ellipsis}
.pill.hot{background:var(--pill-hot);color:var(--pill-hot-fg);border-color:#a0702c}
.pill.hot b{color:#f3c98a}
.bn{background:#f59e0b;color:#1b1200;border-radius:9px;padding:0 5px;font-weight:700;font-size:12px}
.fl{background:var(--flag);color:#fff;border-radius:4px;padding:0 4px;font-size:11px;font-weight:700}
svg#edges{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.brow{display:contents}
.bh{background:var(--panel);border-radius:6px;padding:6px;font-size:13px;word-break:break-all;grid-column:1/3}
.bh small{display:block;color:var(--dim)}
.bgrid{grid-template-columns:230px repeat(6,minmax(0,1fr)) minmax(0,.85fr) minmax(0,.6fr)!important}
.bgrid .cell{min-height:34px;padding:4px}
.bgrid .bh{grid-column:1}
</style></head><body>

 if(showFlags){const t=[];if(nb[name])t.push(nb[name]+' branches');for(const k of pf[name]||[])t.push(FL[k][1]);p.title=name+(t.length?': '+t.join('; '):'')}
 return p}
if(view==='grid'){
 grid.id='grid';head();
 for(const l of G.layers){
  grid.appendChild($('div','rowh',l));
  for(const s of cols){
   const c=G.cells[s+'/'+l]||{parts:[],lines:0};
   const d=$('div','cell'+(c.parts.length?'':' empty'));d.id='c-'+s+'-'+l;
   d.style.setProperty('--a',(c.lines?0.06+0.34*Math.log(1+c.lines)/maxLog:0).toFixed(3));
   for(const p of c.parts)d.appendChild(pill(p.part,p.files,nb[p.part]||0,true));
   grid.appendChild(d)}
 }
 requestAnimationFrame(()=>requestAnimationFrame(drawEdges));
}else{
 grid.classList.add('bgrid');head();
 for(const b of G.branches){
  const h=$('div','bh',b.branch);h.title=b.members.join('\n');h.appendChild($('small',null,`${b.memberCount>1?b.memberCount+' branches | ':''}${b.ahead} ahead | ${b.lastCommit} | ${b.partsTouched.length} parts`));grid.appendChild(h);
  for(const s of cols){
   const d=$('div','cell');
   const ps=b.partsTouched.filter(p=>sysOfPart(p.part)===s);
   if(!ps.length)d.classList.add('empty');
   for(const p of ps.slice(0,6))d.appendChild(pill(p.part,p.files,0,false));
   if(ps.length>6)d.appendChild($('span','pill','+'+(ps.length-6)+' more'));
   grid.appendChild(d)}
 }
}
function drawEdges(){
 const svg=document.getElementById('edges'),w=document.getElementById('wrap');
 const W=w.clientWidth,H=w.clientHeight;svg.setAttribute('width',W);svg.setAttribute('height',H);
 const R=w.getBoundingClientRect();
 const C={import:'--c-import',channel:'--c-channel',cochange:'--c-cochange',event:'--c-event'};
 const css=getComputedStyle(document.documentElement);
 const es=G.cellEdges.filter(e=>e.total>G.cellMedian);
 const mx=Math.max(...es.map(e=>e.total));
 let defs='';
 for(const e of es.sort((a,b)=>a.total-b.total)){
  const a=document.getElementById('c-'+e.from.replace('/','-')),b=document.getElementById('c-'+e.to.replace('/','-'));
  if(!a||!b)continue;
  const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
  const ax=ra.left+ra.width/2-R.left,ay=ra.top+ra.height/2-R.top,bx=rb.left+rb.width/2-R.left,by=rb.top+rb.height/2-R.top;
  const dom=Object.entries(e.byType).sort((x,y)=>y[1]-x[1])[0][0];
  const col=css.getPropertyValue(C[dom]||'--c-import').trim();
  const sw=0.8+7*Math.sqrt(e.total/mx);
  const mxp=(ax+bx)/2,myp=(ay+by)/2,dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
  const bow=Math.min(120,len*0.18);
  const cx=mxp-dy/len*bow,cy=myp+dx/len*bow;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',`M${ax},${ay} Q${cx},${cy} ${bx},${by}`);p.setAttribute('fill','none');p.setAttribute('stroke',col);
  p.setAttribute('stroke-width',sw.toFixed(1));p.setAttribute('stroke-opacity',(0.25+0.4*e.total/mx).toFixed(2));p.setAttribute('stroke-linecap','round');
  const t=document.createElementNS('http://www.w3.org/2000/svg','title');t.textContent=`${e.from} <-> ${e.to}: ${e.total} (${Object.entries(e.byType).map(x=>x.join(' ')).join(', ')})`;p.appendChild(t);
  svg.appendChild(p)}
}
