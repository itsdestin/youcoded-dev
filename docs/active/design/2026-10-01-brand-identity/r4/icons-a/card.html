<!doctype html>
<html><head><meta charset="utf-8">
<!-- card.html?i=i1 — one 1200x620 presentation card per character-led icon concept.
     Every small icon on it is a real-size raster from gen.mjs (no CSS shrinking), so the
     taskbar, Dock, tab and tray read exactly as they would on screen. -->
<link href="../../r3/fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:620px;overflow:hidden;font-family:'DM Sans',sans-serif;color:#21152C}
.card{width:1200px;height:620px;position:relative;background:linear-gradient(135deg,#FAF5FC,#F0E5F7)}
.chip{position:absolute;left:18px;top:16px;font:600 13px 'JetBrains Mono';letter-spacing:.06em;padding:6px 10px;border-radius:8px;background:rgba(33,21,44,.85);color:#fff;z-index:3}
.cap{font:500 10.5px 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:7px}
.px{image-rendering:pixelated}
</style><script src="data.js"></script></head><body>
<script>
const id = new URLSearchParams(location.search).get('i');
const o = OPTS.find(x => x.id === id);
const P = (s) => `png/${id}-${s}.png`;
const other = (i, s) => `<span style="display:block;width:${s}px;height:${s}px;border-radius:${s * .23}px;background:${['#2D7FF9', '#E8453C', '#1DB954', '#F5A623', '#5865F2', '#6B6F76'][i]}"></span>`;
const taskbar = (bg) => `<div style="display:flex;align-items:center;justify-content:center;gap:16px;height:46px;border-radius:9px;background:${bg}">${[0, 1, 2].map(i => other(i, 24)).join('')}<img src="${P(24)}" width="24" height="24">${[3, 4, 5].map(i => other(i, 24)).join('')}</div>`;
const tab = (dark) => {
  const bar = dark ? '#202124' : '#DEE1E6', act = dark ? '#35363A' : '#fff', fg = dark ? '#E8EAED' : '#202124';
  return `<div style="background:${bar};border-radius:9px;padding:6px 8px 6px;display:flex;gap:4px">
    <div style="background:${act};border-radius:8px;height:30px;width:200px;display:flex;align-items:center;gap:8px;padding:0 10px">
      <img src="png/${id}-tab-16.png" width="16" height="16"><span style="font:400 12px 'DM Sans';color:${fg};white-space:nowrap">YouCoded — yours</span></div>
    <div style="height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;opacity:.7"><span style="width:16px;height:16px;border-radius:4px;background:#E8453C"></span><span style="font:400 12px 'DM Sans';color:${fg};white-space:nowrap">Inbox (3)</span></div></div>`;
};
const tray = (bg, fg, w) => `<div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;height:34px;padding:0 12px;border-radius:8px;background:${bg}">
  <img src="png/${id}-tray${w ? '-w' : ''}-16.png" width="16" height="16">
  <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 6.5a9 9 0 0 1 12 0M4.3 9a5.5 5.5 0 0 1 7.4 0M6.6 11.5a2 2 0 0 1 2.8 0" fill="none" stroke="${fg}" stroke-width="1.4" stroke-linecap="round"/></svg>
  <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="${fg}"/></svg>
  <span style="font:500 12px 'DM Sans';color:${fg}">9:41</span></div>`;
const themes = o.themes ? `<div style="display:flex;gap:10px;margin-top:14px;justify-content:center">${Array.from({ length: o.themes }, (_, i) => `<img src="png/${id}-th${i}-256.png" width="62" height="62">`).join('')}</div><div class="cap" style="text-align:center;margin-top:6px">The view changes with your theme</div>` : '';
document.body.innerHTML = `<div class="card"><div class="chip">${id.toUpperCase()} · ${o.label}</div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:470px;background:radial-gradient(400px 360px at 50% 45%,#fff 0%,rgba(255,255,255,0) 70%),url(../../r3/assets/cotton-candy-sky.webp) center/cover">
    <div style="position:absolute;inset:0;background:rgba(250,245,252,.55)"></div>
    <div style="position:absolute;left:0;right:0;top:${o.themes ? 66 : 110}px;display:flex;flex-direction:column;align-items:center">
      <img src="png/${id}-512.png" width="310" height="310" style="filter:drop-shadow(0 22px 34px rgba(70,25,110,.28))">${themes}</div>
    <div style="position:absolute;left:28px;right:28px;bottom:22px;font:500 14.5px/1.45 'DM Sans';color:#3A2650">${o.note}</div>
  </div>
  <div style="position:absolute;left:500px;right:28px;top:20px;bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;align-content:start">
    <div style="grid-column:1/3"><div class="cap">Windows taskbar · real 24px</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${taskbar('#1F1F23')}${taskbar('#EEF0F5')}</div></div>
    <div style="grid-column:1/3"><div class="cap">Mac Dock</div>
      <div style="display:flex;justify-content:center;padding:14px 0;border-radius:14px;background:url(../../r3/assets/cotton-candy-sky.webp) center 30%/cover">
        <div style="display:flex;gap:11px;padding:9px 13px;border-radius:20px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.6)">
          ${[0, 1, 2].map(i => other(i, 56)).join('')}<img src="${P(128)}" width="56" height="56">${[3, 4].map(i => other(i, 56)).join('')}</div></div></div>
    <div style="grid-column:1/3"><div class="cap">Browser tab · its own 16px drawing</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${tab(false)}${tab(true)}</div></div>
    <div><div class="cap">Real sizes</div><div style="display:flex;gap:16px;align-items:flex-end">
      ${[64, 32, 24, 16].map(s => `<div style="text-align:center"><img src="${P(s)}" width="${s}" height="${s}" style="display:block;margin:0 auto"><div class="cap" style="margin:4px 0 0">${s}</div></div>`).join('')}</div></div>
    <div><div class="cap">16px, 6× · icon · tab · tray</div><div style="display:flex;gap:10px">
      <img class="px" src="${P(16)}" width="64" height="64" style="background:#fff;border-radius:8px">
      <img class="px" src="png/${id}-tab-16.png" width="64" height="64" style="background:#fff;border-radius:8px">
      <img class="px" src="png/${id}-tray-w-16.png" width="64" height="64" style="background:#1F1F23;border-radius:8px"></div></div>
    <div style="grid-column:1/3"><div class="cap">Tray, next to the clock · one colour</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${tray('#1F1F23', '#fff', true)}${tray('#E9E8EE', '#1A1A1A', false)}</div></div>
  </div></div>`;
</script></body></html>
