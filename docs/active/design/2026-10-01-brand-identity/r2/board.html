<!doctype html>
<html><head><meta charset="utf-8">
<!-- board.html?t=<territory>&b=<board> — renders one 1440x900 board of one brand territory.
     WHY a query-string page: shoot.sh screenshots every territory x board from this one file,
     so all four directions are framed identically. -->
<link href="fonts/fonts.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
#b{width:1440px;height:900px;position:relative;overflow:hidden}
</style>
<script src="kit.js"></script>
</head><body><div id="b"></div>
<script>
const p = new URLSearchParams(location.search);
const t = p.get('t'), b = p.get('b');
const s = document.createElement('script');
s.src = `t/${t}/boards.js`;
s.onload = () => {
  const T = window.TERR;
  // A territory's boards may be sync (string) or async (returning a string).
  Promise.resolve(T.boards[b]()).then(html => { document.getElementById('b').innerHTML = html; document.title = 'ready'; });
};
document.head.append(s);
</script></body></html>
