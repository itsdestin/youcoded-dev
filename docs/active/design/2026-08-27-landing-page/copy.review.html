<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Landing page copy — review</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1f1d1a;--dim:#6b665e;--line:#e3ddd2;--accent:#b8583f;--ok:#2e7d4f;--no:#b23b3b;--edit:#8a5a00;--okbg:#e6f3ea;--nobg:#f9e3e3;--editbg:#fff3d6}
@media(prefers-color-scheme:dark){:root{--bg:#161513;--card:#201e1b;--ink:#ece7dd;--dim:#a19a8e;--line:#37332d;--okbg:#1d3326;--nobg:#3a1f1f;--editbg:#3a2e12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
code{font:12.5px/1.4 "JetBrains Mono",ui-monospace,monospace;background:rgba(127,127,127,.12);padding:1px 4px;border-radius:4px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0}
.prog{color:var(--dim);font-size:13px}.prog b{color:var(--ink)}
.filters button,.submit{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.submit{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.submit[disabled]{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:220px 1fr;gap:0;max-width:1400px;margin:0 auto}
nav{position:sticky;top:52px;align-self:start;padding:18px 12px;font-size:13px;max-height:calc(100vh - 52px);overflow:auto}
nav a{display:flex;justify-content:space-between;gap:8px;color:var(--dim);text-decoration:none;padding:5px 8px;border-radius:6px}
nav a:hover{background:var(--card)}nav a span{color:var(--ok)}nav a span.left{color:var(--dim)}
main{padding:18px 24px 120px}
section{margin:0 0 26px}section h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.note{color:var(--dim);font-size:13px;margin:0 0 10px}
.row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr) 150px;gap:0;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.row.ok{border-color:var(--ok)}.row.no{border-color:var(--no)}.row.edit{border-color:var(--edit)}
.old{padding:10px 12px;color:var(--dim);font-size:13.5px;border-right:1px solid var(--line);background:rgba(127,127,127,.04);overflow-wrap:anywhere}
.old:empty::before{content:"— new —";font-style:italic}
.new{padding:10px 12px;outline:0;overflow-wrap:anywhere;min-height:44px}
.new:focus{background:var(--editbg)}
.new .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-right:4px}
.acts{display:flex;flex-direction:column;gap:6px;padding:8px;border-left:1px solid var(--line);align-items:stretch}
.acts button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:5px 8px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.row.ok .acts .b-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.row.no .acts .b-no{background:var(--nobg);border-color:var(--no);color:var(--no)}
.row.edit .acts .b-edit{background:var(--editbg);border-color:var(--edit);color:var(--edit)}
.acts input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit;font-size:12.5px;background:transparent;color:var(--ink);width:100%}
.hide{display:none}
.destin{grid-column:1/-1;padding:6px 12px;border-top:1px dashed var(--line);font-size:13px;color:var(--edit)}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 20px;font-size:13px;color:var(--dim);display:flex;gap:12px;align-items:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:none}.row{grid-template-columns:1fr}.old{border-right:0;border-bottom:1px solid var(--line)}.acts{flex-direction:row;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>

computer \u2014 working in your files, on every device you own.`", "destin": "", "id": "02-hero-02", "oldHtml": "\u2014", "newHtml": "New subhead: <code>One app for Claude, hundreds of cloud models, or one that runs free on your own computer \u2014 working in your files, on every device you own.<\/code>"}, {"old": "\u2014", "new": "New button: `Download` (links to Get started)", "destin": "", "id": "02-hero-03", "oldHtml": "\u2014", "newHtml": "New button: <code>Download<\/code> (links to Get started)"}, {"old": "\u2014", "new": "New button: `See it work` (links to the new \"Try it\" embed section)", "destin": "", "id": "02-hero-04", "oldHtml": "\u2014", "newHtml": "New button: <code>See it work<\/code> (links to the new &quot;Try it&quot; embed section)"}]}, {"title": "Try it (new embed section \u2014 no predecessor)", "note": "This entire section is new; the old page had no live demo, only static hand-built mockups further down.", "rows": [{"old": "\u2014", "new": "Section label: `Try it`", "destin": "", "id": "03-try-it-new-embed-section-00", "oldHtml": "\u2014", "newHtml": "Section label: <code>Try it<\/code>"}, {"old": "\u2014", "new": "Headline: `This is the app. Click around.`", "destin": "", "id": "03-try-it-new-embed-section-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>This is the app. Click around.<\/code>"}, {"old": "\u2014", "new": "Body: `Type a message, open the model picker, switch the look \u2014 it's the real interface running on a pretend computer. Nothing you do here leaves this page.`", "destin": "", "id": "03-try-it-new-embed-section-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Type a message, open the model picker, switch the look \u2014 it&#x27;s the real interface running on a pretend computer. Nothing you do here leaves this page.<\/code>"}, {"old": "\u2014", "new": "Button: `Start the demo`", "destin": "", "id": "03-try-it-new-embed-section-03", "oldHtml": "\u2014", "newHtml": "Button: <code>Start the demo<\/code>"}, {"old": "\u2014", "new": "Theme swatch labels: `Midnight` \u00b7 `Cr\u00e8me` \u00b7 `Light` \u00b7 `Dark` \u00b7 `Halftone` \u00b7 `Meadow Mist` \u00b7 `Golden Sunbreak`", "destin": "", "id": "03-try-it-new-embed-section-04", "oldHtml": "\u2014", "newHtml": "Theme swatch labels: <code>Midnight<\/code> \u00b7 <code>Cr\u00e8me<\/code> \u00b7 <code>Light<\/code> \u00b7 <code>Dark<\/code> \u00b7 <code>Halftone<\/code> \u00b7 <code>Meadow Mist<\/code> \u00b7 <code>Golden Sunbreak<\/code>"}]}, {"title": "What is this?", "note": "", "rows": [{"old": "Section label: `What is this?`", "new": "(unchanged \u2014 not respecified in Task 12 brief, so I'm carrying it forward as-is)", "destin": "", "id": "04-what-is-this-00", "oldHtml": "Section label: <code>What is this?<\/code>", "newHtml": "<span class=\"tag\">(unchanged \u2014 not respecified in Task 12 brief, so I&#x27;m carrying it forward as-is)<\/span>"}, {"old": "Section title: `More than a chatbot.`", "new": "(unchanged \u2014 not respecified in Task 12 brief)", "destin": "", "id": "04-what-is-this-01", "oldHtml": "Section title: <code>More than a chatbot.<\/code>", "newHtml": "<span class=\"tag\">(unchanged \u2014 not respecified in Task 12 brief)<\/span>"}, {"old": "Paragraph 1: `YouCoded is an add-on of sorts for Claude Code, a powerful agentic AI tool from Anthropic that can create and edit any type of file, search the web, run terminal commands, and navigate your screen. While Claude Code was designed for coding, YouCoded turns it into something else entirely \u2014 a fully capable and customizable agentic AI assistant that doesn't require you to know how to use AI or understand what \"agentic\" means. With YouCoded, you can teach Claude to navigate emails from any provider, read and summarize your texts, rebuild your spreadsheets, help you study, and more. You get the most intriguing and intuitive form of AI available today, all without needing to become a fratty tech-bro to do it.`", "new": "`Most AI lives in a chat box on someone else's website. YouCoded Agent lives on your computer and phone, working in your own files \u2014 with Claude, hundreds of other models, or one that runs free on your machine. The look, the plugins, and your data are all yours.` **draft 1 \u2014 Destin: \"don't love any of these; fine for now\"**", "destin": "", "id": "04-what-is-this-02", "oldHtml": "Paragraph 1: <code>YouCoded is an add-on of sorts for Claude Code, a powerful agentic AI tool from Anthropic that can create and edit any type of file, search the web, run terminal commands, and navigate your screen. While Claude Code was designed for coding, YouCoded turns it into something else entirely \u2014 a fully capable and customizable agentic AI assistant that doesn&#x27;t require you to know how to use AI or understand what &quot;agentic&quot; means. With YouCoded, you can teach Claude to navigate emails from any provider, read and summarize your texts, rebuild your spreadsheets, help you study, and more. You get the most intriguing and intuitive form of AI available today, all without needing to become a fratty tech-bro to do it.<\/code>", "newHtml": "<code>Most AI lives in a chat box on someone else&#x27;s website. YouCoded Agent lives on your computer and phone, working in your own files \u2014 with Claude, hundreds of other models, or one that runs free on your machine. The look, the plugins, and your data are all yours.<\/code> <b>draft 1 \u2014 Destin: &quot;don&#x27;t love any of these; fine for now&quot;<\/b>"}, {"old": "Paragraph 2: `YouCoded combines that powerful AI with a themeable chat UI, a community marketplace to share and download \"skills\"... multiplayer mini-games, custom integrations with external services, and remote access from any browser.`", "new": "(removed \u2014 folded into the single paragraph above)", "destin": "", "id": "04-what-is-this-03", "oldHtml": "Paragraph 2: <code>YouCoded combines that powerful AI with a themeable chat UI, a community marketplace to share and download &quot;skills&quot;... multiplayer mini-games, custom integrations with external services, and remote access from any browser.<\/code>", "newHtml": "<span class=\"tag\">(removed \u2014 folded into the single paragraph above)<\/span>"}, {"old": "Paragraph 3 (permission note): `Nothing happens without your permission. YouCoded will always ask before taking any action.`", "new": "`Nothing happens without your permission. YouCoded Agent asks before it acts.`", "destin": "", "id": "04-what-is-this-04", "oldHtml": "Paragraph 3 (permission note): <code>Nothing happens without your permission. YouCoded will always ask before taking any action.<\/code>", "newHtml": "<code>Nothing happens without your permission. YouCoded Agent asks before it acts.<\/code>"}]}, {"title": "Row 1 \u2014 One app, any AI", "note": "*(New page structure \u2014 the nine showcase rows replace the old seven; there&#x27;s no clean 1-to-1 mapping between old and new rows. See the &quot;Removed&quot; section at the bottom for everything from the old showcase that isn&#x27;t carried forward.)*", "rows": [{"old": "\u2014", "new": "Label: `One app, any AI`", "destin": "", "id": "05-row-1-one-app-any-ai-00", "oldHtml": "\u2014", "newHtml": "Label: <code>One app, any AI<\/code>"}, {"old": "\u2014", "new": "Headline: `Pick the AI. Keep the conversation.`", "destin": "", "id": "05-row-1-one-app-any-ai-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Pick the AI. Keep the conversation.<\/code>"}, {"old": "\u2014", "new": "Body: `Claude with your plan. Hundreds of models through OpenRouter. Or a model that runs on your own computer \u2014 free, offline, private. Switch mid-conversation; nothing is lost.`", "destin": "", "id": "05-row-1-one-app-any-ai-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Claude with your plan. Hundreds of models through OpenRouter. Or a model that runs on your own computer \u2014 free, offline, private. Switch mid-conversation; nothing is lost.<\/code>"}]}, {"title": "Row 2 \u2014 It actually does things", "note": "", "rows": [{"old": "\u2014", "new": "Label: `It actually does things`", "destin": "", "id": "06-row-2-it-actually-does-t-00", "oldHtml": "\u2014", "newHtml": "Label: <code>It actually does things<\/code>"}, {"old": "\u2014", "new": "Headline: `Give it a folder. It asks before it touches anything.`", "destin": "", "id": "06-row-2-it-actually-does-t-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Give it a folder. It asks before it touches anything.<\/code>"}, {"old": "\u2014", "new": "Body: `It reads your files, writes new ones, runs the steps, and searches the web. Every action that changes something shows up as a question first \u2014 and every \"always allow\" you grant is listed in one screen where you can take it back.`", "destin": "", "id": "06-row-2-it-actually-does-t-02", "oldHtml": "\u2014", "newHtml": "Body: <code>It reads your files, writes new ones, runs the steps, and searches the web. Every action that changes something shows up as a question first \u2014 and every &quot;always allow&quot; you grant is listed in one screen where you can take it back.<\/code>"}]}, {"title": "Row 3 \u2014 Your projects, in one place", "note": "", "rows": [{"old": "\u2014", "new": "Label: `Your projects, in one place`", "destin": "", "id": "07-row-3-your-projects-in-o-00", "oldHtml": "\u2014", "newHtml": "Label: <code>Your projects, in one place<\/code>"}, {"old": "\u2014", "new": "Headline: `Files, chats, and instructions \u2014 together.`", "destin": "", "id": "07-row-3-your-projects-in-o-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Files, chats, and instructions \u2014 together.<\/code>"}, {"old": "\u2014", "new": "Body: `Open spreadsheets, PDFs, documents, and images without leaving the app. Edit a file next to the conversation about it. Search everything you've ever said in a project.`", "destin": "", "id": "07-row-3-your-projects-in-o-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Open spreadsheets, PDFs, documents, and images without leaving the app. Edit a file next to the conversation about it. Search everything you&#x27;ve ever said in a project.<\/code>"}]}, {"title": "Row 4 \u2014 Stay organized", "note": "", "rows": [{"old": "\u2014", "new": "Label: `Stay organized`", "destin": "", "id": "08-row-4-stay-organized-00", "oldHtml": "\u2014", "newHtml": "Label: <code>Stay organized<\/code>"}, {"old": "\u2014", "new": "Headline: `Tags, notes, and one-tap shortcuts.`", "destin": "", "id": "08-row-4-stay-organized-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Tags, notes, and one-tap shortcuts.<\/code>"}, {"old": "\u2014", "new": "Body: `Tag and annotate conversations, filter by tag, pin the ones that matter. Quick chips run the things you do every day in one tap. A project's instructions are a tab you can read and edit, not a hidden file.`", "destin": "", "id": "08-row-4-stay-organized-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Tag and annotate conversations, filter by tag, pin the ones that matter. Quick chips run the things you do every day in one tap. A project&#x27;s instructions are a tab you can read and edit, not a hidden file.<\/code>"}]}, {"title": "Row 5 \u2014 Follow you everywhere", "note": "", "rows": [{"old": "\u2014", "new": "Label: `Follow you everywhere`", "destin": "", "id": "09-row-5-follow-you-everywh-00", "oldHtml": "\u2014", "newHtml": "Label: <code>Follow you everywhere<\/code>"}, {"old": "\u2014", "new": "Headline: `Start on your laptop. Finish on your phone.`", "destin": "", "id": "09-row-5-follow-you-everywh-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Start on your laptop. Finish on your phone.<\/code>"}, {"old": "\u2014", "new": "Body: `Windows, macOS, Linux, Android, and any browser. Your conversations and files stay in sync through your own private GitHub, so what you started here is waiting there.`", "destin": "", "id": "09-row-5-follow-you-everywh-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Windows, macOS, Linux, Android, and any browser. Your conversations and files stay in sync through your own private GitHub, so what you started here is waiting there.<\/code>"}]}, {"title": "Row 6 \u2014 Make it yours", "note": "", "rows": [{"old": "\u2014", "new": "Label: `Make it yours`", "destin": "", "id": "10-row-6-make-it-yours-00", "oldHtml": "\u2014", "newHtml": "Label: <code>Make it yours<\/code>"}, {"old": "\u2014", "new": "Headline: `Describe a look. Install a plugin. Share both.`", "destin": "", "id": "10-row-6-make-it-yours-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Describe a look. Install a plugin. Share both.<\/code>"}, {"old": "\u2014", "new": "Body: `Build a theme by describing it \u2014 wallpapers, colors, mascots. Browse 300+ plugins from the WeCoded marketplace: journaling, a personal encyclopedia, calendar and email integrations, and whatever your friends publish.`", "destin": "", "id": "10-row-6-make-it-yours-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Build a theme by describing it \u2014 wallpapers, colors, mascots. Browse 300+ plugins from the WeCoded marketplace: journaling, a personal encyclopedia, calendar and email integrations, and whatever your friends publish.<\/code>"}]}, {"title": "Row 7 \u2014 Play while it works", "note": "", "rows": [{"old": "\u2014", "new": "Label: `Play while it works`", "destin": "", "id": "11-row-7-play-while-it-work-00", "oldHtml": "\u2014", "newHtml": "Label: <code>Play while it works<\/code>"}, {"old": "\u2014", "new": "Headline: `Challenge a friend while it thinks.`", "destin": "", "id": "11-row-7-play-while-it-work-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Challenge a friend while it thinks.<\/code>"}, {"old": "\u2014", "new": "Body: `Long tasks take a minute. Play Connect Four with a friend in the side panel, see who's online, and get back to the answer when it's ready.`", "destin": "", "id": "11-row-7-play-while-it-work-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Long tasks take a minute. Play Connect Four with a friend in the side panel, see who&#x27;s online, and get back to the answer when it&#x27;s ready.<\/code>"}]}, {"title": "Row 8 \u2014 For builders", "note": "", "rows": [{"old": "\u2014", "new": "Label: `For builders`", "destin": "", "id": "12-row-8-for-builders-00", "oldHtml": "\u2014", "newHtml": "Label: <code>For builders<\/code>"}, {"old": "\u2014", "new": "Headline: `Claude Code inside, your own agent beside it.`", "destin": "", "id": "12-row-8-for-builders-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Claude Code inside, your own agent beside it.<\/code>"}, {"old": "\u2014", "new": "Body: `Run Claude Code as a first-class session next to the app's own agent. Review, stage, and commit changes without leaving the window. Connect tools over MCP. Download and run local models with a GPU-fit check.`", "destin": "", "id": "12-row-8-for-builders-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Run Claude Code as a first-class session next to the app&#x27;s own agent. Review, stage, and commit changes without leaving the window. Connect tools over MCP. Download and run local models with a GPU-fit check.<\/code>"}]}, {"title": "Row 9 \u2014 Roadmap (new; marked &quot;coming after 1.3&quot;, drawn as a sketch, not a real screenshot)", "note": "", "rows": [{"old": "\u2014", "new": "Label: `Roadmap` + chip `Coming after 1.3`", "destin": "", "id": "13-row-9-roadmap-new-marked-00", "oldHtml": "\u2014", "newHtml": "Label: <code>Roadmap<\/code> + chip <code>Coming after 1.3<\/code>"}, {"old": "\u2014", "new": "Headline: `Hand it off.`", "destin": "", "id": "13-row-9-roadmap-new-marked-01", "oldHtml": "\u2014", "newHtml": "Headline: <code>Hand it off.<\/code>"}, {"old": "\u2014", "new": "Body: `Set up a job once \u2014 what to do, which tools it may use, where to stop and check with you \u2014 then run it on a schedule or send it from your phone. Results and approvals land in an inbox. First: run now and scheduled runs. Later: kick off from an incoming email or a changed file.`", "destin": "", "id": "13-row-9-roadmap-new-marked-02", "oldHtml": "\u2014", "newHtml": "Body: <code>Set up a job once \u2014 what to do, which tools it may use, where to stop and check with you \u2014 then run it on a schedule or send it from your phone. Results and approvals land in an inbox. First: run now and scheduled runs. Later: kick off from an incoming email or a changed file.<\/code>"}]}, {"title": "Removed (old showcase content with no predecessor in the new nine rows)", "note": "The old page&#x27;s &quot;Everything the app gives you&quot; section had 7 rows plus a 10-item accordion. None of the new 9 rows are a rename of an old row in the same slot \u2014 the whole section was rewritten. For completeness, here is every heading being cut, so you can confirm none of it needs to survive somewhere:", "rows": [{"old": "Section title: `Everything the app gives you.`", "new": "(removed \u2014 new section has no equivalent single headline above the 9 rows; Row 1 is the first thing shown after \"What is this?\")", "destin": "", "id": "14-removed-old-showcase-con-00", "oldHtml": "Section title: <code>Everything the app gives you.<\/code>", "newHtml": "<span class=\"tag\">(removed \u2014 new section has no equivalent single headline above the 9 rows; Row 1 is the first thing shown after &quot;What is this?&quot;)<\/span>"}, {"old": "Row: `Theme Builder` \u2014 \"Build a theme just by describing it.\"", "new": "(removed as a standalone row \u2014 the theme-building idea now lives inside Row 6 \"Make it yours\")", "destin": "", "id": "14-removed-old-showcase-con-01", "oldHtml": "Row: <code>Theme Builder<\/code> \u2014 &quot;Build a theme just by describing it.&quot;", "newHtml": "<span class=\"tag\">(removed as a standalone row \u2014 the theme-building idea now lives inside Row 6 &quot;Make it yours&quot;)<\/span>"}, {"old": "Row: `WeCoded Marketplace` \u2014 \"Browse, share, and download everything that makes the app yours.\"", "new": "(removed as a standalone row \u2014 folded into Row 6)", "destin": "", "id": "14-removed-old-showcase-con-02", "oldHtml": "Row: <code>WeCoded Marketplace<\/code> \u2014 &quot;Browse, share, and download everything that makes the app yours.&quot;", "newHtml": "<span class=\"tag\">(removed as a standalone row \u2014 folded into Row 6)<\/span>"}, {"old": "Row: `Journaling & Personal History` \u2014 \"Talk about your day. The structure happens on its own.\"", "new": "(removed \u2014 no equivalent row; journaling is mentioned once, in Row 6's body, as a marketplace example)", "destin": "", "id": "14-removed-old-showcase-con-03", "oldHtml": "Row: <code>Journaling &amp; Personal History<\/code> \u2014 &quot;Talk about your day. The structure happens on its own.&quot;", "newHtml": "<span class=\"tag\">(removed \u2014 no equivalent row; journaling is mentioned once, in Row 6&#x27;s body, as a marketplace example)<\/span>"}, {"old": "Row: `Cross-Device Backup & Sync` \u2014 \"Start anywhere. Pick up everywhere.\"", "new": "(removed as a standalone row \u2014 the sync idea now lives inside Row 5 \"Follow you everywhere\")", "destin": "", "id": "14-removed-old-showcase-con-04", "oldHtml": "Row: <code>Cross-Device Backup &amp; Sync<\/code> \u2014 &quot;Start anywhere. Pick up everywhere.&quot;", "newHtml": "<span class=\"tag\">(removed as a standalone row \u2014 the sync idea now lives inside Row 5 &quot;Follow you everywhere&quot;)<\/span>"}, {"old": "Row: `Multiplayer Games` \u2014 \"Play with friends while Claude works.\"", "new": "(removed as a standalone row \u2014 replaced by Row 7 \"Play while it works,\" same idea, new wording)", "destin": "", "id": "14-removed-old-showcase-con-05", "oldHtml": "Row: <code>Multiplayer Games<\/code> \u2014 &quot;Play with friends while Claude works.&quot;", "newHtml": "<span class=\"tag\">(removed as a standalone row \u2014 replaced by Row 7 &quot;Play while it works,&quot; same idea, new wording)<\/span>"}, {"old": "Row: `Integrations` \u2014 18-tag wall (Google Drive, Google Docs, Google Sheets, Google Slides, Google Calendar, Gmail, Google Messages, iMessage, iCloud, Apple Notes, Apple Reminders, Apple Calendar, Apple Mail, Todoist, GitHub, Chrome, Safari, Canva)", "new": "(removed entirely \u2014 no per-service tag wall anywhere on the new page)", "destin": "", "id": "14-removed-old-showcase-con-06", "oldHtml": "Row: <code>Integrations<\/code> \u2014 18-tag wall (Google Drive, Google Docs, Google Sheets, Google Slides, Google Calendar, Gmail, Google Messages, iMessage, iCloud, Apple Notes, Apple Reminders, Apple Calendar, Apple Mail, Todoist, GitHub, Chrome, Safari, Canva)", "newHtml": "<span class=\"tag\">(removed entirely \u2014 no per-service tag wall anywhere on the new page)<\/span>"}, {"old": "Row: `Other features` \u2014 \"Everything else you get.\" \u2014 10-item accordion (Claude Code on Android \u00b7 Better-than-native Remote Access \u00b7 Cross-Device Sync & Restore \u00b7 Themes, Wallpapers & Buddies \u00b7 WeCoded Community Marketplace \u00b7 Skills & External Integrations \u00b7 Multiplayer Mini-Games \u00b7 Permission & Safety Controls \u00b7 Quality of Life Features \u00b7 Uses Your Existing Claude Subscription)", "new": "(removed entirely \u2014 no accordion on the new page; individual ideas are scattered across Rows 1\u20138 in short form)", "destin": "", "id": "14-removed-old-showcase-con-07", "oldHtml": "Row: <code>Other features<\/code> \u2014 &quot;Everything else you get.&quot; \u2014 10-item accordion (Claude Code on Android \u00b7 Better-than-native Remote Access \u00b7 Cross-Device Sync &amp; Restore \u00b7 Themes, Wallpapers &amp; Buddies \u00b7 WeCoded Community Marketplace \u00b7 Skills &amp; External Integrations \u00b7 Multiplayer Mini-Games \u00b7 Permission &amp; Safety Controls \u00b7 Quality of Life Features \u00b7 Uses Your Existing Claude Subscription)", "newHtml": "<span class=\"tag\">(removed entirely \u2014 no accordion on the new page; individual ideas are scattered across Rows 1\u20138 in short form)<\/span>"}]}, {"title": "Story", "note": "", "rows": [{"old": "Section label: `Story`", "new": "(unchanged \u2014 not respecified in Task 13 brief)", "destin": "", "id": "15-story-00", "oldHtml": "Section label: <code>Story<\/code>", "newHtml": "<span class=\"tag\">(unchanged \u2014 not respecified in Task 13 brief)<\/span>"}, {"old": "Section title: `How we got here.`", "new": "(unchanged \u2014 not respecified in Task 13 brief)", "destin": "", "id": "15-story-01", "oldHtml": "Section title: <code>How we got here.<\/code>", "newHtml": "<span class=\"tag\">(unchanged \u2014 not respecified in Task 13 brief)<\/span>"}, {"old": "Paragraph 1: `Honestly, I really just wanted a cooler and more efficient way to journal and track my own tasks/goals. ... And now we're here.`", "new": "(unchanged)", "destin": "", "id": "15-story-02", "oldHtml": "Paragraph 1: <code>Honestly, I really just wanted a cooler and more efficient way to journal and track my own tasks/goals. ... And now we&#x27;re here.<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "Paragraph 2: `Every line of YouCoded was written through conversation with Claude by me, someone who has never written code. ... without a single line typed by hand.`", "new": "(unchanged)", "destin": "", "id": "15-story-03", "oldHtml": "Paragraph 2: <code>Every line of YouCoded was written through conversation with Claude by me, someone who has never written code. ... without a single line typed by hand.<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "\u2014", "new": "New paragraph 3: `YouCoded Agent is what that kind of AI looks like when it's built for everyone \u2014 not just the people who already know how to use it.`", "destin": "", "id": "15-story-04", "oldHtml": "\u2014", "newHtml": "New paragraph 3: <code>YouCoded Agent is what that kind of AI looks like when it&#x27;s built for everyone \u2014 not just the people who already know how to use it.<\/code>"}, {"old": "Link: `Built by Destin \u2192`", "new": "(unchanged)", "destin": "", "id": "15-story-05", "oldHtml": "Link: <code>Built by Destin \u2192<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}]}, {"title": "Get started (was &quot;Prerequisites&quot;)", "note": "<b>Note:<\/b> this is the accounts-required change flagged in the audit \u2014 GitHub moves from optional-ish to Required, Anthropic moves from Required to Optional, and Google/Apple moves from Required to Optional. This matches Destin&#x27;s own framing in the audit (\u00a75 &quot;Hard facts for the new copy&quot; table), not a judgment call by me.", "rows": [{"old": "Section label: `Get started`", "new": "(unchanged)", "destin": "", "id": "16-get-started-was-prerequi-00", "oldHtml": "Section label: <code>Get started<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "Section title: `You'll need a couple of accounts.`", "new": "`Two minutes of setup.`", "destin": "", "id": "16-get-started-was-prerequi-01", "oldHtml": "Section title: <code>You&#x27;ll need a couple of accounts.<\/code>", "newHtml": "<code>Two minutes of setup.<\/code>"}, {"old": "Card 1 \u2014 `Anthropic` [Required] [Paid] \u2014 \"A Claude Pro ($20/mo) or Max ($100\u2013200/mo) subscription for Claude Code, which powers everything in YouCoded. The app itself is free \u2014 you're paying for the AI.\" \u2192 `Subscribe to Claude \u2192`", "new": "Card, now 2nd \u2014 `Anthropic` **[Optional]** [Paid] \u2014 `A Claude Pro or Max plan lets you use Claude \u2014 the model YouCoded was built with.` \u2192 `See Claude plans \u2192`", "destin": "", "id": "16-get-started-was-prerequi-02", "oldHtml": "Card 1 \u2014 <code>Anthropic<\/code> [Required] [Paid] \u2014 &quot;A Claude Pro ($20/mo) or Max ($100\u2013200/mo) subscription for Claude Code, which powers everything in YouCoded. The app itself is free \u2014 you&#x27;re paying for the AI.&quot; \u2192 <code>Subscribe to Claude \u2192<\/code>", "newHtml": "Card, now 2nd \u2014 <code>Anthropic<\/code> <b>[Optional]<\/b> [Paid] \u2014 <code>A Claude Pro or Max plan lets you use Claude \u2014 the model YouCoded was built with.<\/code> \u2192 <code>See Claude plans \u2192<\/code>"}, {"old": "Card 2 \u2014 `Google or Apple` [Required] [Free] \u2014 \"WeCoded marketplace skills store your personal data in your own Google Drive or iCloud account.\" \u2192 `Create Google Account \u2192`", "new": "Card, now 4th, no link \u2014 `Google or Apple` **[Optional]** [Free] \u2014 `An extra copy of your data in Google Drive or iCloud, on top of GitHub.` (no link)", "destin": "", "id": "16-get-started-was-prerequi-03", "oldHtml": "Card 2 \u2014 <code>Google or Apple<\/code> [Required] [Free] \u2014 &quot;WeCoded marketplace skills store your personal data in your own Google Drive or iCloud account.&quot; \u2192 <code>Create Google Account \u2192<\/code>", "newHtml": "Card, now 4th, no link \u2014 <code>Google or Apple<\/code> <b>[Optional]<\/b> [Free] \u2014 <code>An extra copy of your data in Google Drive or iCloud, on top of GitHub.<\/code> (no link)"}, {"old": "Card 3 \u2014 `GitHub` [Required] [Free] \u2014 \"Required to receive marketplace updates. Sign up with your Google or Apple account.\" \u2192 `Create GitHub Account \u2192`", "new": "Card, now 1st \u2014 `GitHub` **[Required]** [Free] \u2014 `Keeps your conversations and files in sync across devices and delivers marketplace updates. Sign up with your Google or Apple account.` \u2192 `Create a GitHub account \u2192`", "destin": "", "id": "16-get-started-was-prerequi-04", "oldHtml": "Card 3 \u2014 <code>GitHub<\/code> [Required] [Free] \u2014 &quot;Required to receive marketplace updates. Sign up with your Google or Apple account.&quot; \u2192 <code>Create GitHub Account \u2192<\/code>", "newHtml": "Card, now 1st \u2014 <code>GitHub<\/code> <b>[Required]<\/b> [Free] \u2014 <code>Keeps your conversations and files in sync across devices and delivers marketplace updates. Sign up with your Google or Apple account.<\/code> \u2192 <code>Create a GitHub account \u2192<\/code>"}, {"old": "\u2014", "new": "New card, 3rd \u2014 `OpenRouter` [Optional] [Pay as you go] \u2014 `One account, hundreds of models from every AI company. Pay only for what you use.` \u2192 `Create an OpenRouter account \u2192`", "destin": "", "id": "16-get-started-was-prerequi-05", "oldHtml": "\u2014", "newHtml": "New card, 3rd \u2014 <code>OpenRouter<\/code> [Optional] [Pay as you go] \u2014 <code>One account, hundreds of models from every AI company. Pay only for what you use.<\/code> \u2192 <code>Create an OpenRouter account \u2192<\/code>"}, {"old": "\u2014", "new": "New line under the cards: `Or skip the paid ones entirely \u2014 run a model on your own computer, free and offline.`", "destin": "", "id": "16-get-started-was-prerequi-06", "oldHtml": "\u2014", "newHtml": "New line under the cards: <code>Or skip the paid ones entirely \u2014 run a model on your own computer, free and offline.<\/code>"}]}, {"title": "Download", "note": "", "rows": [{"old": "Section title: `Download YouCoded`", "new": "`Download YouCoded Agent`", "destin": "", "id": "17-download-00", "oldHtml": "Section title: <code>Download YouCoded<\/code>", "newHtml": "<code>Download YouCoded Agent<\/code>"}, {"old": "Download card labels: `Download for` / `Windows` \u00b7 `macOS` \u00b7 `Linux` \u00b7 `Android`", "new": "(unchanged \u2014 not respecified in Task 13 brief)", "destin": "", "id": "17-download-01", "oldHtml": "Download card labels: <code>Download for<\/code> / <code>Windows<\/code> \u00b7 <code>macOS<\/code> \u00b7 <code>Linux<\/code> \u00b7 <code>Android<\/code>", "newHtml": "<span class=\"tag\">(unchanged \u2014 not respecified in Task 13 brief)<\/span>"}, {"old": "Note line: `Free and open source. Just bring your Claude Pro or Max plan.` + `On iPhone? Use YouCoded from Safari by connecting to any computer running the app via remote access.`", "new": "`Free and open source. On iPhone? Use YouCoded Agent from Safari by connecting to any computer running the app.`", "destin": "", "id": "17-download-02", "oldHtml": "Note line: <code>Free and open source. Just bring your Claude Pro or Max plan.<\/code> + <code>On iPhone? Use YouCoded from Safari by connecting to any computer running the app via remote access.<\/code>", "newHtml": "<code>Free and open source. On iPhone? Use YouCoded Agent from Safari by connecting to any computer running the app.<\/code>"}]}, {"title": "Install modal \u2014 &quot;After install&quot; (shared across all platforms)", "note": "", "rows": [{"old": "Step 1: `Sign in with your Claude account. YouCoded uses your existing Claude Pro or Max subscription \u2014 the same account you use on claude.ai. No separate account, no API key. If you don't have a paid plan yet, you can sign up here.`", "new": "`Sign in with GitHub.`", "destin": "", "id": "18-install-modal-after-inst-00", "oldHtml": "Step 1: <code>Sign in with your Claude account. YouCoded uses your existing Claude Pro or Max subscription \u2014 the same account you use on claude.ai. No separate account, no API key. If you don&#x27;t have a paid plan yet, you can sign up here.<\/code>", "newHtml": "<code>Sign in with GitHub.<\/code>"}, {"old": "Step 2: `Pick a starter theme and model. Both are changeable anytime from the settings panel, so don't overthink it.`", "new": "`Choose where your AI comes from \u2014 Claude, OpenRouter, or a model on this computer (Settings \u2192 Model Providers).`", "destin": "", "id": "18-install-modal-after-inst-01", "oldHtml": "Step 2: <code>Pick a starter theme and model. Both are changeable anytime from the settings panel, so don&#x27;t overthink it.<\/code>", "newHtml": "<code>Choose where your AI comes from \u2014 Claude, OpenRouter, or a model on this computer (Settings \u2192 Model Providers).<\/code>"}, {"old": "Step 3: `Browse the marketplace. Skills (things that give Claude new abilities) and themes (visual overhauls) are a few taps away and shareable with friends.`", "new": "`Pick a theme and browse the marketplace.`", "destin": "", "id": "18-install-modal-after-inst-02", "oldHtml": "Step 3: <code>Browse the marketplace. Skills (things that give Claude new abilities) and themes (visual overhauls) are a few taps away and shareable with friends.<\/code>", "newHtml": "<code>Pick a theme and browse the marketplace.<\/code>"}, {"old": "Android extra note: `On Android, expect one extra step: the first launch runs a one-time setup that downloads and unpacks the Claude Code runtime (~400\u2013600MB depending on the package tier you pick). Keep the app open on the setup screen until it finishes \u2014 it's fast on Wi-Fi.`", "new": "`On Android, the first launch downloads the Claude Code runtime (~400\u2013600 MB) \u2014 Android uses Claude only.`", "destin": "", "id": "18-install-modal-after-inst-03", "oldHtml": "Android extra note: <code>On Android, expect one extra step: the first launch runs a one-time setup that downloads and unpacks the Claude Code runtime (~400\u2013600MB depending on the package tier you pick). Keep the app open on the setup screen until it finishes \u2014 it&#x27;s fast on Wi-Fi.<\/code>", "newHtml": "<code>On Android, the first launch downloads the Claude Code runtime (~400\u2013600 MB) \u2014 Android uses Claude only.<\/code>"}]}, {"title": "FAQ", "note": "<b>Net count:<\/b> 7 questions old, 7 questions new \u2014 one question (pricing/$20/month) is cut and a new, broader &quot;Do I have to pay for anything?&quot; question takes roughly its place, one question is added net-new in position, order is reshuffled so privacy moves from #2 to #3.", "rows": [{"old": "Section label: `Common questions`", "new": "(unchanged \u2014 not respecified in Task 13 brief)", "destin": "", "id": "19-faq-00", "oldHtml": "Section label: <code>Common questions<\/code>", "newHtml": "<span class=\"tag\">(unchanged \u2014 not respecified in Task 13 brief)<\/span>"}, {"old": "Section title: `FAQ`", "new": "(unchanged)", "destin": "", "id": "19-faq-01", "oldHtml": "Section title: <code>FAQ<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "**Q1:** `How is this different from claude.ai?`", "new": "`How is this different from ChatGPT or claude.ai?`", "destin": "", "id": "19-faq-02", "oldHtml": "<b>Q1:<\/b> <code>How is this different from claude.ai?<\/code>", "newHtml": "<code>How is this different from ChatGPT or claude.ai?<\/code>"}, {"old": "**A1:** `Claude.ai is a chat website. YouCoded is an app built on top of Claude Code \u2014 a more powerful form of Claude that can create files, run terminal commands, manage your computer, and interact more meaningfully with a wider range of external services. Think of claude.ai as texting Claude, and YouCoded as giving Claude hands (with themes, a marketplace, games, and remote access layered on top).`", "new": "`Those are chat websites. YouCoded Agent is an app on your computer and phone that works in your own files \u2014 it opens, edits, and organizes them, runs tasks, and searches the web \u2014 and you choose the AI behind it: Claude, hundreds of cloud models, or one that runs locally for free.`", "destin": "", "id": "19-faq-03", "oldHtml": "<b>A1:<\/b> <code>Claude.ai is a chat website. YouCoded is an app built on top of Claude Code \u2014 a more powerful form of Claude that can create files, run terminal commands, manage your computer, and interact more meaningfully with a wider range of external services. Think of claude.ai as texting Claude, and YouCoded as giving Claude hands (with themes, a marketplace, games, and remote access layered on top).<\/code>", "newHtml": "<code>Those are chat websites. YouCoded Agent is an app on your computer and phone that works in your own files \u2014 it opens, edits, and organizes them, runs tasks, and searches the web \u2014 and you choose the AI behind it: Claude, hundreds of cloud models, or one that runs locally for free.<\/code>"}, {"old": "**Q2:** `Is my data private?`", "new": "`Do I have to pay for anything?` the old Q2 (privacy) becomes new Q3; the new Q2 is a brand-new question about cost. See below.", "destin": "", "id": "19-faq-04", "oldHtml": "<b>Q2:<\/b> <code>Is my data private?<\/code>", "newHtml": "<code>Do I have to pay for anything?<\/code> the old Q2 (privacy) becomes new Q3; the new Q2 is a brand-new question about cost. See below."}, {"old": "**A2 (old):** `Everything YouCoded and your installed WeCoded skills create... is stored in your own Google Drive or iCloud account... YouCoded itself sends one anonymous daily ping... You can turn this off at any time in Settings \u2192 About \u2192 Privacy...`", "new": "Moved \u2014 see new Q3/A3 below", "destin": "", "id": "19-faq-05", "oldHtml": "<b>A2 (old):<\/b> <code>Everything YouCoded and your installed WeCoded skills create... is stored in your own Google Drive or iCloud account... YouCoded itself sends one anonymous daily ping... You can turn this off at any time in Settings \u2192 About \u2192 Privacy...<\/code>", "newHtml": "Moved \u2014 see new Q3/A3 below"}, {"old": "\u2014", "new": "**New Q2:** `Do I have to pay for anything?`", "destin": "", "id": "19-faq-06", "oldHtml": "\u2014", "newHtml": "<b>New Q2:<\/b> <code>Do I have to pay for anything?<\/code>"}, {"old": "\u2014", "new": "**New A2:** `No. The app is free and open source. A model that runs on your own computer costs nothing. If you want Claude, that's a Claude Pro or Max plan from Anthropic; if you want other cloud models, OpenRouter bills per use.`", "destin": "", "id": "19-faq-07", "oldHtml": "\u2014", "newHtml": "<b>New A2:<\/b> <code>No. The app is free and open source. A model that runs on your own computer costs nothing. If you want Claude, that&#x27;s a Claude Pro or Max plan from Anthropic; if you want other cloud models, OpenRouter bills per use.<\/code>"}, {"old": "**Q3 (was Q2):** `Is my data private?`", "new": "(unchanged question text)", "destin": "", "id": "19-faq-08", "oldHtml": "<b>Q3 (was Q2):<\/b> <code>Is my data private?<\/code>", "newHtml": "<span class=\"tag\">(unchanged question text)<\/span>"}, {"old": "**A3:** old privacy answer above", "new": "`Your conversations, files, and settings live in your own GitHub (and, if you add them, your Google Drive or iCloud). Cloud models see what you send them while they work; a local model sends nothing anywhere. The app sends one anonymous daily ping \u2014 a hash of your device ID, the app version, platform, and rough region \u2014 so we can see how many people use it. No IP address, no username, no message content. Turn it off in Settings \u2192 About \u2192 Privacy.`", "destin": "", "id": "19-faq-09", "oldHtml": "<b>A3:<\/b> old privacy answer above", "newHtml": "<code>Your conversations, files, and settings live in your own GitHub (and, if you add them, your Google Drive or iCloud). Cloud models see what you send them while they work; a local model sends nothing anywhere. The app sends one anonymous daily ping \u2014 a hash of your device ID, the app version, platform, and rough region \u2014 so we can see how many people use it. No IP address, no username, no message content. Turn it off in Settings \u2192 About \u2192 Privacy.<\/code>"}, {"old": "**Q4 (was Q3):** `What does the $20/month get me?`", "new": "(removed \u2014 replaced by new Q2 above, which answers cost more broadly)", "destin": "", "id": "19-faq-10", "oldHtml": "<b>Q4 (was Q3):<\/b> <code>What does the $20/month get me?<\/code>", "newHtml": "<span class=\"tag\">(removed \u2014 replaced by new Q2 above, which answers cost more broadly)<\/span>"}, {"old": "**A4:** `The $20 goes to Anthropic for a Claude Pro subscription... You're paying for the AI, not the app.`", "new": "(removed)", "destin": "", "id": "19-faq-11", "oldHtml": "<b>A4:<\/b> <code>The $20 goes to Anthropic for a Claude Pro subscription... You&#x27;re paying for the AI, not the app.<\/code>", "newHtml": "<span class=\"tag\">(removed)<\/span>"}, {"old": "**Q5 (was Q4):** `What platforms does it run on?`", "new": "`What platforms does it run on?` (unchanged question)", "destin": "", "id": "19-faq-12", "oldHtml": "<b>Q5 (was Q4):<\/b> <code>What platforms does it run on?<\/code>", "newHtml": "<code>What platforms does it run on?<\/code> (unchanged question)"}, {"old": "**A5:** `Windows, macOS, Linux, and Android are all fully supported with native apps. You can also access YouCoded remotely from any web browser. Apple ecosystem integrations (iMessage, Apple Notes, etc.) are only available on macOS.`", "new": "`Windows, macOS, Linux, and Android, plus any web browser by connecting to a computer running the app. Apple integrations (iMessage, Apple Notes, and so on) work on macOS only.`", "destin": "", "id": "19-faq-13", "oldHtml": "<b>A5:<\/b> <code>Windows, macOS, Linux, and Android are all fully supported with native apps. You can also access YouCoded remotely from any web browser. Apple ecosystem integrations (iMessage, Apple Notes, etc.) are only available on macOS.<\/code>", "newHtml": "<code>Windows, macOS, Linux, and Android, plus any web browser by connecting to a computer running the app. Apple integrations (iMessage, Apple Notes, and so on) work on macOS only.<\/code>"}, {"old": "**Q6 (was Q5):** `Do I need to know how to code?`", "new": "(unchanged question)", "destin": "", "id": "19-faq-14", "oldHtml": "<b>Q6 (was Q5):<\/b> <code>Do I need to know how to code?<\/code>", "newHtml": "<span class=\"tag\">(unchanged question)<\/span>"}, {"old": "**A6:** `Not at all. YouCoded was built entirely by a non-developer using Claude Code itself. The app is designed for everyone... If you can use ChatGPT, you can use YouCoded.`", "new": "`No. The whole app was built by someone who has never written code, by talking to AI. If you can use ChatGPT, you can use this.`", "destin": "", "id": "19-faq-15", "oldHtml": "<b>A6:<\/b> <code>Not at all. YouCoded was built entirely by a non-developer using Claude Code itself. The app is designed for everyone... If you can use ChatGPT, you can use YouCoded.<\/code>", "newHtml": "<code>No. The whole app was built by someone who has never written code, by talking to AI. If you can use ChatGPT, you can use this.<\/code>"}, {"old": "**Q7 (was Q6):** `I've heard bad things about \"agentic\" AI. Is it safe?`", "new": "`Is \"agentic\" AI safe?`", "destin": "", "id": "19-faq-16", "oldHtml": "<b>Q7 (was Q6):<\/b> <code>I&#x27;ve heard bad things about &quot;agentic&quot; AI. Is it safe?<\/code>", "newHtml": "<code>Is &quot;agentic&quot; AI safe?<\/code>"}, {"old": "**A7:** `YouCoded always asks for permission before taking actions... you should always monitor your AI assistant when in use... You should be especially cautious when taking advantage of \"Bypass Permissions\" mode, which allows Claude to act without your input.`", "new": "`The app asks before it changes anything, and every standing permission you grant is listed on one screen where you can revoke it. AI still makes mistakes, so keep an eye on what it's doing \u2014 and be careful with full-auto mode, which lets it act without asking.`", "destin": "", "id": "19-faq-17", "oldHtml": "<b>A7:<\/b> <code>YouCoded always asks for permission before taking actions... you should always monitor your AI assistant when in use... You should be especially cautious when taking advantage of &quot;Bypass Permissions&quot; mode, which allows Claude to act without your input.<\/code>", "newHtml": "<code>The app asks before it changes anything, and every standing permission you grant is listed on one screen where you can revoke it. AI still makes mistakes, so keep an eye on what it&#x27;s doing \u2014 and be careful with full-auto mode, which lets it act without asking.<\/code>"}, {"old": "**Q8 (was Q7):** `Who built this?`", "new": "`Who built this?` (unchanged question)", "destin": "", "id": "19-faq-18", "oldHtml": "<b>Q8 (was Q7):<\/b> <code>Who built this?<\/code>", "newHtml": "<code>Who built this?<\/code> (unchanged question)"}, {"old": "**A8:** `So far, it's just me (Destin). However, my intention is for this open-source project to become something we all build together... No profit motive, no ulterior incentives \u2014 just people making cool shit and sharing it with other people :)`", "new": "(unchanged)", "destin": "", "id": "19-faq-19", "oldHtml": "<b>A8:<\/b> <code>So far, it&#x27;s just me (Destin). However, my intention is for this open-source project to become something we all build together... No profit motive, no ulterior incentives \u2014 just people making cool shit and sharing it with other people :)<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}]}, {"title": "Gallery", "note": "", "rows": [{"old": "Section label: `Gallery`", "new": "(unchanged \u2014 not respecified in Task 13 brief)", "destin": "", "id": "20-gallery-00", "oldHtml": "Section label: <code>Gallery<\/code>", "newHtml": "<span class=\"tag\">(unchanged \u2014 not respecified in Task 13 brief)<\/span>"}, {"old": "Section title: `See what people have built.`", "new": "(unchanged)", "destin": "", "id": "20-gallery-01", "oldHtml": "Section title: <code>See what people have built.<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "7 images, old alt text pattern: `YouCoded <surface> in the <Theme> theme` (e.g. `YouCoded chat view in the Devils Garden theme`)", "new": "`YouCoded Agent \u2014 <surface> in the <Theme> theme` (filenames come from the regenerated gallery; pattern fixed, names filled in by Task 13)", "destin": "", "id": "20-gallery-02", "oldHtml": "7 images, old alt text pattern: <code>YouCoded &lt;surface&gt; in the &lt;Theme&gt; theme<\/code> (e.g. <code>YouCoded chat view in the Devils Garden theme<\/code>)", "newHtml": "<code>YouCoded Agent \u2014 &lt;surface&gt; in the &lt;Theme&gt; theme<\/code> (filenames come from the regenerated gallery; pattern fixed, names filled in by Task 13)"}]}, {"title": "Footer", "note": "", "rows": [{"old": "Wordmark: `You` + `Coded`", "new": "`YouCoded Agent`", "destin": "", "id": "21-footer-00", "oldHtml": "Wordmark: <code>You<\/code> + <code>Coded<\/code>", "newHtml": "<code>YouCoded Agent<\/code>"}, {"old": "Link: `GitHub`", "new": "(unchanged)", "destin": "", "id": "21-footer-01", "oldHtml": "Link: <code>GitHub<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "Link: `Built by Destin`", "new": "(unchanged)", "destin": "", "id": "21-footer-02", "oldHtml": "Link: <code>Built by Destin<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "Badge: `Open Source`", "new": "(unchanged)", "destin": "", "id": "21-footer-03", "oldHtml": "Badge: <code>Open Source<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "Legal line: `MIT License \u00b7 YouCoded is an independent, community-built project. Not affiliated with, endorsed by, or officially supported by Anthropic.`", "new": "(unchanged)", "destin": "", "id": "21-footer-04", "oldHtml": "Legal line: <code>MIT License \u00b7 YouCoded is an independent, community-built project. Not affiliated with, endorsed by, or officially supported by Anthropic.<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}, {"old": "Floating pill: `Download \u2193`", "new": "(unchanged)", "destin": "", "id": "21-footer-05", "oldHtml": "Floating pill: <code>Download \u2193<\/code>", "newHtml": "<span class=\"tag\">(unchanged)<\/span>"}]}]};</script>
<script>
(function(){
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const LS='copy-review:'+DATA.key; let server=false;
  const state={deck:DATA.key,started:new Date().toISOString(),submitted:null,answers:{}};
  const rows=[]; DATA.sections.forEach(s=>s.rows.forEach(r=>rows.push(r)));
  async function load(){
    try{const r=await fetch('/answers',{cache:'no-store'});if(r.ok){server=true;const j=await r.json();if(j&&j.answers)Object.assign(state,j);return;}}catch(e){}
    try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.answers)Object.assign(state,j);}catch(e){}
  }
  let t=null; function save(){ clearTimeout(t); t=setTimeout(async()=>{ try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
    if(server){try{await fetch('/answers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state)});$('#status').textContent='Saved.';}catch(e){$('#status').textContent='Server gone — edits kept in this browser; tell Claude.';}} },250); }
  function cls(a){ return !a||!a.v?'':(a.v==='yes'?'ok':a.v==='no'?'no':'edit'); }
  function render(){
    const main=$('#main'), nav=$('#nav'); main.innerHTML=''; nav.innerHTML='';
    DATA.sections.forEach((s,si)=>{
      const sec=document.createElement('section'); sec.id='sec-'+si;
      sec.innerHTML='<h2>'+s.title+'</h2>'+(s.note?'<p class="note">'+s.note+'</p>':'');
      s.rows.forEach(r=>{
        const a=state.answers[r.id]||{}; const el=document.createElement('div'); el.className='row '+cls(a); el.dataset.id=r.id;
        const newHtml=(a.v==='other'&&a.note!=null)?esc(a.note):r.newHtml;
        el.innerHTML='<div class="old">'+r.oldHtml+'</div><div class="new" contenteditable="true" spellcheck="true">'+newHtml+'</div>'
          +'<div class="acts"><button class="b-ok">✓ Keep</button><button class="b-edit" tabindex="-1">✎ Edited</button><button class="b-no">✗ No</button><input class="why" placeholder="note / why" value="'+esc(a.v==='no'?(a.note||''):(a.why||''))+'"></div>'
          +(r.destin?'<div class="destin">Destin (from the .md): '+r.destin+'</div>':'');
        const nw=el.querySelector('.new');
        nw.addEventListener('input',()=>{ const txt=nw.innerText.trim(); state.answers[r.id]={v:'other',note:txt}; el.className='row edit'; paint(); save(); });
        el.querySelector('.b-ok').onclick=()=>{ state.answers[r.id]={v:'yes'}; nw.innerHTML=r.newHtml; el.className='row ok'; paint(); save(); };
        el.querySelector('.b-edit').onclick=()=>nw.focus();
        el.querySelector('.b-no').onclick=()=>{ const why=el.querySelector('.why'); state.answers[r.id]={v:'no',note:why.value}; el.className='row no'; paint(); save(); why.focus(); };
        el.querySelector('.why').addEventListener('input',e=>{ const a=state.answers[r.id]||{}; if(a.v==='no'){a.note=e.target.value;} else {a.why=e.target.value; if(!a.v){a.v='other'; a.note=nw.innerText.trim(); el.className='row edit';}} state.answers[r.id]=a; paint(); save(); });
        sec.appendChild(el);
      });
      main.appendChild(sec);
      const a=document.createElement('a'); a.href='#sec-'+si; a.dataset.sec=si; a.innerHTML=s.title+'<span></span>'; nav.appendChild(a);
    });
    paint();
  }
  function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function paint(){
    let done=0,edits=0,nos=0; rows.forEach(r=>{const a=state.answers[r.id]; if(a&&a.v){done++; if(a.v==='other')edits++; if(a.v==='no')nos++;}});
    $('#done').textContent=done; $('#total').textContent=rows.length; $('#edits').textContent=edits; $('#nos').textContent=nos;
    DATA.sections.forEach((s,si)=>{ const n=s.rows.filter(r=>state.answers[r.id]&&state.answers[r.id].v).length; const sp=$('#nav a[data-sec="'+si+'"] span'); sp.textContent=n+'/'+s.rows.length; sp.className=n===s.rows.length?'':'left'; });
    applyFilter();
    $('#submit').disabled=!!state.submitted;
  }
  let filter='all';
  function applyFilter(){ $$('.row').forEach(el=>{ const a=state.answers[el.dataset.id]; const v=a&&a.v; const show=filter==='all'||(filter==='open'&&!v)||(filter==='edit'&&v==='other')||(filter==='no'&&v==='no'); el.classList.toggle('hide',!show); }); }
  $$('.filters button').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; $$('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b)); applyFilter(); });
  $('#submit').onclick=async()=>{
    const open=rows.length-Object.values(state.answers).filter(a=>a.v).length;
    if(open&&!confirm(open+' rows are still undecided — submit anyway? (undecided = keep as written)')) return;
    rows.forEach(r=>{ if(!state.answers[r.id]||!state.answers[r.id].v) state.answers[r.id]={v:'yes',implicit:true}; });
    state.submitted=new Date().toISOString();
    if(server){ try{ await fetch('/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state)}); $('#status').textContent='Submitted — Claude has your edits.'; }catch(e){ $('#status').textContent='Submit failed — server gone; tell Claude the edits are in this browser.'; } }
    else { try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){} $('#status').textContent='Submitted locally (no server) — tell Claude.'; }
    $('#submit').disabled=true;
  };
  load().then(render);
})();
</script></body></html>
