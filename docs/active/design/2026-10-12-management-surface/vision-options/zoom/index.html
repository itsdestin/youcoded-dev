<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Big picture: zoom in</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* cc.css — the shared pieces, ported class-for-class from the app's real components on
   origin/session/ui-consistency-audit (desktop/src/renderer/components/ui/*.tsx and
   styles/globals.css). Each block names the component it copies; the numbers are that
   component's Tailwind classes turned into CSS. WHY a rewrite (2026-10-13, audit.md): the
   previous file was written from the older guide text, not from the components, and
   drifted on almost every number (8px button corners, 32px buttons, capitals headings,
   panel-coloured rows, a 48px bordered header). Paint only with these variables.
   Switch theme with <html data-theme="creme|midnight|dark|light">. */

/* ---- theme palettes: the four built-ins, values from globals.css ---- */
:root, :root[data-theme="light"]{--canvas:#F2F2F2;--panel:#EAEAEA;--inset:#D7D7D7;--well:#F9F9F9;--accent:#1A1A1A;--on-accent:#F2F2F2;--fg:#1A1A1A;--fg-2:#444444;--fg-dim:#535353;--fg-muted:#5E5E5E;--fg-faint:#989898;--edge:#C0C0C0;--edge-dim:#B3B3B380;--link:#2055CA;--shadow-strength:.15;color-scheme:light}
:root[data-theme="dark"]{--canvas:#111111;--panel:#191919;--inset:#222222;--well:#1C1C1C;--accent:#D4D4D4;--on-accent:#111111;--fg:#E0E0E0;--fg-2:#B0B0B0;--fg-dim:#999999;--fg-muted:#898989;--fg-faint:#515151;--edge:#393939;--edge-dim:#44444480;--link:#66AAFF;--shadow-strength:.4;color-scheme:dark}
:root[data-theme="midnight"]{--canvas:#0D1117;--panel:#161B22;--inset:#21262D;--well:#0D1117;--accent:#B1BAC4;--on-accent:#0D1117;--fg:#C9D1D9;--fg-2:#A0AAB4;--fg-dim:#919AA4;--fg-muted:#858D97;--fg-faint:#4E555E;--edge:#343A41;--edge-dim:#3F454C80;--link:#58A6FF;--shadow-strength:.4;color-scheme:dark}
:root[data-theme="creme"]{--canvas:#F6EEE1;--panel:#EBE1D1;--inset:#D8CCB9;--well:#F9F0E2;--accent:#3D3229;--on-accent:#F6EEE1;--fg:#2C2418;--fg-2:#504333;--fg-dim:#564C3D;--fg-muted:#615648;--fg-faint:#9A8F7F;--edge:#C4B8A6;--edge-dim:#B8AC9A80;--link:#5B4A1E;--shadow-strength:.15;color-scheme:light}

/* ---- derived outlines (globals.css:2061-2062) and the semantic set (§2.3) ---- */
:root{
  /* WHY these two: card and button outlines in the app are not the raw --edge; they mix in
     text colour so they stay visible on every theme (decisions "Surface levels"). */
  --edge-card:color-mix(in srgb,var(--edge) 82%,var(--fg) 18%);
  --edge-strong:color-mix(in srgb,var(--edge) 65%,var(--fg) 35%);
  --status-ok:#2E9B57;--status-warn:#C99700;--status-error:#E5484D;--status-idle:#8A8A8A;
  --tag-blue:#3B82C4;
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;
  --font:'Cascadia Mono','Cascadia Code','Fira Code',ui-monospace,monospace;
  --dur-hover:180ms;--dur-reveal:260ms;--ease:cubic-bezier(.2,.7,.2,1);
  --layer-shadow:0 8px 32px rgba(0,0,0,var(--shadow-strength));
}
:root[data-theme="midnight"],:root[data-theme="dark"]{--status-warn:#F2B33D}

/* ---- page ---- */
*{box-sizing:border-box}
/* WHY clip: the page never scrolls itself (the pane does); without it the off-screen side panel
   widened the page and scrollIntoView slid everything sideways, cutting the panel off. */
html,body{margin:0;height:100%;overflow:clip}
body{font:14px/1.45 var(--font);color:var(--fg);background:var(--panel)}
a{color:var(--link)}
button{font:inherit}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- type scale (globals.css: 2xs/3xs 11 · xs 12 · sm 14 · base 16) ---- */
.t-lg{font-size:18px;font-weight:600}
.t-base{font-size:16px;font-weight:500}
.t-sm{font-size:14px}
.t-xs{font-size:12px}
.t-2xs{font-size:11px}
/* SectionLabel.tsx — 12px medium muted, NORMAL CASE, no letter-spacing. WHY: Destin retired
   the spaced-capitals eyebrow app-wide (decisions "Heading ladder", all "No capitals"). The
   class keeps its old name so every call site moves at once. */
.eyebrow{font-size:12px;font-weight:500;color:var(--fg-muted)}
.muted{color:var(--fg-muted)} .dim{color:var(--fg-2)}
.num{font-variant-numeric:tabular-nums}
/* Count after a word: faint, smaller (decisions "Counts", SegmentedTabLabel) */
.cnt{font-size:11px;font-weight:400;color:var(--fg-muted);margin-left:4px}

/* ---- .layer-surface (globals.css:1375): popups, full-screen cards ---- */
.layer{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-xl);box-shadow:var(--layer-shadow)}

/* ---- cards on a full screen are raised: .layer-surface (globals.css:1375) — panel fill, 1px edge,
        radius-xl, the layer shadow (MarketplaceCard.tsx:339; decisions "Card look: raised").
        A box inside one is the nested level: CARD_LEVEL_2 = FIELD_SURFACE 'bg-inset border border-edge-card rounded-lg'. ---- */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-xl);box-shadow:var(--layer-shadow);padding:16px}
.card .card,.card.inset{background:var(--inset);border:1px solid var(--edge-card);border-radius:var(--radius-lg);box-shadow:none;padding:12px}
/* + .card-interactive and .hover-lift on a grid card (MarketplaceCard.tsx:339; globals.css:1524,1547) */
.card-interactive{cursor:pointer;transition:background-color 120ms steps(4),transform 200ms steps(5)}
@media (hover:hover){.card-interactive:hover{background-color:var(--inset);transform:scale(1.02)}}
.card-interactive:active{background-color:var(--edge)}
.card-interactive:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Button.tsx ---- base 'inline-flex items-center justify-center gap-1.5 font-medium rounded-lg'
   md 'text-xs px-3 py-1.5' · sm 'text-2xs px-2.5 py-1' · secondary is the default here. */
.btn{font-size:12px;line-height:16px;font-weight:500;padding:6px 12px;border-radius:var(--radius-lg);border:1px solid var(--edge-strong);background:transparent;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease)}
.btn.sm{font-size:11px;line-height:14px;padding:4px 10px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{border-color:transparent;color:var(--fg-dim)}
@media (hover:hover){.btn:hover{background:var(--inset)} .btn.ghost:hover{color:var(--fg)}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent) 90%,transparent)}}
.btn:active{background:var(--edge)} .btn.primary:active{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- CloseButton.tsx = Button size="icon" variant="ghost": w-7 h-7, rounded-lg, svg w-4 h-4 ---- */
.closebtn{width:28px;height:28px;padding:0;flex:none;border:0;border-radius:var(--radius-lg);background:transparent;color:var(--fg-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background-color var(--dur-hover) var(--ease)}
@media (hover:hover){.closebtn:hover{background:var(--inset);color:var(--fg)}}
.closebtn:active{background:var(--edge)} .closebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- SegmentedTabs.tsx variant="pill" ----
   PILL_CONTAINER 'w-fit flex items-center gap-0.5 p-0.5 layer-surface !rounded-full' (shadow off)
   PILL_TAB_BASE 'px-3 py-1 rounded-full text-sm font-medium inline-flex items-center gap-1.5' */
.tabs{display:inline-flex;align-items:center;gap:2px;padding:2px;background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-full);width:fit-content;flex:none}
.tabs button{font-size:14px;line-height:20px;font-weight:500;padding:4px 12px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease)}
.tabs button .count{font-size:11px;color:var(--fg-muted)}
.tabs button svg.ic{width:16px;height:16px}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tabs button[aria-selected="true"] .count,.tabs button[aria-pressed="true"] .count{color:inherit;opacity:.8}
@media (hover:hover){.tabs button:not([aria-selected="true"]):not([aria-pressed="true"]):hover{background:var(--inset);color:var(--fg)}}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- FilterChip.tsx: 'px-3 py-1 rounded-full text-sm'; inactive 'bg-inset text-fg-2 hover:text-fg
        border border-edge hover:border-edge-dim'; active 'bg-accent text-on-accent' ---- */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font-size:14px;line-height:20px;padding:4px 12px;border-radius:var(--radius-full);background:var(--inset);border:1px solid var(--edge);color:var(--fg-2);cursor:pointer;white-space:nowrap;transition:color var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease)}
@media (hover:hover){.fchip:not([aria-pressed="true"]):hover{color:var(--fg);border-color:var(--edge-dim)}}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Chip.tsx (counts, plain tags): 'rounded-sm px-1.5 py-0.5 text-2xs text-fg-2 bg-inset border border-edge-dim' ---- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:var(--radius-sm);background:var(--inset);border:1px solid var(--edge-dim);font-size:11px;line-height:14px;color:var(--fg-2);white-space:nowrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg-muted);flex:none}
.dot.ok{background:var(--status-ok)} .dot.warn{background:var(--status-warn)} .dot.error{background:var(--status-error)} .dot.idle{background:var(--status-idle)}
/* ---- Pill.tsx (status labels: "tinted pill, normal case, dot inside" — decisions "Status labels"):
        'rounded-full border gap-1 pl-1.5 pr-2 py-px text-3xs leading-tight text-fg-2'; neutral 'bg-inset border-edge-dim' ---- */
.spill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:var(--radius-full);border:1px solid var(--edge-dim);background:var(--inset);font-size:11px;line-height:1.25;color:var(--fg-2);white-space:nowrap}
.spill.warn{background:color-mix(in srgb,var(--status-warn) 15%,transparent);border-color:color-mix(in srgb,var(--status-warn) 30%,transparent)}
.spill.warn .dot{background:var(--status-warn)}
/* the two sides of the app — a word with a small mark, in the muted line under a row */
.side{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-muted)}
/* WHY no mark (U8): the two small icons were unexplained; the words say it */

/* ---- SettingRow.tsx (nav density): 'surface-1 flex items-center gap-3 px-3 py-2 bg-inset/50
        border border-edge-card rounded-lg'; title 'text-sm text-fg font-medium'; description
        'text-2xs -mt-0.5 text-fg-muted' ---- */
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;background:color-mix(in srgb,var(--inset) 50%,transparent);border:1px solid var(--edge-card);border-radius:var(--radius-lg)}
.row .body{flex:1;min-width:0}
.row .body>.t-sm,.row .body>.t-xs{font-weight:500;color:var(--fg)}
.row .hint{font-size:11px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11px;color:var(--fg-muted);white-space:nowrap}
.card .row{background:var(--inset)}   /* a row inside a card is level 2 (globals.css .surface-1 .surface-1) */
/* the right-hand chevron every navigating row has (SettingRow: svg w-4 h-4 text-fg-muted, rotate-90 when open) */
.chev{display:inline-flex;color:var(--fg-muted);flex:none;transition:transform var(--dur-hover) var(--ease)}
.chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Callout.tsx info: 'rounded-lg p-3 border bg-accent/10 border-accent/25', text-xs ---- */
.callout{border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:var(--radius-lg);padding:12px;font-size:12px;color:var(--fg-2)}
/* ---- states.tsx EmptyState block: 'flex flex-col items-center gap-2 py-8', 'text-sm text-fg-muted text-center' ---- */
.empty{text-align:center;color:var(--fg-muted);padding:32px 0;font-size:14px}

/* ---- tooltips (Tooltip.tsx look: a small layer surface) ---- */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);min-width:160px;max-width:320px;width:max-content;padding:8px 10px;border-radius:var(--radius-lg);background:var(--panel);color:var(--fg);border:1px solid var(--edge);box-shadow:var(--layer-shadow);font-size:12px;font-weight:400;line-height:1.4;text-align:left;text-transform:none;letter-spacing:0;white-space:normal;opacity:0;pointer-events:none;transition:opacity var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease);z-index:20}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{opacity:1;transform:translateX(-50%) translateY(0)}
.tip.below::after{bottom:auto;top:calc(100% + 8px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---- Zoom-in view: only layout and the status colours; every other look is cc.css's ---- */
:root{--c-done:var(--status-ok);--c-building:var(--fg-muted);--c-planned:color-mix(in srgb,var(--fg-faint) 72%,var(--canvas));--c-vision:var(--well);
  --l-exists:var(--status-ok);--l-building:var(--fg-2);--l-planned:var(--fg-faint)}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.framed .band{height:32px;justify-content:flex-end;padding-right:16px}.framed .band .ttl{display:none}.framed .legend{position:static}
.band{position:relative;height:40px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--fg)}
.screen-body{flex:1;min-height:0;display:flex;padding:0 10px 10px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);border-radius:var(--radius-xl);overflow:hidden}
.panehead{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px 6px}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.crumbs .sep{color:var(--fg-faint)}
.crumbs button{border:0;background:transparent;color:var(--fg-2);cursor:pointer;border-radius:var(--radius-md);padding:3px 8px;font-size:14px;font-weight:500;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease)}
.crumbs button:hover{background:var(--inset);color:var(--fg)}
.crumbs button:focus-visible{outline:2px solid var(--accent)}
.crumbs .here{padding:3px 8px;font-size:14px;font-weight:600;color:var(--fg);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{position:absolute;right:16px;top:0;height:40px;display:flex;gap:14px;align-items:center}
.leg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);cursor:default}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.caption{flex:none;padding:0 16px 8px;font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:26px}
.caption b{color:var(--fg);font-weight:600}
#canvas{position:relative;flex:1;min-height:0;margin:0 16px 14px;overflow:hidden}

/* the boxes: every one is absolutely placed; JS moves them and CSS glides them */
.nd{position:absolute;box-sizing:border-box;overflow:hidden;opacity:0;pointer-events:none;border-radius:4px}
/* WHY no glide: 200 boxes sliding at once cannot be verified headlessly and risks jank; a 150ms fade between views is safe */
#canvas{transition:opacity 150ms var(--ease)}#canvas.fading{opacity:0}
.nd.on{opacity:1;pointer-events:auto}
.nd.dim{opacity:.5}
.nd.pillar,.nd.capability{border-radius:var(--radius-lg)}
.nd.r1{background:var(--panel);border:1px solid var(--edge-card)}
.nd.r1.pillar{border-radius:var(--radius-xl)}
.nd.rx{background:transparent;border:1px solid var(--edge-dim)}
.nd.r0{background:transparent;border:0}
.nd.click{cursor:pointer}
.nd.click:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nd.hot{border-color:var(--edge-strong);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.hd{position:absolute;left:0;right:0;top:0;padding:7px 10px 0;font-weight:500;color:var(--fg);pointer-events:none;overflow:hidden}
.hd .ti{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13px;line-height:16px}
.nd.capability .hd{padding:5px 8px 0}.nd.capability .hd .ti{-webkit-line-clamp:1;font-size:12px;line-height:15px}
.nd.leaf{border:0;border-radius:4px}
.nd.leaf.s-done{background:var(--c-done);color:var(--fg)}
.nd.leaf.s-building{background:var(--c-building);color:var(--on-accent)}
.nd.leaf.s-planned{background:var(--c-planned);color:var(--fg)}
.nd.leaf.s-vision{background:repeating-linear-gradient(45deg,var(--fg-faint) 0 1.5px,transparent 1.5px 6px),var(--well);box-shadow:inset 0 0 0 1px var(--edge-strong);color:var(--fg)}
.nd.leaf.s-done{--sc:var(--c-done)}.nd.leaf.s-building{--sc:var(--c-building)}.nd.leaf.s-planned{--sc:var(--fg-faint)}.nd.leaf.s-vision{--sc:var(--fg-faint)}
.nd.leaf.on:hover{filter:brightness(1.07);outline:2px solid var(--fg);outline-offset:-2px}
.nd.leaf.isfocus{background:color-mix(in srgb,var(--sc) 9%,var(--canvas));box-shadow:inset 0 0 0 2px var(--sc);color:var(--fg)}
.nd.leaf.s-vision.isfocus{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--fg-faint) 40%,transparent) 0 1.5px,transparent 1.5px 8px),var(--well)}
.nd.leaf.isfocus:hover{filter:none;outline:0}
.lb{position:absolute;inset:0;padding:7px 8px;pointer-events:none;overflow:hidden}
.lb .ti{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font-size:12px;line-height:15px;font-weight:500}
.lb .st{font-size:11px;line-height:14px;opacity:.78;margin-top:2px}
.nd.leaf.big .lb{padding:12px 13px}.nd.leaf.big .lb .ti{font-size:14px;line-height:18px;-webkit-line-clamp:5}
.nd.leaf.isfocus.s-vision{box-shadow:inset 0 0 0 2px var(--fg-faint)}

/* zoomed feature tiles: calm neutral tile, a thin status stripe, name and status in words */
.zoomed .nd.leaf{background:var(--panel);border:1px solid var(--edge-card);border-radius:var(--radius-lg);color:var(--fg)}
.zoomed .nd.leaf::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.zoomed .nd.leaf.s-vision{border-style:dashed;background:var(--well)}
.zoomed .nd.leaf.s-vision::before{background:repeating-linear-gradient(45deg,var(--fg-faint) 0 2px,transparent 2px 5px)}
.zoomed .nd.leaf.s-planned{--sc:var(--fg-faint)}
.zoomed .nd.leaf .lb{padding:9px 10px 8px 14px}
.zoomed .nd.leaf .lb .ti{font-size:13px;line-height:17px;-webkit-line-clamp:3}
.zoomed .nd.leaf .lb .st{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;opacity:1;color:var(--fg-2)}
.zoomed .nd.leaf .lb .st i{width:8px;height:8px;border-radius:50%;background:var(--sc);flex:none}
.zoomed .nd.leaf.s-vision .lb .st i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg-faint)}
.zoomed .nd.leaf.s-planned .lb .st i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg-faint)}
.zoomed .nd.leaf.on:hover{filter:none;outline:2px solid var(--fg);outline-offset:-2px}
.zoomed .nd.leaf.isfocus{box-shadow:inset 0 0 0 2px var(--sc)}

/* right column: a short, calm list of the other systems this one connects to */
#railhd{position:absolute;font-size:12px;font-weight:500;color:var(--fg-muted)}
#conns{position:absolute;overflow-y:auto;font-size:13px}
#conns .row{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;border:1px solid var(--edge-card);border-radius:var(--radius-lg);background:var(--panel);margin:0 0 6px;padding:8px 10px;color:var(--fg);cursor:pointer;text-align:left;font:inherit}
#conns .row:hover{background:var(--inset)}
#conns .row:focus-visible{outline:2px solid var(--accent)}
#conns .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#conns .stw{font-size:12px;color:var(--fg-muted);flex:none}
#conns .more{border:0;background:transparent;color:var(--fg-2);cursor:pointer;padding:4px 2px;font:inherit;font-size:12px;text-decoration:underline}
#conns .none{padding:2px 0;color:var(--fg-muted)}

  els[n.id]=e; });
// parents first so smaller boxes paint on top
Object.values(D).sort((a,b)=>ancestors(a.id).length-ancestors(b.id).length).forEach(n=>{ if(els[n.id]) canvas.insertBefore(els[n.id],$('#railhd')); });

/* ---- state ---- */
let focus='root', links=[], groups=[], cur={};
const stateOf=(a,b)=>{const x=statusOf(a),y=statusOf(b); return (x==='done'&&y==='done')?'exists':((x==='planned'||x==='vision'||y==='planned'||y==='vision')?'planned':'building');};
const STATE_WORD={exists:'Exists today',building:'Being built',planned:'Planned, not started'};

function subtree(id){const s=new Set();(function w(i){s.add(i);D[i].kids.forEach(w);})(id);return s;}
function computeLinks(){
  links=[]; if(focus==='root')return;
  const S=subtree(focus), seen=new Set();
  Object.values(D).forEach(n=>{ if(n.id==='root')return;
    const inS=S.has(n.id);
    n.needs.forEach(x=>{ if(!D[x.id])return; const a=S.has(n.id),b=S.has(x.id); if(a===b)return; const k='n|'+n.id+'|'+x.id; if(seen.has(k))return; seen.add(k);
      links.push({kind:'needs',from:n.id,to:x.id,inside:a?n.id:x.id,outside:a?x.id:n.id,dir:a?'out':'in',because:x.because}); });
    n.shares.forEach(x=>{ if(!D[x.id])return; const a=S.has(n.id),b=S.has(x.id); if(a===b)return; const k='s|'+[n.id,x.id].sort().join('|'); if(seen.has(k))return; seen.add(k);
      links.push({kind:'shares',from:n.id,to:x.id,inside:a?n.id:x.id,outside:a?x.id:n.id,because:x.because}); }); });
  links.forEach(l=>{ l.state=stateOf(l.inside,l.outside); l.tp=D[l.outside].pillar||l.outside; l.own=l.tp===D[focus].pillar; });
}

let size={w:0,h:0};
function compute(){
  size={w:canvas.clientWidth,h:canvas.clientHeight}; const Cw=size.w,Ch=size.h;
  computeLinks();
  canvas.classList.toggle('zoomed',focus!=='root');
  const out={}; Object.keys(meta).forEach(k=>delete meta[k]);
  let railX=Cw, railW=0;
  if(focus==='root'){ lay('root',{x:0,y:0,w:Cw,h:Ch},0,'main',out); }
  else { railW=Math.min(260,Math.round(Cw*.2)); railX=Cw-railW; lay(focus,{x:0,y:0,w:Cw-railW-24,h:Ch},0,'main',out); }
  cur.out=out; cur.main=out[focus==='root'?'root':focus]; cur.railX=railX; cur.railW=railW;
  Object.entries(els).forEach(([id,e])=>{
    const r=out[id], m=meta[id]; e.classList.remove('hot','isfocus','big','r0','r1','rx','click');
    if(!r){ e.classList.remove('on'); e.tabIndex=-1; return; }
    e.style.left=r.x+'px'; e.style.top=r.y+'px'; e.style.width=r.w+'px'; e.style.height=r.h+'px';
    e.classList.add('on');
    const n=D[id], leaf=!n.kids.length;
    if(!leaf) e.classList.add(m.rel===0?'r0':m.rel===1?'r1':'rx');
    if(leaf){ const lb=e.querySelector('.lb'); let show=false;
      if(id===focus){e.classList.add('isfocus');}
      else if(focus!=='root'){ show=r.w>=96&&r.h>=44; }  // zoomed: every tile that can hold a name shows it
      else if(m.rel===1){show=true; e.classList.add('big');} else show=(r.w>=118&&r.h>=50);
      lb.style.display=show?'':'none'; }
    else { const hd=e.querySelector('.hd'); hd.style.display=(m.rel===1)?'':'none'; }
    if(m.rel===1&&id!==focus){ e.classList.add('click'); e.tabIndex=0; } else e.tabIndex=-1;
  });
  buildRail(); card(); crumbs(); caption();
}

/* ---- right column: other systems this one connects to, one status word each ---- */
const LWORD={exists:'exists',building:'in progress',planned:'planned',mixed:'partly planned'};
function buildRail(){
  const rh=$('#railhd'), cn=$('#conns');
  if(focus==='root'){ rh.style.display='none'; cn.style.display='none'; return; }
  rh.style.display=''; cn.style.display='';
  rh.style.left=cur.railX+'px'; rh.style.top='0px'; rh.textContent='Connects to';
  rh.dataset.tip='The other major systems this one depends on or shares work with. Click one to go there.';
  cn.style.left=cur.railX+'px'; cn.style.width=cur.railW+'px'; cn.style.top='24px'; cn.style.height=Math.max(60,size.h-24)+'px';
  const map={}; links.forEach(l=>{ if(l.own)return; (map[l.tp]=map[l.tp]||{tp:l.tp,items:[]}).items.push(l); });
  const rows=Object.values(map).map(g=>{ const st=new Set(g.items.map(l=>l.state));
    g.word=st.size===1?[...st][0]:(st.has('planned')&&st.has('exists')?'mixed':(st.has('planned')?'planned':'building')); return g; })
    .sort((a,b)=>b.items.length-a.items.length||D.root.kids.indexOf(a.tp)-D.root.kids.indexOf(b.tp));
  const MAXV=5; let h='';
  if(!rows.length) h='<div class="none">Nothing outside this system is recorded.</div>';
  rows.forEach((g,i)=>{ const l=g.items[0];
    const tip=(l.kind==='shares'?D[l.inside].title+' shares work with '+D[l.outside].title:(l.dir==='out'?D[l.inside].title+' needs '+D[l.outside].title:D[l.outside].title+' needs '+D[l.inside].title))+(l.because?'. '+l.because:'')+(g.items.length>1?' (and '+(g.items.length-1)+' more link'+(g.items.length>2?'s':'')+')':'');
    h+='<button class="row'+(i>=MAXV?' extra':'')+'"'+(i>=MAXV?' hidden':'')+' data-go="'+g.tp+'" data-tip="'+esc(tip)+'"><span class="nm">'+esc(D[g.tp].title)+'</span><span class="stw">'+LWORD[g.word]+'</span></button>'; });
  if(rows.length>MAXV) h+='<button class="more" data-more="1" data-tip="Show the other connected systems.">More ('+(rows.length-MAXV)+')</button>';
  cn.innerHTML=h;
}
document.addEventListener('click',e=>{ const m=e.target.closest('[data-more]'); if(!m)return; document.querySelectorAll('#conns .extra').forEach(x=>x.hidden=false); m.remove(); });

/* ---- the card for a single feature ---- */
function names(list){ const t=list.map(x=>'<b data-go="'+x.id+'">'+esc(D[x.id].title)+'</b>'); return t.slice(0,2).join(', ')+(t.length>2?' and '+(t.length-2)+' more':''); }
function card(){
  const c=$('#card'); const n=D[focus];
  if(focus==='root'||n.kids.length){ c.classList.remove('on'); return; }
  const r=cur.main, w=Math.min(640,r.w-60), h=Math.min(r.h-60,460);
  c.style.left=(r.x+(r.w-w)/2)+'px'; c.style.top=(r.y+(r.h-h)/2)+'px'; c.style.width=w+'px'; c.style.maxHeight=h+'px';
  const path=ancestors(focus).slice(0,-1).map(a=>D[a].title).join('  ›  ');
  const fact=(k,list)=>list.length?'<li><span>'+k+'</span><div>'+names(list)+'</div></li>':'';
  const facts=fact('Waiting on',n.needs)+fact('Holds up',n.needed_by)+fact('Shares work with',n.shares);
  const all=(t,list)=>list.length?'<li><b>'+t+'</b><br>'+list.map(x=>esc(D[x.id].title)+(x.because?' — '+esc(x.because):'')).join('<br>')+'</li>':'';
  const ev=(n.evidence||[]).map(e=>'<li data-tip="Where this is recorded: '+esc(e.ref||'')+'"><b>'+esc(KIND[e.kind]||'Record')+(e.date?' · '+nice(e.date):'')+'</b><br>'+esc(e.note||'')+'</li>').join('');
  c.innerHTML='<div class="t-xs muted">'+esc(path)+'</div><h2>'+esc(n.title)+'</h2><span class="pill"><i class="sw" style="width:10px;height:10px;border-radius:3px;background:'+({done:'var(--c-done)',building:'var(--c-building)',planned:'var(--c-planned)',vision:'repeating-linear-gradient(45deg,var(--fg-faint) 0 1.5px,transparent 1.5px 4px)'}[n.status])+'"></i>'+SW[n.status]+(n.since?' · since '+nice(n.since):'')+'</span>'
    +'<p class="why">'+(n.why?esc(n.why):'<span class="muted">Nothing written about this one yet.</span>')+'</p>'
    +(facts?'<ul class="facts">'+facts+'</ul>':'')
    +'<details><summary>More</summary><ul class="mt">'+(n.why?'<li>'+esc(n.why)+'</li>':'')+all('Waiting on',n.needs)+all('Holds up',n.needed_by)+all('Shares work with',n.shares)+ev+'</ul></details>';
  c.classList.add('on');
}

function crumbs(){
  const a=ancestors(focus), box=$('#crumbs'); let h='';
  h+=focus==='root'?'<span class="here">The whole vision</span>':'<button data-go="root" data-tip="Zoom all the way out to the whole vision.">The whole vision</button>';
  a.forEach((id,i)=>{ h+='<span class="sep">›</span>'+(i===a.length-1?'<span class="here">'+esc(D[id].title)+'</span>':'<button data-go="'+id+'" data-tip="Zoom back out to this level.">'+esc(D[id].title)+'</button>'); });
  box.innerHTML=h; $('#up').style.visibility=focus==='root'?'hidden':'visible';
}
function caption(){
  const c=$('#caption'), n=D[focus]; let t;
  if(focus==='root') t='<b>Each big box is a major system.</b> Each small square is one feature, coloured by where it stands. Click a system to zoom in.';
  else if(n.kids.length){ const k=counts(focus); t='<b>'+esc(verdict(focus).replace(/^./,x=>x.toUpperCase()))+'.</b> '+k.done+' of '+weight(focus)+' features exist.'; }
  else t='<b>'+SW[n.status].replace(/^./,x=>x.toUpperCase())+'.</b> Press Esc to zoom out.';
  c.innerHTML=t; c.dataset.tip=c.textContent;
}

/* ---- moving around ---- */
function tell(){ if(window.parent===window) return;
  const id=focus==='root'?null:focus; parent.postMessage({bp:'focus',id:id,title:id?D[id].title:''},'*'); }
function show(id){ // WHY fade: swap the layout while the canvas is invisible, then fade back in
  canvas.classList.add('fading'); clearTimeout(show.t);
  show.t=setTimeout(()=>{ focus=id; compute(); requestAnimationFrame(()=>canvas.classList.remove('fading')); },150); }
function go(id){ if(!D[id]||id===focus)return; try{history.replaceState(null,'',id==='root'?location.pathname:'#focus='+id);}catch(e){} show(id); tell(); }
canvas.addEventListener('click',e=>{ const t=e.target.closest('.nd'); if(!t)return; const m=meta[t.dataset.id]; if(!m)return;
  let id=t.dataset.id; if(id===focus) return;
  while(id&&meta[id]&&meta[id].rel>1) id=D[id].parent;
  if(meta[id]&&meta[id].rel===1) go(id); });
document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); } });
$('#up').addEventListener('click',()=>go(focus==='root'?'root':(D[focus].parent)));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&focus!=='root') go(D[focus].parent||'root');
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('nd')){ e.preventDefault(); e.target.click(); } });

/* ---- hover: plain-word tips, click-target highlight, line highlight ---- */
const tip=$('#tip');
function tipFor(el){
  const nd=el.closest('.nd'); if(nd&&meta[nd.dataset.id]){ const id=nd.dataset.id, n=D[id], m=meta[id];
    if(!n.kids.length){ let s='<b>'+esc(n.title)+'</b><br>'+SW[n.status]+(n.since?' since '+nice(n.since):'')+(n.why?'<br><span class="m">'+esc(n.why)+'</span>':'');
      let a=id; while(meta[a]&&meta[a].rel>1) a=D[a].parent; if(a!==id&&a!==focus) s+='<br><span class="m">Click to zoom into '+esc(D[a].title)+'.</span>'; else if(id!==focus) s+='<br><span class="m">Click for details.</span>';
      return s; }
    let s='<b>'+esc(n.title)+'</b><br>'+verdict(id).replace(/^./,x=>x.toUpperCase())+'. '+esc(countsWords(id))+'.';
    if(id!==focus) s+='<br><span class="m">Click to zoom in.</span>'; return s; }
  return el.closest('[data-tip]')?.dataset.tip||null; }
let hotEl=null;
function hot(el){ if(hotEl)hotEl.classList.remove('hot'); hotEl=el; if(el)el.classList.add('hot'); }
document.addEventListener('mousemove',e=>{
  const t=tipFor(e.target); if(!t){ tip.classList.remove('on'); } else {
    tip.innerHTML=t; tip.classList.add('on'); const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+14,y=e.clientY+16; if(x+w>innerWidth-8)x=e.clientX-w-14; if(y+h>innerHeight-8)y=e.clientY-h-12; tip.style.left=x+'px'; tip.style.top=y+'px'; }
  const nd=e.target.closest('.nd'); let a=null;
  if(nd&&meta[nd.dataset.id]&&nd.dataset.id!==focus){ let id=nd.dataset.id; while(meta[id]&&meta[id].rel>1)id=D[id].parent; if(meta[id]&&meta[id].rel===1&&D[id].kids.length) a=els[id]; }
  hot(a);
});
document.addEventListener('mouseleave',()=>tip.classList.remove('on'));

/* ---- start ---- */
if(window.self!==window.top) document.documentElement.classList.add('framed');
function fromHash(){ const m=location.hash.match(/focus=([^&]+)/), h=m?decodeURIComponent(m[1]):location.hash.slice(1);
  if(D[h]&&h!=='root') return h;
  const p=h.startsWith('part:')?null:null; return 'root'; }  // WHY: unknown ids (wiring parts) just open normally
function init(){ cur.order=D.root.kids; focus=fromHash(); compute(); if(focus!=='root') tell(); } // WHY: tell the switcher the plain title of what we opened on
addEventListener('resize',()=>compute());
addEventListener('hashchange',()=>{ const f=fromHash(); if(f!==focus){ show(f); } });
init();
</script>
</body>
</html>
