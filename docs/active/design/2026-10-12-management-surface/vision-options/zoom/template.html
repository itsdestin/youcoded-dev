<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Big picture: zoom in</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/*CC_CSS*/

/* ---- Zoom-in view: only layout and the status colours; every other look is cc.css's ---- */
:root{--c-done:var(--status-ok);--c-building:var(--fg-muted);--c-planned:color-mix(in srgb,var(--fg-faint) 72%,var(--canvas));--c-vision:var(--well);
  --l-exists:var(--status-ok);--l-building:var(--fg-2);--l-planned:var(--fg-faint)}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.band{position:relative;height:40px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--fg)}
.screen-body{flex:1;min-height:0;display:flex;padding:0 10px 10px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);border-radius:var(--radius-xl);overflow:hidden}
.panehead{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px 6px}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.crumbs .sep{color:var(--fg-faint)}
.crumbs button{border:0;background:transparent;color:var(--fg-2);cursor:pointer;border-radius:var(--radius-md);padding:3px 8px;font-size:14px;font-weight:500;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease)}
.crumbs button:hover{background:var(--inset);color:var(--fg)}
.crumbs button:focus-visible{outline:2px solid var(--accent)}
.crumbs .here{padding:3px 8px;font-size:14px;font-weight:600;color:var(--fg);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{position:absolute;right:16px;top:0;height:40px;display:flex;gap:14px;align-items:center}
.leg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);cursor:default}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.caption{flex:none;padding:0 16px 8px;font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:26px}
.caption b{color:var(--fg);font-weight:600}
#canvas{position:relative;flex:1;min-height:0;margin:0 16px 14px;overflow:hidden}

/* the boxes: every one is absolutely placed; JS moves them and CSS glides them */
.nd{position:absolute;box-sizing:border-box;overflow:hidden;opacity:0;pointer-events:none;border-radius:4px}
.anim .nd{transition:left 460ms var(--ease),top 460ms var(--ease),width 460ms var(--ease),height 460ms var(--ease),opacity 320ms var(--ease),background-color 200ms}
.nd.on{opacity:1;pointer-events:auto}
.nd.dim{opacity:.5}
.nd.pillar,.nd.capability{border-radius:var(--radius-lg)}
.nd.r1{background:var(--panel);border:1px solid var(--edge-card)}
.nd.r1.pillar{border-radius:var(--radius-xl)}
.nd.rx{background:transparent;border:1px solid var(--edge-dim)}
.nd.r0{background:transparent;border:0}
.nd.mini{background:var(--panel);border:1px solid var(--edge-card);border-radius:var(--radius-lg)}
.nd.click{cursor:pointer}
.nd.click:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nd.hot{border-color:var(--edge-strong);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.nd.hot.mini{box-shadow:0 0 0 2px var(--accent)}
.hd{position:absolute;left:0;right:0;top:0;padding:7px 10px 0;font-weight:500;color:var(--fg);pointer-events:none;overflow:hidden}
.hd .ti{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13px;line-height:16px}
.nd.capability .hd{padding:5px 8px 0}.nd.capability .hd .ti{-webkit-line-clamp:1;font-size:12px;line-height:15px}
.nd.mini .hd{padding:2px 7px 0}.nd.mini .hd .ti{-webkit-line-clamp:1;font-size:11px;line-height:13px}
.nd.leaf{border:0;border-radius:4px}
.nd.leaf.s-done{background:var(--c-done);color:var(--fg)}
.nd.leaf.s-building{background:var(--c-building);color:var(--on-accent)}
.nd.leaf.s-planned{background:var(--c-planned);color:var(--fg)}
.nd.leaf.s-vision{background:repeating-linear-gradient(45deg,var(--fg-faint) 0 1.5px,transparent 1.5px 6px),var(--well);box-shadow:inset 0 0 0 1px var(--edge-strong);color:var(--fg)}
.nd.leaf.s-done{--sc:var(--c-done)}.nd.leaf.s-building{--sc:var(--c-building)}.nd.leaf.s-planned{--sc:var(--fg-faint)}.nd.leaf.s-vision{--sc:var(--fg-faint)}
.nd.leaf.on:hover{filter:brightness(1.07);outline:2px solid var(--fg);outline-offset:-2px}
.nd.leaf.isfocus{background:color-mix(in srgb,var(--sc) 9%,var(--canvas));box-shadow:inset 0 0 0 2px var(--sc);color:var(--fg)}
.nd.leaf.s-vision.isfocus{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--fg-faint) 40%,transparent) 0 1.5px,transparent 1.5px 8px),var(--well)}
.nd.leaf.isfocus:hover{filter:none;outline:0}
.lb{position:absolute;inset:0;padding:7px 8px;pointer-events:none;overflow:hidden}
.lb .ti{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font-size:12px;line-height:15px;font-weight:500}
.lb .st{font-size:11px;line-height:14px;opacity:.78;margin-top:2px}
.nd.leaf.big .lb{padding:12px 13px}.nd.leaf.big .lb .ti{font-size:14px;line-height:18px;-webkit-line-clamp:5}
.nd.hasl::after{content:'';position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 2px color-mix(in srgb,var(--canvas) 70%,transparent)}
.nd.leaf.s-building.hasl::after{background:var(--on-accent)}
.nd.lk-exists{box-shadow:inset 0 0 0 2px var(--l-exists),0 0 0 1px var(--l-exists)}
.nd.lk-building{box-shadow:inset 0 0 0 2px var(--fg),0 0 0 1px var(--fg)}
.nd.lk-planned{box-shadow:inset 0 0 0 2px var(--fg-2),0 0 0 1px var(--canvas)}
.nd.mini.far{opacity:.55}
.nd.mini.far.on:hover{opacity:1}
.nd.leaf.isfocus.s-vision{box-shadow:inset 0 0 0 2px var(--fg-faint)}

/* the connection lines */
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;transition:opacity 260ms var(--ease)}
#lines.show{opacity:1}
#lines path{fill:none;stroke-linecap:round}
#lines path.exists{stroke:var(--l-exists)}#lines path.building{stroke:var(--l-building)}#lines path.planned{stroke:var(--l-planned);stroke-dasharray:6 5}
#lines circle{stroke:none}#lines circle.exists{fill:var(--l-exists)}#lines circle.building{fill:var(--l-building)}#lines circle.planned{fill:var(--l-planned)}
#lines .off{opacity:.12}
#lines .ls{transition:opacity 160ms}

#railhd{position:absolute;font-size:12px;font-weight:500;color:var(--fg-muted)}
#conns{position:absolute;overflow-y:auto;padding:0 2px 8px 0;font-size:12px}
#conns .eyebrow{margin:0 0 6px}
#conns details{border:1px solid var(--edge-card);border-radius:var(--radius-lg);background:var(--panel);margin:0 0 6px}
#conns summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-lg);color:var(--fg)}
#conns summary::-webkit-details-marker{display:none}
#conns summary:hover{background:var(--inset)}
#conns summary .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#conns summary .cnt{margin:0}
.lsw{width:30px;height:0;border-top:3px solid var(--l-exists);flex:none;border-radius:2px}
.lsw.building{border-color:var(--l-building)}.lsw.planned{border-top-style:dashed;border-color:var(--l-planned)}
#conns .it{padding:6px 10px 8px 10px;border-top:1px solid var(--edge-dim);color:var(--fg-2);line-height:1.4}
#conns .it b{font-weight:600;color:var(--fg);cursor:pointer}
#conns .it b:hover{text-decoration:underline}
#conns .it .bc{color:var(--fg-muted);display:block;margin-top:2px}
#conns .none{padding:8px 4px;color:var(--fg-muted)}
.lstate{font-size:11px;color:var(--fg-muted)}

#card{position:absolute;overflow:auto;padding:22px 26px;border-radius:var(--radius-xl);background:var(--panel);border:1px solid var(--edge);box-shadow:var(--layer-shadow);opacity:0;pointer-events:none;transition:opacity 260ms var(--ease) 260ms}
#card.on{opacity:1;pointer-events:auto}
#card h2{margin:6px 0 8px;font-size:18px;font-weight:600;color:var(--fg)}
#card .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px 2px 8px;border-radius:9999px;background:var(--inset);border:1px solid var(--edge)}
#card .why{font-size:14px;color:var(--fg);margin:0 0 14px}
#card .ev{margin:0;padding:0;list-style:none}
#card .ev li{padding:7px 0;border-top:1px solid var(--edge-dim);font-size:12px;color:var(--fg-2)}
#card .ev b{color:var(--fg);font-weight:600}

#hint{position:absolute;left:0;bottom:0;font-size:12px;color:var(--fg-muted);pointer-events:none}
#tip{position:fixed;z-index:50;max-width:340px;padding:8px 10px;border-radius:var(--radius-lg);background:var(--panel);color:var(--fg);border:1px solid var(--edge);box-shadow:var(--layer-shadow);font-size:12px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity 120ms}
#tip.on{opacity:1}
#tip b{font-weight:600}#tip .m{color:var(--fg-muted)}
.zbtn{flex:none}
</style>
</head>
<body>
<div class="screen">
  <div class="band"><span>Big picture</span>      <div class="legend" id="legend">
  <span class="leg" data-tip="Done and in the app today."><i class="sw" style="background:var(--c-done)"></i>exists</span>
  <span class="leg" data-tip="Work has started: an unmerged branch or an active plan."><i class="sw" style="background:var(--c-building)"></i>being built</span>
  <span class="leg" data-tip="Written on the roadmap, not started."><i class="sw" style="background:var(--c-planned)"></i>planned</span>
  <span class="leg" data-tip="Only in your words so far. Nothing written down or started."><i class="sw" style="background:repeating-linear-gradient(45deg,var(--fg-faint) 0 1.5px,transparent 1.5px 5px),var(--well);box-shadow:inset 0 0 0 1px var(--edge-strong)"></i>only an idea</span>
</div></div>
  <div class="screen-body"><div class="pane">
    <div class="panehead">
      <div class="crumbs" id="crumbs"></div>

      <button class="btn zbtn" id="up" data-tip="Zoom out one step. The Esc key does the same.">Zoom out</button>
    </div>
    <div class="caption" id="caption"></div>
    <div id="canvas"><svg id="lines"></svg><div id="railhd"></div><div id="conns"></div><div id="card"></div><div id="hint"></div></div>
  </div></div>
</div>
<div id="tip"></div>
<script>
const D=/*DATA*/;
const ORDER={done:0,building:1,planned:2,vision:3};
const SW={done:'exists',building:'being built',planned:'planned',vision:'only an idea'};
const KIND={changelog:'Release notes',roadmap:'Roadmap',shipped:'Shipped list',code:'The app itself',plan:'A plan',branch:'Work in progress',doc:'A document'};
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=d=>d?MON[+d.slice(5,7)-1]+' '+(+d.slice(8,10)):'';
const canvas=$('#canvas');

/* ---- the tree ---- */
const leafCache={};
function leaves(id){ if(leafCache[id])return leafCache[id]; const n=D[id]; return leafCache[id]=n.kids.length?n.kids.flatMap(leaves):[id]; }
const weight=id=>leaves(id).length;
function counts(id){ const c={done:0,building:0,planned:0,vision:0}; leaves(id).forEach(l=>c[D[l].status]++); return c; }
function statusOf(id){ // a box that is not a single feature: its own evidence if it has one, else read off its features
  const n=D[id]; if(n.status) return n.status; const c=counts(id), t=weight(id);
  if(c.done===t) return 'done'; if(c.building>0&&!c.planned&&!c.vision) return 'building'; return (c.done>=t*0.5&&!c.planned&&!c.vision)?'building':'planned'; }
function sortedKids(id){ const n=D[id];
  const k=n.kids.map((x,i)=>[x,i]);
  if(n.kind==='capability') k.sort((a,b)=>ORDER[D[a[0]].status]-ORDER[D[b[0]].status]||a[1]-b[1]); // WHY: same-status squares sit together so each colour reads as one patch
  else k.sort((a,b)=>weight(b[0])-weight(a[0])||a[1]-b[1]);
  return k.map(x=>x[0]); }
const ancestors=id=>{const a=[];while(id&&id!=='root'){a.unshift(id);id=D[id].parent;}return a;};
function verdict(id){ const c=counts(id),t=weight(id),d=c.done/t;
  return d>=0.75?'mostly exists':d>=0.45?'about half exists':'mostly still ahead'; }
function countsWords(id){ const c=counts(id),t=weight(id),p=[];
  if(c.done)p.push(c.done+' exist'+(c.done===1?'s':'')); if(c.building)p.push(c.building+' being built'); if(c.planned)p.push(c.planned+' planned'); if(c.vision)p.push(c.vision+' only '+(c.vision===1?'an idea':'ideas'));
  return t+' features: '+p.join(', '); }

/* ---- squarified treemap ---- */
function squarify(ids,x,y,w,h){
  const tot=ids.reduce((s,i)=>s+weight(i),0), k=w*h/tot, items=ids.map(i=>({id:i,a:weight(i)*k})), res={};
  const worst=(row,side)=>{const s=row.reduce((t,r)=>t+r.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn));};
  const place=row=>{const s=row.reduce((t,r)=>t+r.a,0);
    if(w>=h){const rw=s/h;let yy=y;row.forEach(r=>{const rh=r.a/rw;res[r.id]={x:x,y:yy,w:rw,h:rh};yy+=rh;});x+=rw;w-=rw;}
    else{const rh=s/w;let xx=x;row.forEach(r=>{const rw=r.a/rh;res[r.id]={x:xx,y:y,w:rw,h:rh};xx+=rw;});y+=rh;h-=rh;}};
  let row=[];
  for(const it of items){ const side=Math.min(w,h);
    if(!row.length||worst(row.concat(it),side)<=worst(row,side)) row.push(it); else{place(row);row=[it];} }
  if(row.length)place(row);
  return res; }

const meta={}; // id -> {rel,mode}
function lay(id,r,rel,mode,out){
  out[id]=r; meta[id]={rel,mode}; const n=D[id]; if(!n.kids.length)return;
  let hd=0,pad=0,g=2;
  if(mode==='main'){ if(rel===1) hd=n.kind==='pillar'?38:24; pad=rel===1?6:(rel===0?0:3); }
  else { pad=2; g=1; if(rel===0&&r.h>=30) hd=16; }
  const inner={x:r.x+pad,y:r.y+(hd?hd+2:pad),w:r.w-2*pad,h:r.h-pad-(hd?hd+2:pad)};
  const rs=squarify(sortedKids(id),inner.x,inner.y,Math.max(inner.w,1),Math.max(inner.h,1));
  for(const k of n.kids){ const q=rs[k]; lay(k,{x:q.x+g,y:q.y+g,w:Math.max(q.w-2*g,1),h:Math.max(q.h-2*g,1)},rel+1,mode,out); }
  meta[id].hd=hd; }

/* ---- DOM: one element per box, made once ---- */
const els={};
Object.values(D).forEach(n=>{ if(n.id==='root')return;
  const e=document.createElement('div'); e.className='nd '+n.kind; e.dataset.id=n.id; e.setAttribute('role','button');
  if(!n.kids.length){ e.classList.add('leaf','s-'+n.status); e.innerHTML='<div class="lb"><div class="ti">'+esc(n.title)+'</div><div class="st">'+SW[n.status]+'</div></div>'; }
  else e.innerHTML='<div class="hd"><div class="ti">'+esc(n.title)+'</div></div>';
  els[n.id]=e; });
// parents first so smaller boxes paint on top
Object.values(D).sort((a,b)=>ancestors(a.id).length-ancestors(b.id).length).forEach(n=>{ if(els[n.id]) canvas.insertBefore(els[n.id],$('#lines')); });

/* ---- state ---- */
let focus='root', links=[], groups=[], cur={};
const stateOf=(a,b)=>{const x=statusOf(a),y=statusOf(b); return (x==='done'&&y==='done')?'exists':((x==='planned'||x==='vision'||y==='planned'||y==='vision')?'planned':'building');};
const STATE_WORD={exists:'Exists today',building:'Being built',planned:'Planned, not started'};

function subtree(id){const s=new Set();(function w(i){s.add(i);D[i].kids.forEach(w);})(id);return s;}
function computeLinks(){
  links=[]; if(focus==='root')return;
  const S=subtree(focus), seen=new Set();
  Object.values(D).forEach(n=>{ if(n.id==='root')return;
    const inS=S.has(n.id);
    n.needs.forEach(x=>{ if(!D[x.id])return; const a=S.has(n.id),b=S.has(x.id); if(a===b)return; const k='n|'+n.id+'|'+x.id; if(seen.has(k))return; seen.add(k);
      links.push({kind:'needs',from:n.id,to:x.id,inside:a?n.id:x.id,outside:a?x.id:n.id,dir:a?'out':'in',because:x.because}); });
    n.shares.forEach(x=>{ if(!D[x.id])return; const a=S.has(n.id),b=S.has(x.id); if(a===b)return; const k='s|'+[n.id,x.id].sort().join('|'); if(seen.has(k))return; seen.add(k);
      links.push({kind:'shares',from:n.id,to:x.id,inside:a?n.id:x.id,outside:a?x.id:n.id,because:x.because}); }); });
  links.forEach(l=>{ l.state=stateOf(l.inside,l.outside); l.tp=D[l.outside].pillar||l.outside; l.own=l.tp===D[focus].pillar; });
}

let size={w:0,h:0};
function compute(animate){
  size={w:canvas.clientWidth,h:canvas.clientHeight}; const Cw=size.w,Ch=size.h;
  computeLinks();
  const out={}; Object.keys(meta).forEach(k=>delete meta[k]);
  let railX=Cw, railW=0, miniIds=[], boxes={};
  if(focus==='root'){ lay('root',{x:0,y:0,w:Cw,h:Ch},0,'main',out); }
  else {
    railW=Math.min(300,Math.round(Cw*.24)); const gap=Cw>1000?100:50; railX=Cw-railW; const mainW=Cw-railW-gap;
    lay(focus,{x:0,y:0,w:mainW,h:Ch},0,'main',out);
    miniIds=D.root.kids.filter(p=>p!==D[focus].pillar);
    const top=24, mh=Math.min(Math.round(Ch*.58),480), n=miniIds.length, g=4, minH=32;
    const free=Math.max(0,mh-top-n*minH-(n-1)*g), W=miniIds.reduce((s,i)=>s+weight(i),0);
    let y=top; miniIds.forEach(p=>{ const h=minH+free*weight(p)/W; const r={x:railX,y:y,w:railW,h:h}; boxes[p]=r; lay(p,r,0,'mini',out); y+=h+g; });
    cur.railBottom=y;
  }
  cur.out=out; cur.main=out[focus==='root'?'root':focus]; cur.railX=railX; cur.railW=railW; cur.boxes=boxes;
  // apply to the DOM
  const inMain=new Set(focus==='root'?[]:[]);
  Object.entries(els).forEach(([id,e])=>{
    const r=out[id], m=meta[id]; e.classList.remove('hot','hasl','lk-exists','lk-building','lk-planned','isfocus','big','r0','r1','rx','mini','click','far');
    if(!r){ e.classList.remove('on'); e.tabIndex=-1; return; }
    e.style.left=r.x+'px'; e.style.top=r.y+'px'; e.style.width=r.w+'px'; e.style.height=r.h+'px';
    e.classList.add('on'); e.classList.remove('dim');
    const n=D[id], leaf=!n.kids.length;
    if(m.mode==='mini'){ e.classList.add('mini'); if(leaf) e.classList.remove('mini'); }
    else e.classList.add(m.rel===0?'r0':m.rel===1?'r1':'rx');
    if(leaf){ e.classList.remove('r0','r1','rx');
      const lb=e.querySelector('.lb'); let show=false;
      if(m.mode==='main'){ if(id===focus){e.classList.add('isfocus');show=false;} else if(m.rel===1){show=true; e.classList.add('big');} else show=(r.w>=118&&r.h>=50); }
      lb.style.display=show?'':'none'; }
    else { const hd=e.querySelector('.hd'); let show=(m.mode==='main'&&m.rel===1)||(m.mode==='mini'&&m.rel===0&&r.h>=30); hd.style.display=show?'':'none'; }
    const clickable=(m.mode==='main'&&m.rel===1)||(m.mode==='mini'&&m.rel===0);
    if(clickable){ e.classList.add('click'); e.tabIndex=0; } else e.tabIndex=-1;
    if(m.mode==='mini'&&m.rel===0) e.classList.add('far');
  });
  // dots on features that have a connection, rings on the far-end features
  const ins=new Set(links.map(l=>l.inside)), outs=links.filter(l=>!l.own);
  if(focus!=='root'&&D[focus].kids.length) leaves(focus).forEach(l=>{ if([...ins].some(i=>subtree(i).has(l)) && out[l]) els[l].classList.add('hasl'); });
  outs.forEach(l=>leaves(l.outside).forEach(x=>{ const e=els[x]; if(e&&out[x]){ e.classList.remove('lk-exists','lk-building','lk-planned'); e.classList.add('lk-'+l.state); } }));
  if(focus!=='root'&&!D[focus].kids.length) els[focus].classList.remove('hasl');
  buildRail(); drawLines(); card(); crumbs(); caption(animate);
}

/* ---- the right-hand side: connections for the box in focus ---- */
function buildRail(){
  const rh=$('#railhd'), cn=$('#conns');
  if(focus==='root'){ rh.style.display='none'; cn.style.display='none'; groups=[]; return; }
  rh.style.display=''; cn.style.display='';
  rh.style.left=cur.railX+'px'; rh.style.top='0px'; rh.textContent='The rest of the app'; rh.dataset.tip='Every other major system, shrunk. Click one to zoom there. Bright squares are things connected to what you are looking at.';
  const top=(cur.railBottom||300)+12; cn.style.left=cur.railX+'px'; cn.style.width=cur.railW+'px'; cn.style.top=top+'px'; cn.style.height=Math.max(60,size.h-top)+'px';
  // group by far-end system and state
  const map={}; links.forEach(l=>{ const k=(l.own?'own':l.tp)+'|'+l.state; (map[k]=map[k]||{tp:l.own?'own':l.tp,state:l.state,items:[]}).items.push(l); });
  const rank=p=>p==='own'?99:cur.order.indexOf(p), srank={exists:0,building:1,planned:2};
  groups=Object.values(map).sort((a,b)=>(a.tp==='own')-(b.tp==='own')||rank(a.tp)-rank(b.tp)||srank[a.state]-srank[b.state]);
  let h='<div class="eyebrow">What it connects to <span class="cnt">'+links.length+'</span></div>';
  if(!links.length) h+='<div class="none">Nothing here is recorded as depending on, or sharing work with, anything else.</div>';
  const total=links.length;
  groups.forEach((g,gi)=>{
    const nm=g.tp==='own'?'Elsewhere in this same system':D[g.tp].title;
    const tipw={exists:'Both ends exist today, so this connection is real.',building:'At least one end is being built; none is only planned.',planned:'At least one end is only planned or an idea, so this connection does not exist yet.'}[g.state];
    h+='<details data-g="'+gi+'"'+((groups.length<=3||total<=6)?' open':'')+'><summary data-tip="'+esc(tipw)+' Click to list them."><i class="lsw '+g.state+'"></i><span class="nm">'+esc(nm)+'</span><span class="lstate">'+({exists:'exists',building:'in progress',planned:'planned'}[g.state])+'</span><span class="cnt">'+g.items.length+'</span></summary>';
    g.items.forEach(l=>{ const I='<b data-go="'+l.inside+'">'+esc(D[l.inside].title)+'</b>', O='<b data-go="'+l.outside+'">'+esc(D[l.outside].title)+'</b>';
      const s=l.kind==='shares'?I+' shares work with '+O:(l.dir==='out'?I+' needs '+O:O+' needs '+I);
      h+='<div class="it">'+s+(l.because?'<span class="bc">'+esc(l.because)+'</span>':'')+'</div>'; });
    h+='</details>'; });
  cn.innerHTML=h;
}

function drawLines(){
  const svg=$('#lines'); svg.classList.remove('show'); svg.innerHTML=''; svg.dataset.n='0';
  clearTimeout(drawLines.t);
  if(focus==='root'||!groups.length) return;
  const real=groups.filter(g=>g.tp!=='own'); if(!real.length) return;
  const Ch=size.h, K=real.length, step=K>1?Math.min(40,(Ch-130)/(K-1)):0, y0=Math.max(50,(Ch-step*(K-1))/2-40);
  const sx=cur.main.x+cur.main.w, ex=cur.railX;
  let h='';
  real.forEach((g,i)=>{ const b=cur.boxes[g.tp]; const idx=real.filter(x=>x.tp===g.tp); const j=idx.indexOf(g);
    const ey=b.y+b.h*(idx.length===1?.5:(.28+.44*j/(idx.length-1))), sy=y0+i*step;
    const mx=(sx+ex)/2, w=1.6+Math.min(g.items.length,10)*.55;
    h+='<g class="ls" data-g="'+groups.indexOf(g)+'"><path class="'+g.state+'" stroke-width="'+w.toFixed(1)+'" d="M'+sx+' '+sy+' C'+mx+' '+sy+' '+mx+' '+ey+' '+ex+' '+ey+'"/><circle class="'+g.state+'" cx="'+sx+'" cy="'+sy+'" r="'+(w/2+2).toFixed(1)+'"/><circle class="'+g.state+'" cx="'+ex+'" cy="'+ey+'" r="'+(w/2+2).toFixed(1)+'"/></g>'; });
  svg.innerHTML=h;
  drawLines.t=setTimeout(()=>svg.classList.add('show'),$('#canvas').classList.contains('anim')?480:0);
}

/* ---- the card for a single feature ---- */
function card(){
  const c=$('#card'); const n=D[focus];
  if(focus==='root'||n.kids.length){ c.classList.remove('on'); return; }
  const r=cur.main, w=Math.min(560,r.w-60), h=Math.min(r.h-60,440);
  c.style.left=(r.x+(r.w-w)/2)+'px'; c.style.top=(r.y+(r.h-h)/2)+'px'; c.style.width=w+'px'; c.style.maxHeight=h+'px';
  const path=ancestors(focus).slice(0,-1).map(a=>D[a].title).join('  ›  ');
  let ev=(n.evidence||[]).map(e=>'<li data-tip="Where this is recorded: '+esc(e.ref||'')+'"><b>'+esc(KIND[e.kind]||'Record')+(e.date?' · '+nice(e.date):'')+'</b><br>'+esc(e.note||'')+'</li>').join('');
  c.innerHTML='<div class="t-xs muted">'+esc(path)+'</div><h2>'+esc(n.title)+'</h2><span class="pill"><i class="sw" style="width:10px;height:10px;border-radius:3px;background:'+({done:'var(--c-done)',building:'var(--c-building)',planned:'var(--c-planned)',vision:'repeating-linear-gradient(45deg,var(--fg-faint) 0 1.5px,transparent 1.5px 4px)'}[n.status])+'"></i>'+SW[n.status]+(n.since?' · since '+nice(n.since):'')+'</span>'
    +'<p class="why" style="margin-top:14px">'+(n.why?esc(n.why):'<span class="muted">Nothing written about this one yet.</span>')+'</p>'
    +(ev?'<div class="eyebrow" style="margin-bottom:4px">What backs this up</div><ul class="ev">'+ev+'</ul>':'');
  c.classList.add('on');
}

function crumbs(){
  const a=ancestors(focus), box=$('#crumbs'); let h='';
  h+=focus==='root'?'<span class="here">The whole vision</span>':'<button data-go="root" data-tip="Zoom all the way out to the whole vision.">The whole vision</button>';
  a.forEach((id,i)=>{ h+='<span class="sep">›</span>'+(i===a.length-1?'<span class="here">'+esc(D[id].title)+'</span>':'<button data-go="'+id+'" data-tip="Zoom back out to this level.">'+esc(D[id].title)+'</button>'); });
  box.innerHTML=h; $('#up').style.visibility=focus==='root'?'hidden':'visible';
}
function caption(){
  const c=$('#caption'), n=D[focus]; let t;
  if(focus==='root') t='<b>Each big box is a major system.</b> The bigger the box, the more it holds. Each small square is one feature, coloured by where it stands today. <b>Click a system to zoom in.</b>';
  else if(n.kind==='pillar') t='<b>'+esc(verdict(focus).replace(/^./,x=>x.toUpperCase()))+'.</b> '+esc(countsWords(focus))+'. '+(n.quote?'<span class="muted">Your words: “'+esc(n.quote)+'”</span>':'');
  else if(n.kind==='capability') t='<b>'+esc(verdict(focus).replace(/^./,x=>x.toUpperCase()))+'.</b> '+esc(countsWords(focus))+'. Click a feature for what backs it up. Lines on the right show what this connects to.';
  else t='<b>'+SW[n.status].replace(/^./,x=>x.toUpperCase())+'.</b> Lines on the right show what this connects to. Press Esc to zoom out.';
  c.innerHTML=t; c.dataset.tip=c.textContent;
}

/* ---- moving around ---- */
function go(id,push){ if(!D[id])return; focus=id; try{history.replaceState(null,'',id==='root'?location.pathname:'#'+id);}catch(e){} cur.order=D.root.kids; compute(true); }
canvas.addEventListener('click',e=>{ const t=e.target.closest('.nd'); if(!t)return; const m=meta[t.dataset.id]; if(!m)return;
  let id=t.dataset.id;
  if(m.mode==='mini'){ go(D[id].pillar||id); return; }
  if(id===focus) return;
  while(id&&meta[id]&&meta[id].rel>1) id=D[id].parent;
  if(meta[id]&&meta[id].rel===1) go(id); });
document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); } });
$('#up').addEventListener('click',()=>go(focus==='root'?'root':(D[focus].parent)));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&focus!=='root') go(D[focus].parent||'root');
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('nd')){ e.preventDefault(); e.target.click(); } });

/* ---- hover: plain-word tips, click-target highlight, line highlight ---- */
const tip=$('#tip');
function tipFor(el){
  const nd=el.closest('.nd'); if(nd&&meta[nd.dataset.id]){ const id=nd.dataset.id, n=D[id], m=meta[id];
    if(!n.kids.length){ let s='<b>'+esc(n.title)+'</b><br>'+SW[n.status]+(n.since?' since '+nice(n.since):'')+(n.why?'<br><span class="m">'+esc(n.why)+'</span>':'');
      if(m.mode==='mini') s+='<br><span class="m">In '+esc(D[n.pillar].title)+'. Click to zoom there.</span>';
      else { let a=id; while(meta[a]&&meta[a].rel>1) a=D[a].parent; if(a!==id&&a!==focus) s+='<br><span class="m">Click to zoom into '+esc(D[a].title)+'.</span>'; else if(id!==focus) s+='<br><span class="m">Click for what backs it up.</span>'; }
      return s; }
    let s='<b>'+esc(n.title)+'</b><br>'+verdict(id).replace(/^./,x=>x.toUpperCase())+'. '+esc(countsWords(id))+'.';
    if(id!==focus) s+='<br><span class="m">Click to zoom in.</span>'; return s; }
  return el.closest('[data-tip]')?.dataset.tip||null; }
let hotEl=null;
function hot(el){ if(hotEl)hotEl.classList.remove('hot'); hotEl=el; if(el)el.classList.add('hot'); }
document.addEventListener('mousemove',e=>{
  const t=tipFor(e.target); if(!t){ tip.classList.remove('on'); } else {
    tip.innerHTML=t; tip.classList.add('on'); const w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+14,y=e.clientY+16; if(x+w>innerWidth-8)x=e.clientX-w-14; if(y+h>innerHeight-8)y=e.clientY-h-12; tip.style.left=x+'px'; tip.style.top=y+'px'; }
  const nd=e.target.closest('.nd'); let a=null;
  if(nd&&meta[nd.dataset.id]){ const m=meta[nd.dataset.id]; let id=nd.dataset.id; if(m.mode==='mini'){ while(meta[id]&&meta[id].rel>0)id=D[id].parent; a=els[id]; } else if(id!==focus){ while(meta[id]&&meta[id].rel>1)id=D[id].parent; if(meta[id]&&meta[id].rel===1&&!(!D[id].kids.length&&id===nd.dataset.id)) a=els[id]; } }
  hot(a);
  // line highlight when hovering a connection row
  const det=e.target.closest('#conns details'); const svg=$('#lines');
  svg.querySelectorAll('.ls').forEach(g=>g.classList.toggle('off',!!det&&g.dataset.g!==det.dataset.g));
});
document.addEventListener('mouseleave',()=>tip.classList.remove('on'));

/* ---- start ---- */
function init(){ cur.order=D.root.kids; const h=location.hash.slice(1); if(h&&D[h]) focus=h; compute(false); requestAnimationFrame(()=>requestAnimationFrame(()=>canvas.classList.add('anim'))); }
addEventListener('resize',()=>{ canvas.classList.remove('anim'); compute(false); requestAnimationFrame(()=>canvas.classList.add('anim')); });
addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(D[h]&&h!==focus){focus=h;compute(true);} else if(!h&&focus!=='root'){focus='root';compute(true);} });
init();
</script>
</body>
