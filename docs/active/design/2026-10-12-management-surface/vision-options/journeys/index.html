<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Journeys — where the app lands against the vision</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* cc.css — the shared pieces, ported class-for-class from the app's real components on
   origin/session/ui-consistency-audit (desktop/src/renderer/components/ui/*.tsx and
   styles/globals.css). Each block names the component it copies; the numbers are that
   component's Tailwind classes turned into CSS. WHY a rewrite (2026-10-13, audit.md): the
   previous file was written from the older guide text, not from the components, and
   drifted on almost every number (8px button corners, 32px buttons, capitals headings,
   panel-coloured rows, a 48px bordered header). Paint only with these variables.
   Switch theme with <html data-theme="creme|midnight|dark|light">. */

/* ---- theme palettes: the four built-ins, values from globals.css ---- */
:root, :root[data-theme="light"]{--canvas:#F2F2F2;--panel:#EAEAEA;--inset:#D7D7D7;--well:#F9F9F9;--accent:#1A1A1A;--on-accent:#F2F2F2;--fg:#1A1A1A;--fg-2:#444444;--fg-dim:#535353;--fg-muted:#5E5E5E;--fg-faint:#989898;--edge:#C0C0C0;--edge-dim:#B3B3B380;--link:#2055CA;--shadow-strength:.15;color-scheme:light}
:root[data-theme="dark"]{--canvas:#111111;--panel:#191919;--inset:#222222;--well:#1C1C1C;--accent:#D4D4D4;--on-accent:#111111;--fg:#E0E0E0;--fg-2:#B0B0B0;--fg-dim:#999999;--fg-muted:#898989;--fg-faint:#515151;--edge:#393939;--edge-dim:#44444480;--link:#66AAFF;--shadow-strength:.4;color-scheme:dark}
:root[data-theme="midnight"]{--canvas:#0D1117;--panel:#161B22;--inset:#21262D;--well:#0D1117;--accent:#B1BAC4;--on-accent:#0D1117;--fg:#C9D1D9;--fg-2:#A0AAB4;--fg-dim:#919AA4;--fg-muted:#858D97;--fg-faint:#4E555E;--edge:#343A41;--edge-dim:#3F454C80;--link:#58A6FF;--shadow-strength:.4;color-scheme:dark}
:root[data-theme="creme"]{--canvas:#F6EEE1;--panel:#EBE1D1;--inset:#D8CCB9;--well:#F9F0E2;--accent:#3D3229;--on-accent:#F6EEE1;--fg:#2C2418;--fg-2:#504333;--fg-dim:#564C3D;--fg-muted:#615648;--fg-faint:#9A8F7F;--edge:#C4B8A6;--edge-dim:#B8AC9A80;--link:#5B4A1E;--shadow-strength:.15;color-scheme:light}

/* ---- derived outlines (globals.css:2061-2062) and the semantic set (§2.3) ---- */
:root{
  /* WHY these two: card and button outlines in the app are not the raw --edge; they mix in
     text colour so they stay visible on every theme (decisions "Surface levels"). */
  --edge-card:color-mix(in srgb,var(--edge) 82%,var(--fg) 18%);
  --edge-strong:color-mix(in srgb,var(--edge) 65%,var(--fg) 35%);
  --status-ok:#2E9B57;--status-warn:#C99700;--status-error:#E5484D;--status-idle:#8A8A8A;
  --tag-blue:#3B82C4;
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;
  --font:'Cascadia Mono','Cascadia Code','Fira Code',ui-monospace,monospace;
  --dur-hover:180ms;--dur-reveal:260ms;--ease:cubic-bezier(.2,.7,.2,1);
  --layer-shadow:0 8px 32px rgba(0,0,0,var(--shadow-strength));
}
:root[data-theme="midnight"],:root[data-theme="dark"]{--status-warn:#F2B33D}

/* ---- page ---- */
*{box-sizing:border-box}
/* WHY clip: the page never scrolls itself (the pane does); without it the off-screen side panel
   widened the page and scrollIntoView slid everything sideways, cutting the panel off. */
html,body{margin:0;height:100%;overflow:clip}
body{font:14px/1.45 var(--font);color:var(--fg);background:var(--panel)}
a{color:var(--link)}
button{font:inherit}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- type scale (globals.css: 2xs/3xs 11 · xs 12 · sm 14 · base 16) ---- */
.t-lg{font-size:18px;font-weight:600}
.t-base{font-size:16px;font-weight:500}
.t-sm{font-size:14px}
.t-xs{font-size:12px}
.t-2xs{font-size:11px}
/* SectionLabel.tsx — 12px medium muted, NORMAL CASE, no letter-spacing. WHY: Destin retired
   the spaced-capitals eyebrow app-wide (decisions "Heading ladder", all "No capitals"). The
   class keeps its old name so every call site moves at once. */
.eyebrow{font-size:12px;font-weight:500;color:var(--fg-muted)}
.muted{color:var(--fg-muted)} .dim{color:var(--fg-2)}
.num{font-variant-numeric:tabular-nums}
/* Count after a word: faint, smaller (decisions "Counts", SegmentedTabLabel) */
.cnt{font-size:11px;font-weight:400;color:var(--fg-muted);margin-left:4px}

/* ---- .layer-surface (globals.css:1375): popups, full-screen cards ---- */
.layer{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-xl);box-shadow:var(--layer-shadow)}

/* ---- cards on a full screen are raised: .layer-surface (globals.css:1375) — panel fill, 1px edge,
        radius-xl, the layer shadow (MarketplaceCard.tsx:339; decisions "Card look: raised").
        A box inside one is the nested level: CARD_LEVEL_2 = FIELD_SURFACE 'bg-inset border border-edge-card rounded-lg'. ---- */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-xl);box-shadow:var(--layer-shadow);padding:16px}
.card .card,.card.inset{background:var(--inset);border:1px solid var(--edge-card);border-radius:var(--radius-lg);box-shadow:none;padding:12px}
/* + .card-interactive and .hover-lift on a grid card (MarketplaceCard.tsx:339; globals.css:1524,1547) */
.card-interactive{cursor:pointer;transition:background-color 120ms steps(4),transform 200ms steps(5)}
@media (hover:hover){.card-interactive:hover{background-color:var(--inset);transform:scale(1.02)}}
.card-interactive:active{background-color:var(--edge)}
.card-interactive:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Button.tsx ---- base 'inline-flex items-center justify-center gap-1.5 font-medium rounded-lg'
   md 'text-xs px-3 py-1.5' · sm 'text-2xs px-2.5 py-1' · secondary is the default here. */
.btn{font-size:12px;line-height:16px;font-weight:500;padding:6px 12px;border-radius:var(--radius-lg);border:1px solid var(--edge-strong);background:transparent;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease)}
.btn.sm{font-size:11px;line-height:14px;padding:4px 10px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{border-color:transparent;color:var(--fg-dim)}
@media (hover:hover){.btn:hover{background:var(--inset)} .btn.ghost:hover{color:var(--fg)}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent) 90%,transparent)}}
.btn:active{background:var(--edge)} .btn.primary:active{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- CloseButton.tsx = Button size="icon" variant="ghost": w-7 h-7, rounded-lg, svg w-4 h-4 ---- */
.closebtn{width:28px;height:28px;padding:0;flex:none;border:0;border-radius:var(--radius-lg);background:transparent;color:var(--fg-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background-color var(--dur-hover) var(--ease)}
@media (hover:hover){.closebtn:hover{background:var(--inset);color:var(--fg)}}
.closebtn:active{background:var(--edge)} .closebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- SegmentedTabs.tsx variant="pill" ----
   PILL_CONTAINER 'w-fit flex items-center gap-0.5 p-0.5 layer-surface !rounded-full' (shadow off)
   PILL_TAB_BASE 'px-3 py-1 rounded-full text-sm font-medium inline-flex items-center gap-1.5' */
.tabs{display:inline-flex;align-items:center;gap:2px;padding:2px;background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-full);width:fit-content;flex:none}
.tabs button{font-size:14px;line-height:20px;font-weight:500;padding:4px 12px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease)}
.tabs button .count{font-size:11px;color:var(--fg-muted)}
.tabs button svg.ic{width:16px;height:16px}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tabs button[aria-selected="true"] .count,.tabs button[aria-pressed="true"] .count{color:inherit;opacity:.8}
@media (hover:hover){.tabs button:not([aria-selected="true"]):not([aria-pressed="true"]):hover{background:var(--inset);color:var(--fg)}}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- FilterChip.tsx: 'px-3 py-1 rounded-full text-sm'; inactive 'bg-inset text-fg-2 hover:text-fg
        border border-edge hover:border-edge-dim'; active 'bg-accent text-on-accent' ---- */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font-size:14px;line-height:20px;padding:4px 12px;border-radius:var(--radius-full);background:var(--inset);border:1px solid var(--edge);color:var(--fg-2);cursor:pointer;white-space:nowrap;transition:color var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease)}
@media (hover:hover){.fchip:not([aria-pressed="true"]):hover{color:var(--fg);border-color:var(--edge-dim)}}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Chip.tsx (counts, plain tags): 'rounded-sm px-1.5 py-0.5 text-2xs text-fg-2 bg-inset border border-edge-dim' ---- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:var(--radius-sm);background:var(--inset);border:1px solid var(--edge-dim);font-size:11px;line-height:14px;color:var(--fg-2);white-space:nowrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg-muted);flex:none}
.dot.ok{background:var(--status-ok)} .dot.warn{background:var(--status-warn)} .dot.error{background:var(--status-error)} .dot.idle{background:var(--status-idle)}
/* ---- Pill.tsx (status labels: "tinted pill, normal case, dot inside" — decisions "Status labels"):
        'rounded-full border gap-1 pl-1.5 pr-2 py-px text-3xs leading-tight text-fg-2'; neutral 'bg-inset border-edge-dim' ---- */
.spill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:var(--radius-full);border:1px solid var(--edge-dim);background:var(--inset);font-size:11px;line-height:1.25;color:var(--fg-2);white-space:nowrap}
.spill.warn{background:color-mix(in srgb,var(--status-warn) 15%,transparent);border-color:color-mix(in srgb,var(--status-warn) 30%,transparent)}
.spill.warn .dot{background:var(--status-warn)}
/* the two sides of the app — a word with a small mark, in the muted line under a row */
.side{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-muted)}
/* WHY no mark (U8): the two small icons were unexplained; the words say it */

/* ---- SettingRow.tsx (nav density): 'surface-1 flex items-center gap-3 px-3 py-2 bg-inset/50
        border border-edge-card rounded-lg'; title 'text-sm text-fg font-medium'; description
        'text-2xs -mt-0.5 text-fg-muted' ---- */
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;background:color-mix(in srgb,var(--inset) 50%,transparent);border:1px solid var(--edge-card);border-radius:var(--radius-lg)}
.row .body{flex:1;min-width:0}
.row .body>.t-sm,.row .body>.t-xs{font-weight:500;color:var(--fg)}
.row .hint{font-size:11px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11px;color:var(--fg-muted);white-space:nowrap}
.card .row{background:var(--inset)}   /* a row inside a card is level 2 (globals.css .surface-1 .surface-1) */
/* the right-hand chevron every navigating row has (SettingRow: svg w-4 h-4 text-fg-muted, rotate-90 when open) */
.chev{display:inline-flex;color:var(--fg-muted);flex:none;transition:transform var(--dur-hover) var(--ease)}
.chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Callout.tsx info: 'rounded-lg p-3 border bg-accent/10 border-accent/25', text-xs ---- */
.callout{border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:var(--radius-lg);padding:12px;font-size:12px;color:var(--fg-2)}
/* ---- states.tsx EmptyState block: 'flex flex-col items-center gap-2 py-8', 'text-sm text-fg-muted text-center' ---- */
.empty{text-align:center;color:var(--fg-muted);padding:32px 0;font-size:14px}

/* ---- tooltips (Tooltip.tsx look: a small layer surface) ---- */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);min-width:160px;max-width:320px;width:max-content;padding:8px 10px;border-radius:var(--radius-lg);background:var(--panel);color:var(--fg);border:1px solid var(--edge);box-shadow:var(--layer-shadow);font-size:12px;font-weight:400;line-height:1.4;text-align:left;text-transform:none;letter-spacing:0;white-space:normal;opacity:0;pointer-events:none;transition:opacity var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease);z-index:20}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{opacity:1;transform:translateX(-50%) translateY(0)}
.tip.below::after{bottom:auto;top:calc(100% + 8px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- journeys view: only arranges the shared pieces above; status is shown as on the current page ---- */
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.band{height:40px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 12px}
.btitle{font-size:14px;font-weight:500;color:var(--fg);white-space:nowrap}
.screen-body{flex:1;min-height:0;display:flex;padding:0 10px 10px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);border-radius:var(--radius-xl);overflow:hidden}
.panehead{flex:none;padding:12px 20px;display:flex;flex-direction:column;gap:4px;position:relative}
.panehead::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;background:linear-gradient(to right,transparent,var(--edge-card) 8%,var(--edge-card) 92%,transparent)}
.cols{flex:1;min-height:0;display:flex}
.main{flex:1;min-width:0;overflow-y:auto;padding:14px 20px 40px;display:flex;flex-direction:column;gap:10px}
.side{width:340px;flex:none;overflow-y:auto;padding:16px 16px 40px 4px;display:flex;flex-direction:column;gap:12px}
.side .card{padding:12px}
.gh{font-size:16px;font-weight:500;margin:0}
.gdesc{font-size:12px;color:var(--fg-muted);margin:2px 0 0}

/* status dots, same four looks as the current Big picture tab */
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--fg-muted);box-sizing:border-box}
.sdot.done{background:var(--status-ok);border-color:var(--status-ok)}
.sdot.building{background:linear-gradient(90deg,var(--fg-2) 50%,transparent 50%);border-color:var(--fg-2)}
.sdot.planned{background:transparent}
.sdot.vision{border-style:dotted}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--fg-muted);font-size:12px}
.leg{display:inline-flex;align-items:center;gap:6px}

/* a journey = one raised card: title, then the steps left to right */
.jcard{padding:10px 14px 10px;flex:none;transition:opacity 150ms}
.jcard.dim{opacity:.38}
.jhead{display:flex;align-items:flex-start;gap:10px}
.jnum{flex:none;width:22px;height:22px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.jtext{flex:1;min-width:0}
.jtitle{font-size:14px;font-weight:500;color:var(--fg)}
.jquote{font-size:11px;color:var(--fg-muted);margin-top:1px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{flex:none;margin-top:1px}
.verdict.ok{background:color-mix(in srgb,var(--status-ok) 15%,transparent);border-color:color-mix(in srgb,var(--status-ok) 35%,transparent)}
.steps{display:flex;align-items:stretch;margin-top:8px}
.link{flex:0 0 14px;align-self:center;height:0;border-top:2px solid var(--status-ok);position:relative}
.link.broken{border-top:2px dashed var(--fg-faint)}
.step{flex:1 1 0;min-width:0;text-align:left;position:relative;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--inset) 55%,transparent);border:1px solid var(--edge-card);border-radius:var(--radius-lg);padding:10px 8px 6px;display:flex;flex-direction:column;gap:3px;
  transition:background-color 120ms steps(4)}
@media (hover:hover){.step:hover{background:var(--inset)}}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step::before{content:'';position:absolute;left:8px;right:8px;top:0;height:4px;border-radius:0 0 3px 3px}
.step.done::before{background:var(--status-ok)}
.step.building::before{background:var(--fg-2)}
.step.planned::before{background:var(--fg-faint)}
.step.vision::before{background:repeating-linear-gradient(45deg,var(--fg-faint) 0 2px,transparent 2px 5px)}
.step.vision{border-style:dashed}
.step .st{font-size:12px;line-height:1.3;font-weight:500;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.step .sy{font-size:11px;color:var(--fg-muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .sw{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-2)}
.catch{font-weight:500;color:var(--fg)}
.step.stop{box-shadow:0 0 0 2px var(--accent)}
.step.beyond{opacity:.72}
.step.sel{background:var(--inset);box-shadow:0 0 0 2px var(--tag-blue)}
.step.hit{box-shadow:0 0 0 2px var(--status-warn);background:color-mix(in srgb,var(--status-warn) 14%,var(--inset))}
.flag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:600;line-height:1;padding:3px 7px;border-radius:var(--radius-full);white-space:nowrap}
.stopwhy{margin-top:8px;font-size:12px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stopwhy b{font-weight:600;color:var(--fg)}
.also{margin-top:3px;font-size:11px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.also button{font:inherit;color:var(--fg-2);background:none;border:0;border-bottom:1px dotted var(--fg-muted);padding:0;cursor:pointer}
.also button:hover{color:var(--fg)}

/* side: summary rows */
.irow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:var(--radius-md);padding:6px 8px;margin:0;color:var(--fg);cursor:pointer;font:inherit}
@media (hover:hover){.irow:hover{background:var(--inset)}} .irow:focus-visible{outline:2px solid var(--accent)}
.irow.on{background:var(--inset);box-shadow:inset 0 0 0 1px var(--edge-strong)}
.irow .t-sm{flex:1;min-width:0;font-size:13px;line-height:1.3}
.chips{display:flex;gap:3px;flex:none}
.jc{width:18px;height:18px;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.jc.link{flex:none;align-self:auto;border:0;height:18px;position:static;cursor:pointer;font:inherit;font-size:11px;font-weight:600}
.side .eyebrow{margin-bottom:4px}
.sub{font-size:11px;color:var(--fg-muted);margin:0 8px 6px}
.clear{align-self:flex-start}

/* side: detail */
.dhead{display:flex;align-items:flex-start;gap:8px}
.dhead .t-base{flex:1;line-height:1.3}
.statusline{display:flex;align-items:center;gap:8px;color:var(--fg-2);flex-wrap:wrap;margin-top:6px}
.dsec{margin-top:12px}
.vlink{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;margin:0 -6px;border-radius:var(--radius-md);cursor:pointer}
@media (hover:hover){.vlink:hover{background:var(--inset)}}
.vlink .sdot{margin-top:4px}
.vlink .t-sm{font-size:13px;line-height:1.3}
.crumb{font-size:12px;color:var(--fg-2)}
#tip{position:fixed;z-index:50;max-width:300px;padding:8px 10px;border-radius:var(--radius-lg);background:var(--panel);color:var(--fg);border:1px solid var(--edge);box-shadow:var(--layer-shadow);font-size:12px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity var(--dur-hover) var(--ease)}
#tip.on{opacity:1}
</style></head>
<body>
<div class="screen">
  <div class="band"><div></div><div class="btitle">Journeys</div><div></div></div>
  <div class="screen-body"><div class="pane">
    <div class="panehead">
      <div class="gh" data-tip="Each row is something a real person would want to do. Every box is a piece of the app, coloured by whether it exists today. Read left to right: you can get this far, then it stops.">What can people actually do with the app today, from start to finish?</div>

xtra": ["agents.background.personal"], "stop": 1}, {"title": "Start a chat on one device, pick it up on another", "quote": "I start a conversation on one device, I can pick it up on almost any of my other devices pretty much immediately", "steps": ["sync.follow.chats", "sync.follow.remote", "everywhere.platforms.web", "everywhere.platforms.android", "sync.follow.safety", "sync.mesh.backup"], "held": ["sync.follow.safety", "sync.mesh.backup"], "extra": [], "stop": 4}, {"title": "A normal person finds free tools and has the assistant set them up", "quote": "download a single app and then see curated free content that would actually be useful to them in their daily lives", "steps": ["everywhere.platforms.desktop", "everywhere.firstrun.setup", "marketplace.browse.curated", "marketplace.setup.install", "marketplace.setup.walkthrough", "yours.everyone.ostools"], "held": ["marketplace.browse.pages", "marketplace.setup.walkthrough", "yours.everyone.ostools"], "extra": ["marketplace.browse.pages"], "stop": 4}, {"title": "Use any AI you like, with no single company holding your work", "quote": "use any open weight model, any US or Chinese model to work with an open source document editor", "steps": ["chat.converse.cloud", "chat.converse.local", "chat.converse.native", "yours.model.any", "yours.model.free", "yours.model.data"], "held": ["yours.model.free"], "extra": [], "stop": 4}], "byNode": {"agents.background.personal": [0, 2, 3], "agents.background.scheduled": [0, 2, 3], "agents.unit.recipe": [0, 2, 3], "yours.everyone.student": [0, 3], "yours.model.free": [0, 6], "marketplace.browse.pages": [1, 5], "marketplace.publish.fork": [1], "agents.background.view": [2, 3], "sync.follow.safety": [2, 4], "sync.mesh.handoff": [2], "pages.agents.attached": [3], "sync.mesh.backup": [4], "marketplace.setup.walkthrough": [5], "yours.everyone.ostools": [5]}, "bySys": {"agents": [0, 2, 3], "yours": [0, 3, 5, 6], "marketplace": [1, 5], "sync": [2, 4], "pages": [3]}, "sys": {"chat": "Chat and the assistant", "projects": "Projects", "pages": "Pages", "marketplace": "Marketplace", "social": "Social", "sync": "Sync and Mesh", "agents": "Agents and automations", "yours": "Yours: personalization and no lock-in", "everywhere": "Everywhere: desktop, phone, web", "together": "Built together: open source and the community"}, "tracks": {"app": "The app", "addons": "Marketplace & add-ons", "engine": "The assistant's engine", "devices": "Installs & devices", "building": "How it gets built"}, "mission": "An app that is yours: your tools, your data, your choice of AI, built and shared with everyone. The core of a personal, open-source 'artisan web' against the own-nothing-and-be-happy economy."};
const N=DATA.nodes, J=DATA.journeys;
const WORD={done:'exists',building:'being built',planned:'planned',vision:'only an idea'};
const TIPS={done:'This exists in the app today.',building:'Someone is building this right now, but it is not in the app yet.',planned:'Written down as future work. Nothing is built yet.',vision:'Only in your own words so far. No plan or work behind it.'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=d=>{if(!d)return '';const [y,m,dd]=d.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+dd)+', '+y};
const dot=s=>`<i class="sdot ${s}" aria-hidden="true"></i>`;
let sel=null, filt=null; // selected step id; filter = {kind:'sys'|'node', id}

document.getElementById('legend').innerHTML=Object.keys(WORD).map(s=>`<span class="leg" data-tip="${esc(TIPS[s])}">${dot(s)}${WORD[s]}</span>`).join('')+
  `<span class="leg" data-tip="The first box in a row that is not finished. Everything to its right cannot be reached yet."><span class="flag" style="position:static;transform:none">stops here</span></span>`;

function heldIds(){ // which unfinished things match the current filter
  if(!filt) return null;
  if(filt.kind==='node') return new Set([filt.id]);
  return new Set(Object.keys(DATA.byNode).filter(k=>N[k].sysid===filt.id));
}
function renderMain(){
  const H=heldIds();
  document.getElementById('main').innerHTML=J.map((j,i)=>{
    const rowHit=H&&j.held.some(x=>H.has(x));
    const stopN=j.stop===null?null:N[j.steps[j.stop]];
    const verdict=j.stop===null
      ?`<span class="spill verdict ok tip" data-tip="Every step in this row exists today. A person can do this from start to finish."><i class="sdot done"></i>Works from start to finish</span>`
      :`<span class="spill verdict tip" data-tip="${esc(j.stop===0?'The very first step does not exist yet, so this cannot be started.':'The first '+j.stop+' step'+(j.stop>1?'s work':' works')+'; the next one does not exist yet, so a person gets stuck there.')}">${j.stop===0?'Cannot start yet':'Works up to step '+j.stop+' of '+j.steps.length}</span>`;
    const steps=j.steps.map((s,k)=>{
      const n=N[s], beyond=j.stop!==null&&k>j.stop&&n.status==='done', isStop=k===j.stop;
      const link=k?`<span class="link${j.stop!==null&&k>j.stop?' broken':''}"></span>`:'';
      const tip=n.title+' — '+TIPS[n.status]+(isStop?' This is where the journey stops.':'')+(beyond?' It works on its own, but you cannot reach it in this journey yet because an earlier step is missing.':'')+' Click for details.';
      return link+`<button class="step ${n.status}${isStop?' stop':''}${beyond?' beyond':''}${sel===s?' sel':''}${H&&H.has(s)?' hit':''}" data-step="${s}" data-tip="${esc(tip)}">${isStop?'<span class="flag">stops here</span>':''}
        <span class="st">${esc(n.label||n.title)}</span><span class="sy">${esc(n.system)}</span><span class="sw">${dot(n.status)}${WORD[n.status]}${n.catch?' <b class="catch" data-tip="Counted as existing, but its own evidence names a catch. Click for details.">· with a catch</b>':''}</span></button>`;
    }).join('');
    const cat=j.steps.filter(s=>N[s].catch).map(s=>`<div class="also" style="white-space:normal"><b>With a catch — ${esc(N[s].label||N[s].title)}:</b> ${esc(N[s].why)}</div>`).join('');
    const why=stopN?`<div class="stopwhy"><b>Stops at “${esc(stopN.label||stopN.title)}”.</b> ${esc(stopN.why)}</div>`:'';
    const also=j.extra.length?`<div class="also">Also waiting on, behind the scenes: ${j.extra.map(x=>`<button data-step="${x}" data-tip="${esc(WORD[N[x].status]+' — '+N[x].why+' Click for details.')}">${esc(N[x].label||N[x].title)}</button>`).join(', ')}</div>`:'';
    return `<section class="card jcard${H&&!rowHit?' dim':''}" id="j${i}"><div class="jhead"><span class="jnum">${i+1}</span><div class="jtext"><div class="jtitle">${esc(j.title)}</div><div class="jquote">“${esc(j.quote)}”</div></div>${verdict}</div>
      <div class="steps">${steps}</div>${why}${cat}${also}</section>`;
  }).join('');
}
const chips=a=>`<span class="chips">${a.map(i=>`<span class="jc" data-tip="Journey ${i+1}: ${esc(J[i].title)}">${i+1}</span>`).join('')}</span>`;
function renderSide(){
  const sysRows=Object.entries(DATA.bySys).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));
  const nodeRows=Object.entries(DATA.byNode).filter(([k,v])=>v.length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,7);
  const on=(k,id)=>filt&&filt.kind===k&&filt.id===id?' on':'';
  let h='';
  if(sel) h+=detail(sel);
  h+=`<div class="card"><div class="eyebrow" data-tip="Parts of the app that are not finished and that journeys run into. The numbers are the journeys held up. A system at the top is the one to finish first to get the most journeys working.">Which systems hold journeys back</div>
    ${sysRows.map(([id,v])=>`<button class="irow${on('sys',id)}" data-filt="sys:${id}" data-tip="Click to light up the unfinished boxes from ${esc(DATA.sys[id])} across all journeys. Click again to clear."><span class="t-sm">${esc(DATA.sys[id])}</span>${chips(v)}</button>`).join('')}</div>`;
  h+=`<div class="card"><div class="eyebrow" data-tip="Single unfinished things that more than one journey runs into, including ones hidden behind the boxes you see. Finishing one of these moves several journeys at once.">Single things that stop more than one journey</div>
    ${nodeRows.map(([id,v])=>`<button class="irow${on('node',id)}" data-filt="node:${id}" data-tip="${esc(WORD[N[id].status]+' — '+N[id].why+' Click to light it up.')}">${dot(N[id].status)}<span class="t-sm">${esc(N[id].label||N[id].title)}</span>${chips(v)}</button>`).join('')}</div>`;
  if(filt) h+=`<button class="btn sm ghost clear" data-clear data-tip="Stop highlighting and show every journey normally.">Clear highlight</button>`;
  document.getElementById('side').innerHTML=h;
}
function detail(id){
  const n=N[id], usedBy=J.map((j,i)=>j.steps.includes(id)?i:-1).filter(i=>i>=0), heldBy=(DATA.byNode[id]||[]).filter(i=>!usedBy.includes(i));
  const row=(x,extra)=>`<div class="vlink" data-step="${x}" data-tip="Open the details for this piece."><i class="sdot ${N[x].status}"></i><div><div class="t-sm">${esc(N[x].title)}</div><div class="t-2xs muted">${WORD[N[x].status]}${extra?' · '+esc(extra):''}</div></div></div>`;
  const needs=n.needs.map(x=>row(x,n.needsWhy[x])).join('');
  return `<div class="card"><div class="dhead"><div class="t-base">${esc(n.title)}</div><button class="closebtn" data-closed aria-label="Close" data-tip="Close these details."><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <div class="statusline t-xs"><span data-tip="${esc(TIPS[n.status])}">${dot(n.status)} ${WORD[n.status]}${n.since?' · since '+nice(n.since):''}</span></div>
   <p class="t-sm" style="margin:8px 0 0">${esc(n.why)}</p>
   <div class="dsec"><div class="eyebrow">Belongs to</div><div class="crumb" data-tip="The big system this piece is part of.">${esc(n.system)}${n.cap?' › '+esc(n.cap):''}</div>
     <div style="margin-top:4px"><span class="badge" data-tip="The line of work this piece belongs to.">${esc(DATA.tracks[n.track])}</span></div></div>
   <div class="dsec"><div class="eyebrow" data-tip="Pieces that have to exist first. If one of them is missing, this one cannot work either.">What it needs first</div>${needs||'<div class="t-xs muted">Nothing else. It stands on its own.</div>'}</div>
   ${n.shares.length?`<div class="dsec"><div class="eyebrow" data-tip="Different names for overlapping work. Doing one moves the other.">Closely tied to</div>${n.shares.map(x=>row(x)).join('')}</div>`:''}
   <div class="dsec"><div class="eyebrow" data-tip="The journeys on this page that pass through this piece, or that are held up by it behind the scenes.">Journeys it matters to</div>
     ${usedBy.length||heldBy.length?`<span class="chips">${usedBy.concat(heldBy).map(i=>`<span class="jc" data-tip="Journey ${i+1}: ${esc(J[i].title)}">${i+1}</span>`).join('')}</span>`:'<div class="t-xs muted">None of the journeys here.</div>'}</div></div>`;
}
function selectStep(id){
  sel=id; renderMain(); renderSide();
  const b=document.querySelector(`.step[data-step="${id}"]`); if(b) b.classList.add('sel');
  document.getElementById('side').scrollTop=0;
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-closed]')){sel=null;renderMain();renderSide();return}
  if(t.closest('[data-clear]')){filt=null;renderMain();renderSide();return}
  const f=t.closest('[data-filt]'); if(f){const [k,id]=f.dataset.filt.split(':');filt=(filt&&filt.kind===k&&filt.id===id)?null:{kind:k,id};renderMain();renderSide();return}
  const s=t.closest('[data-step]'); if(s) selectStep(s.dataset.step);
});
// one floating hint for everything with data-tip (a CSS-only hint would be clipped by the scrolling panes)
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]'); if(!t){tip.classList.remove('on');return}
  tip.textContent=t.dataset.tip; tip.classList.add('on'); const r=t.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8), y=r.top-h-8; if(y<8) y=r.bottom+8; tip.style.left=x+'px'; tip.style.top=y+'px'});
document.addEventListener('mouseleave',()=>tip.classList.remove('on'));
renderMain(); renderSide();
</script></body></html>
