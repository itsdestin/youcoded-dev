<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Journeys — where the app lands against the vision</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/*CC_CSS*/
/* ---- journeys view: only arranges the shared pieces above; status is shown as on the current page ---- */
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.band{height:40px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 12px}
.btitle{font-size:14px;font-weight:500;color:var(--fg);white-space:nowrap}
.screen-body{flex:1;min-height:0;display:flex;padding:0 10px 10px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);border-radius:var(--radius-xl);overflow:hidden}
.panehead{flex:none;padding:12px 20px;display:flex;flex-direction:column;gap:4px;position:relative}
.panehead::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;background:linear-gradient(to right,transparent,var(--edge-card) 8%,var(--edge-card) 92%,transparent)}
.cols{flex:1;min-height:0;display:flex}
/* WHY (U10): both scrolling panes fade out at the bottom with a plain "more below" cue while there is more to scroll to, so nothing looks cut off by accident */
.wrap{position:relative;display:flex;min-width:0;min-height:0}
.wrap.grow{flex:1}
.side-wrap{width:360px;flex:none}
.wrap>.main,.wrap>.side{flex:1;width:auto;min-height:0}
.cue{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;pointer-events:none;opacity:0;transition:opacity 150ms;background:linear-gradient(to bottom,transparent,var(--canvas) 80%)}
.cue.on{opacity:1}
.cue span{font-size:12px;color:var(--fg-2);background:var(--panel);border:1px solid var(--edge-card);border-radius:var(--radius-full);padding:3px 10px}
.gl{border-bottom:1px dotted var(--fg-muted);cursor:help}
.main{flex:1;min-width:0;overflow-y:auto;padding:14px 20px 40px;display:flex;flex-direction:column;gap:10px}
.side{overflow-y:auto;padding:16px 16px 40px 4px;display:flex;flex-direction:column;gap:12px}
.side .card{padding:12px}
.gh{font-size:16px;font-weight:500;margin:0}
.gdesc{font-size:12px;color:var(--fg-muted);margin:2px 0 0}

/* status dots, same four looks as the current Big picture tab */
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--fg-muted);box-sizing:border-box}
.sdot.done{background:var(--status-ok);border-color:var(--status-ok)}
.sdot.building{background:linear-gradient(90deg,var(--fg-2) 50%,transparent 50%);border-color:var(--fg-2)}
.sdot.planned{background:transparent}
.sdot.vision{border-style:dotted}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--fg-muted);font-size:12px}
.leg{display:inline-flex;align-items:center;gap:6px}

/* a journey = one raised card: title, then the steps left to right */
.jcard{padding:10px 14px 10px;flex:none;transition:opacity 150ms}
.jcard.dim{opacity:.38}
.jhead{display:flex;align-items:flex-start;gap:10px}
.jnum{flex:none;width:22px;height:22px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.jtext{flex:1;min-width:0}
.jtitle{font-size:14px;font-weight:500;color:var(--fg)}
.jline{font-size:12px;color:var(--fg-2);margin-top:2px}
.jquote{font-size:11px;color:var(--fg-muted);margin-top:1px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{overflow-x:hidden}
.verdict{flex:none;margin-top:1px}
.verdict.ok{background:color-mix(in srgb,var(--status-ok) 15%,transparent);border-color:color-mix(in srgb,var(--status-ok) 35%,transparent)}
.steps{display:flex;align-items:stretch;margin-top:8px}
.link{flex:0 0 14px;align-self:center;height:0;border-top:2px solid var(--status-ok);position:relative}
.link.broken{border-top:2px dashed var(--fg-faint)}
.step{flex:1 1 0;min-width:0;text-align:left;position:relative;font:inherit;color:var(--fg);cursor:pointer;
  background:color-mix(in srgb,var(--inset) 55%,transparent);border:1px solid var(--edge-card);border-radius:var(--radius-lg);padding:10px 8px 6px;display:flex;flex-direction:column;gap:3px;
  transition:background-color 120ms steps(4)}
@media (hover:hover){.step:hover{background:var(--inset)}}
.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step::before{content:'';position:absolute;left:8px;right:8px;top:0;height:4px;border-radius:0 0 3px 3px}
.step.done::before{background:var(--status-ok)}
.step.building::before{background:var(--fg-2)}
.step.planned::before{background:var(--fg-faint)}
.step.vision::before{background:repeating-linear-gradient(45deg,var(--fg-faint) 0 2px,transparent 2px 5px)}
.step.vision{border-style:dashed}
.step .st{font-size:12px;line-height:1.3;font-weight:500;flex:1;overflow-wrap:break-word;hyphens:auto}
.step .sy{font-size:11px;color:var(--fg-muted);line-height:1.25;overflow-wrap:break-word}
.step .sw{display:flex;align-items:center;flex-wrap:wrap;gap:2px 5px;font-size:11px;color:var(--fg-2)}
.catch{font-weight:500;color:var(--fg)}
.step.stop{box-shadow:0 0 0 2px var(--accent)}
.step.beyond{opacity:.72}
.step.sel{background:var(--inset);box-shadow:0 0 0 2px var(--tag-blue)}
.step.hit{box-shadow:0 0 0 2px var(--status-warn);background:color-mix(in srgb,var(--status-warn) 14%,var(--inset))}
.flag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:600;line-height:1;padding:3px 7px;border-radius:var(--radius-full);white-space:nowrap}
.stopwhy{margin-top:8px;font-size:12px;color:var(--fg-2)}
.stopwhy .more{color:var(--fg-muted);cursor:default;border-bottom:1px dotted var(--fg-muted)}
.stopwhy b{font-weight:600;color:var(--fg)}
.also{margin-top:3px;font-size:11px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.also button{font:inherit;color:var(--fg-2);background:none;border:0;border-bottom:1px dotted var(--fg-muted);padding:0;cursor:pointer}
.also button:hover{color:var(--fg)}

/* side: summary rows */
.irow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:var(--radius-md);padding:6px 8px;margin:0;color:var(--fg);cursor:pointer;font:inherit}
@media (hover:hover){.irow:hover{background:var(--inset)}} .irow:focus-visible{outline:2px solid var(--accent)}
.irow.on{background:var(--inset);box-shadow:inset 0 0 0 1px var(--edge-strong)}
.irow .t-sm{flex:1;min-width:0;font-size:13px;line-height:1.3}
.chips{display:flex;gap:3px;flex:none}
.jc{width:18px;height:18px;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.jc.link{flex:none;align-self:auto;border:0;height:18px;position:static;cursor:pointer;font:inherit;font-size:11px;font-weight:600}
.side .eyebrow{margin-bottom:4px}
.sub{font-size:11px;color:var(--fg-muted);margin:0 8px 6px}
.clear{align-self:flex-start}

.hold{flex:none;font-size:12px;color:var(--fg-muted);white-space:nowrap}
.irow.on .hold{color:var(--fg)}
.fact{font-size:13px;line-height:1.35;color:var(--fg-2);margin:6px 0 0}
.fact b{font-weight:500;color:var(--fg)}
.fact button{font:inherit;color:var(--fg);background:none;border:0;border-bottom:1px dotted var(--fg-muted);padding:0;cursor:pointer}
details.more{margin-top:12px;border-top:1px solid var(--edge-card);padding-top:8px}
details.more>summary{cursor:pointer;font-size:12px;color:var(--fg-2);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'+ '}
details.more[open]>summary::before{content:'\2212 '}
.framed .band{display:none}
/* side: detail */
.dhead{display:flex;align-items:flex-start;gap:8px}
.dhead .t-base{flex:1;line-height:1.3}
.statusline{display:flex;align-items:center;gap:8px;color:var(--fg-2);flex-wrap:wrap;margin-top:6px}
.dsec{margin-top:12px}
.vlink{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;margin:0 -6px;border-radius:var(--radius-md);cursor:pointer}
@media (hover:hover){.vlink:hover{background:var(--inset)}}
.vlink .sdot{margin-top:4px}
.vlink .t-sm{font-size:13px;line-height:1.3}
.crumb{font-size:12px;color:var(--fg-2)}
#tip{position:fixed;z-index:50;max-width:300px;padding:8px 10px;border-radius:var(--radius-lg);background:var(--panel);color:var(--fg);border:1px solid var(--edge);box-shadow:var(--layer-shadow);font-size:12px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity var(--dur-hover) var(--ease)}
#tip.on{opacity:1}
</style></head>
<body>
<script>if(window.self!==window.top)document.documentElement.classList.add("framed")</script>
<div class="screen">
  <div class="band"><div></div><div class="btitle">Journeys</div><div></div></div>
  <div class="screen-body"><div class="pane">
    <div class="panehead">
      <div class="gh" data-tip="Each row is something a real person would want to do. Every box is a piece of the app, coloured by whether it exists today. Read left to right: you can get this far, then it stops.">What can people actually do with the app today, from start to finish?</div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="cols">
      <div class="wrap grow"><div class="main" id="main"></div><div class="cue" id="cue-main"><span>More journeys below ↓</span></div></div>
      <div class="wrap side-wrap"><aside class="side" id="side"></aside><div class="cue" id="cue-side"><span>More below ↓</span></div></div>
    </div>
  </div></div>
</div>
<div id="tip"></div>
<script>
/*DATA*/
const N=DATA.nodes, J=DATA.journeys;
const WORD={done:'exists',building:'being built',planned:'planned',vision:'only an idea'};
const TIPS={done:'This exists in the app today.',building:'Someone is building this right now, but it is not in the app yet.',planned:'Written down as future work. Nothing is built yet.',vision:'Only in your own words so far. No plan or work behind it.'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=d=>{if(!d)return '';const [y,m,dd]=d.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+dd)+', '+y};
const dot=s=>`<i class="sdot ${s}" aria-hidden="true"></i>`;
const nm=x=>N[x].title; // WHY (U3): one name per thing, everywhere: the node title (labels are no longer used)
const shortSys=s=>s.split(':')[0]; // "Everywhere: desktop, phone, web" -> "Everywhere" in a box; full name stays in hovers
// WHY (U2): words the person may not know get a plain hover (gl, in visible text) or plainer wording (plain, inside hovers)
const GLOSS=[['Specialist file','a file that describes one helper assistant and what it may do','a helper-assistant file'],
 ['Mesh','your phone, computer and browser working together as one','Mesh (your devices working as one)'],
 ['Fediverse','open networks where different apps can follow each other','Fediverse (open networks of apps)'],
 ['AT protocol','an open standard that lets different social apps share one account','AT protocol (open social standard)'],
 ['Fork','copy someone else\u2019s work, change it, and share your own version','Copy'],
 ['runtime','the part of the app that runs the assistant','engine']];
const gl=h=>GLOSS.reduce((a,[w,t])=>a.replace(new RegExp('\\b'+w+'\\b','g'),m=>`<span class="gl" data-tip="${esc(t)}">${m}</span>`),h);
const plain=t=>GLOSS.reduce((a,[w,,p])=>a.replace(new RegExp('\\b'+w+'\\b','g'),p),t);
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
let sel=null, filt=null; // sel = open step id; filt = {key, ids:Set} things to light up
const post=(id,title)=>{ if(window.parent!==window) parent.postMessage({bp:'focus',id:id,title:title||''},'*'); };
const inJ=(j,ids)=>j.steps.some(s=>ids.has(s))||j.held.some(x=>ids.has(x));
const journeysOf=id=>J.map((j,i)=>j.steps.includes(id)||j.held.includes(id)?i:-1).filter(i=>i>=0);

document.getElementById('legend').innerHTML=Object.keys(WORD).map(s=>`<span class="leg" data-tip="${esc(TIPS[s])}">${dot(s)}${WORD[s]}</span>`).join('')+
  `<span class="leg" data-tip="The first box in a row that is not finished. Everything to its right cannot be reached yet."><span class="flag" style="position:static;transform:none">stops here</span></span>`;

function renderMain(){
  const H=filt?filt.ids:null;
  document.getElementById('main').innerHTML=J.map((j,i)=>{
    const rowHit=H&&inJ(j,H);
    const stopN=j.stop===null?null:N[j.steps[j.stop]];
    const verdict=j.stop===null
      ?`<span class="spill verdict ok" data-tip="Every step in this row exists today. A person can do this from start to finish."><i class="sdot done"></i>Works from start to finish</span>`
      :`<span class="spill verdict" data-tip="${esc(j.stop===0?'The very first step does not exist yet, so this cannot be started.':'The first '+j.stop+' step'+(j.stop>1?'s work':' works')+'; the next one does not exist yet, so a person gets stuck there.')}">${j.stop===0?'Can\u2019t start: step 1 is unbuilt':j.stop+' of '+j.steps.length+' steps work'}</span>`;
    const steps=j.steps.map((s,k)=>{
      const n=N[s], beyond=j.stop!==null&&k>j.stop&&n.status==='done', isStop=k===j.stop;
      const link=k?`<span class="link${j.stop!==null&&k>j.stop?' broken':''}"></span>`:'';
      const tip=plain(nm(s))+' ('+plain(n.system)+') — '+TIPS[n.status]+(isStop?' This is where the journey stops.':'')+(beyond?' It works on its own, but you cannot reach it in this journey yet because an earlier step is missing.':'')+(n.catch?' Counted as existing, but there is a catch: '+plain(n.why):'')+' Click for details.';
      return link+`<button class="step ${n.status}${isStop?' stop':''}${beyond?' beyond':''}${sel===s?' sel':''}${H&&H.has(s)?' hit':''}" data-step="${s}" data-tip="${esc(tip)}">${isStop?'<span class="flag">stops here</span>':''}
        <span class="st">${gl(esc(nm(s)))}</span><span class="sy">${gl(esc(shortSys(n.system)))}</span><span class="sw">${dot(n.status)}${WORD[n.status]}${n.catch?` <b class="catch" data-tip="${esc('The catch: '+plain(n.why))}">· with a catch</b>`:''}</span></button>`;
    }).join('');
    // one short line at most; the reason, the catch and the hidden dependencies sit in its hover
    let line='';
    if(stopN){
      const hid=j.extra.length?` · ${j.extra.length} more unbuilt ${j.extra.length===1?'thing':'things'} it needs`:'';
      const tipL='Why it stops: '+plain(stopN.why)+(j.extra.length?' Also needs: '+j.extra.map(nm).join('; ')+'.':'')+(j.steps.some(s=>N[s].catch)?' Catch on a finished step: '+j.steps.filter(s=>N[s].catch).map(s=>nm(s)+' — '+plain(N[s].why)).join(' '):'');
      line=`<div class="jline" data-tip="${esc(tipL)}">Stops at step ${j.stop+1}: “${esc(nm(j.steps[j.stop]))}”${hid}</div>`;
    }
    return `<section class="card jcard${H&&!rowHit?' dim':''}" id="j${i}"><div class="jhead"><span class="jnum">${i+1}</span><div class="jtext"><div class="jtitle" data-tip="${esc('In Destin’s words: “'+j.quote+'”')}">${esc(j.title)}</div>${line}</div>${verdict}</div>
      <div class="steps">${steps}</div></section>`;
  }).join('');
}
function renderSide(){
  const sysRows=Object.entries(DATA.bySys).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));
  const nodeRows=Object.entries(DATA.byNode).filter(([k,v])=>v.length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,5);
  const on=k=>filt&&filt.key===k?' on':'';
  const names=v=>v.map(i=>(i+1)+'. '+J[i].title).join('\n');
  let h='';
  if(sel) h+=detail(sel);
  h+=`<div class="card"><div class="eyebrow" data-tip="Parts of the app that are not finished and that journeys run into. The one at the top is the one to finish first to get the most journeys working.">What holds journeys back</div>
    ${sysRows.map(([id,v])=>`<button class="irow${on('sys:'+id)}" data-filt="sys:${id}" data-tip="${esc(plain(DATA.sys[id])+' holds back: \n'+names(v)+'\nClick to light these up.')}"><span class="t-sm">${gl(esc(shortSys(DATA.sys[id])))}</span><span class="hold">${plural(v.length,'journey')}</span></button>`).join('')}</div>`;
  h+=`<div class="card"><div class="eyebrow" data-tip="Single unfinished things that more than one journey runs into. Finishing one of these moves several journeys at once.">Single things that stop several</div>
    ${nodeRows.map(([id,v])=>`<button class="irow${on('node:'+id)}" data-filt="node:${id}" data-tip="${esc(nm(id)+' ('+WORD[N[id].status]+') holds back: \n'+names(v)+'\nClick to light it up.')}">${dot(N[id].status)}<span class="t-sm">${esc(nm(id))}</span><span class="hold">${plural(v.length,'journey')}</span></button>`).join('')}</div>`;
  if(filt) h+=`<button class="btn sm ghost clear" data-clear data-tip="Stop highlighting and show every journey normally.">Clear highlight</button>`;
  document.getElementById('side').innerHTML=h;
}
function detail(id){
  const n=N[id], js=journeysOf(id);
  const unf=n.needs.filter(x=>N[x].status!=='done');
  const first=(n.why.match(/^.*?[.!?](\s|$)/)||[n.why])[0].trim(), rest=n.why.slice(first.length).trim();
  const row=(x,extra)=>`<div class="vlink" data-step="${x}" data-tip="Open the details for this piece."><i class="sdot ${N[x].status}"></i><div><div class="t-sm">${gl(esc(N[x].title))}</div><div class="t-2xs muted">${WORD[N[x].status]}${extra?' · '+esc(extra):''}</div></div></div>`;
  const facts=[];
  facts.push(unf.length?`<p class="fact"><b>Waiting on:</b> ${unf.map(x=>`<button data-step="${x}">${esc(nm(x))}</button>`).join(', ')}</p>`:`<p class="fact"><b>Waiting on:</b> nothing that is missing</p>`);
  if(js.length) facts.push(`<p class="fact"><b>${n.status==='done'?'Used by':'Holds up'}:</b> <button data-lightnode="${id}" data-tip="Light up these journeys: ${esc(js.map(i=>J[i].title).join('; '))}">${plural(js.length,'journey')}</button></p>`);
  facts.push(`<p class="fact"><b>Part of:</b> ${esc(shortSys(n.system))}</p>`);
  const ev=(n.evidence||[]).filter(e=>e.note);
  return `<div class="card"><div class="dhead"><div class="t-base">${gl(esc(nm(id)))}</div><button class="closebtn" data-closed aria-label="Close" data-tip="Close these details."><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <div class="statusline t-xs"><span data-tip="${esc(TIPS[n.status])}">${dot(n.status)} ${WORD[n.status]}</span>${n.catch?'<span class="catch">· with a catch</span>':''}</div>
   <p class="t-sm" style="margin:8px 0 0">${n.catch?'<b>The catch:</b> ':''}${gl(esc(first))}</p>
   ${facts.slice(0,3).join('')}
   <details class="more"><summary>More</summary>
     ${rest?`<p class="t-sm" style="margin:8px 0 0">${gl(esc(rest))}</p>`:''}
     ${n.since?`<div class="t-xs muted" style="margin-top:8px">Status since ${nice(n.since)}</div>`:''}
     <div class="dsec"><div class="eyebrow">Belongs to</div><div class="crumb">${gl(esc(n.system))}${n.cap?' › '+esc(n.cap):''}</div></div>
     <div class="dsec"><div class="eyebrow" data-tip="Pieces that have to exist first.">What it needs first</div>${n.needs.map(x=>row(x,n.needsWhy[x])).join('')||'<div class="t-xs muted">Nothing else. It stands on its own.</div>'}</div>
     ${n.shares.length?`<div class="dsec"><div class="eyebrow" data-tip="Different names for overlapping work. Doing one moves the other.">Closely tied to</div>${n.shares.map(x=>row(x)).join('')}</div>`:''}
     ${js.length?`<div class="dsec"><div class="eyebrow">Journeys it matters to</div>${js.map(i=>`<div class="t-sm" style="margin:2px 0">${i+1}. ${esc(J[i].title)}</div>`).join('')}</div>`:''}
     ${ev.length?`<div class="dsec"><div class="eyebrow">What backs this up</div>${ev.map(e=>`<div class="t-xs muted" style="margin:2px 0">${esc(e.note)}${e.date?' ('+nice(e.date)+')':''}</div>`).join('')}</div>`:''}
   </details></div>`;
}
function setFilt(key,ids){filt=key?{key,ids}:null;}
function nodesUnfinishedOf(sys){return new Set(Object.keys(DATA.byNode).filter(k=>N[k].sysid===sys));}
function selectStep(id){
  sel=id; renderMain(); renderSide();
  const b=document.querySelector(`.step[data-step="${id}"]`); if(b) b.classList.add('sel');
  document.getElementById('side').scrollTop=0;
  post(id,nm(id));
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-closed]')){sel=null;renderMain();renderSide();post(null);return}
  if(t.closest('[data-clear]')){filt=null;renderMain();renderSide();post(null);return}
  const ln=t.closest('[data-lightnode]'); if(ln){const id=ln.dataset.lightnode;setFilt('node:'+id,new Set([id]));renderMain();renderSide();return}
  const f=t.closest('[data-filt]'); if(f){const [k,id]=f.dataset.filt.split(':');
    if(filt&&filt.key===f.dataset.filt){filt=null;renderMain();renderSide();post(null);return}
    if(k==='sys'){setFilt('sys:'+id,nodesUnfinishedOf(id));renderMain();renderSide();post(id,DATA.sys[id]);}
    else{setFilt('node:'+id,new Set([id]));renderMain();renderSide();post(id,nm(id));}
    return}
  const s=t.closest('[data-step]'); if(s) selectStep(s.dataset.step);
});
// one floating hint for everything with data-tip (a CSS-only hint would be clipped by the scrolling panes)
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]'); if(!t){tip.classList.remove('on');return}
  tip.textContent=t.dataset.tip; tip.classList.add('on'); const r=t.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8), y=r.top-h-8; if(y<8) y=r.bottom+8; tip.style.left=x+'px'; tip.style.top=y+'px'});
document.addEventListener('mouseleave',()=>tip.classList.remove('on'));
// open focused: #focus=<node id> or part:<id>. Light the journeys containing it (or its system's); never error.
function applyFocus(){
  const m=/focus=([^&]+)/.exec(location.hash); if(!m) return;
  let id=decodeURIComponent(m[1]), ids=new Set(), pillar=null;
  if(id.startsWith('part:')){ (DATA.parts[id.slice(5)]||[]).forEach(v=>{Object.keys(N).forEach(k=>{if(k===v||k.startsWith(v+'.'))ids.add(k)})}); id=[...ids][0]||null; }
  else Object.keys(N).forEach(k=>{if(k===id||k.startsWith(id+'.'))ids.add(k)});
  if(id) pillar=DATA.pillarOf[id]||null;
  if(!J.some(j=>inJ(j,ids))&&pillar) ids=new Set(Object.keys(N).filter(k=>N[k].sysid===pillar));
  if(!J.some(j=>inJ(j,ids))) return;
  setFilt('focus:'+id,ids);
  if(id&&N[id]) sel=id;
}
function cues(){[['main','cue-main'],['side','cue-side']].forEach(([a,c])=>{const e=document.getElementById(a);
  document.getElementById(c).classList.toggle('on',e.scrollHeight-e.clientHeight>4&&e.scrollTop+e.clientHeight<e.scrollHeight-12)})}
['main','side'].forEach(i=>document.getElementById(i).addEventListener('scroll',cues));
addEventListener('resize',cues);
new MutationObserver(cues).observe(document.querySelector('.cols'),{childList:true,subtree:true});
applyFocus(); renderMain(); renderSide(); cues();
if(filt&&sel) setTimeout(()=>{const r=document.querySelector('.jcard:not(.dim)'); if(r) r.scrollIntoView({block:'nearest'})},0);
</script></body></html>
