<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><title>How it works</title>

<style>/* cc.css — the shared pieces, ported class-for-class from the app's real components on
   origin/session/ui-consistency-audit (desktop/src/renderer/components/ui/*.tsx and
   styles/globals.css). Each block names the component it copies; the numbers are that
   component's Tailwind classes turned into CSS. WHY a rewrite (2026-10-13, audit.md): the
   previous file was written from the older guide text, not from the components, and
   drifted on almost every number (8px button corners, 32px buttons, capitals headings,
   panel-coloured rows, a 48px bordered header). Paint only with these variables.
   Switch theme with <html data-theme="creme|midnight|dark|light">. */

/* ---- theme palettes: the four built-ins, values from globals.css ---- */
:root, :root[data-theme="light"]{--canvas:#F2F2F2;--panel:#EAEAEA;--inset:#D7D7D7;--well:#F9F9F9;--accent:#1A1A1A;--on-accent:#F2F2F2;--fg:#1A1A1A;--fg-2:#444444;--fg-dim:#535353;--fg-muted:#5E5E5E;--fg-faint:#989898;--edge:#C0C0C0;--edge-dim:#B3B3B380;--link:#2055CA;--shadow-strength:.15;color-scheme:light}
:root[data-theme="dark"]{--canvas:#111111;--panel:#191919;--inset:#222222;--well:#1C1C1C;--accent:#D4D4D4;--on-accent:#111111;--fg:#E0E0E0;--fg-2:#B0B0B0;--fg-dim:#999999;--fg-muted:#898989;--fg-faint:#515151;--edge:#393939;--edge-dim:#44444480;--link:#66AAFF;--shadow-strength:.4;color-scheme:dark}
:root[data-theme="midnight"]{--canvas:#0D1117;--panel:#161B22;--inset:#21262D;--well:#0D1117;--accent:#B1BAC4;--on-accent:#0D1117;--fg:#C9D1D9;--fg-2:#A0AAB4;--fg-dim:#919AA4;--fg-muted:#858D97;--fg-faint:#4E555E;--edge:#343A41;--edge-dim:#3F454C80;--link:#58A6FF;--shadow-strength:.4;color-scheme:dark}
:root[data-theme="creme"]{--canvas:#F6EEE1;--panel:#EBE1D1;--inset:#D8CCB9;--well:#F9F0E2;--accent:#3D3229;--on-accent:#F6EEE1;--fg:#2C2418;--fg-2:#504333;--fg-dim:#564C3D;--fg-muted:#615648;--fg-faint:#9A8F7F;--edge:#C4B8A6;--edge-dim:#B8AC9A80;--link:#5B4A1E;--shadow-strength:.15;color-scheme:light}

/* ---- derived outlines (globals.css:2061-2062) and the semantic set (§2.3) ---- */
:root{
  /* WHY these two: card and button outlines in the app are not the raw --edge; they mix in
     text colour so they stay visible on every theme (decisions "Surface levels"). */
  --edge-card:color-mix(in srgb,var(--edge) 82%,var(--fg) 18%);
  --edge-strong:color-mix(in srgb,var(--edge) 65%,var(--fg) 35%);
  --status-ok:#2E9B57;--status-warn:#C99700;--status-error:#E5484D;--status-idle:#8A8A8A;
  --tag-blue:#3B82C4;
  --radius-sm:4px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;
  --font:'Cascadia Mono','Cascadia Code','Fira Code',ui-monospace,monospace;
  --dur-hover:180ms;--dur-reveal:260ms;--ease:cubic-bezier(.2,.7,.2,1);
  --layer-shadow:0 8px 32px rgba(0,0,0,var(--shadow-strength));
}
:root[data-theme="midnight"],:root[data-theme="dark"]{--status-warn:#F2B33D}

/* ---- page ---- */
*{box-sizing:border-box}
/* WHY clip: the page never scrolls itself (the pane does); without it the off-screen side panel
   widened the page and scrollIntoView slid everything sideways, cutting the panel off. */
html,body{margin:0;height:100%;overflow:clip}
body{font:14px/1.45 var(--font);color:var(--fg);background:var(--panel)}
a{color:var(--link)}
button{font:inherit}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- type scale (globals.css: 2xs/3xs 11 · xs 12 · sm 14 · base 16) ---- */
.t-lg{font-size:18px;font-weight:600}
.t-base{font-size:16px;font-weight:500}
.t-sm{font-size:14px}
.t-xs{font-size:12px}
.t-2xs{font-size:11px}
/* SectionLabel.tsx — 12px medium muted, NORMAL CASE, no letter-spacing. WHY: Destin retired
   the spaced-capitals eyebrow app-wide (decisions "Heading ladder", all "No capitals"). The
   class keeps its old name so every call site moves at once. */
.eyebrow{font-size:12px;font-weight:500;color:var(--fg-muted)}
.muted{color:var(--fg-muted)} .dim{color:var(--fg-2)}
.num{font-variant-numeric:tabular-nums}
/* Count after a word: faint, smaller (decisions "Counts", SegmentedTabLabel) */
.cnt{font-size:11px;font-weight:400;color:var(--fg-muted);margin-left:4px}

/* ---- .layer-surface (globals.css:1375): popups, full-screen cards ---- */
.layer{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-xl);box-shadow:var(--layer-shadow)}

/* ---- cards on a full screen are raised: .layer-surface (globals.css:1375) — panel fill, 1px edge,
        radius-xl, the layer shadow (MarketplaceCard.tsx:339; decisions "Card look: raised").
        A box inside one is the nested level: CARD_LEVEL_2 = FIELD_SURFACE 'bg-inset border border-edge-card rounded-lg'. ---- */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-xl);box-shadow:var(--layer-shadow);padding:16px}
.card .card,.card.inset{background:var(--inset);border:1px solid var(--edge-card);border-radius:var(--radius-lg);box-shadow:none;padding:12px}
/* + .card-interactive and .hover-lift on a grid card (MarketplaceCard.tsx:339; globals.css:1524,1547) */
.card-interactive{cursor:pointer;transition:background-color 120ms steps(4),transform 200ms steps(5)}
@media (hover:hover){.card-interactive:hover{background-color:var(--inset);transform:scale(1.02)}}
.card-interactive:active{background-color:var(--edge)}
.card-interactive:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Button.tsx ---- base 'inline-flex items-center justify-center gap-1.5 font-medium rounded-lg'
   md 'text-xs px-3 py-1.5' · sm 'text-2xs px-2.5 py-1' · secondary is the default here. */
.btn{font-size:12px;line-height:16px;font-weight:500;padding:6px 12px;border-radius:var(--radius-lg);border:1px solid var(--edge-strong);background:transparent;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease),color var(--dur-hover) var(--ease)}
.btn.sm{font-size:11px;line-height:14px;padding:4px 10px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{border-color:transparent;color:var(--fg-dim)}
@media (hover:hover){.btn:hover{background:var(--inset)} .btn.ghost:hover{color:var(--fg)}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent) 90%,transparent)}}
.btn:active{background:var(--edge)} .btn.primary:active{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- CloseButton.tsx = Button size="icon" variant="ghost": w-7 h-7, rounded-lg, svg w-4 h-4 ---- */
.closebtn{width:28px;height:28px;padding:0;flex:none;border:0;border-radius:var(--radius-lg);background:transparent;color:var(--fg-dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background-color var(--dur-hover) var(--ease)}
@media (hover:hover){.closebtn:hover{background:var(--inset);color:var(--fg)}}
.closebtn:active{background:var(--edge)} .closebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- SegmentedTabs.tsx variant="pill" ----
   PILL_CONTAINER 'w-fit flex items-center gap-0.5 p-0.5 layer-surface !rounded-full' (shadow off)
   PILL_TAB_BASE 'px-3 py-1 rounded-full text-sm font-medium inline-flex items-center gap-1.5' */
.tabs{display:inline-flex;align-items:center;gap:2px;padding:2px;background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius-full);width:fit-content;flex:none}
.tabs button{font-size:14px;line-height:20px;font-weight:500;padding:4px 12px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color var(--dur-hover) var(--ease)}
.tabs button .count{font-size:11px;color:var(--fg-muted)}
.tabs button svg.ic{width:16px;height:16px}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tabs button[aria-selected="true"] .count,.tabs button[aria-pressed="true"] .count{color:inherit;opacity:.8}
@media (hover:hover){.tabs button:not([aria-selected="true"]):not([aria-pressed="true"]):hover{background:var(--inset);color:var(--fg)}}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- FilterChip.tsx: 'px-3 py-1 rounded-full text-sm'; inactive 'bg-inset text-fg-2 hover:text-fg
        border border-edge hover:border-edge-dim'; active 'bg-accent text-on-accent' ---- */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font-size:14px;line-height:20px;padding:4px 12px;border-radius:var(--radius-full);background:var(--inset);border:1px solid var(--edge);color:var(--fg-2);cursor:pointer;white-space:nowrap;transition:color var(--dur-hover) var(--ease),border-color var(--dur-hover) var(--ease)}
@media (hover:hover){.fchip:not([aria-pressed="true"]):hover{color:var(--fg);border-color:var(--edge-dim)}}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Chip.tsx (counts, plain tags): 'rounded-sm px-1.5 py-0.5 text-2xs text-fg-2 bg-inset border border-edge-dim' ---- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:var(--radius-sm);background:var(--inset);border:1px solid var(--edge-dim);font-size:11px;line-height:14px;color:var(--fg-2);white-space:nowrap}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg-muted);flex:none}
.dot.ok{background:var(--status-ok)} .dot.warn{background:var(--status-warn)} .dot.error{background:var(--status-error)} .dot.idle{background:var(--status-idle)}
/* ---- Pill.tsx (status labels: "tinted pill, normal case, dot inside" — decisions "Status labels"):
        'rounded-full border gap-1 pl-1.5 pr-2 py-px text-3xs leading-tight text-fg-2'; neutral 'bg-inset border-edge-dim' ---- */
.spill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:var(--radius-full);border:1px solid var(--edge-dim);background:var(--inset);font-size:11px;line-height:1.25;color:var(--fg-2);white-space:nowrap}
.spill.warn{background:color-mix(in srgb,var(--status-warn) 15%,transparent);border-color:color-mix(in srgb,var(--status-warn) 30%,transparent)}
.spill.warn .dot{background:var(--status-warn)}
/* the two sides of the app — a word with a small mark, in the muted line under a row */
.side{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-muted)}
/* WHY no mark (U8): the two small icons were unexplained; the words say it */

/* ---- SettingRow.tsx (nav density): 'surface-1 flex items-center gap-3 px-3 py-2 bg-inset/50
        border border-edge-card rounded-lg'; title 'text-sm text-fg font-medium'; description
        'text-2xs -mt-0.5 text-fg-muted' ---- */
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;background:color-mix(in srgb,var(--inset) 50%,transparent);border:1px solid var(--edge-card);border-radius:var(--radius-lg)}
.row .body{flex:1;min-width:0}
.row .body>.t-sm,.row .body>.t-xs{font-weight:500;color:var(--fg)}
.row .hint{font-size:11px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11px;color:var(--fg-muted);white-space:nowrap}
.card .row{background:var(--inset)}   /* a row inside a card is level 2 (globals.css .surface-1 .surface-1) */
/* the right-hand chevron every navigating row has (SettingRow: svg w-4 h-4 text-fg-muted, rotate-90 when open) */
.chev{display:inline-flex;color:var(--fg-muted);flex:none;transition:transform var(--dur-hover) var(--ease)}
.chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- Callout.tsx info: 'rounded-lg p-3 border bg-accent/10 border-accent/25', text-xs ---- */
.callout{border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:var(--radius-lg);padding:12px;font-size:12px;color:var(--fg-2)}
/* ---- states.tsx EmptyState block: 'flex flex-col items-center gap-2 py-8', 'text-sm text-fg-muted text-center' ---- */
.empty{text-align:center;color:var(--fg-muted);padding:32px 0;font-size:14px}

/* ---- tooltips (Tooltip.tsx look: a small layer surface) ---- */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);min-width:160px;max-width:320px;width:max-content;padding:8px 10px;border-radius:var(--radius-lg);background:var(--panel);color:var(--fg);border:1px solid var(--edge);box-shadow:var(--layer-shadow);font-size:12px;font-weight:400;line-height:1.4;text-align:left;text-transform:none;letter-spacing:0;white-space:normal;opacity:0;pointer-events:none;transition:opacity var(--dur-hover) var(--ease),transform var(--dur-hover) var(--ease);z-index:20}
.tip:hover::after,.tip:focus-visible::after,.tip.show::after{opacity:1;transform:translateX(-50%) translateY(0)}
.tip.below::after{bottom:auto;top:calc(100% + 8px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* page-specific rules only; every look (fonts, surfaces, radius, status colours) comes from cc.css */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--panel)}
.band{height:40px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px}
.btitle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.body{flex:1;min-height:0;display:flex;padding:0 10px 10px}
.pane{flex:1;min-width:0;display:flex;background:var(--canvas);border-radius:var(--radius-xl);overflow:hidden}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{padding:12px 20px 8px;display:flex;flex-direction:column;gap:8px;position:relative}
.head::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:1px;background:linear-gradient(to right,transparent,var(--edge-card) 8%,var(--edge-card) 92%,transparent)}
.lens{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;align-items:center;margin-left:auto;font-size:11px;color:var(--fg-muted)}
.legend i{display:inline-block;width:26px;height:0;border-top:2px solid var(--status-ok);vertical-align:middle;margin-right:5px}
.legend i.building{border-top-color:var(--fg-muted)} .legend i.planned{border-top:2px dashed var(--fg-faint)}
.scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:12px 20px 20px}
.stage{position:relative;width:944px;height:600px;margin:0 auto}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.edge{fill:none;stroke-width:2;stroke-linecap:round}
.edge.exists{stroke:var(--status-ok)} .edge.building{stroke:var(--fg-muted);stroke-width:2.5}
.edge.planned{stroke:var(--fg-faint);stroke-dasharray:6 5}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.ehov{opacity:.9}
.stage.dim .edge,.stage.dim .node{opacity:.22}
.stage.dim .edge.on,.stage.dim .node.on{opacity:1}
.stage.dim .edge.seen,.stage.dim .node.seen{opacity:.6}
.edge.on{stroke-width:4.5}
.edge.sel{stroke-width:4}
.node{position:absolute;width:144px;height:70px;padding:8px 10px;border-radius:var(--radius-lg);border:1px solid var(--edge-card);background:var(--panel);box-shadow:var(--layer-shadow);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:left;color:var(--fg);font:inherit;transition:background-color 120ms steps(4)}
@media (hover:hover){.node:hover{background:var(--inset)}}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.node .nt{font-size:13px;font-weight:500;line-height:1.2}
.node .ns{font-size:11px;color:var(--fg-muted);display:flex;align-items:center;gap:5px}
.node.exists{border-left:4px solid var(--status-ok)}
.node.building{border-left:4px solid var(--fg-muted)}
.node.outside{background:var(--well);border-style:solid;box-shadow:none}
.node.ahead{background:transparent;box-shadow:none;border:1px dashed var(--fg-faint);border-left:1px dashed var(--fg-faint)}
.node.ahead.planned .nt{color:var(--fg-2)}
.node.ahead.building{background:var(--panel);border-style:dashed;border-left:4px solid var(--fg-muted)}
.node.ahead.idea{background:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--fg-faint) 14%,transparent) 5px 6px)}
.node.sel{outline:2px solid var(--accent);outline-offset:2px}
.badge-n{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.zone{position:absolute;font-size:11px;color:var(--fg-muted)}
.zone.ahead{left:680px;top:545px;width:250px;line-height:1.4}
.framed .band{display:none}
.zone.out{}
.dot.building{background:var(--fg-muted)} .dot.planned{background:var(--fg-faint)}
.dot.idea{background:repeating-linear-gradient(45deg,var(--fg-faint) 0 2px,transparent 2px 4px);border:1px solid var(--fg-faint)}
.dot.exists{background:var(--status-ok)}
.drawer{width:340px;flex:none;overflow:auto;padding:16px;border-left:1px solid var(--edge-card);background:var(--panel)}
.drawer h2{margin:0 0 4px;font-size:16px;font-weight:500}
.drawer h3{margin:16px 0 6px;font-size:12px;font-weight:500;color:var(--fg-muted)}
.drawer p{margin:6px 0;font-size:13px;line-height:1.45}
.crow{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;margin:0 0 6px;border:1px solid var(--edge-card);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--inset) 50%,transparent);color:var(--fg);cursor:pointer;font-size:12px;line-height:1.4}
@media (hover:hover){.crow:hover{background:var(--inset)}}
.crow:focus-visible{outline:2px solid var(--accent)}
.crow .dot{margin-top:5px}
.crow b{font-weight:500}
.vrow{padding:6px 0;font-size:12px;border-top:1px solid var(--edge-dim)}
.vrow:first-child{border-top:0}
ul.plain{margin:4px 0;padding-left:18px;font-size:12px;color:var(--fg-2)}
details.code{margin-top:14px;font-size:11px;color:var(--fg-muted)}
details.code summary{cursor:pointer}
details.code code{display:block;font-size:11px;color:var(--fg-2);margin:3px 0;word-break:break-all}
.stepcard{border:1px solid var(--edge);border-radius:var(--radius-xl);padding:14px;background:var(--inset)}
.stepcard .sn{font-size:11px;color:var(--fg-muted)}
.stepcard p{font-size:14px;margin:6px 0 12px;line-height:1.45}
.stepcard .acts{display:flex;gap:8px;align-items:center}
.vtabs{margin:8px 0}.vtabs button{font-size:12px;padding:3px 10px}
.tooltip{position:fixed;z-index:50;max-width:300px;padding:8px 10px;border-radius:var(--radius-lg);background:var(--panel);border:1px solid var(--edge);box-shadow:var(--layer-shadow);font-size:12px;line-height:1.4;pointer-events:none;display:none}
.hint1{font-size:12px;color:var(--fg-muted)}
.one{font-size:14px;line-height:1.4;margin:8px 0}
ul.facts{list-style:none;margin:8px 0;padding:0;font-size:13px;line-height:1.4}
ul.facts li{padding:4px 0;border-top:1px solid var(--edge-dim)} ul.facts li:first-child{border-top:0}
.todo{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 8px;border:0;border-radius:var(--radius-lg);background:transparent;color:var(--fg);cursor:pointer;font-size:13px;line-height:1.3}
@media (hover:hover){.todo:hover{background:var(--inset)}}
.todo:focus-visible{outline:2px solid var(--accent)}
details.more{margin-top:14px;font-size:12px}
details.more>summary{cursor:pointer;color:var(--fg-muted);font-size:12px}
details.more[open]>summary{margin-bottom:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.steps button{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge);background:transparent;color:var(--fg-2);font-size:12px;cursor:pointer;padding:0}
.steps button[aria-current=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.steps button.past{background:var(--inset)}
</style></head><body>
<div class="screen">
 <div class="band"><span></span><span class="btitle"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/></svg>How it works</span><span></span></div>
 <div class="body"><div class="pane">
  <div class="main">

-in", "yours"], "yours.look": ["Make it look like yours", "yours"], "yours.look.themes": ["Themes, built in and from the community", "yours"], "yours.look.buddy": ["The buddy", "yours"], "yours.look.finetune": ["Fine-tune the look", "yours"], "yours.look.minimal": ["One set of Look choices over every theme", "yours"], "yours.look.themebuilder": ["Describe a theme and the assistant builds it", "yours"], "yours.look.reduced": ["Reduced Effects switch", "yours"], "yours.model": ["Any model, no single provider", "yours"], "yours.model.any": ["Switch providers and models freely", "yours"], "yours.model.free": ["A free model that is good enough for everyday use", "yours"], "yours.model.data": ["Your data and your agents are not held by one company", "yours"], "yours.model.tags": ["Cost, intelligence and speed tags on each model", "yours"], "yours.model.localsettings": ["Choose how a local model runs", "yours"], "yours.everyone": ["A different app for everyone", "yours"], "yours.everyone.student": ["A student's setup: documents, study pages, weekly research agents", "yours"], "yours.everyone.developer": ["A developer's setup: development tools inside the app", "yours"], "yours.everyone.ostools": ["Open-source tools replacing paid suites: Office, Home Assistant, Plaid", "yours"], "everywhere": ["Everywhere: desktop, phone, web", "everywhere"], "everywhere.platforms": ["One app on every platform", "everywhere"], "everywhere.platforms.desktop": ["Windows, Mac, Linux", "everywhere"], "everywhere.platforms.android": ["Android", "everywhere"], "everywhere.platforms.web": ["In a browser", "everywhere"], "everywhere.platforms.onecore": ["One core shared by desktop and phone", "everywhere"], "everywhere.platforms.signed": ["Installs without scary warnings (signing)", "everywhere"], "everywhere.added.linux": ["Linux packages (.deb, .rpm, .pacman, AppImage)", "everywhere"], "everywhere.added.winsign": ["Windows installers signed", "everywhere"], "everywhere.added.macsign": ["Mac inst ard", "together"], "together.added.closeout": ["Close-out and wrap-up checks", "together"]}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const W=144,H=70,PX=160;
const stage=document.getElementById('stage'), svg=document.getElementById('lines'), drawer=document.getElementById('drawer'), tip=document.getElementById('tooltip');
const WORD={exists:'exists',building:'being built',planned:'planned',idea:'only an idea so far'};
const P={},E={},els={},eels={};
D.parts.forEach(p=>{P[p.id]=p;p.px=p.x*PX;p.py=p.y});
D.edges.forEach(e=>E[e.id]=e);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showTip(html,ev){tip.innerHTML=html;tip.style.display='block';moveTip(ev)}
function moveTip(ev){const r=tip.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY+14;if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14;if(y+r.height>innerHeight-8)y=ev.clientY-r.height-14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
// where a line meets a box: the point on the box's outline along the line to the other box's centre
function anchor(a,b,pad){const cx=a.px+W/2,cy=a.py+H/2,tx=b.px+W/2,ty=b.py+H/2,dx=tx-cx,dy=ty-cy;
  const sx=dx?(W/2+pad)/Math.abs(dx):1e9,sy=dy?(H/2+pad)/Math.abs(dy):1e9,t=Math.min(sx,sy);return[cx+dx*t,cy+dy*t]}
function edgePath(e){const a=P[e.a],b=P[e.b],[x1,y1]=anchor(a,b,3),[x2,y2]=anchor(b,a,3);return`M${x1},${y1} L${x2},${y2}`}
// nodes
D.parts.forEach(p=>{
  const b=document.createElement('button');b.className=`node ${p.kind} ${p.cls}`;b.style.left=p.px+'px';b.style.top=p.py+'px';b.dataset.id=p.id;
  const lead=p.kind==='outside'?'Outside the app':p.kind==='ahead'?WORD[p.cls]:'';
  b.innerHTML=`<span class="nt">${esc(p.t)}</span><span class="ns">${p.kind==='ahead'?`<i class="dot ${p.cls}"></i>${esc(WORD[p.cls])}`:p.kind==='outside'?'Outside the app':`<i class="dot ${p.cls}"></i>${esc(WORD[p.cls])}`}</span>`;
  b.onmouseenter=ev=>showTip(p.code.length?`<b>${esc(p.t)}</b><br>Click for what it does. Where it lives in the code: ${p.code.slice(0,3).map(esc).join(', ')}${p.code.length>3?' …':''}`:`<b>${esc(p.t)}</b><br>${esc(WORD[p.cls])}. Click for what it needs.`,ev);
  b.onmousemove=moveTip;b.onmouseleave=hideTip;
  b.onclick=()=>{leaveTrace();select('node',p.id)};
  stage.appendChild(b);els[p.id]=b;
});
// edges
const NS='http://www.w3.org/2000/svg';
['exists','building','planned'].forEach(c=>{const m=document.createElementNS(NS,'marker');m.id='ar-'+c;m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','7');m.setAttribute('orient','auto-start-reverse');
 const pa=document.createElementNS(NS,'path');pa.setAttribute('d','M1,1 L9,5 L1,9 z');pa.setAttribute('fill',c==='exists'?'var(--status-ok)':c==='building'?'var(--fg-muted)':'var(--fg-faint)');m.appendChild(pa);svg.appendChild(m)});
D.edges.forEach(e=>{
  const d=edgePath(e);
  const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','edge '+e.cls);p.setAttribute('marker-end',`url(#ar-${e.cls})`);if(e.both)p.setAttribute('marker-start',`url(#ar-${e.cls})`);p.id='e-'+e.id;
  const h=document.createElementNS(NS,'path');h.setAttribute('d',d);h.setAttribute('class','hit');
  h.onmouseenter=ev=>showTip(`${esc(e.s)}<br><span style="color:var(--fg-muted)">${esc(WORD[e.cls])}. Click for why.</span>`,ev);h.onmousemove=moveTip;h.onmouseleave=hideTip;
  h.onclick=()=>{leaveTrace();select('edge',e.id)};
  svg.appendChild(p);svg.appendChild(h);eels[e.id]=p;
});
const dotLayer=document.createElementNS(NS,'g');svg.appendChild(dotLayer);

let sel=null,trace=null;
function clearMarks(){Object.values(els).forEach(n=>{n.classList.remove('on','seen','sel');const b=n.querySelector('.badge-n');if(b)b.remove()});Object.values(eels).forEach(n=>n.classList.remove('on','seen','sel'));stage.classList.remove('dim');dotLayer.innerHTML=''}
function dotRow(c){return`<i class="dot ${c}"></i>`}
function conRow(e,fromId){const other=P[e.a===fromId?e.b:e.a];
  return`<button class="crow" data-e="${e.id}"><i class="dot ${e.cls}"></i><span><b>${esc(other.t)}</b>: ${esc(e.s)} <span class="muted">(${WORD[e.cls]})</span></span></button>`}
function bindRows(){drawer.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{select('edge',b.dataset.e)})}
// WHY every detail is: name, status, ONE sentence, at most three facts, the rest behind a closed More (ROUND2 section 3)
const first=t=>{const m=String(t).match(/^.*?[.!?](?=\s|$)/);return m?m[0]:t};
const rest=t=>String(t).slice(first(t).length).trim();
const more=inner=>`<details class="more"><summary>More</summary>${inner}</details>`;
function say(msg){if(window.parent!==window)parent.postMessage(msg,'*')}
function tell(id,title){say({bp:'focus',id:id,title:title})}
function renderDefault(){
  const open=D.edges.filter(e=>e.cls!=='exists');
  const order={building:0,planned:1};open.sort((a,b)=>order[a.cls]-order[b.cls]);
  // WHY one short line each: the reason lives in the hover and in the connection's own detail, not on the list
  drawer.innerHTML=`<h2>What is not finished</h2>`+
   open.map(e=>`<button class="todo" data-e="${e.id}" data-tip="${esc(e.s)}"><i class="dot ${e.cls}"></i><span>${esc(P[e.a].t)} needs ${esc(P[e.b].t)} <span class="muted">· ${esc(WORD[e.cls])}</span></span></button>`).join('')+
   more(`<p class="hint1">Boxes are the app's real parts. Solid green lines work today, dashed grey lines are planned, and faint dashed boxes do not exist yet. Pick a part or a line, or follow a path above.</p>`);
  drawer.querySelectorAll('.todo').forEach(b=>{const e=E[b.dataset.e];b.onclick=()=>{leaveTrace();select('edge',e.id)};b.onmouseenter=ev=>showTip(esc(e.s),ev);b.onmousemove=moveTip;b.onmouseleave=hideTip});
}
function select(kind,id,quiet){
  clearMarks();sel={kind,id};
  if(kind==='node'){
    const p=P[id];els[id].classList.add('sel');
    const edges=D.edges.filter(e=>e.a===id||e.b===id);
    edges.forEach(e=>{eels[e.id].classList.add('on');els[e.a].classList.add('on');els[e.b].classList.add('on')});stage.classList.add('dim');els[id].classList.add('on');
    const names=l=>l.map(x=>esc(x)).join(', ');
    const needs=edges.filter(e=>e.a===id&&e.cls!=='exists').map(e=>P[e.b].t);
    const holds=edges.filter(e=>e.b===id&&e.cls!=='exists').map(e=>P[e.a].t);
    const todo=p.visionItems.filter(v=>v.cls!=='exists').length;
    const facts=[];
    if(needs.length)facts.push(`Waiting on: ${names(needs)}`);
    if(holds.length)facts.push(`Holds up: ${names(holds)}`);
    if(todo&&facts.length<3)facts.push(`${todo} of ${p.visionItems.length} big-picture items still to do`);
    if(facts.length<3){const w=edges.filter(e=>e.cls==='exists').length;if(w)facts.push(`Working link${w>1?'s':''} to ${w} other part${w>1?'s':''}`)}
    let h=`<h2>${esc(p.t)}</h2><p><span class="spill"><i class="dot ${p.cls}"></i>${p.kind==='outside'?'Outside the app':esc(WORD[p.cls])}</span></p><p class="one">${esc(first(p.what))}</p>`;
    if(facts.length)h+=`<ul class="facts">${facts.slice(0,3).map(f=>`<li>${f}</li>`).join('')}</ul>`;
    let m='';
    if(rest(p.what))m+=`<p>${esc(rest(p.what))}</p>`;
    if(p.inside.length)m+=`<h3>Inside this part</h3><ul class="plain">${p.inside.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
    m+=`<h3>Connections (${edges.length})</h3>`+edges.map(e=>conRow(e,id)).join('');
    if(p.visionItems.length)m+=`<h3>In your big picture</h3>`+p.visionItems.map(v=>`<div class="vrow"><i class="dot ${v.cls}"></i> <b class="fw">${esc(v.t)}</b> <span class="muted">${esc(v.w)}</span><div class="muted">${esc(v.why)}</div></div>`).join('');
    if(p.code.length)m+=`<h3>Where it lives in the code</h3>`+p.code.map(c=>`<code style="display:block;font-size:11px;word-break:break-all">youcoded/desktop/src/${esc(c)}</code>`).join('')+`<div class="hint1" style="margin-top:6px">Read from: ${esc(p.src)}</div>`;
    drawer.innerHTML=h+more(m);
    if(!quiet)tell('part:'+id,p.t);
  }else{
    const e=E[id];eels[id].classList.add('on','sel');els[e.a].classList.add('on');els[e.b].classList.add('on');stage.classList.add('dim');
    drawer.innerHTML=`<h2>${esc(P[e.a].t)} ${e.both?'and':'to'} ${esc(P[e.b].t)}</h2><p><span class="spill"><i class="dot ${e.cls}"></i>${esc(WORD[e.cls])}</span></p><p class="one">${esc(first(e.s))}</p>`+
    more((rest(e.s)?`<p>${esc(rest(e.s))}</p>`:'')+`<h3>Why we say so</h3><ul class="plain">${e.src.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h3>Ends of this connection</h3><button class="crow" data-n="${e.a}"><b>${esc(P[e.a].t)}</b></button><button class="crow" data-n="${e.b}"><b>${esc(P[e.b].t)}</b></button>`);
    drawer.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>select('node',b.dataset.n));
  }
  bindRows();
}
// ---- traces
const lens=document.getElementById('traces');
D.traces.forEach(t=>{const b=document.createElement('button');b.className='fchip tip below';b.dataset.tip=t.hint;b.setAttribute('aria-pressed','false');b.textContent=t.t;b.dataset.t=t.id;b.onclick=()=>trace&&trace.t.id===t.id?leaveTrace():startTrace(t);lens.insertBefore(b,lens.querySelector('.legend'))});
function leaveTrace(){if(!trace)return;trace=null;lens.querySelectorAll('.fchip').forEach(b=>b.setAttribute('aria-pressed','false'));clearMarks();sel=null;renderDefault()}
function startTrace(t){leaveTrace();trace={t,v:t.variants[0],i:0};lens.querySelectorAll('.fchip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t.id));drawStep()}
function stepNodes(s){return s.e?[E[s.e].a,E[s.e].b]:[s.n]}
function drawStep(){
  clearMarks();const steps=trace.v.steps,s=steps[trace.i];stage.classList.add('dim');
  // earlier steps stay softly lit; the current one is bold
  steps.slice(0,trace.i).forEach(p=>{(p.e?[p.e].concat(p.also||[]):[]).forEach(x=>eels[x].classList.add('seen'));stepNodes(p).forEach(n=>els[n].classList.add('seen'))});
  const cur=(s.e?[s.e]:[]).concat(s.also||[]);
  cur.forEach(x=>{eels[x].classList.remove('seen');eels[x].classList.add('on')});
  stepNodes(s).concat((s.also||[]).flatMap(x=>[E[x].a,E[x].b])).forEach(n=>{els[n].classList.remove('seen');els[n].classList.add('on')});
  const nb=document.createElement('span');nb.className='badge-n';nb.textContent=trace.i+1;els[stepNodes(s)[s.d===-1?1:0]].appendChild(nb);
  if(s.e){const e=E[s.e],a=s.d===-1?e.b:e.a,b=s.d===-1?e.a:e.b,[x1,y1]=anchor(P[a],P[b],3),[x2,y2]=anchor(P[b],P[a],3);
    const c=document.createElementNS(NS,'circle');c.setAttribute('r','5');c.setAttribute('fill','var(--accent)');
    const am=document.createElementNS(NS,'animateMotion');am.setAttribute('dur','1.4s');am.setAttribute('repeatCount','indefinite');am.setAttribute('path',`M${x1},${y1} L${x2},${y2}`);c.appendChild(am);dotLayer.appendChild(c)}
  const t=trace.t,multi=t.variants.length>1;
  // WHY one short sentence per step; the remainder of a long step and the step picker stay quiet
  drawer.innerHTML=`<h2>${esc(t.t)}</h2>`+(multi?`<div class="tabs vtabs">${t.variants.map(v=>`<button data-v="${v.id}" aria-selected="${v===trace.v}">${esc(v.t)}</button>`).join('')}</div>`:'')+
   `<div class="stepcard"><div class="sn">Step ${trace.i+1} of ${steps.length}</div><p>${esc(first(s.s))}</p>${rest(s.s)?more(`<p>${esc(rest(s.s))}</p>`):''}<div class="acts"><button class="btn sm" id="bk" ${trace.i?'':'disabled'}>Back</button><button class="btn sm primary" id="nx">${trace.i<steps.length-1?'Next':'Start again'}</button><span class="spacer"></span><button class="btn sm ghost" id="ex">Close</button></div></div>
   <div class="steps">`+steps.map((x,k)=>`<button data-k="${k}" class="${k<trace.i?'past':''}" ${k===trace.i?'aria-current="true"':''} data-tip="Step ${k+1}">${k+1}</button>`).join('')+`</div>`;
  drawer.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{trace.v=t.variants.find(v=>v.id===b.dataset.v);trace.i=0;drawStep()});
  drawer.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{trace.i=+b.dataset.k;drawStep()});
  document.getElementById('nx').onclick=()=>{trace.i=(trace.i+1)%steps.length;drawStep()};
  document.getElementById('bk').onclick=()=>{trace.i--;drawStep()};document.getElementById('ex').onclick=leaveTrace;
}
stage.addEventListener('click',e=>{if(e.target===stage||e.target===svg){if(trace)return;sel=null;clearMarks();renderDefault();tell(null)}});
renderDefault();
// ---- opening on a thing chosen in another view (#focus=part:<id> or a node id)
function partFor(f){
  if(!f)return null;
  if(f.startsWith('part:')){const i=f.slice(5);return P[i]?i:null}
  const n=D.parts.find(p=>p.vision.includes(f));if(n)return n.id;
  const sys=(D.nodes[f]||[])[1]||f.split('.')[0];
  const m=D.parts.find(p=>p.vision.some(v=>(D.nodes[v]||[])[1]===sys))||D.parts.find(p=>p.id===sys);
  return m?m.id:null;
}
function applyHash(){
  const m=location.hash.match(/focus=([^&]+)/);if(!m)return;
  const id=partFor(decodeURIComponent(m[1]));
  if(id){leaveTrace();select('node',id,true);tell('part:'+id,P[id].t)}
}
applyHash();addEventListener('hashchange',applyHash);
</script></body></html>
