     named (first-launch setup screen with the tagline, site footer, lockups, the "yc" initials);

<style>
  :root { --ink:#21152C; --mut:#6b5a78; --pur:#8B47B8; }
  * { box-sizing:border-box; }
  body { margin:0; width:1200px; height:700px; overflow:hidden; font-family:'DM Sans',sans-serif; color:var(--ink); background:#F4ECF8; }

  .tag { position:absolute; left:18px; top:16px; z-index:9; font:700 13px/1 'JetBrains Mono'; background:#21152Cdd; color:#fff; padding:7px 10px; border-radius:8px; }
  /* the wordmark */
  .wm { position:relative; display:inline-flex; align-items:baseline; white-space:nowrap; font-family:'DM Sans'; font-weight:800; letter-spacing:-.055em; line-height:1; }
  .wm .you { background:linear-gradient(100deg, var(--a), var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; padding-right:.02em; }
  .wm .p { position:absolute; }
  /* materials (same recipes as icons.html) */
  .gem { position:absolute; background: radial-gradient(120% 90% at 30% 12%, rgba(255,255,255,.55), rgba(255,255,255,0) 42%), linear-gradient(170deg, var(--g1,#B07BE0) 0%, var(--g2,#8B47B8) 48%, var(--g3,#C2549B) 100%);
         box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 6px rgba(60,10,90,.3), 0 3px 8px rgba(90,30,130,.3); }
  .eye { position:absolute; border-radius:50%; background: radial-gradient(60% 40% at 62% 30%, rgba(255,255,255,.95) 0 30%, rgba(255,255,255,0) 32%), var(--e,#2a1340); }

  /* ---- round 9 font boards ---- */
  .setup { position:absolute; left:24px; top:56px; width:640px; height:620px; border-radius:16px; overflow:hidden; background:url(../src6/walls/cotton-candy-sky.jpg) 45% 60%/cover; box-shadow:0 14px 40px rgba(60,20,100,.25); }
  .setup .bar { position:absolute; left:0; right:0; top:0; height:34px; background:rgba(245,236,250,.55); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.6); }
  .setup .bar i { position:absolute; top:12px; width:10px; height:10px; border-radius:50%; background:#d8c6e6; }
  .setup .card { position:absolute; left:110px; right:110px; top:110px; bottom:80px; border-radius:24px; background:rgba(250,244,253,.72); backdrop-filter:blur(18px) saturate(1.3); border:1px solid rgba(255,255,255,.8); box-shadow:0 20px 50px rgba(60,20,100,.25); display:flex; flex-direction:column; align-items:center; padding-top:38px; }
  .tagline { font:500 11px/1 'JetBrains Mono'; letter-spacing:.24em; text-transform:uppercase; color:#7a6688; }
  .btn { background:linear-gradient(100deg,#9D5BD0,#8B47B8); color:#fff; font-weight:700; font-size:15px; padding:12px 30px; border-radius:999px; box-shadow:0 8px 20px rgba(110,40,160,.35); }
  .foot { position:absolute; left:688px; right:24px; top:56px; height:300px; border-radius:16px; overflow:hidden; background:linear-gradient(160deg,#2A1838,#160D20); color:#e9dff2; padding:26px 26px; }
  .foot .cols { position:absolute; right:26px; top:28px; display:flex; gap:30px; font-size:12.5px; line-height:2; color:#bfaed0; }
  .foot .cols b { display:block; color:#fff; font-size:11px; font:500 10px 'JetBrains Mono'; letter-spacing:.18em; text-transform:uppercase; margin-bottom:4px; color:#9f8db2; }
  .foot .base { position:absolute; left:26px; right:26px; bottom:20px; border-top:1px solid rgba(255,255,255,.1); padding-top:14px; font-size:11.5px; color:#8f7da3; display:flex; justify-content:space-between; }
  .cell { position:absolute; top:372px; height:304px; border-radius:16px; background:#fff; border:1px solid #e6dcec; padding:20px; }
  .cell .lab { margin-bottom:16px; display:block; }
  /* name boards */
  .hero { position:absolute; inset:0 0 270px 0; background:url(../src6/walls/cotton-candy-sky.jpg) center 62%/cover; }
  .hero::after { content:''; position:absolute; inset:0; background:linear-gradient(#fff0 40%, #f4ecf8 100%); }
  .glassbar { position:absolute; left:50px; right:50px; top:44px; height:66px; border-radius:20px; background:rgba(245,236,250,.62); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.7); display:flex; align-items:center; padding:0 26px; z-index:2; }
  .nav { margin-left:auto; display:flex; gap:26px; font-size:15px; color:#4a3a58; align-items:center; }
  .pill { background:var(--pur); color:#fff; padding:8px 16px; border-radius:999px; font-weight:700; font-size:14px; }
  .big { position:absolute; left:0; right:0; top:160px; height:220px; display:flex; align-items:center; justify-content:center; z-index:2; }
  .row4 { position:absolute; left:24px; right:24px; bottom:22px; height:226px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .card { position:relative; border-radius:18px; overflow:hidden; background-size:cover; background-position:center; }
  .card .hdr { position:absolute; left:12px; right:12px; top:12px; height:54px; border-radius:13px; display:flex; align-items:center; padding:0 14px; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.35); }
  .card .hdr .nav { gap:12px; font-size:11px; }
  .card .cap { position:absolute; left:14px; bottom:12px; }
  .doc { background:#fff; border:1px solid #e4dcea; }
  .doc .bar { height:54px; border-bottom:1px solid #eee7f2; display:flex; align-items:center; padding:0 14px; }

  .doc h4 { margin:0 16px 10px; font:700 17px/1.2 'DM Sans'; }
  .doc .ln { height:7px; border-radius:4px; background:#ece6f0; margin:0 16px 8px; max-width:calc(100% - 32px); }
  .note { position:absolute; right:24px; top:398px; width:560px; text-align:right; font-size:13.5px; color:#4a3a58; z-index:3; }
  /* icon boards */
  .left { position:absolute; left:0; top:0; bottom:0; width:430px; background:radial-gradient(circle at 50% 40%, #fff, #E9DCF2 72%); display:flex; align-items:center; justify-content:center; }
  .left .big-ic { margin-top:-70px; }
  .left .desc { position:absolute; left:26px; right:26px; bottom:22px; font-size:14.5px; line-height:1.42; color:#3c2d48; }
  .left .warn { color:#9a3b5c; }
  .right { position:absolute; left:458px; right:26px; top:22px; bottom:20px; display:flex; flex-direction:column; gap:15px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tb { height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .tb.d { background:#1f1d24; } .tb.l { background:#ecebf0; border:1px solid #dcdae2; }
  .tb .me { position:relative; width:24px; height:24px; }
  .tb .me::after { content:''; position:absolute; left:6px; right:6px; bottom:-8px; height:3px; border-radius:2px; background:#8fb4ff; }
  .dock { height:96px; border-radius:16px; background:url(../src6/walls/cotton-candy-sky.jpg) center 70%/cover; display:flex; align-items:center; justify-content:center; }
  .dock .tray { display:flex; gap:12px; padding:10px 14px; border-radius:20px; background:rgba(255,255,255,.35); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.5); align-items:center; }
  .tabs { height:40px; border-radius:10px; display:flex; align-items:flex-end; padding:0 8px; gap:4px; }
  .tabs.l { background:#dee1e6; } .tabs.d { background:#202124; }
  .tab { height:32px; width:168px; border-radius:9px 9px 0 0; display:flex; align-items:center; gap:8px; padding:0 11px; font-size:12.5px; }
  .tabs.l .tab.on { background:#fff; color:#1f1f1f; } .tabs.d .tab.on { background:#35363a; color:#e8eaed; }
  .tabs .tab.off { color:#5f6368; } .tabs.d .tab.off { color:#9aa0a6; }
  .themes { display:flex; gap:16px; align-items:flex-end; }
  .themes figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:5px; font:500 10px 'JetBrains Mono'; color:var(--mut); letter-spacing:.06em; }
  .vs { display:flex; align-items:center; gap:10px; font:500 11px 'JetBrains Mono'; color:var(--mut); }
  .win { border-radius:12px; background:#fff; border:1px solid #dcd6e2; box-shadow:0 10px 30px rgba(60,30,90,.12); overflow:hidden; }
  .win .t { height:34px; background:#f3f1f6; border-bottom:1px solid #e6e1ea; display:flex; align-items:center; padding:0 14px; font-size:12.5px; color:#444; }
  .grid { display:flex; gap:22px; padding:18px 22px; align-items:flex-start; }
  .file { width:112px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; text-align:center; color:#333; border-radius:8px; padding:8px 4px; }

  .gen { width:80px; height:96px; display:flex; align-items:center; justify-content:center; }
  .li { display:flex; align-items:center; gap:10px; padding:5px 18px; font-size:12.5px; color:#333; }
  .li .dim { color:#888; margin-left:auto; font-size:11.5px; }
</style>
<body><div id="root"></div>
<script>
const P = new URLSearchParams(location.search), B = P.get('b') || 'w1';
const $ = (h) => document.getElementById('root').insertAdjacentHTML('beforeend', h);

// The silhouette, in px: body `w` wide, centre at (cx,cy), rig grid proportions. parts: a/b/l.
function buddy(cx, cy, w, { parts = 'abl', eyes = true, arms = [0, 0], clipY = null } = {}) {
  const k = w / 14, X = (x) => cx + (x - 12) * k, Y = (y) => cy + (y - 10) * k;
  const bx = (x, y, ww, hh, r, extra = '') => `<div class="gem" style="left:${X(x)}px;top:${Y(y)}px;width:${ww * k}px;height:${hh * k}px;border-radius:${r * k}px;${extra}"></div>`;
  let h = '';
  // arms swing about the shoulder (top centre of the arm), like the rig's pivots
  if (parts.includes('a')) h += bx(1, 9, 3, 4, .8, `transform-origin:50% 0;transform:rotate(${arms[0]}deg)`) + bx(20, 9, 3, 4, .8, `transform-origin:50% 0;transform:rotate(${arms[1]}deg)`);
  if (parts.includes('l')) h += bx(7.2, 17, 3.5, 4, 1.2) + bx(13.3, 17, 3.5, 4, 1.2);
  if (parts.includes('b')) h += bx(5, 4, 14, 12, 4);
  if (eyes) h += `<div class="eye" style="left:${X(7.7)}px;top:${Y(7.35)}px;width:${3.2 * k}px;height:${4.4 * k}px"></div><div class="eye" style="left:${X(13.1)}px;top:${Y(7.05)}px;width:${3.2 * k}px;height:${4.4 * k}px"></div>`;
  return h;
}

// Measure a wordmark: x-height top, baseline, and the boundary between "you" and "coded".
function metrics(wm) {
  const o = wm.getBoundingClientRect(), base = wm.querySelector('.base').getBoundingClientRect().top - o.top;
  const cs = getComputedStyle(wm), cv = document.createElement('canvas').getContext('2d');
  cv.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const xh = cv.measureText('x').actualBoundingBoxAscent;
  const you = wm.querySelector('.you').getBoundingClientRect(), coded = wm.querySelector('.coded').getBoundingClientRect();
  return { base, xTop: base - xh, xh, youR: you.right - o.left, codedL: coded.left - o.left };
}
const word = (h, c, gap = 0) => `<span class="wm" style="font-size:${h}px;color:${c.ink};--a:${c.a};--b:${c.b};--g1:${c.g[0]};--g2:${c.g[1]};--g3:${c.g[2]};--e:${c.e}"><span class="you">you</span><span class="gap" style="display:inline-block;width:${gap}px"></span><span class="coded">coded</span><i class="base" style="display:inline-block;width:0;height:0"></i></span>`;

// The candidate fonts. Destin, round 8: "t1/t3/t4 all interesting, let me see some more fonts."
// Every board fills them the same way ("you" in the mascot's gradient, "coded" in ink) so only
// the letter shapes differ.
const FONTS = {
  f1: { t: 'F1 · DM Sans (your T1)', font: "'DM Sans'", wt: 800, ls: '-.055em', n: 'The site\'s own font today. Crisp and neutral; the safest, since every page already uses it.' },
  f2: { t: 'F2 · Outfit (your T3)', font: "'Outfit'", wt: 600, ls: '-.035em', n: 'Lighter and airier geometric letters. More "modern product"; reads calm on technical pages.' },
  f3: { t: 'F3 · M PLUS Rounded (your T4)', font: "'M PLUS Rounded 1c'", wt: 800, ls: '-.045em', n: 'Soft rounded stroke ends, like the mascot\'s limbs, without being bubbly.' },
  f4: { t: 'F4 · Manrope (new)', font: "'Manrope'", wt: 800, ls: '-.05em', n: 'Close to DM Sans but a touch more rounded and open — warm without losing polish.' },
  f5: { t: 'F5 · Figtree (new)', font: "'Figtree'", wt: 700, ls: '-.04em', n: 'Friendly geometric with round dots and open "e"s; very readable small.' },
  f6: { t: 'F6 · Urbanist (new)', font: "'Urbanist'", wt: 700, ls: '-.035em', n: 'Pure circles and straight lines; the most "designed" and minimal of the set.' },
  f7: { t: 'F7 · Lexend (new)', font: "'Lexend'", wt: 600, ls: '-.045em', n: 'Wide and very easy to read — it was drawn for reading ease. Clear on every surface.' },
};
const wordIn = (F, h, ink = '#21152C', you = 'gem') => `<span style="font-family:${F.font};font-weight:${F.wt};letter-spacing:${F.ls};font-size:${h}px;line-height:1.1;white-space:nowrap"><span style="${you === 'gem' ? 'background:linear-gradient(100deg,#9D5BD0,#D25AA0);-webkit-background-clip:text;background-clip:text;color:transparent' : 'color:' + you};padding-right:.03em">you</span><span style="color:${ink}">coded</span></span>`;
const ycIn = (F, h, color) => `<span style="font-family:${F.font};font-weight:${F.wt};letter-spacing:${F.ls};font-size:${h}px;line-height:1;${color === 'gem' ? 'background:linear-gradient(100deg,#9D5BD0,#D25AA0);-webkit-background-clip:text;background-clip:text;color:transparent' : 'color:' + color}">yc</span>`;
function fontBoard(id) {
  const F = FONTS[id], icon = (px) => `<img src="out/k4-256.png" width="${px}" height="${px}" style="display:block">`;
  $(`<div class="tag">${F.t}</div>
    <div class="lab" style="position:absolute;right:24px;top:24px;max-width:700px;text-align:right;line-height:1.4">${F.n}</div>
    <div class="setup"><div class="bar"><i style="left:14px"></i><i style="left:30px"></i><i style="left:46px"></i></div>
      <div class="card">${icon(84)}<div style="margin-top:18px">${wordIn(F, 56)}</div><div class="tagline" style="margin-top:12px">agents for everyone</div>
        <div style="margin-top:34px;font-size:17px;color:#3a2a48">Let's set up your assistant.</div><div style="margin-top:6px;font-size:13.5px;color:#76658a">It takes about a minute. You can change everything later.</div>
        <div class="btn" style="margin-top:26px">Get started</div>
        <div style="margin-top:22px;display:flex;gap:7px"><i style="width:22px;height:6px;border-radius:3px;background:#8B47B8"></i><i style="width:6px;height:6px;border-radius:3px;background:#d4c2e2"></i><i style="width:6px;height:6px;border-radius:3px;background:#d4c2e2"></i></div></div>
      <div class="lab" style="position:absolute;left:14px;bottom:12px;background:#fff9;padding:5px 8px;border-radius:6px;color:#3a2a3a">First launch · setup screen</div></div>
    <div class="foot"><div style="display:flex;align-items:center;gap:12px">${icon(40)}${wordIn(F, 30, '#F3EAF9')}</div>
      <div class="tagline" style="margin-top:12px;color:#a996bd">agents for everyone</div>
      <div style="margin-top:16px;font-size:12.5px;color:#a996bd;max-width:200px;line-height:1.5">An assistant you own and shape. Free and open source.</div>
      <div class="cols"><div><b>Product</b>Download<br>Themes<br>Skills</div><div><b>Help</b>Docs<br>Privacy<br>Contact</div></div>
      <div class="base"><span>© 2026 YouCoded</span><span>Site footer</span></div></div>
    <div class="cell" style="left:688px;width:300px"><span class="lab">Lockups</span>
      <div style="display:flex;align-items:center;gap:12px">${icon(46)}<div>${wordIn(F, 30)}<div class="tagline" style="margin-top:6px;font-size:9px">agents for everyone</div></div></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:26px">${icon(64)}${wordIn(F, 26)}</div></div>
    <div class="cell" style="left:1002px;right:24px"><span class="lab">The initials</span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px"><div style="display:flex;gap:16px;align-items:baseline">${ycIn(F, 64, 'gem')}${ycIn(F, 64, '#21152C')}</div>
        <div style="display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:#21152C">${ycIn(F, 34, '#fff')}<span style="font:500 10px 'JetBrains Mono';color:#bba9cc;letter-spacing:.14em">ON DARK</span></div></div></div>`);
}
const SITE = { ink: '#21152C', a: '#8B47B8', b: '#D25AA0', g: ['#B07BE0', '#8B47B8', '#C2549B'], e: '#2a1340' };
const PLACES = [
  { icon: 'out/k1-golden-64.png', label: "Golden Sunbreak theme", wall: '../src6/walls/golden-sunbreak.jpg', hdr: 'rgba(14,10,20,.6)', ink: '#F8E8C8', a: '#FFC030', b: '#FF8A3D', g: ['#FFD27A', '#E9A21F', '#D2701E'], e: '#3a2408', dark: 1, navc: '#e8d6b4' },
  { icon: 'out/k1-meadow-64.png', label: 'Meadow Mist theme', wall: '../src6/walls/meadow-mist.jpg', hdr: 'rgba(246,250,245,.72)', ink: '#041008', a: '#2F7D55', b: '#7FB069', g: ['#8FD1A8', '#2F7D55', '#1F5A40'], e: '#0f2a1c', navc: '#2a3a2e' },
  { icon: 'out/k1-strawberry-64.png', label: 'Strawberry Kitty theme', wall: '../src6/walls/strawberry-kitty.jpg', hdr: 'rgba(252,228,233,.75)', ink: '#3A1420', a: '#CC4060', b: '#F08AA0', g: ['#F7A3B5', '#CC4060', '#A52A4A'], e: '#3A1420', navc: '#5a2a38' },
];
function nameBoard(id) {
  const N = NAMES[id];
  $(`<div class="tag">${N.title}</div><div class="hero"><div class="glassbar"><span id="hdr"></span><div class="nav"><span>About</span><span>Features</span><span>FAQ</span><span class="pill">Download</span></div></div><div class="big" id="big"></div></div>
    <div class="note">${N.note}</div>
    <div class="row4">${PLACES.map((p, i) => `<div class="card" style="background-image:url(${p.wall})"><div class="hdr" style="background:${p.hdr}"><span id="c${i}"></span><div class="nav" style="color:${p.navc}"><span>About</span><span>FAQ</span></div></div>
      <div class="cap lab" style="color:${p.dark ? '#f5e6c8' : '#3a2a3a'};background:${p.dark ? '#0008' : '#fff9'};padding:5px 8px;border-radius:6px">${p.label}</div></div>`).join('')}
      <div class="card doc"><div class="bar"><span id="doc"></span><div class="nav" style="font-size:11px;gap:12px;color:#666"><span>Docs</span><span>Support</span></div></div>
        <div class="crumb">HELP › PRIVACY &amp; DATA</div><h4>Where YouCoded keeps your files</h4><div class="ln" style="width:88%"></div><div class="ln"></div><div class="ln" style="width:70%"></div>
        <div class="cap lab" style="color:#3a2a3a">Plain help page · name alone</div></div></div>`);
  buildName(N, document.getElementById('big'), 130, SITE);
  buildName(N, document.getElementById('hdr'), 30, SITE, false, true);
  PLACES.forEach((p, i) => buildName(N, document.getElementById('c' + i), 22, p, false, true));
  buildName(N, document.getElementById('doc'), 21, SITE, true, true);
}

// ======================== ICONS ========================
const ICONS = {
  k4: { t: 'K4 · Just the face (your pick)', d: 'Unchanged from round 8, for comparison: the milk-glass face panel and two eyes over the theme\'s colour.' },
  k6: { t: 'K6 · The icon stands up (your pick)', d: 'Unchanged from round 8: the tile is the body, standing on glass legs, eyes as its face.' },
  k8: { t: 'K8 · Standing mascot on a tile (your pick)', d: 'Unchanged from round 8: K6 set on a frosted square, for places that insist on a square.' },
  y1: { t: 'Y1 · The face, with "yc" for a mouth', d: 'K4, and its mouth is the initials: the face and the name in one mark. Lettering will follow whichever font you pick.', w: '"yc" softens to a smudge at 16px; the eyes still carry it.' },
  y2: { t: 'Y2 · The initials alone', d: '"yc" in milk-glass on the theme\'s colour — the proposed standard for the initials anywhere they appear alone (favicon, social, stickers).' },
  y3: { t: 'Y3 · Standing up, with "yc" for a mouth', d: 'K6 with the initials as its mouth under the eyes.', w: '"yc" is lost below about 32px.' },
  y4: { t: 'Y4 · The badge: face over the full name', d: 'The face in colour-glass above "youcoded" on a frosted tile. For profile pictures, app stores and stickers, where the name has room — not for 16px.', w: 'Not a taskbar icon: the word is unreadable below about 64px.' },
};
const NEIGH = ['#3b82f6', '#ef4444', '#22c55e', '#f59e0b', '#6366f1', '#64748b'];
const nb = (c, s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="${c}"/><rect x="7" y="7" width="10" height="10" rx="2" fill="#fff" opacity=".9"/></svg>`;
const img = (id, px, show = px) => `<img src="out/${id}-${px}.png" width="${show}" height="${show}" style="display:block">`;
function iconBoard(k) {
  const I = ICONS[k];
  const tb = (cls) => `<div class="tb ${cls}">${NEIGH.slice(0, 3).map(c => nb(c, 24)).join('')}<span class="me">${img(k, 24)}</span>${NEIGH.slice(3).map(c => nb(c, 24)).join('')}</div>`;
  $(`<div class="tag">${I.t}</div>
    <div class="left"><div class="big-ic">${img(k, 512, 300)}</div><div class="desc">${I.d}${I.w ? `<br><span class="warn">${I.w}</span>` : ''}</div></div>
    <div class="right">
      <div><div class="lab" style="margin-bottom:7px">Windows taskbar · real size (24px)</div><div class="two">${tb('d')}${tb('l')}</div></div>
      <div><div class="lab" style="margin-bottom:7px">Mac dock · real size</div><div class="dock"><div class="tray">${NEIGH.slice(0, 3).map(c => nb(c, 56)).join('')}${img(k, 56)}${NEIGH.slice(3, 5).map(c => nb(c, 56)).join('')}</div></div></div>
      <div><div class="lab" style="margin-bottom:7px">Browser tab · 16px</div><div class="two">
        <div class="tabs l"><div class="tab on">${img(k, 16)}YouCoded</div><div class="tab off">Inbox (3)</div></div>
        <div class="tabs d"><div class="tab on">${img(k, 16)}YouCoded</div><div class="tab off">Inbox (3)</div></div></div></div>
      <div class="two"><div><div class="lab" style="margin-bottom:9px">Today vs this · 48 / 32px</div>
        <div class="vs">today <img src="../src6/today-icon.svg" width="48"><img src="../src6/today-icon.svg" width="32"> &nbsp; new ${img(k, 48)}${img(k, 32)}</div></div>
        <div><div class="lab" style="margin-bottom:9px">Dressed in other themes</div><div class="themes">${['golden', 'meadow', 'strawberry'].map(t => `<figure>${img(k + '-' + t, 64, 56)}<span>${t}</span></figure>`).join('')}</div></div></div>
    </div>`);
}
const INST = {
  i1: { t: 'I1 · H3, with K4\'s face', d: 'Exactly your round-7 H3 — the theme\'s colour, a frosted band along the bottom, the white arrow — with K4\'s milk-glass face above the band.' },
  i2: { t: 'I2 · H3, with K6 standing', d: 'H3\'s recipe with the standing mascot (milk-glass body, colour-glass legs) above the band.' },
  i3: { t: 'I3 · H3, with Y1 (face + "yc")', d: 'H3\'s recipe with the face that has "yc" for a mouth — the installer carries the name.' },
};
const fileIcon = (label, color) => `<svg width="64" height="80" viewBox="0 0 64 80"><path d="M6 2 H42 L60 20 V76 Q60 78 58 78 H6 Q4 78 4 76 V4 Q4 2 6 2 Z" fill="#fff" stroke="#c9c4cf" stroke-width="2"/><path d="M42 2 V20 H60" fill="#eee" stroke="#c9c4cf" stroke-width="2"/><rect x="10" y="50" width="34" height="14" rx="3" fill="${color}"/><text x="27" y="61" font-size="10" font-family="DM Sans" font-weight="700" fill="#fff" text-anchor="middle">${label}</text></svg>`;
function installerBoard(k) {
  const I = INST[k];
  $(`<div class="tag">${I.t}</div><div class="left"><div class="big-ic">${img(k, 512, 300)}</div><div class="desc">${I.d}</div></div>
    <div class="right"><div class="lab">Your Downloads folder, right after clicking Download</div>
      <div class="win"><div class="t">📁 Downloads</div><div class="grid">
        <div class="file"><div class="gen">${fileIcon('PDF', '#d64545')}</div>Q3 report.pdf</div><div class="file"><div class="gen">${fileIcon('ZIP', '#c99a2e')}</div>photos.zip</div>
        <div class="file sel"><div class="gen">${img(k, 96, 90)}</div>YouCoded-Setup-1.3.1.exe</div><div class="file"><div class="gen">${fileIcon('MP3', '#3b82f6')}</div>song.mp3</div></div>
        <div style="border-top:1px solid #eee;padding:6px 0 10px"><div class="li">${img(k, 16)}YouCoded-Setup-1.3.1.exe<span class="dim">Application · 142 MB</span></div></div></div>

        <div><div class="lab" style="margin-bottom:10px">This one · 96 · 32 · 16px</div><div class="vs">${img(k, 96)}${img(k, 32)}${img(k, 16)}</div></div></div>
    </div>`);
}
Promise.all(['800 20px "Manrope"','700 20px "Figtree"','700 20px "Urbanist"','600 20px "Lexend"','600 20px "Outfit"','800 20px "M PLUS Rounded 1c"','800 20px "DM Sans"', '700 20px "DM Sans"', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'].map(f => document.fonts.load(f))).then(() => {
  if (FONTS[B]) fontBoard(B); else if (ICONS[B]) iconBoard(B); else if (INST[B]) installerBoard(B);
  document.body.dataset.ready = 1;
});
