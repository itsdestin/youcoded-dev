id: no-hand-rolled-dialog-shell-exemption-still-applies
language: tsx
severity: error
message: >-
  This file is exempted from no-hand-rolled-dialog-shell but no longer renders
  <OverlayPanel>. An exemption is a liability once it stops being true — drop
  the file from that rule's ignores: and from this rule's files:.
note: |
  Invariant source: tests/dialog-shell.test.tsx (Plan B, 2026-09-16; "every
  exempted file still exists and still hand-rolls" — case 3 of the "dialog
  shell adoption" describe block). The "still hand-rolls" half is this rule: a
  whole-file (`kind: program`) presence check over exactly the exempted files,
  same shape as appearance-broadcast-handler-registered. The file names are
  matched ONLY at their real in-scope locations, so a same-named file
  elsewhere is not treated as the exemption.
  The "still exists (in scope)" half is check.sh's rule-paths pass
  (2026-09-16): a deleted or moved exempted file leaves a files: glob here
  that matches nothing, and that fails the check.
  SHAPE: the retired test used `src.includes('<OverlayPanel')` on raw text;
  presence here means a JSX tag whose name starts with OverlayPanel, the same
  shape no-hand-rolled-dialog-shell forbids elsewhere.
files:
  - "**/src/renderer/components/ResumeBrowser.tsx"
  - "**/src/renderer/components/ZoomOverlay.tsx"
  - "**/src/renderer/components/ViewToggleHint.tsx"
  - "**/src/renderer/components/VoiceButton.tsx"
  - "**/src/renderer/components/ui/AnchorTip.tsx"
  - "**/src/renderer/components/ui/Select.tsx"
  - "**/src/renderer/components/ui/Toast.tsx"
  - "**/src/renderer/components/ui/ZoomPill.tsx"
  - "**/src/renderer/components/ui/Tooltip.tsx"
  - "**/fixtures/no-hand-rolled-dialog-shell-exemption-still-applies.tsx"
rule:
  kind: program
  not:
    has:
      stopBy: end
      any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        regex: "^OverlayPanel"
