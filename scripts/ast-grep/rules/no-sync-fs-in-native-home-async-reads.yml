id: no-sync-fs-in-native-home-async-reads
language: typescript
severity: error
message: >-
  NativeHome's async readers — readSessionLinesAsync (every scroll-up page
  and tear-off), listSessionFilesAsync and readSessionHeadAsync (every Resume
  list open, once per native session file) — must never call a blocking
  fs.*Sync; they exist so those reads leave the main thread.
note: |
  Invariant source: tests/main-hot-path-no-sync-fs.test.ts on origin/master
  (added by the 2026-09-16 smoothness sweep, Batch C, after Plan B had
  already retired that file on its branch). Ported by the Plan B close-out
  merge, 2026-09-17 ("merge port" rows in
  docs/archive/plans/2026-09-16-sweep-ledger.md); the file stays deleted.
  Cases: "native history reads the IPC handlers use" (readSessionLinesAsync)
  and "the Resume list" (listSessionFilesAsync, readSessionHeadAsync). Fires
  at the `program` level when (a) an fs.*Sync call sits inside one of the
  three methods, or (b) one of them is gone (the retired methodBody()
  helper's `toBeGreaterThan(0)`). The sync twins (readSessionLines,
  listSessionFiles, readSessionHead) stay legal for their sync callers.
files:
  - "**/src/main/native-home.ts"
  - "**/fixtures/no-sync-fs-in-native-home-async-reads.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          kind: member_expression
          all:
            - has: { field: object, regex: "^fs$" }
            - has: { field: property, regex: "Sync$" }
        inside:
          stopBy: end
          kind: method_definition
          has: { field: name, regex: "^(readSessionLinesAsync|listSessionFilesAsync|readSessionHeadAsync)$" }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^readSessionLinesAsync$" } } }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^listSessionFilesAsync$" } } }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^readSessionHeadAsync$" } } }
