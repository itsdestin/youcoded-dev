id: appearance-broadcast-handler-registered
language: typescript
severity: error
message: >-
  main/ipc/appearance.ts must hold a channel-table entry named IPC.APPEARANCE_BROADCAST.
  Without it, no window (including Buddy floaters) ever receives a theme /
  font / reduced-effects change made in another window, and no phone hears the
  computer's changes.
note: |
  Invariant source: tests/appearance-buddy-broadcast.test.ts (retired by Plan
  B, 2026-09-16). FIX (review of batch A, 2026-09-16): the sibling rule
  appearance-broadcast-reaches-all-windows matches the entry itself and negates
  what must be inside it — but if the WHOLE entry is deleted, nothing is left
  to match and that rule falls silent. This rule is the whole-file
  (`kind: program`) branch: it fires when no entry for the channel exists.
  RETARGETED 2026-10-01 (one-core R3-8): the handler was an
  `ipcMain.on(IPC.APPEARANCE_BROADCAST, …)` in main.ts; appearance:broadcast is a
  channel-table entry now (main/ipc/appearance.ts), served to windows and to
  phones by one handler. THE REGION is the object literal holding the pair
  `name: IPC.APPEARANCE_BROADCAST`.
files:
  - "**/src/main/ipc/appearance.ts"
  - "**/fixtures/appearance-broadcast-handler-registered.ts"
utils:
  broadcast-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.APPEARANCE_BROADCAST$" }
rule:
  kind: program
  not:
    has:
      stopBy: end
      matches: broadcast-entry
