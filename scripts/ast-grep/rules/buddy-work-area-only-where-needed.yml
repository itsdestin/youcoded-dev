id: buddy-work-area-only-where-needed
language: typescript
severity: error
message: >-
  The usable-screen-area lookup (WorkAreaResolver) is built only where a
  helper is needed (`helperAtLaunch.needed ? new WorkAreaResolver() : null`)
  and handed to the buddy manager as `workArea: buddyWorkArea ?? undefined`.
  Everywhere else the manager gets no work-area source, which is what keeps
  Electron's own number — correct there — in use, byte for byte.
note: |
  Invariant source: tests/buddy-consent-gate.test.ts (Plan B t6a review fix,
  2026-09-16; "builds the usable-screen-area lookup only where a helper is
  needed"). The retired case required both strings somewhere in main.ts
  (raw text); matched here as code — the conditional construction and the
  `workArea:` property.
files:
  - "**/src/main/main.ts"
  - "**/fixtures/buddy-work-area-only-where-needed.ts"
rule:
  kind: program
  any:
    - not: { has: { stopBy: end, pattern: "helperAtLaunch.needed ? new WorkAreaResolver() : null" } }
    - not: { has: { stopBy: end, kind: pair, regex: "^workArea\\s*:\\s*buddyWorkArea \\?\\? undefined$" } }
