id: arcade-challenge-game-in-reducer
language: typescript
severity: error
message: >-
  The game reducer must keep `challengeGame` — without it an accepted
  challenge can only open Connect 4.
note: |
  Invariant source: tests/arcade-authority.test.ts (Plan B t6a review fix, 2026-09-16; "the challenge carries which game, end to end"). — its game-reducer.ts link; the other links are the sibling arcade-challenge-game-* rules.
files:
  - "**/src/renderer/state/game-reducer.ts"
  - "**/fixtures/arcade-challenge-game-in-reducer.ts"
utils:
  # A non-comment leaf token: the retired guards read files through
  # readStripped(), which blanks every comment, so a comment never counts.
  code-token:
    any:
      - kind: string_fragment
      - kind: identifier
      - kind: property_identifier
      - kind: private_property_identifier
      - kind: shorthand_property_identifier
      - kind: shorthand_property_identifier_pattern
      - kind: type_identifier
      - kind: statement_identifier
      - kind: regex_pattern
rule:
  kind: program
  not: { has: { stopBy: end, matches: code-token, regex: "challengeGame" } }
