id: buddy-show-consults-refusal-gate
language: typescript
severity: error
message: >-
  The IPC.BUDDY_SHOW channel-table entry (main/ipc/buddy.ts) must consult the
  refusal gate — calling both `showRefusal()` and `refresh()` on the helper —
  before it may show the buddy. The gate is pure and lives in ipc-handlers.ts
  precisely so a correct answer there means nothing unless the handler that
  creates the buddy actually asks it; a gate nothing calls is the same bug with
  extra steps. The status is re-read on every show, never trusted from launch,
  because the user can flip the KWin helper off in System Settings while
  YouCoded is running (design §4).
note: |
  Invariant source: tests/buddy-consent-gate.test.ts (Plan B, 2026-09-16;
  "asks the gate, and re-reads the status rather than trusting launch").
  The describe block's other cases became buddy-show-refuses-before-creating,
  buddy-drag-reads-cached-helper-status, buddy-work-area-only-where-needed and
  buddy-work-area-reresolved-on-display-change (review of t6a, 2026-09-16);
  its handler-brevity check only proved the old text slice was the handler,
  and went with the slice.
  RETARGETED 2026-10-01 (one-core R3-8): the handler was
  `ipcMain.handle(IPC.BUDDY_SHOW, …)` in main.ts calling `buddyShowRefusal()` and
  `refreshBuddyHelperStatus()`; buddy:show is a channel-table entry now
  (main/ipc/buddy.ts) and reaches the same two functions through the helper hand-over
  (`helper().showRefusal(...)`, `helper().refresh()`). THE REGION is the object
  literal holding the pair `name: IPC.BUDDY_SHOW`.
files:
  - "**/src/main/ipc/buddy.ts"
  - "**/fixtures/buddy-show-consults-refusal-gate.ts"
utils:
  show-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.BUDDY_SHOW$" }
rule:
  kind: program
  any:
    # The entry exists but is missing one (or both) of the two required calls.
    - has:
        stopBy: end
        matches: show-entry
        not:
          all:
            - has: { stopBy: end, pattern: "$H.showRefusal($$$)" }
            - has: { stopBy: end, pattern: "$H.refresh($$$)" }
    # The entry is gone entirely — the same failure this rule exists to catch,
    # invisible to a "not: has:" scoped to an entry that no longer exists.
    - not:
        has:
          stopBy: end
          matches: show-entry
