id: buddy-show-consults-refusal-gate
language: typescript
severity: error
message: >-
  The BUDDY_SHOW IPC handler must consult the refusal gate — calling both
  `refreshBuddyHelperStatus()` and `buddyShowRefusal()` — before it may show
  the buddy. The gate is pure and lives in ipc-handlers.ts precisely so a
  correct answer there means nothing unless the handler that creates the
  buddy actually asks it; a gate nothing calls is the same bug with extra
  steps. The status is re-read on every show, never trusted from launch,
  because the user can flip the KWin helper off in System Settings while
  YouCoded is running (design §4).
note: |
  Invariant source: tests/buddy-consent-gate.test.ts (Plan B, 2026-09-16;
  "asks the gate, and re-reads the status rather than trusting launch" —
  the "main.ts wires the gate" describe block's other 5 cases are each a
  distinct, narrow region of main.ts (handler brevity, refusal-before-show
  ORDERING, the drag-path cache-only dependency, the conditional
  work-area-resolver construction, three debounced display-event wires) and
  are kept as text reads rather than five more bespoke rules).
files:
  - "**/src/main/main.ts"
  - "**/fixtures/buddy-show-consults-refusal-gate.ts"
rule:
  kind: program
  any:
    # The handler exists but is missing one (or both) of the two required calls.
    - has:
        stopBy: end
        pattern: ipcMain.handle(IPC.BUDDY_SHOW, $HANDLER)
        not:
          all:
            - has: { stopBy: end, pattern: "buddyShowRefusal($$$)" }
            - has: { stopBy: end, pattern: "refreshBuddyHelperStatus($$$)" }
    # The handler is gone entirely — the same failure this rule exists to
    # catch, invisible to a "not: has:" scoped to a call that no longer exists.
    - not:
        has:
          stopBy: end
          pattern: ipcMain.handle(IPC.BUDDY_SHOW, $HANDLER)
