id: arcade-state-play-only-in-own-board
language: tsx
severity: error
message: >-
  `state.play` is the open game's OWN state, opaque to the shell: only that
  game's board (ConnectFourBoard.tsx, ChessBoard.tsx) may narrow it. A shell
  file reaching in collapses the split back into the one shared pot it took
  the largest piece of work in the project to get out of.
note: |
  Invariant source: tests/arcade-authority.test.ts (Plan B t6a review fix, 2026-09-16; "only a game's own board narrows state.play").
  The retired case matched `\bstate\.play\b` in each game file (comments
  blanked) and allowed only the two boards. Matched here on a member
  expression ending in `state.play` (preceded by nothing or a non-word
  character, so `x.state.play` counts and `gamestate.play` does not) and on
  any string spelling it.
files:
  - "**/src/renderer/components/game/**/*.tsx"
  - "**/fixtures/arcade-state-play-only-in-own-board.tsx"
ignores:
  - "**/*.test.tsx"
  - "**/components/game/ConnectFourBoard.tsx"
  - "**/components/game/ChessBoard.tsx"
utils:
  # A non-comment leaf token: the retired guards read files through
  # readStripped(), which blanks every comment, so a comment never counts.
  code-token:
    any:
      - kind: string_fragment
      - kind: jsx_text
      - kind: identifier
      - kind: property_identifier
      - kind: private_property_identifier
      - kind: shorthand_property_identifier
      - kind: shorthand_property_identifier_pattern
      - kind: type_identifier
      - kind: statement_identifier
      - kind: regex_pattern
rule:
  any:
    - kind: member_expression
      regex: "(^|\\W)state\\.play$"
    - matches: code-token
      regex: "\\bstate\\.play\\b"
