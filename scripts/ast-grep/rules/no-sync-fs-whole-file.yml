id: no-sync-fs-whole-file
language: typescript
severity: error
message: >-
  This main-process file must never call a blocking fs.*Sync anywhere in it.
  transcript-mirror.ts is on the hot main-process path (mirrors every
  transcript write); marketplace-file-reader.ts and transcript-cwd.ts are on
  Task 2's user-action read paths (perf/main-thread-async-reads) — opening a
  skill/command/agent file in the in-app marketplace viewer, and resolving
  which project a transcript belongs to (once per project slug, every Resume
  Browser open). A blocking fs call in any of them stalls every window's IPC
  at once.
note: |
  MERGED (review of batch B, 2026-09-16) from three previously separate,
  byte-for-byte-identical rules that differed only in `files:` and prose —
  no-sync-fs-in-main-hot-path-transcript-mirror, no-sync-fs-in-main-read-path
  (the base rule) and no-sync-fs-in-main-read-path-transcript-cwd. All three
  were a whole-file ban on `fs.$METHOD($$$)` where METHOD ends `Sync` — no
  `inside:` scoping, because (per each retired test) the whole file is
  legitimately on its hot/read path with no off-path helper to exempt,
  unlike lease-client.ts (no-sync-fs-in-main-hot-path) or session-browser.ts
  (no-sync-fs-in-main-read-path-session-browser), which keep their own
  per-function rules. Invariant sources: tests/main-hot-path-no-sync-fs.test.ts
  (retired by Plan B, 2026-09-16; case 2 of 3 — "transcript mirror (whole
  file)") and tests/main-read-path-no-sync-fs.test.ts (retired by Plan B,
  2026-09-16; case 1 of 4 — "marketplace-file-reader (whole file)" — and
  case 3 of 4 — "transcript-cwd (whole file)"). EXPECTED_VIOLATIONS is
  unaffected by the merge: all three violation fixtures stay, each still
  independently fires this one rule id, so the fixture-match count is the
  same 3 as before (one per fixture file) — see scripts/ast-grep/check.sh's
  dated comment.
files:
  - "**/src/main/conversations/transcript-mirror.ts"
  - "**/src/main/marketplace-file-reader.ts"
  - "**/src/main/transcript-cwd.ts"
  - "**/fixtures/no-sync-fs-whole-file-transcript-mirror.ts"
  - "**/fixtures/no-sync-fs-whole-file-marketplace-file-reader.ts"
  - "**/fixtures/no-sync-fs-whole-file-transcript-cwd.ts"
rule:
  pattern: fs.$METHOD($$$ARGS)
constraints:
  METHOD:
    regex: "Sync$"
