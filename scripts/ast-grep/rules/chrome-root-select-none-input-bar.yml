id: chrome-root-select-none-input-bar
language: tsx
severity: error
message: >-
  InputBar.tsx must keep `className="input-bar-container … select-none …"`
  on the composer's root. Its buttons and chrome must not be painted or
  copied by Ctrl+A or drag-select (Destin, 2026-09-10); the text box itself
  opts back in through globals.css.
note: |
  Invariant source: tests/unselectable-chrome.test.ts (Plan B, 2026-09-16),
  the "composer" case of "chrome areas carry select-none on their own
  root". The retired case blanked comments and required the regex
  `className="input-bar-container\b[^"]*\bselect-none\b` somewhere in the
  file. Fires on the file when no JSX attribute's text matches that regex.
  DIFFERENCE (minimal): a string quoting the markup no longer satisfies it —
  it must be a real JSX attribute.
files:
  - "**/src/renderer/components/InputBar.tsx"
  - "**/fixtures/chrome-root-select-none-input-bar.tsx"
rule:
  kind: program
  not:
    has:
      stopBy: end
      kind: jsx_attribute
      regex: '^className="input-bar-container\b[^"]*\bselect-none\b'
