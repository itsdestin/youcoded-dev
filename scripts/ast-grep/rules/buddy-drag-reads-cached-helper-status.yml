id: buddy-drag-reads-cached-helper-status
language: typescript
severity: error
message: >-
  `captionChannelLive` is asked on EVERY FRAME of a buddy drag, so it must
  answer from the cache (`cachedBuddyHelperStatus()`) — never await, never
  call `helperStatus()` (two subprocess calls sixty times a second).
note: |
  Invariant source: tests/buddy-consent-gate.test.ts (Plan B t6a review fix,
  2026-09-16; 'answers the "is the helper live" question from the cache,
  never with a fresh call'). The retired case sliced main.ts from
  `captionChannelLive: () =>` to the next "// Publish to module scope"
  comment (raw text, comments included) and required
  `cachedBuddyHelperStatus()` and neither `await` nor `helperStatus()` in
  it. Matched on the `captionChannelLive` property's full text (its value
  and any comments inside it); a whole-file branch fires when the property
  is gone (the retired slice then read nothing and failed).
files:
  - "**/src/main/main.ts"
  - "**/fixtures/buddy-drag-reads-cached-helper-status.ts"
rule:
  any:
    - kind: pair
      regex: "^captionChannelLive\\s*:"
      any:
        - not: { has: { stopBy: end, pattern: cachedBuddyHelperStatus() } }
        - regex: "await|helperStatus\\(\\)"
    - kind: program
      not:
        has:
          stopBy: end
          kind: pair
          regex: "^captionChannelLive\\s*:"
