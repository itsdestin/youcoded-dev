id: session-strip-no-hand-written-curve
language: tsx
severity: error
message: >-
  SessionStrip uses the --ease-* tokens, never a hand-written cubic-bezier(
  — five drifted copies of one overshoot accumulated that way. (steps() is
  the frame budget and stays.)
note: |
  Invariant source: tests/animation-frame-budget.test.ts (Plan B t6a review fix, 2026-09-16; the TSX half of "leaves no hand-written curve in SessionStrip").
  Scoped to SessionStrip.tsx only, as the retired case was (the rest of the
  renderer is a separate cleanup).
files:
  - "**/src/renderer/components/SessionStrip.tsx"
  - "**/fixtures/session-strip-no-hand-written-curve.tsx"
utils:
  # A leaf token of the file as the retired test's `read()` saw it: every
  # string/template fragment, JSX text, identifier kind and LINE comment.
  # Block comments are excluded — read() deleted them before matching.
  code-leaf:
    any:
      - kind: string_fragment
      - kind: jsx_text
      - kind: identifier
      - kind: property_identifier
      - kind: shorthand_property_identifier
      - kind: shorthand_property_identifier_pattern
      - kind: type_identifier
      - kind: statement_identifier
      - kind: regex_pattern
      - all:
          - kind: comment
          - not: { regex: "^/\\*" }
rule:
  matches: code-leaf
  regex: "cubic-bezier\\("
  not: { has: { regex: "cubic-bezier\\(" } }
