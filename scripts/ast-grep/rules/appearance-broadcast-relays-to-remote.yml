id: appearance-broadcast-relays-to-remote
language: typescript
severity: error
message: >-
  The IPC.APPEARANCE_BROADCAST entry (main/ipc/appearance.ts) must relay theme
  changes both ways between the computer and phones: its handler must call
  `sendToPhones({ type: IPC.APPEARANCE_SYNC, … })` (a window's change reaches the
  phones) and `sendToWindows(IPC.APPEARANCE_SYNC, …)` (a phone's change reaches
  the computer's windows). Without them a phone keeps an old theme until
  reloaded, or a phone's change never reaches the computer's windows (Destin,
  2026-09-11).
note: |
  Invariant source: tests/remote-server-connections.test.ts (Plan B, 2026-09-16)
  — "the window relay also broadcasts appearance:sync to remote clients" and
  "the remote server is told how to reach the computer's windows".
  RETARGETED 2026-10-01 (one-core R3-8): the two halves used to be an
  `ipcMain.on(IPC.APPEARANCE_BROADCAST, …)` in main.ts that called
  `remoteServer.broadcast({ type: IPC.APPEARANCE_SYNC, … })`, plus an
  `onAppearanceBroadcast` callback main.ts gave the RemoteServer. Both are one
  channel-table entry now: the computer's branch calls `ctx.desktop.sendToPhones`
  and the phone's branch calls `ctx.remote.sendToWindows`. THE REGION is the
  object literal holding the pair `name: IPC.APPEARANCE_BROADCAST`; it fires when
  that object holds no call of either shape. A comment spelling a call no longer
  counts (a real call is required). If the whole entry is deleted,
  appearance-broadcast-handler-registered fires.
files:
  - "**/src/main/ipc/appearance.ts"
  - "**/fixtures/appearance-broadcast-relays-to-remote*.ts"
utils:
  broadcast-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.APPEARANCE_BROADCAST$" }
  sends-sync-object-to-phones:
    kind: call_expression
    has: { field: function, regex: "sendToPhones$" }
    all:
      - has:
          field: arguments
          has:
            nthChild: 1
            kind: object
            has:
              kind: pair
              all:
                - has: { field: key, regex: "^type$" }
                - has: { field: value, regex: "^IPC\\.APPEARANCE_SYNC$" }
rule:
  matches: broadcast-entry
  not:
    all:
      - has: { stopBy: end, matches: sends-sync-object-to-phones }
      - has: { stopBy: end, pattern: "$R.sendToWindows(IPC.APPEARANCE_SYNC, $$$)" }
