id: chrome-root-select-none-thinking-line
language: tsx
severity: error
message: >-
  ThinkingIndicator.tsx must keep `data-testid="thinking-indicator"
  className="… select-none …"` on the thinking line's root. It is a status
  line, not content: Ctrl+A must not paint it (Destin, 2026-09-10).
note: |
  Invariant source: tests/unselectable-chrome.test.ts (Plan B, 2026-09-16),
  the "thinking line" case of "chrome areas carry select-none on their own
  root". The retired case blanked comments and required the regex
  `data-testid="thinking-indicator" className="[^"]*\bselect-none\b`
  somewhere in the file.
  Fires on the file when no `className="…select-none…"` JSX attribute
  comes directly after a `data-testid="thinking-indicator"` attribute.
  DIFFERENCES (minimal): any whitespace between the two attributes is
  accepted (the regex needed exactly one space); a string quoting the
  markup no longer satisfies it.
files:
  - "**/src/renderer/components/ThinkingIndicator.tsx"
  - "**/fixtures/chrome-root-select-none-thinking-line.tsx"
rule:
  kind: program
  not:
    has:
      stopBy: end
      kind: jsx_attribute
      regex: '^className="[^"]*\bselect-none\b'
      follows:
        kind: jsx_attribute
        regex: '^data-testid="thinking-indicator"$'
