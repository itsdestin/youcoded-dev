id: no-sync-fs-in-main-read-path-theme-preview
language: typescript
severity: error
message: >-
  buildPreviewHTML must never call a blocking fs.*Sync — Task 2
  (perf/main-thread-async-reads) converted this path off fs.*Sync so
  regenerating a theme's preview image after editing its wallpaper/pattern
  can no longer freeze Electron's main thread.
note: |
  Invariant source: tests/main-read-path-no-sync-fs.test.ts (retired by Plan
  B, 2026-09-16; case 2 of 4 — "theme-preview-generator buildPreviewHTML").
  Fires two ways at the whole-file (`program`) level: (a) an fs.*Sync call
  found inside buildPreviewHTML, or (b) buildPreviewHTML is gone entirely —
  the retired test's own `slice()` helper asserted the start/end markers were
  found (`toBeGreaterThan(-1)` / `toBeGreaterThan(start)`); a bare
  `inside:`-scoped rule with no existence branch would silently stop
  guarding that once the function is renamed or removed.
files:
  - "**/src/main/theme-preview-generator.ts"
  - "**/fixtures/no-sync-fs-in-main-read-path-theme-preview.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        pattern: fs.$METHOD($$$ARGS)
        inside:
          kind: function_declaration
          stopBy: end
          has:
            field: name
            regex: "^buildPreviewHTML$"
    - not:
        has:
          stopBy: end
          kind: function_declaration
          has:
            field: name
            regex: "^buildPreviewHTML$"
constraints:
  METHOD:
    regex: "Sync$"
