id: perf-mark-index-order
language: tsx
severity: error
message: >-
  index.tsx must mark 'yc:modules-evaluated' before 'yc:root-render', and both
  marks must exist. The perf-lab rig (youcoded-dev/scripts/perf-lab) reads them
  in order to recover the hidden window between page navigation and the app's
  first render — ESM hoists every import above the module body, so
  modules-evaluated is written below the imports on purpose (it marks the END
  of bundle evaluation, not the start).
note: |
  Invariant source: tests/perf-marks-renderer.test.ts (retired by Plan B,
  2026-09-16; case 1 of 3 — "index.tsx marks modules-evaluated and root
  render, in that order"). The two marks live in different scopes in the real
  file (modules-evaluated is a top-level statement; root-render is inside the
  else branch of the top-level if/else that decides workbench vs. normal
  boot), so the order check matches the ENCLOSING top-level statement against
  `follows` rather than the call itself — ast-grep's `follows`/`precedes`
  relations only compare true siblings under the same parent, even with
  `stopBy: end` (verified empirically, scratch probe 2026-09-16: a `follows`
  check on the nested call itself never fires, correct or wrong order alike).
  SHAPE-INDEPENDENT (fixed in review, 2026-09-16): the first draft required
  the enclosing statement to be `kind: if_statement`, so a root-render mark
  placed as a BARE top-level statement (no if/else) never tripped the order
  check at all — a real miss, not just a narrower fixture. The rule now finds
  whichever direct child of `program` contains each mark (any kind) and
  checks `follows` between those two children, so an if-wrapped mark and a
  bare one are both covered by the same branch. This also drops the
  `kind: expression_statement` requirement on the modules-evaluated side,
  which was a FALSE POSITIVE source: wrapping that mark in a plain block
  statement (still correct order) failed the kind-specific match and the
  `not: follows` fired anyway. Proved on real index.tsx by inverting the
  order in place (swapping which mark comes first, not renaming either) and
  restoring afterward.
files:
  - "**/src/renderer/index.tsx"
  - "**/fixtures/perf-mark-index-order.tsx"
rule:
  kind: program
  any:
    - not: { has: { stopBy: end, pattern: "performance.mark('yc:modules-evaluated')" } }
    - not: { has: { stopBy: end, pattern: "performance.mark('yc:root-render')" } }
    - has:
        has:
          stopBy: end
          pattern: "performance.mark('yc:root-render')"
        not:
          follows:
            stopBy: end
            has:
              stopBy: end
              pattern: "performance.mark('yc:modules-evaluated')"
