id: session-strip-held-pill-keeps-name
language: tsx
severity: error
message: >-
  The pill in hand keeps its fully expanded name (Destin, 2026-09-02: "i
  want to keep the fully expanded name"): its settled drag width is never
  COLLAPSED_PILL_PX, and a pill shows its name when
  `displayPack.expanded.has(s.id) || isHovered || isActive`.
note: |
  Invariant source: tests/animation-frame-budget.test.ts (Plan B t6a review fix, 2026-09-16; the TSX half of "keeps the open name in hand while dragging").
files:
  - "**/src/renderer/components/SessionStrip.tsx"
  - "**/fixtures/session-strip-held-pill-keeps-name.tsx"
rule:
  any:
    - pattern: "if (id === sessionId) return COLLAPSED_PILL_PX;"
    - kind: program
      not:
        has:
          stopBy: end
          kind: ternary_expression
          has: { field: alternative, pattern: "displayPack.expanded.has(s.id) || isHovered || isActive" }
