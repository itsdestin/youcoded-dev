id: no-hardcoded-z-index-or-scrim-9000-band
language: tsx
severity: error
message: >-
  No file under components/project-view/ hardcodes a 9000-band z-index.
  ProjectHero's kebab menu used z-[9000] SOLELY to clear ProjectView's old
  z-[8000]; with ProjectView now at z-40, that value would float a
  narrow-mode menu above every overlay in the app.
note: |
  Invariant source: tests/overlay-layer-authority.test.ts (retired by Plan B,
  2026-09-16; case 3 of 5 — "project-view has no hardcoded 9000-band
  z-index"). Recursive scope over components/project-view/ (the retired
  test's own `walk()`), `.tsx` files — see
  no-hardcoded-z-index-or-scrim-9000-band-ts for the `.ts` twin: a
  `language: tsx` rule's `files:` entries for `*.ts` paths would silently
  match nothing, since ast-grep only parses a file under the language it was
  configured with. Also matches `template_string` alongside
  `string_fragment` — see no-hardcoded-z-index-or-scrim's note for why.
files:
  - "**/src/renderer/components/project-view/**/*.tsx"
  - "**/fixtures/no-hardcoded-z-index-or-scrim-9000-band.tsx"
ignores:
  - "**/*.test.tsx"
rule:
  any:
    - kind: string_fragment
      regex: "z-\\[9\\d{3}\\]"
    - kind: template_string
      regex: "z-\\[9\\d{3}\\]"
