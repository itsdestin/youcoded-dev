id: main-registers-all-quit-routes
language: typescript
severity: error
message: >-
  main.ts must register teardown on all three quit routes — window-all-closed,
  before-quit, and SIGTERM/SIGINT — routed through one idempotent
  shutdownApp(), or a route silently skips teardown: for months
  window-all-closed was the app's ONLY quit listener, so macOS Cmd+Q, dock
  quit, and an OS-shutdown SIGTERM ran no teardown at all, leaking
  llama-server (which holds its fixed port for the next launch to wrongly
  adopt), the hook relay's pipe, sync watchers, and every stdio MCP server's
  spawned subprocess (2026-08-05 fix).
note: |
  Invariant source: tests/app-quit-routes.test.ts (retired by Plan B, 2026-09-16).
  Each `any:` branch is the negation of one required piece; ast-grep reports
  matches, so a "must exist" check is written as its negation over the whole
  file (`kind: program`) — the rule fires if ANY required piece is missing.
  This is a weaker guard than a behavioral test (it proves the pieces are
  present, not that teardown actually runs or is idempotent at runtime) —
  the original test carried the same limitation, since main.ts runs Electron
  app setup at import time and cannot be imported into a test.
files:
  - "**/src/main/main.ts"
  - "**/fixtures/app-quit-routes.ts"
rule:
  kind: program
  any:
    - not: { has: { stopBy: end, pattern: "app.on('window-all-closed', $$$)" } }
    - not: { has: { stopBy: end, pattern: "app.on('before-quit', $$$)" } }
    - not: { has: { stopBy: end, kind: string_fragment, regex: "^SIGTERM$" } }
    - not: { has: { stopBy: end, kind: string_fragment, regex: "^SIGINT$" } }
    - not:
        has:
          stopBy: end
          kind: function_declaration
          has:
            field: name
            regex: "^shutdownApp$"
    - not: { has: { stopBy: end, pattern: "if (shuttingDown) return shuttingDown;" } }
    - not: { has: { stopBy: end, pattern: "$X.preventDefault()" } }
