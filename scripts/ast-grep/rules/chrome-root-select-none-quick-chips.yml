id: chrome-root-select-none-quick-chips
language: tsx
severity: error
message: >-
  QuickChips.tsx must wrap the chip row (`<div className="flex gap-1 px-3
  py-1 overflow-x-auto …">`) directly in a `<div className="… select-none …">`.
  Quick chips are chrome, not highlightable or copyable (Destin, 2026-09-10).
note: |
  Invariant source: tests/unselectable-chrome.test.ts (Plan B, 2026-09-16),
  the "quick chips" case of "chrome areas carry select-none on their own
  root". The retired case blanked comments and required the regex
  `<div className="[^"]*\bselect-none\b[^"]*">\s*<div className="flex gap-1 px-3 py-1 overflow-x-auto`
  somewhere in the file.
  Fires on the file when no JSX element's own text starts with that regex
  (the wrapper's only attribute is the className, and the chip row is its
  first child with nothing but whitespace between).
  DIFFERENCE (minimal): a string quoting the markup no longer satisfies it —
  it must be a real JSX element; a comment between the two tags hides the
  pair (as it did before: the blanked comment left its braces behind).
files:
  - "**/src/renderer/components/QuickChips.tsx"
  - "**/fixtures/chrome-root-select-none-quick-chips.tsx"
rule:
  kind: program
  not:
    has:
      stopBy: end
      kind: jsx_element
      regex: '^<div className="[^"]*\bselect-none\b[^"]*">\s*<div className="flex gap-1 px-3 py-1 overflow-x-auto'
