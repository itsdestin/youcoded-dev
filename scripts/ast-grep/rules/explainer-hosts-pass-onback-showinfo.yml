id: explainer-hosts-pass-onback-showinfo
language: tsx
severity: error
message: >-
  A file that renders <SettingsExplainer> must pass <Dialog> an onBack that is
  driven by its showInfo flag. Dialog gained `onBack` for exactly this; if a
  host stops passing it, the explainer becomes a view you cannot back out of.
note: |
  Invariant source: tests/explainer-shell.test.tsx (Plan B, 2026-09-16; "every
  host drives Dialog onBack from its showInfo flag" — case 2 of the "explainer
  hosts" describe block). ThemeScreen.tsx, the lifted case, is the twin rule
  explainer-hosts-pass-onback-showinfo-lifted.
  SCOPING: the retired HOSTS list minus ThemeScreen — ContextPopup.tsx,
  SettingsPanel.tsx, SyncPanel.tsx.
  SHAPE: whole-file, like the retired check. It applied only when the file
  still contained `<SettingsExplainer` (a tag whose name starts with it), then
  required that at least ONE `onBack={…}` expression (braces balanced,
  comments stripped) mention showInfo — SettingsPanel legitimately has a
  second onBack for Account's connections sub-page. Here: a `kind: program`
  that has such a tag and has NO `onBack` JSX attribute whose `{…}` value
  holds a non-comment `showInfo` (an identifier, property, shorthand or
  string piece). Formatting-independent, like the old brace balancing.
  A host file that is deleted or renamed fails check.sh's rule-paths pass
  (2026-09-16), as the retired test threw on a missing file.
files:
  - "**/src/renderer/components/ContextPopup.tsx"
  - "**/src/renderer/components/SettingsPanel.tsx"
  - "**/src/renderer/components/SyncPanel.tsx"
  - "**/fixtures/explainer-hosts-pass-onback-showinfo.tsx"
rule:
  kind: program
  has:
    stopBy: end
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: "^SettingsExplainer"
  not:
    has:
      stopBy: end
      kind: jsx_attribute
      all:
        - has:
            kind: property_identifier
            regex: "^onBack$"
        - has:
            kind: jsx_expression
            has:
              stopBy: end
              any:
                - kind: identifier
                - kind: property_identifier
                - kind: shorthand_property_identifier
                - kind: shorthand_property_identifier_pattern
                - kind: string_fragment
                - kind: template_string
              regex: "showInfo"
