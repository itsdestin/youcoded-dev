id: native-session-list-uses-async-form
language: typescript
severity: error
message: >-
  The IPC and remote session-list handlers must call nativeHost.listAsync(),
  never nativeHost.list() — the sync form lists and head-reads every native
  session file on the main process, on every Resume list open.
note: |
  Invariant source: tests/main-hot-path-no-sync-fs.test.ts on origin/master
  (added by the 2026-09-16 smoothness sweep, Batch C, after Plan B had
  already retired that file on its branch). Ported by the Plan B close-out
  merge, 2026-09-17 ("merge port" rows in
  docs/archive/plans/2026-09-16-sweep-ledger.md); the file stays deleted.
  Case: "the Resume list" — its handler half (`not.toMatch(/nativeHost\.list\(\)/)`
  over the comment-stripped ipc-handlers.ts and remote-server.ts). Matches a
  zero-argument `.list()` on any receiver whose text ends in `nativeHost`
  (`nativeHost`, `this.nativeRuntime.nativeHost`), as the substring regex did.
  A comment naming the old call (ipc-handlers.ts has one) does not fire.
files:
  - "**/src/main/ipc-handlers.ts"
  - "**/src/main/remote-server.ts"
  - "**/fixtures/native-session-list-uses-async-form.ts"
rule:
  pattern: $OBJ.list()
constraints:
  OBJ:
    regex: "nativeHost$"
