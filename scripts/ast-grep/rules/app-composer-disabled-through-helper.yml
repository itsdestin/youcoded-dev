id: app-composer-disabled-through-helper
language: tsx
severity: error
message: >-
  <ChatInputBar disabled=…> in App.tsx must be `composerDisabled({...})`
  (state/startup-dialog-store.ts). On a touch device the terminal-view bar IS
  the terminal's keyboard and must work before the session starts, or a startup
  dialog sent to terminal view can only be Esc'd away; chat view stays gated.
note: |
  Second review F2 (2026-09-24). The rule itself is unit-tested
  (tests/startup-dialog-store.test.ts); this pins that App actually uses it —
  a test cannot mount App.
files:
  - "**/src/renderer/App.tsx"
  - "**/fixtures/app-composer-disabled-through-helper.tsx"
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: "^disabled$"
  not:
    has:
      stopBy: end
      kind: call_expression
      regex: "^composerDisabled\\("
  inside:
    any:
      - kind: jsx_self_closing_element
      - kind: jsx_opening_element
    has:
      field: name
      regex: "^ChatInputBar$"
