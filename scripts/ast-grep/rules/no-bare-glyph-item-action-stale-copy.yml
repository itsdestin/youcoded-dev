id: no-bare-glyph-item-action-stale-copy
language: tsx
severity: error
message: >-
  No in-menu copy tells the user to press a control that was removed. Change
  41 (K6) deleted the ✕ next to each connected device, but the Remote Access
  explainer still read "Use the ✕ next to a device under Connected Devices to
  disconnect it." — help text naming a control that no longer exists. Name
  the button by its label, not by a glyph that may be replaced.
note: |
  Invariant source: tests/item-list-authority.test.ts (retired by Plan B,
  2026-09-16; case 4 of 4 — "no in-menu copy tells the user to press a
  control that was removed"). Same SCOPING as no-bare-glyph-item-action.
  Matches both `jsx_text` (copy rendered directly as JSX children) and
  `string_fragment`/`template_string` (copy held in a string or template
  literal constant) with the same regex the retired test used —
  `/(Use|Tap|Click|Press) the ✕/`.
files:
  - "**/src/renderer/App.tsx"
  - "**/src/renderer/components/*.tsx"
  - "**/src/renderer/components/development/*.tsx"
  - "**/src/renderer/components/ui/*.tsx"
  - "**/fixtures/no-bare-glyph-item-action-stale-copy.tsx"
rule:
  any:
    - kind: jsx_text
      regex: "(Use|Tap|Click|Press) the ✕"
    - kind: string_fragment
      regex: "(Use|Tap|Click|Press) the ✕"
    - kind: template_string
      regex: "(Use|Tap|Click|Press) the ✕"
