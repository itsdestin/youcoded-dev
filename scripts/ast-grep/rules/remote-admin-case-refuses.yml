id: remote-admin-case-refuses
language: typescript
severity: error
message: >-
  main/ipc/remote-admin.ts must refuse host administration over the remote
  socket: the channel-table entries for IPC.REMOTE_SET_PASSWORD,
  IPC.REMOTE_SET_CONFIG, IPC.REMOTE_DEVICES_RENAME and IPC.REMOTE_DEVICES_UNPAIR
  stay, each carrying `remoteAllowed: false` and `refusal: hostAdminRefusal`
  (the answer HOST_ADMIN_REFUSAL); IPC.REMOTE_GET_CONFIG stays an entry a
  phone may call; and there is no entry for remote:disconnect-client. Behind a
  loopback bind every phone arrives as 127.0.0.1, so an address check let any
  paired phone change the host password; a performed Unpair left the device with
  full access while its row vanished.
note: |
  Invariant source: tests/remote-shim.test.ts (Plan B,
  2026-09-16) — "refuses the administration channels, and not by comparing an
  address", the server half of "a phone cannot unpair a device", and the
  source half of "reading the configuration is still allowed". The file's
  responseOutcome cases stay. The Unpair button half is
  unpair-button-disabled-on-remote. The retired address-check and
  disconnect-handler idioms are banned by remote-server-no-address-check-or-disconnect.
  RETARGETED 2026-10-01 (one-core R3-8): the refusals were `case`s in
  remote-server.ts answering with HOST_ADMIN_REFUSAL; the admin channels are
  channel-table entries now (main/ipc/remote-admin.ts), and the table refuses a
  phone from the entry's own policy without the handler ever running. Here, on
  that file, it fires when:
    - there is no entry (an object holding the pair `name: IPC.<CHANNEL>`) for
      any one of the five channels (once per missing channel);
    - one of the four refused entries lacks either `remoteAllowed: false` or a
      `refusal: hostAdminRefusal` pair;
    - the `hostAdminRefusal` constant is missing or no longer holds
      HOST_ADMIN_REFUSAL;
    - the IPC.REMOTE_GET_CONFIG entry is made `desktopOnly` or
      `remoteAllowed` (reading the configuration is not administration);
    - any pair names remote:disconnect-client or REMOTE_DISCONNECT_CLIENT: that
      channel deliberately has NO entry, so it falls to the door's "unsupported"
      answer, which every shim version rejects. A refusal there resolved as an
      ordinary value, another false success.
  The R3-8 retarget keeps the distinction the old rule drew by comments: four
  channels REFUSE, one stays answered, one is deliberately unlisted.
files:
  - "**/src/main/ipc/remote-admin.ts"
  - "**/fixtures/remote-admin-case-refuses*.ts"
utils:
  set-password-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.REMOTE_SET_PASSWORD$" }
  set-config-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.REMOTE_SET_CONFIG$" }
  get-config-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.REMOTE_GET_CONFIG$" }
  rename-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.REMOTE_DEVICES_RENAME$" }
  unpair-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.REMOTE_DEVICES_UNPAIR$" }
  refused-entry-name:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.REMOTE_(SET_PASSWORD|SET_CONFIG|DEVICES_RENAME|DEVICES_UNPAIR)$" }
  refusing-entry:
    kind: object
    all:
      - has: { kind: pair, regex: "^remoteAllowed:\\s*false$" }
      - has: { kind: pair, regex: "^refusal:\\s*hostAdminRefusal$" }
rule:
  any:
    # Presence: each channel must still have an entry.
    - kind: program
      not: { has: { stopBy: end, matches: set-password-entry } }
    - kind: program
      not: { has: { stopBy: end, matches: set-config-entry } }
    - kind: program
      not: { has: { stopBy: end, matches: get-config-entry } }
    - kind: program
      not: { has: { stopBy: end, matches: rename-entry } }
    - kind: program
      not: { has: { stopBy: end, matches: unpair-entry } }
    # The four administration entries refuse a phone from the table.
    - matches: refused-entry-name
      not: { matches: refusing-entry }
    # The refusal constant still holds the sentence.
    - kind: program
      not:
        has:
          stopBy: end
          kind: variable_declarator
          all:
            - has: { field: name, regex: "^hostAdminRefusal$" }
            - has: { stopBy: end, regex: "HOST_ADMIN_REFUSAL" }
    # Reading the configuration stays answered.
    - matches: get-config-entry
      has: { kind: pair, regex: "^(desktopOnly|remoteAllowed):" }
    # remote:disconnect-client has no entry.
    - kind: pair
      regex: "REMOTE_DISCONNECT_CLIENT|remote:disconnect-client"
