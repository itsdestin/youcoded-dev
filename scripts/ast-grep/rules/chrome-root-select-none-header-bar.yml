id: chrome-root-select-none-header-bar
language: tsx
severity: error
message: >-
  HeaderBar.tsx must keep `className="header-bar … select-none …"` on the
  header bar's root. The bar is app chrome: without select-none, Ctrl+A and
  drag-select paint and copy it (Destin, 2026-09-10).
note: |
  Invariant source: tests/unselectable-chrome.test.ts (Plan B, 2026-09-16),
  the "header bar" case of "chrome areas carry select-none on their own
  root". The retired case blanked comments and required the regex
  `className="header-bar\b[^"]*\bselect-none\b` somewhere in the file.
  Fires on the file when no JSX attribute's text matches that regex.
  DIFFERENCE (minimal): a string quoting the markup no longer satisfies it —
  it must be a real JSX attribute.
files:
  - "**/src/renderer/components/HeaderBar.tsx"
  - "**/fixtures/chrome-root-select-none-header-bar.tsx"
rule:
  kind: program
  not:
    has:
      stopBy: end
      kind: jsx_attribute
      regex: '^className="header-bar\b[^"]*\bselect-none\b'
