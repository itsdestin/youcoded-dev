id: chatview-passes-provider-to-attentionbanner
language: tsx
severity: error
message: >-
  ChatView must render `<AttentionBanner>` and pass it `provider={provider}`.
  Without the prop, a native session shows the Claude-Code "check Terminal
  view" pointer even though native sessions have no Terminal view — a dead
  end the component's own tests cannot catch, since they render
  AttentionBanner directly and never prove the real caller wires the prop
  through.
note: |
  Invariant source: tests/attention-banner.test.tsx (Plan B, 2026-09-16; "the
  stuck line" describe block's only source-reading case, "ChatView passes
  the session provider to the banner" — the other 13 cases render the real
  component and stay untouched). The retired case sliced ChatView from
  `<AttentionBanner` and matched `\bprovider=\{provider\}` in its attributes.
  FIX (review of t6a, 2026-09-16): the first draft matched only the
  self-closing form, and went silent if ChatView stopped rendering the banner
  at all (the retired slice would then have been empty and failed). It now
  checks the opening tag of an open/close `<AttentionBanner …>…</…>` too, and
  a whole-file branch fires when ChatView renders no AttentionBanner.
files:
  - "**/src/renderer/components/ChatView.tsx"
  - "**/fixtures/chatview-passes-provider-to-attentionbanner.tsx"
  - "**/fixtures/chatview-passes-provider-to-attentionbanner-absent.tsx"
utils:
  banner-tag:
    any:
      - kind: jsx_self_closing_element
      - kind: jsx_opening_element
    has:
      field: name
      regex: "^AttentionBanner$"
rule:
  any:
    - matches: banner-tag
      not:
        has:
          kind: jsx_attribute
          regex: "^provider=\\{provider\\}"
    - kind: program
      not:
        has:
          stopBy: end
          matches: banner-tag
