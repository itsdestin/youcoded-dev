id: pill-label-reveals-with-motion-tokens
language: typescript
severity: error
message: >-
  The pill label's max-width reveal uses the motion tokens — `max-width
  var(--dur-reveal) var(--ease-reveal)` — never a hand-tuned duration or an
  overshoot curve (width-like properties never overshoot).
note: |
  Invariant source: tests/animation-frame-budget.test.ts (Plan B t6a review fix, 2026-09-16; the TSX half of "never draws a dot touching the pill in hand — veiled by proximity, moved while hidden"). (its pill-label-style.ts line).
files:
  - "**/src/renderer/components/header/pill-label-style.ts"
  - "**/fixtures/pill-label-reveals-with-motion-tokens.ts"
rule:
  kind: program
  not: { has: { stopBy: end, kind: string_fragment, regex: "max-width var\\(--dur-reveal\\) var\\(--ease-reveal\\)" } }
