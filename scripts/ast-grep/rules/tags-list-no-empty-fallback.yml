id: tags-list-no-empty-fallback
language: typescript
severity: error
message: >-
  The tags:list table entry answers through listTagsForHost(…) and never falls
  back to an empty list. A failed or unavailable tag read must reach the screen
  as `{ ok: false, error }` ("Couldn't load your tags"), not as "this person
  has no tags" (error inventory 2026-09-10, false message 16).
note: |
  Invariant source: tests/tag-list-host.test.ts (Plan B, 2026-09-16).
  RETARGETED 2026-09-30 (one-core R3-1): tags:list used to be written twice, an
  `ipcMain.handle(IPC.TAGS_LIST, …)` in ipc-handlers.ts (this rule) and a
  `case 'tags:list':` in remote-server.ts (the retired sibling rule
  tags-list-no-empty-fallback-remote). Both doors now run ONE table entry in
  main/ipc/tags.ts, so one rule guards it.
  THE REGION is the object literal that names `IPC.TAGS_LIST` (the table entry:
  `defineChannel({ name: IPC.TAGS_LIST, … })`). Two branches:
  - NO DELEGATION: the file has no call whose callee ends in `listTagsForHost`
    inside that entry — which also covers a file with no tags:list entry at
    all. Fires on the file.
  - EMPTY FALLBACK: inside that entry, an empty array literal (`[]`, any
    spacing) — as `return []`, `.catch(() => [])` or `cond ? x : []` alike.
files:
  - "**/src/main/ipc/tags.ts"
  - "**/fixtures/tags-list-no-empty-fallback.ts"
  - "**/fixtures/tags-list-no-empty-fallback-missing.ts"
utils:
  tl-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.TAGS_LIST$" }
  delegation:
    kind: call_expression
    has: { field: function, regex: "listTagsForHost$" }
rule:
  any:
    # NO DELEGATION (and: no tags:list entry at all).
    - kind: program
      not:
        has:
          stopBy: end
          all:
            - matches: delegation
            - inside: { stopBy: end, matches: tl-entry }
    # EMPTY FALLBACK.
    - kind: array
      regex: "^\\[\\s*\\]$"
      inside: { stopBy: end, matches: tl-entry }
