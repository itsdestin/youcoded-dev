id: tooltip-key-on-wrapper-not-child
language: tsx
severity: error
message: >-
  A `key=` on a Tooltip's wrapped child belongs on <Tooltip> itself. The
  wrapper is the element in the array now, so a key left on the child names
  nothing, and React re-renders the wrong rows.
note: |
  Invariant source: tests/tooltip-adoption.test.ts (retired by Plan B,
  2026-09-16; case 4 of 4 — "never leaves a list key on the wrapped
  child"). Fires when the wrapped child carries `key=` and <Tooltip> itself
  does not — mirroring the retired test's
  `/\bkey=/.test(s.head) && !/\bkey=/.test(s.wrapper)`. `jsx_attribute`'s
  name has no `field:` label in this grammar (verified empirically, scratch
  probe 2026-09-16: the debug AST shows a bare `property_identifier` child,
  not a `name:`-labelled one) — matched by `kind: property_identifier`
  instead of `field: name`.
files:
  - "**/src/renderer/**/*.tsx"
  - "**/fixtures/tooltip-key-on-wrapper-not-child.tsx"
ignores:
  - "**/src/renderer/dev/workbench/**"
rule:
  kind: jsx_element
  all:
    - has:
        field: open_tag
        has:
          field: name
          regex: "^Tooltip$"
        not:
          has:
            kind: jsx_attribute
            has:
              kind: property_identifier
              regex: "^key$"
    - has:
        any:
          - kind: jsx_self_closing_element
            has:
              kind: jsx_attribute
              has:
                kind: property_identifier
                regex: "^key$"
          - kind: jsx_element
            has:
              field: open_tag
              has:
                kind: jsx_attribute
                has:
                  kind: property_identifier
                  regex: "^key$"
