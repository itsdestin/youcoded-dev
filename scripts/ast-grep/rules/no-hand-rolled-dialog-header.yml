id: no-hand-rolled-dialog-header
language: tsx
severity: error
message: >-
  No view inside a dialog paints its own header. Pass `title`, `onBack` and
  `headerActions` to <Dialog> instead. D1 gave <Dialog> the header, close
  button, back chevron and scroll body — it then shipped with SIX views still
  painting all four themselves, across Remote Access, Backup & Sync,
  Appearance and its theme editor, the sync add/edit form and the setup
  wizard, holding THREE separate reimplementations of the back chevron
  between them. If the view cannot reach its Dialog, lift the state that
  picks the view up to the component that owns it.
note: |
  Invariant source: tests/dialog-chrome-authority.test.ts (retired by Plan B,
  2026-09-16; case 2 of 4 — "no view inside a dialog paints its own header").
  SCOPING mirrors tests/helpers/guard-scope.ts's inScopeFiles(): App.tsx,
  components/*.tsx, components/development/*.tsx, components/ui/*.tsx — NOT
  marketplace, project-view, game, git, tags, context-menu, buddy or the dev
  workbench, which have their own unrelated instances of this exact recipe and
  were deliberately never in the original guard's scope (an earlier draft
  found HowContextWorksPopup.tsx and dev/workbench/compare/registry.tsx match
  this pattern too; they are real, out-of-scope, pre-existing surfaces, not a
  regression this rule should catch). Dialog.tsx (where the real header lives)
  and SyncSetupWizard.tsx (EXEMPT — its title is derived from state that
  legitimately lives inside it, see the retired test's OWNS_ITS_HEADER
  comment) are excluded. LIMITATION: the retired test also counted per-file
  (SyncSetupWizard.tsx allowed exactly 1, not 0-or-more) and separately
  verified that exemption still applies with the expected count — a whole-file
  `ignores:` cannot express "at most 1 here"; a SECOND hand-rolled header
  appearing in SyncSetupWizard.tsx would no longer be caught. Case 1 ("this
  guard can see what it claims to cover", non-vacuity) and case 3 ("every
  exemption still exists and still applies", exemption bookkeeping this
  ignores: approach no longer tracks) are dropped, not approximated, per
  global.md's non-vacuity rule — this rule's fixture pass is the non-vacuity
  check now.
files:
  - "**/src/renderer/**/*.tsx"
  - "**/fixtures/dialog-chrome-authority.tsx"
ignores:
  - "**/src/renderer/dev/**"
  - "**/src/renderer/components/marketplace/**"
  - "**/src/renderer/components/project-view/**"
  - "**/src/renderer/components/game/**"
  - "**/src/renderer/components/git/**"
  - "**/src/renderer/components/tags/**"
  - "**/src/renderer/components/context-menu/**"
  - "**/src/renderer/components/buddy/**"
  - "**/Dialog.tsx"
  - "**/SyncSetupWizard.tsx"
rule:
  kind: string_fragment
  regex: "px-4 py-3 border-b border-edge shrink-0"
