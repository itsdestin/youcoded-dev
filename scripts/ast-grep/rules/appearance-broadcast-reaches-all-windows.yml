id: appearance-broadcast-reaches-all-windows
language: typescript
severity: error
message: >-
  The IPC.APPEARANCE_BROADCAST entry must relay via BrowserWindow.getAllWindows()
  and send IPC.APPEARANCE_SYNC to every peer window. Buddy floater windows do not
  own sessions, so filtering through the session-peer registry instead would leave
  their independent ThemeProvider permanently on its launch theme.
note: |
  Invariant source: tests/appearance-buddy-broadcast.test.ts (retired by Plan B,
  2026-09-16). ast-grep reports matches, so a "must contain both calls" check is
  written as the negation: fires on the channel-table entry for
  IPC.APPEARANCE_BROADCAST when its handler is MISSING either
  BrowserWindow.getAllWindows() or IPC.APPEARANCE_SYNC.
  RETARGETED 2026-10-01 (one-core R3-8): was the call site
  `ipcMain.on(IPC.APPEARANCE_BROADCAST, …)` in main.ts; the entry in
  main/ipc/appearance.ts is the one handler now. If the WHOLE entry is deleted this
  rule is silent; appearance-broadcast-handler-registered catches that.
files:
  - "**/src/main/ipc/appearance.ts"
  - "**/fixtures/appearance-buddy-broadcast.ts"
utils:
  broadcast-entry:
    kind: object
    has: { kind: pair, regex: "^name:\\s*IPC\\.APPEARANCE_BROADCAST$" }
rule:
  matches: broadcast-entry
  not:
    all:
      - has: { stopBy: end, pattern: "BrowserWindow.getAllWindows()" }
      - has: { stopBy: end, pattern: "IPC.APPEARANCE_SYNC" }
