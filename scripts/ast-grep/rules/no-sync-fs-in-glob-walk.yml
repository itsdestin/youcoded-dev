id: no-sync-fs-in-glob-walk
language: typescript
severity: error
message: >-
  The Glob tool's directory walk (`const walk = async (...) => ...` in
  harness/tools/glob.ts) and its root probe must stay async — the walk ran
  with readdirSync/statSync on the main process, so every Glob the model
  issued (often several per turn) froze every window for the whole walk.
note: |
  Invariant source: tests/main-hot-path-no-sync-fs.test.ts on origin/master
  (added by the 2026-09-16 smoothness sweep, Batch C, after Plan B had
  already retired that file on its branch). Ported by the Plan B close-out
  merge, 2026-09-17 ("merge port" rows in
  docs/archive/plans/2026-09-16-sweep-ledger.md); the file stays deleted.
  Case: "the model's file tools — Glob's walk, Read, Edit, Write" — its
  glob.ts half (Read is read-tool-no-blocking-read; Edit, Write and
  file-fingerprint.ts joined no-sync-fs-whole-file). Fires at the `program`
  level when (a) an fs.*Sync call sits inside the `walk` arrow function
  (the retired slice ran from `const walk = async (` to its closing `};`),
  (b) no `walk` variable holding an arrow function exists (the retired
  `toBeGreaterThan(0)`), or (c) the async root probe
  `await fs.promises.stat(root)` is gone (the retired `toMatch`). The one
  sync stat left in the file, inside the missing-root hint (error path), is
  outside the walk and stays legal.
files:
  - "**/src/main/harness/tools/glob.ts"
  - "**/fixtures/no-sync-fs-in-glob-walk.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          kind: member_expression
          all:
            - has: { field: object, regex: "^fs$" }
            - has: { field: property, regex: "Sync$" }
        inside:
          stopBy: end
          kind: variable_declarator
          has: { field: name, regex: "^walk$" }
    - not:
        has:
          stopBy: end
          kind: variable_declarator
          all:
            - has: { field: name, regex: "^walk$" }
            - has: { field: value, kind: arrow_function }
    - not:
        has:
          stopBy: end
          pattern: await fs.promises.stat(root)
