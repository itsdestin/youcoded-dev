id: no-sync-fs-in-main-hot-path-git-transport
language: typescript
severity: error
message: >-
  gitDirSizeBytes must never call a blocking fs.*Sync — it runs from the
  sync engine's 120s poll for EVERY space. 2026-09-10: readdirSync/statSync
  over a large .git held the main thread for the whole walk; this method was
  converted to an async walk (fs.promises) with the same caps and symlink
  rule, off the event loop.
note: |
  Invariant source: tests/main-hot-path-no-sync-fs.test.ts (retired by Plan B,
  2026-09-16; case 3 of 3 — "git-transport gitDirSizeBytes"). Fires two ways
  at the whole-file (`program`) level: (a) an fs.*Sync call found inside the
  gitDirSizeBytes method, or (b) gitDirSizeBytes is gone entirely — the same
  absence the retired test's own `expect(start).toBeGreaterThan(0)` guarded
  against, which a bare `inside:`-scoped rule (with no existence branch)
  would silently stop guarding once the method is renamed or removed.
  git-transport.ts's OTHER methods legitimately use fs.*Sync (lock reaping,
  repo init, exclude-file bookkeeping) — this rule is scoped to
  gitDirSizeBytes's body only, on purpose.
  FIX (Plan B close-out, 2026-09-17): the ban used to be
  `pattern: fs.$METHOD($$$ARGS)` inside a `has:` plus a top-level
  `constraints: METHOD: Sync$`. ast-grep checks constraints only after the
  whole rule has matched, and a `has:` stops at the FIRST `fs.X(...)` call it
  finds — so a harmless `fs.watch(...)` or `fs.createReadStream(...)` ahead
  of a real `fs.readFileSync(...)` failed the constraint and silenced the
  WHOLE rule, including its "still exists" branches (found while porting
  master's hot-path cases: an inverted ipc-handlers.ts did not fire). The
  ban now matches the call's shape directly (object `fs`, property ending
  `Sync`) with no constraint, so every call is judged on its own.
files:
  - "**/src/main/sync-spaces/git-transport.ts"
  - "**/fixtures/no-sync-fs-in-main-hot-path-git-transport.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          kind: member_expression
          all:
            - has: { field: object, regex: "^fs$" }
            - has: { field: property, regex: "Sync$" }
        inside:
          kind: method_definition
          stopBy: end
          has:
            field: name
            regex: "^gitDirSizeBytes$"
    - not:
        has:
          stopBy: end
          kind: method_definition
          has:
            field: name
            regex: "^gitDirSizeBytes$"
