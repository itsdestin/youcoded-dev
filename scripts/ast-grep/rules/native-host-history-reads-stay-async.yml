id: native-host-history-reads-stay-async
language: typescript
severity: error
message: >-
  NativeSessionHost.getHistoryAsync/getHistoryPageAsync must never call a
  blocking fs.*Sync, and isLive() must never read history (readEvents* /
  getHistory*) — isLive is a boolean check; it used to read a session's
  whole history (parent and every child) to compute it and throw it away.
note: |
  Invariant source: tests/main-hot-path-no-sync-fs.test.ts on origin/master
  (added by the 2026-09-16 smoothness sweep, Batch C, after Plan B had
  already retired that file on its branch). Ported by the Plan B close-out
  merge, 2026-09-17 ("merge port" rows in
  docs/archive/plans/2026-09-16-sweep-ledger.md); the file stays deleted.
  Case: "native history reads the IPC handlers use (per scroll-up page, per
  tear-off)". The retired isLive check was a text regex
  /readEvents|getHistory/ over the comment-stripped body, so any identifier,
  property name or string in that body containing either word fires here
  (comments do not, matching the stripped read). Fires at the `program`
  level on either ban, or when any of the three methods is gone.
files:
  - "**/src/main/harness/native-session-host.ts"
  - "**/fixtures/native-host-history-reads-stay-async.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          kind: member_expression
          all:
            - has: { field: object, regex: "^fs$" }
            - has: { field: property, regex: "Sync$" }
        inside:
          stopBy: end
          kind: method_definition
          has: { field: name, regex: "^(getHistoryAsync|getHistoryPageAsync)$" }
    - has:
        stopBy: end
        any:
          - kind: identifier
          - kind: property_identifier
          - kind: shorthand_property_identifier
          - kind: string_fragment
        regex: "readEvents|getHistory"
        inside:
          stopBy: end
          kind: method_definition
          has: { field: name, regex: "^isLive$" }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^getHistoryAsync$" } } }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^getHistoryPageAsync$" } } }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^isLive$" } } }
