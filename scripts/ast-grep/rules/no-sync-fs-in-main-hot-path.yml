id: no-sync-fs-in-main-hot-path
language: typescript
severity: error
message: >-
  createLeaseClient must never call a blocking fs.*Sync — this is a hot
  main-process path (runs per lease acquire/renew/release) and a blocking fs
  call on the main thread stalls every window's IPC at once. 2026-09-08: the
  app froze 6+ minutes on a synchronous lease write.
note: |
  Invariant source: tests/main-hot-path-no-sync-fs.test.ts (retired by Plan B,
  2026-09-16; case 1 of 3 — "lease client (createLeaseClient body)").
  Fires two ways at the whole-file (`program`) level: (a) an fs.*Sync call
  found inside createLeaseClient, or (b) createLeaseClient is gone entirely
  — the same failure mode the retired test's `src.slice(src.indexOf(...))`
  would otherwise miss silently (an absent marker slices to near-nothing and
  trivially passes). lease-client.ts's OTHER helpers legitimately use
  fs.*Sync (best-effort lease-file cleanup outside the hot acquire/renew
  path) — this rule is scoped to createLeaseClient's body only, on purpose.
files:
  - "**/src/main/conversations/lease-client.ts"
  - "**/fixtures/no-sync-fs-in-main-hot-path.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        pattern: fs.$METHOD($$$ARGS)
        inside:
          kind: function_declaration
          stopBy: end
          has:
            field: name
            regex: "^createLeaseClient$"
    - not:
        has:
          stopBy: end
          kind: function_declaration
          has:
            field: name
            regex: "^createLeaseClient$"
constraints:
  METHOD:
    regex: "Sync$"
