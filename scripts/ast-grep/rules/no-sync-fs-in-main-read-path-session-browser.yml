id: no-sync-fs-in-main-read-path-session-browser
language: typescript
severity: error
message: >-
  session-browser.ts's listing path must never call a blocking fs.*Sync.
  Task 2 (perf/main-thread-async-reads) converted readIndexMeta,
  resolveSlugToPath, walkSlugParts, forwardResolveSlug, walkForward,
  readTopic, readSessionTranscriptMeta and listPastSessions — including the
  store-overlay loop's four fs.existsSync-turned-exists() calls — off
  fs.*Sync, so the Resume Browser's slug→path resolution chain (run once per
  project slug on every open) can no longer freeze Electron's main thread.
note: |
  Invariant source: tests/main-read-path-no-sync-fs.test.ts (retired by Plan
  B, 2026-09-16; case 4 of 4 — "session-browser listing path"). The retired
  test sliced ONE contiguous region from `function readIndexMeta` to
  `export async function loadHistory` (per controller decision 4,
  task-2-brief.md) because all eight functions sit contiguously in file
  order between those two markers — `loadHistory` itself and anything after
  it is deliberately OUT of scope. Each function gets its own `any:` pair
  (fs.*Sync found inside it / the function is gone entirely) rather than one
  giant slice, so a rename that keeps the function findable under a new
  scope still gets caught precisely, and the retired test's own
  `expect(start).toBeGreaterThan(-1)` / `toBeGreaterThan(start)` guard
  against a moved/renamed marker carries over per-function instead of
  collapsing to one brittle pair of markers.
files:
  - "**/src/main/session-browser.ts"
  - "**/fixtures/no-sync-fs-in-main-read-path-session-browser.ts"
rule:
  kind: program
  any:
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^readIndexMeta$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^readIndexMeta$" } } }
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^resolveSlugToPath$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^resolveSlugToPath$" } } }
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^walkSlugParts$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^walkSlugParts$" } } }
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^forwardResolveSlug$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^forwardResolveSlug$" } } }
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^walkForward$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^walkForward$" } } }
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^readTopic$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^readTopic$" } } }
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^readSessionTranscriptMeta$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^readSessionTranscriptMeta$" } } }
    - has: { stopBy: end, pattern: fs.$METHOD($$$ARGS), inside: { kind: function_declaration, stopBy: end, has: { field: name, regex: "^listPastSessions$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^listPastSessions$" } } }
constraints:
  METHOD:
    regex: "Sync$"
