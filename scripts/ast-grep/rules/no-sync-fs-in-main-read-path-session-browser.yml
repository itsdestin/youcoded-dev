id: no-sync-fs-in-main-read-path-session-browser
language: typescript
severity: error
message: >-
  session-browser.ts's listing path must never call a blocking fs.*Sync.
  Task 2 (perf/main-thread-async-reads) converted readIndexMeta,
  extractStoreMeta, withRetry, resolveSlugToPath, walkSlugParts,
  forwardResolveSlug, walkForward, readTopic, cleanTitle,
  readSessionTranscriptMeta and listPastSessions — including the
  store-overlay loop's four fs.existsSync-turned-exists() calls — off
  fs.*Sync, so the Resume Browser's slug→path resolution chain (run once per
  project slug on every open) can no longer freeze Electron's main thread.
note: |
  Invariant source: tests/main-read-path-no-sync-fs.test.ts (retired by Plan
  B, 2026-09-16; case 4 of 4 — "session-browser listing path").
  FIX (review of batch B, 2026-09-16): the retired test sliced ONE
  contiguous region from `function readIndexMeta` to
  `export async function loadHistory` — EVERYTHING between those two
  markers, not just the eight functions this rule used to name explicitly
  (it silently missed extractStoreMeta, withRetry, cleanTitle and any
  top-level code sitting between the named functions). Restated as a
  whole-file ban: any fs.*Sync call anywhere in the file that is NOT inside
  loadHistory (the one function the retired slice deliberately excluded,
  and everything else in the file sits before it) fires. This also covers
  code the retired test's marker-slice never reached (e.g. nativeJsonlPath,
  which sits above the readIndexMeta marker) — a strengthening, not a
  narrowing, per global.md's guidance that a stronger replacement guard is
  fine. The two `not: has:` branches keep the retired test's own
  `expect(start).toBeGreaterThan(-1)` marker-existence checks: if either
  readIndexMeta or loadHistory itself is renamed away, that is exactly the
  drift the original slice would have failed loudly on, so this rule fires
  too rather than going quiet because the ban branch has nothing left to
  match.
  FIX (Plan B close-out, 2026-09-17): the ban used to be
  `pattern: fs.$METHOD($$$ARGS)` inside a `has:` plus a top-level
  `constraints: METHOD: Sync$`. ast-grep checks constraints only after the
  whole rule has matched, and a `has:` stops at the FIRST `fs.X(...)` call it
  finds — so a harmless `fs.watch(...)` or `fs.createReadStream(...)` ahead
  of a real `fs.readFileSync(...)` failed the constraint and silenced the
  WHOLE rule, including its "still exists" branches (found while porting
  master's hot-path cases: an inverted ipc-handlers.ts did not fire). The
  ban now matches the call's shape directly (object `fs`, property ending
  `Sync`) with no constraint, so every call is judged on its own.
files:
  - "**/src/main/session-browser.ts"
  - "**/fixtures/no-sync-fs-in-main-read-path-session-browser.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          kind: member_expression
          all:
            - has: { field: object, regex: "^fs$" }
            - has: { field: property, regex: "Sync$" }
        not:
          inside:
            stopBy: end
            kind: function_declaration
            has:
              field: name
              regex: "^loadHistory$"
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^readIndexMeta$" } } }
    - not: { has: { stopBy: end, kind: function_declaration, has: { field: name, regex: "^loadHistory$" } } }
