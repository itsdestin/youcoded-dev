id: theme-effects-draws-from-interval
language: tsx
severity: error
message: >-
  ThemeEffects draws particles from setInterval(draw, …), never a
  requestAnimationFrame(draw…) chain (30fps work woken 180×/s). The one-shot
  resize coalescer may keep rAF.
note: |
  Invariant source: tests/animation-css-budget.test.ts (Plan B t6a review fix, 2026-09-16; the TSX half of "ThemeEffects draws from an interval, not a rAF chain").
  FIX (review round 2, 2026-09-16): the retired regex `/setInterval\(draw/`
  found the call as a substring, indifferent to any `window.` prefix. The
  presence branch below drops its `^` anchor to match that tolerance.
files:
  - "**/src/renderer/components/ThemeEffects.tsx"
  - "**/fixtures/theme-effects-draws-from-interval.tsx"
rule:
  any:
    - any:
        - kind: call_expression
        - all:
            - kind: comment
            - not: { regex: "^/\\*" }
      regex: "requestAnimationFrame\\(draw"
      not: { has: { regex: "requestAnimationFrame\\(draw" } }
    - kind: program
      not: { has: { stopBy: end, kind: call_expression, regex: "setInterval\\(draw" } }
