id: no-sync-fs-in-accepted-history-publish
language: typescript
severity: error
message: >-
  accepted-history-store.ts's publish(), its atomicWrite() and the
  IncrementalTranscriptReader class must never call a blocking fs.*Sync —
  publish() runs at EVERY turn boundary on the main process, so a sync read
  or write there stalls every window's IPC once per turn.
note: |
  Invariant source: tests/main-hot-path-no-sync-fs.test.ts on origin/master
  (added by the 2026-09-16 smoothness sweep, Batch C, after Plan B had
  already retired that file on its branch). Ported by the Plan B close-out
  merge, 2026-09-17 ("merge port" rows in
  docs/archive/plans/2026-09-16-sweep-ledger.md); the file stays deleted.
  Case: "accepted-history publish() and its incremental reader (per turn
  boundary)". The retired text slices were the whole
  IncrementalTranscriptReader class (to the next top-level `}`) and the two
  method bodies. Fires at the whole-file (`program`) level when (a) an
  fs.*Sync call sits inside any of the three, or (b) any of the three is gone
  — the retired case's own `expect(...).toBeGreaterThan(0)` presence checks.
  Other methods of AcceptedHistoryStore are not on this path and are not
  scanned, on purpose (the retired case did not scan them either).
files:
  - "**/src/main/harness/accepted-history-store.ts"
  - "**/fixtures/no-sync-fs-in-accepted-history-publish.ts"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          kind: member_expression
          all:
            - has: { field: object, regex: "^fs$" }
            - has: { field: property, regex: "Sync$" }
        inside:
          stopBy: end
          any:
            - kind: class_declaration
              has: { field: name, regex: "^IncrementalTranscriptReader$" }
            - kind: method_definition
              has: { field: name, regex: "^(publish|atomicWrite)$" }
    - not: { has: { stopBy: end, kind: class_declaration, has: { field: name, regex: "^IncrementalTranscriptReader$" } } }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^publish$" } } }
    - not: { has: { stopBy: end, kind: method_definition, has: { field: name, regex: "^atomicWrite$" } } }
