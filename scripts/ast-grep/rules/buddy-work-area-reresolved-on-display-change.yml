id: buddy-work-area-reresolved-on-display-change
language: typescript
severity: error
message: >-
  The buddy's usable screen area is re-asked on all three display events
  (display-metrics-changed, display-added, display-removed) through the
  debounced `reresolveWorkArea` (it clears its pending timer). Screens being
  plugged in, unplugged or rearranged each change which KDE screen an
  Electron display is, and KDE fires the first event three times within
  200 ms of a window appearing.
note: |
  Invariant source: tests/buddy-consent-gate.test.ts (Plan B t6a review fix,
  2026-09-16; "re-asks for the usable screen area on all three display
  events, debounced"). The retired case required
  `screen.on('<event>', reresolveWorkArea)` for each event, and
  `clearTimeout(t)` in the text from `const reresolveWorkArea` to the first
  of those calls — here, inside the `reresolveWorkArea` declaration.
files:
  - "**/src/main/main.ts"
  - "**/fixtures/buddy-work-area-reresolved-on-display-change.ts"
rule:
  kind: program
  any:
    - not: { has: { stopBy: end, pattern: "screen.on('display-metrics-changed', reresolveWorkArea)" } }
    - not: { has: { stopBy: end, pattern: "screen.on('display-added', reresolveWorkArea)" } }
    - not: { has: { stopBy: end, pattern: "screen.on('display-removed', reresolveWorkArea)" } }
    - not:
        has:
          stopBy: end
          kind: variable_declarator
          all:
            - has: { field: name, regex: "^reresolveWorkArea$" }
            - has: { stopBy: end, pattern: clearTimeout(t) }
