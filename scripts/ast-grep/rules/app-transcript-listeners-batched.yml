id: app-transcript-listeners-batched
language: tsx
severity: error
message: >-
  App.tsx's transcript listeners must hand every chat action to the frame batcher
  (attachTranscriptFeed in state/screen-feed.ts, which routes through routeTranscriptEvent; routeTranscriptShrink in state/transcript-batch.ts) and
  never dispatch to the store themselves. A direct dispatch can land AHEAD of
  actions still waiting for their frame: a /clear drawn above the message sent
  just before it, or a file-shrink compaction overtaking the queued summary.
note: |
  Invariant source: one-core R4-3 (Destin approved 2026-10-01); behaviour pinned by
  tests/transcript-routing.test.ts, which cannot mount App, so this rule pins the
  wiring. Fires if EITHER a `transcriptEvent` / `transcriptShrink` callback contains
  a `dispatch(` / `dispatchMany(` call, OR App no longer calls both helpers (sync-fix6: the transcript half moved into the shared feed the buddy also uses).
  `dispatchArtifact(...)` (the artifact tracker's own store) is a different
  identifier and is not matched.
files:
  - "**/src/renderer/App.tsx"
  - "**/fixtures/app-transcript-listeners-batched.tsx"
rule:
  kind: program
  any:
    - has:
        stopBy: end
        kind: call_expression
        all:
          - has:
              field: function
              regex: 'transcript(Event|Shrink)$'
          - has:
              field: arguments
              has:
                stopBy: end
                any:
                  - pattern: dispatch($$$)
                  - pattern: dispatchMany($$$)
    - not:
        has:
          stopBy: end
          pattern: attachTranscriptFeed($$$)
    - not:
        has:
          stopBy: end
          pattern: routeTranscriptShrink($$$)
