id: private-continuation-dir-single-owner
language: typescript
severity: error
message: >-
  The private-continuation directory name (the 0600 sidecar holding ChatGPT
  reasoning ciphertext — see AcceptedHistoryStore) must be named in exactly
  one module. Any other file naming it is a second path that could read,
  copy, sync or attach the sidecar the sync engine and the diagnostics
  collector are meant to never reach.
note: |
  Invariant source: tests/accepted-history-privacy.test.ts (Plan B, 2026-09-16;
  the test's only case, "Reader 6" — the bug-report/diagnostics collector
  half). The retired test walked EVERY .ts/.tsx file under src/ (main,
  renderer AND shared, test files included) and asserted a raw
  `.includes('private-continuation')` matched exactly
  ['main/harness/accepted-history-store.ts'].
  FIX (review of t6a, 2026-09-16): the first draft scanned only src/main and
  src/renderer .ts string literals. `.includes()` over raw text also caught a
  comment or any other token spelling the name, so this rule now matches the
  SMALLEST node whose text contains the name (a leaf: string/template
  fragment, comment, any identifier kind, regex) — the `not: has:` keeps a
  template_string and its own fragment from reporting twice.
  Companions: -tsx (the same ban for .tsx files — `language: typescript`
  never scans them), -present (the owner still names it; the retired
  test's `toEqual([owner])` failed on its absence too) and -devtools
  (dev-tools.ts never names `userData`).
files:
  - "**/src/**/*.ts"
  - "**/fixtures/private-continuation-dir-single-owner.ts"
ignores:
  - "**/src/main/harness/accepted-history-store.ts"
rule:
  regex: "private-continuation"
  any:
    - kind: string_fragment
    - kind: comment
    - kind: identifier
    - kind: property_identifier
    - kind: private_property_identifier
    - kind: shorthand_property_identifier
    - kind: shorthand_property_identifier_pattern
    - kind: type_identifier
    - kind: statement_identifier
    - kind: regex_pattern
  not:
    has:
      regex: "private-continuation"
