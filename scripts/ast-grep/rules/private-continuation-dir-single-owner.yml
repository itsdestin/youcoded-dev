id: private-continuation-dir-single-owner
language: typescript
severity: error
message: >-
  The private-continuation directory name (the 0600 sidecar holding ChatGPT
  reasoning ciphertext — see AcceptedHistoryStore) must be named in exactly
  one module. Any other file naming it is a second path that could read,
  copy, sync or attach the sidecar the sync engine and the diagnostics
  collector are meant to never reach.
note: |
  Invariant source: tests/accepted-history-privacy.test.ts (Plan B, 2026-09-16;
  the test's only case, "Reader 6" — the bug-report/diagnostics collector
  half). The retired test walked every .ts/.tsx file under src/ and asserted
  the literal string 'private-continuation' appears in exactly
  ['main/harness/accepted-history-store.ts']. This rule reproduces that as a
  presence ban on every OTHER .ts file under src/main and src/renderer.
  Scoped to .ts, not .tsx: this is a main-process filesystem path constant, so
  only main-process (and its renderer-side .ts, non-JSX helper) code could
  plausibly reference it; if a .tsx file ever needs to, add a tsx twin then.
  See private-continuation-dir-single-owner-devtools for the companion
  'userData' ban — that one is scoped to dev-tools.ts alone, because 'userData'
  is a common, legitimate literal everywhere else (app.getPath('userData'),
  NativeHome, …) and cannot share this rule's broad files: glob.
files:
  - "**/src/main/**/*.ts"
  - "**/src/renderer/**/*.ts"
  - "**/fixtures/private-continuation-dir-single-owner.ts"
ignores:
  - "**/src/main/harness/accepted-history-store.ts"
rule:
  any:
    - kind: string_fragment
      regex: "private-continuation"
    - kind: template_string
      regex: "private-continuation"
