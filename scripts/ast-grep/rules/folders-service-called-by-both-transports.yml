id: folders-service-called-by-both-transports
language: typescript
severity: error
message: >-
  remote-server.ts and ipc-handlers.ts must each call all five folder-service
  functions — listPickerFolders, addFolder, removeFolder, renameFolder and
  setFolderDescription. A transport that stops calling one has grown its own
  copy, which is how the phone's picker lost every synced project
  (Destin, 2026-09-11).
note: |
  Invariant source: tests/folders-service.test.ts (Plan B, 2026-09-16) —
  "both transports call the shared service for all five folder channels".
  Whole-file (`kind: program`): fires when either file has no call to any
  one of the five. The retired check was `toContain('<name>(')` on the raw
  text; this rule counts a call expression whose callee's text ENDS in the
  name, as the substring did (so `svc.addFolder(…)`, `x?.addFolder(…)` and
  even `readdFolder(…)` count). DIFFERENCE, deliberate: a comment or string
  spelling `addFolder(`, or a declaration `function addFolder(` that is never
  called, no longer satisfies it — the case is titled "call the shared
  service". SAME AS BEFORE: the rule does not look at where the called name
  comes from, so a same-name local copy that IS called passes, exactly as it
  passed the retired substring check (the import itself is not pinned).
  The sibling absence half is no-folders-json-outside-service.
files:
  - "**/src/main/remote-server.ts"
  - "**/src/main/ipc-handlers.ts"
  - "**/fixtures/folders-service-called-by-both-transports.ts"
rule:
  kind: program
  any:
    - not: { has: { stopBy: end, kind: call_expression, has: { field: function, regex: "listPickerFolders$" } } }
    - not: { has: { stopBy: end, kind: call_expression, has: { field: function, regex: "addFolder$" } } }
    - not: { has: { stopBy: end, kind: call_expression, has: { field: function, regex: "removeFolder$" } } }
    - not: { has: { stopBy: end, kind: call_expression, has: { field: function, regex: "renameFolder$" } } }
    - not: { has: { stopBy: end, kind: call_expression, has: { field: function, regex: "setFolderDescription$" } } }
