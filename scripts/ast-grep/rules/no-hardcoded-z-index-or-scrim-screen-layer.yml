id: no-hardcoded-z-index-or-scrim-screen-layer
language: tsx
severity: error
message: >-
  Marketplace and Library must stay on the shared screen layer
  (`fixed inset-0 z-40`), agreeing with ProjectView. Change 26 put all three
  screens on one layer so a Toast/ContextMenu/AnchorTip firing while any of
  them is open is never silently painted underneath it.
note: |
  Invariant source: tests/overlay-layer-authority.test.ts (retired by Plan B,
  2026-09-16; case 2 of 5 — "the three screens agree on their z-index").
  Presence check (`not: has:`) over the whole-file `program` node, scoped by
  `files:` to exactly the two named screens (ProjectView's own z-40 combo is
  guarded separately by no-hardcoded-z-index-or-scrim, which also bans the
  z-[8000] regression the OTHER two screens never had).
files:
  - "**/src/renderer/components/marketplace/MarketplaceScreen.tsx"
  - "**/src/renderer/components/library/LibraryScreen.tsx"
  - "**/fixtures/no-hardcoded-z-index-or-scrim-screen-layer.tsx"
rule:
  kind: program
  not:
    has:
      stopBy: end
      kind: string_fragment
      regex: "fixed inset-0 z-40"
