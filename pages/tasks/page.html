<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <!-- BUILT FILE when this is page.html: edit the files in src/ and run `node build.mjs`.
       No stylesheet link and no <script src>: the app adds the theme and the style kit
       (every .yc-* class), and a page must work with nothing but itself. -->
  <style>
/* Tasks page — its own rules only. Every control is a kit class (.yc-*); what is here is the
   layout of a three-part task app and the few pieces the kit has no word for (a task row, its
   round tick, the calendar grid, the board). Colours come from the theme except the fixed
   project/label dots, which identify a thing and must not change with the theme. */
:root {
  --t-p1: var(--yc-danger); --t-p2: var(--yc-warning); --t-p3: var(--accent); --t-p4: var(--fg-muted);
  --t-nav-w: 248px; --t-detail-w: 380px;
}
html, body { overflow: hidden; }
.t-app { position: relative; }
.t-icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.t-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--dot, var(--fg-muted)); }
.t-grow { flex: 1; min-width: 0; }
.t-clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[hidden] { display: none !important; }

/* ── left: where to look ─────────────────────────────────────────────────────────────── */
.t-nav { width: var(--t-nav-w); flex: none; display: flex; flex-direction: column; gap: 12px; padding: 12px; background: var(--panel); border-right: 1px solid var(--edge); overflow-y: auto; }
.t-nav h1 { padding: 2px 6px; }
.t-nav__group { display: flex; flex-direction: column; gap: 2px; }
.t-nav__label { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 2px 8px; min-height: 28px; }
.t-navitem { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 4px 8px; border: 1px solid transparent; border-radius: var(--radius-md, 8px); background: transparent; color: var(--fg-2); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.t-navitem:hover { background: var(--inset); color: var(--fg); }
.t-navitem[aria-current="true"] { background: color-mix(in oklab, var(--accent) 16%, transparent); border-color: color-mix(in oklab, var(--accent) 30%, transparent); color: var(--fg); font-weight: 500; }
.t-navitem.is-drop { outline: 2px solid var(--accent); outline-offset: -2px; }
.t-navitem:focus-visible, .t-task:focus-visible, .t-check:focus-visible, .t-linkish:focus-visible, .t-day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.t-navitem__count { margin-left: auto; font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.t-navitem__count.is-late { color: var(--destructive-fg, var(--fg)); }
.t-nav__foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 8px; }
.t-goal { flex: 1; min-width: 0; justify-content: flex-start; gap: 8px; }
.t-ring { width: 18px; height: 18px; flex: none; transform: rotate(-90deg); }
.t-ring circle { fill: none; stroke-width: 3; }
.t-ring__track { stroke: var(--edge); }
.t-ring__fill { stroke: var(--accent); stroke-linecap: round; }
.t-scrim { display: none; }

/* ── middle: the list ────────────────────────────────────────────────────────────────── */
.t-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); }
:root[data-yc-see-through] .t-main { background: transparent; }
/* The heading lines up with the list under it; a board uses the full width instead. */
.t-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 20px 8px; width: 100%; max-width: 860px; margin: 0 auto; }
.t-head--wide { max-width: none; }
.t-head h2 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.t-head__sub { font-size: 12px; color: var(--fg-muted); font-weight: 400; white-space: nowrap; }
.t-head__tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.t-head .yc-select { width: auto; font-size: 12px; padding: 5px 8px; height: 28px; }
.t-head .yc-filter { height: 28px; font-size: 12px; padding: 0 10px; }
.t-iconbtn.t-menu-btn { display: none; }
.t-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 96px; }
.t-list__inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.t-group { display: flex; flex-direction: column; gap: 2px; border-radius: var(--radius-lg, 12px); }
.t-group.is-drop { outline: 2px dashed var(--accent); outline-offset: 4px; }
.t-group__head { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 4px; }
.t-group__title { font-size: 13px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font-family: inherit; cursor: default; }
button.t-group__title { cursor: pointer; }
.t-group__title .t-icon { transition: transform 150ms ease; color: var(--fg-muted); }
.t-group.is-open > .t-group__head .t-group__title .t-chev { transform: rotate(90deg); }
.t-group__count { font-size: 11px; color: var(--fg-muted); }
.t-group__head .t-linkish { margin-left: auto; }
.t-linkish { appearance: none; background: none; border: 0; padding: 2px 4px; font: inherit; font-size: 12px; color: var(--link, var(--accent)); cursor: pointer; border-radius: var(--radius-sm, 4px); }
.t-linkish:hover { text-decoration: underline; }

.t-task { position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 8px 8px; border-radius: var(--radius-md, 8px); border: 1px solid transparent; cursor: pointer; }
.t-task:hover, .t-task.is-open { background: var(--panel); border-color: var(--edge-dim); }
.t-task.is-open { border-color: color-mix(in oklab, var(--accent) 40%, var(--edge)); }
.t-task.is-sub { margin-left: 28px; }
.t-task.is-dragging { opacity: .4; }
.t-task.drop-before::before, .t-task.drop-after::after { content: ''; position: absolute; left: 4px; right: 4px; height: 2px; border-radius: 2px; background: var(--accent); }
.t-task.drop-before::before { top: -2px; }
.t-task.drop-after::after { bottom: -2px; }
.t-task__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t-task__title { font-size: 14px; color: var(--fg); overflow-wrap: anywhere; }
.t-task.is-done .t-task__title { color: var(--fg-muted); text-decoration: line-through; }
.t-task__notes { font-size: 12px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-task__meta { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--fg-2); }
.t-task__meta:empty { display: none; }
.t-meta { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.t-meta .t-icon { width: 13px; height: 13px; color: var(--fg-muted); }
.t-meta--overdue .t-icon { color: var(--yc-danger); }
.t-meta--today .t-icon { color: var(--yc-ok); }
.t-meta--tomorrow .t-icon { color: var(--yc-warning); }
.t-meta--week .t-icon { color: var(--accent); }
.t-meta--where { margin-left: auto; color: var(--fg-muted); }
.t-task__actions { display: flex; gap: 2px; opacity: 0; }
.t-task:hover .t-task__actions, .t-task:focus-within .t-task__actions { opacity: 1; }
.t-iconbtn { appearance: none; width: 26px; height: 26px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; border-radius: var(--radius-md, 8px); background: transparent; color: var(--fg-muted); cursor: pointer; padding: 0; }
.t-iconbtn:hover { background: var(--inset); color: var(--fg); border-color: var(--edge-dim); }
.t-iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.t-twisty { margin: -3px -6px -3px -4px; }
.t-twisty .t-icon { transition: transform 150ms ease; }
.t-twisty[aria-expanded="true"] .t-icon { transform: rotate(90deg); }

/* The round tick. Its ring is the priority colour; pointing at it previews the tick. */
.t-check { appearance: none; position: relative; width: 18px; height: 18px; flex: none; margin: 1px 0 0; padding: 0; border-radius: 50%; border: 2px solid var(--pc, var(--t-p4)); background: color-mix(in oklab, var(--pc, var(--t-p4)) 12%, transparent); cursor: pointer; }
.t-check.p1 { --pc: var(--t-p1); } .t-check.p2 { --pc: var(--t-p2); } .t-check.p3 { --pc: var(--t-p3); }
.t-check.p4 { background: transparent; }
.t-check::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--pc, var(--t-p4)); border-width: 0 2px 2px 0; transform: rotate(45deg); opacity: 0; }
.t-check:hover::after { opacity: .7; }
.t-check[aria-pressed="true"] { background: var(--pc, var(--t-p4)); }
.t-check[aria-pressed="true"]::after { opacity: 1; border-color: var(--canvas); }
.t-check.is-static { cursor: default; }
@media (pointer: coarse) { .t-check::before { content: ''; position: absolute; inset: -12px; } }
.t-pick { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

.t-add { appearance: none; display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--radius-md, 8px); background: transparent; color: var(--fg-muted); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.t-add:hover { color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
.t-add .t-icon { width: 18px; height: 18px; }
.t-add:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* The add/edit box: a title line that understands typed shortcuts, then the same choices as buttons. */
.t-editor { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--yc-edge-strong); border-radius: var(--radius-lg, 12px); background: var(--panel); }
.t-editor input.t-plain, .t-plain { appearance: none; width: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; padding: 0; resize: none; }
.t-editor #ed-title { font-size: 15px; font-weight: 500; }
.t-editor #ed-notes { font-size: 12px; color: var(--fg-2); }
.t-plain::placeholder { color: var(--fg-muted); font-weight: 400; }
.t-found { display: flex; flex-wrap: wrap; gap: 6px; }
.t-found:empty { display: none; }
.t-found .yc-chip { cursor: pointer; border-color: color-mix(in oklab, var(--accent) 35%, transparent); background: color-mix(in oklab, var(--accent) 12%, transparent); }
.t-editor__row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.t-editor__row .yc-select { width: auto; max-width: 180px; font-size: 12px; padding: 5px 8px; height: 28px; }
.t-editor__row .yc-button { height: 28px; }
.t-editor__foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.t-editor__hint { margin-right: auto; font-size: 11px; color: var(--fg-muted); }

/* ── the board (a project shown as columns) ─────────────────────────────────────────── */
.t-board { display: flex; align-items: flex-start; gap: 12px; padding: 4px 20px 96px; overflow: auto; flex: 1; min-height: 0; }
.t-col { width: 280px; flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: var(--radius-lg, 12px); background: color-mix(in oklab, var(--inset) 60%, transparent); border: 1px solid var(--edge-dim); }
.t-col.is-drop { outline: 2px dashed var(--accent); outline-offset: 2px; }
.t-col .t-task { background: var(--panel); border-color: var(--edge-dim); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.t-col .t-task.is-sub { display: none; }
.t-col--new { background: transparent; border-style: dashed; }

/* ── right: one task ─────────────────────────────────────────────────────────────────── */
.t-detail { width: var(--t-detail-w); flex: none; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--edge); min-height: 0; }
.t-detail__head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 14px; font-size: 12px; color: var(--fg-muted); }
.t-detail__body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.t-detail__title { display: flex; gap: 10px; align-items: flex-start; }
.t-detail__title textarea { font-size: 16px; font-weight: 600; line-height: 1.35; overflow: hidden; }
.t-detail__title .t-check { margin-top: 3px; }
.t-field { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 6px 8px; font-size: 12px; }
.t-field > label, .t-field > span.t-field__name { color: var(--fg-muted); }
.t-field .yc-select, .t-field .yc-button { font-size: 12px; padding: 5px 8px; min-height: 28px; }
.t-field .yc-button { justify-content: flex-start; width: 100%; }
.t-labels { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.t-labels .yc-chip { cursor: pointer; }
.t-notes { min-height: 64px; font-size: 13px; }
.t-sub { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-radius: var(--radius-md, 8px); cursor: pointer; }
.t-sub:hover { background: var(--inset); }
.t-sub.is-done span { color: var(--fg-muted); text-decoration: line-through; }
.t-comment { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.t-comment__meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--fg-muted); }
.t-detail__foot { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 11px; color: var(--fg-muted); }

/* ── things that float: menus, the date picker, pop-ups, the undo line ───────────────── */
.t-pop { position: fixed; z-index: 50; min-width: 200px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius-lg, 12px); box-shadow: 0 8px 32px rgba(0, 0, 0, .15); padding: 4px; font-size: 13px; }
.t-pop__item { appearance: none; display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border: 0; border-radius: var(--radius-md, 8px); background: transparent; color: var(--fg-2); font: inherit; text-align: left; cursor: pointer; white-space: nowrap; }
.t-pop__item:hover, .t-pop__item:focus-visible { background: var(--inset); outline: 0; color: var(--fg); }
.t-pop__item.is-danger { color: var(--destructive-fg, var(--fg)); }
.t-pop__item .t-pop__hint { margin-left: auto; padding-left: 16px; font-size: 11px; color: var(--fg-muted); }
.t-pop__item .t-tick { margin-left: auto; color: var(--accent); }
.t-pop hr { margin: 4px 0; }
.t-pop__title { padding: 6px 10px 2px; font-size: 11px; font-weight: 500; color: var(--fg-muted); }
.t-pop__pad { padding: 6px; display: flex; flex-direction: column; gap: 8px; }
.t-flags { display: flex; gap: 4px; padding: 2px 6px 6px; }
.t-flags .t-iconbtn { width: 32px; height: 28px; border-color: var(--edge-dim); }
.t-flags .t-iconbtn[aria-pressed="true"] { background: var(--inset); border-color: var(--yc-edge-strong); }
.t-flag-1 { color: var(--t-p1); } .t-flag-2 { color: var(--t-p2); } .t-flag-3 { color: var(--t-p3); } .t-flag-4 { color: var(--t-p4); }

.t-date { width: 280px; }
.t-cal__head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; font-size: 12px; font-weight: 500; }
.t-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 2px; }
.t-cal span { font-size: 10px; color: var(--fg-muted); text-align: center; padding: 2px 0; }
.t-day { appearance: none; aspect-ratio: 1; border: 1px solid transparent; border-radius: var(--radius-md, 8px); background: transparent; color: var(--fg-2); font: inherit; font-size: 12px; cursor: pointer; padding: 0; position: relative; }
.t-day:hover { background: var(--inset); }
.t-day.is-out { color: var(--fg-faint); }
.t-day.is-past { color: var(--fg-muted); }
.t-day.is-today { border-color: var(--yc-edge-strong); font-weight: 600; color: var(--fg); }
.t-day.is-picked { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.t-day.has-tasks::after { content: ''; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; opacity: .6; }
.t-date__row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); }
.t-date__row .yc-select, .t-date__row .yc-input { font-size: 12px; padding: 5px 8px; }
.t-date__custom { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
.t-date__custom .yc-row .yc-input { width: 64px; }
.t-weekdays { display: flex; gap: 3px; }
.t-weekdays .yc-filter { flex: 1; height: 26px; padding: 0; font-size: 11px; }

.t-modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; background: rgb(0 0 0 / .4); overflow-y: auto; }
.t-modal__box { width: min(480px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.t-modal__box--wide { width: min(600px, 100%); }
.t-modal__box h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.t-modal__foot { display: flex; justify-content: flex-end; gap: 8px; }
.t-setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
.t-setting .yc-select, .t-setting .yc-input { width: 150px; font-size: 13px; }
.t-setting small { display: block; font-size: 11px; color: var(--fg-muted); }
.t-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.t-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.t-bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: 11px; color: var(--fg-muted); }
.t-bar i { display: block; width: 100%; max-width: 36px; min-height: 2px; border-radius: 4px 4px 0 0; background: color-mix(in oklab, var(--accent) 45%, transparent); }
.t-bar.is-met i { background: var(--accent); }
.t-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.t-stat { text-align: center; }
.t-stat b { display: block; font-size: 22px; font-weight: 600; color: var(--fg); }
.t-keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px; color: var(--fg-2); margin: 0 12px 8px; }

.t-toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px); padding: 8px 8px 8px 14px; background: var(--panel); border: 1px solid var(--yc-edge-strong); border-radius: var(--radius-lg, 12px); box-shadow: 0 8px 32px rgba(0, 0, 0, .2); font-size: 13px; }
.t-bulk { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 6px; max-width: calc(100vw - 16px); overflow-x: auto; padding: 8px 10px; background: var(--panel); border: 1px solid var(--yc-edge-strong); border-radius: var(--radius-lg, 12px); box-shadow: 0 8px 32px rgba(0, 0, 0, .2); font-size: 12px; white-space: nowrap; }
.t-alerts { position: fixed; right: 12px; top: 12px; z-index: 55; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 24px)); }
.t-alerts .yc-notice { background: var(--panel); box-shadow: 0 8px 32px rgba(0, 0, 0, .2); }
.t-fab { display: none; }

/* ── narrower panes: the task opens over the list ────────────────────────────────────── */
@media (max-width: 1040px) {
  .t-detail { position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; width: min(var(--t-detail-w), 100%); box-shadow: -8px 0 32px rgb(0 0 0 / .18); }
}
/* ── a phone: the left list becomes a drawer, the task a full screen ─────────────────── */
@media (max-width: 639.98px) {
  .t-nav { position: absolute; left: 0; top: 0; bottom: 0; z-index: 25; width: min(300px, 86vw); transform: translateX(-100%); transition: transform 180ms ease; box-shadow: 8px 0 32px rgb(0 0 0 / .2); }
  .t-app.is-nav-open .t-nav { transform: none; }
  .t-app.is-nav-open .t-scrim { display: block; position: absolute; inset: 0; z-index: 24; background: rgb(0 0 0 / .4); }
  .t-iconbtn.t-menu-btn { display: inline-flex; }
  .t-head { padding: 10px 12px 6px; }
  .t-list { padding: 4px 8px 96px; }
  .t-board { padding: 4px 12px 96px; }
  .t-col { width: 82vw; }
  .t-detail { width: 100%; border-left: 0; }
  .t-task__actions { display: none; }
  .t-task.is-sub { margin-left: 20px; }
  .t-fab { display: inline-flex; position: fixed; right: 16px; bottom: 16px; z-index: 15; width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
  .t-fab .t-icon { width: 22px; height: 22px; }
  .t-pop { left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; max-height: 80vh; }
  .t-date { width: auto; }
  .t-modal { padding: 16px 8px; align-items: flex-end; }
  .t-head__tools .yc-select { max-width: 120px; }
}
@media (prefers-reduced-motion: reduce) { .t-nav, .t-icon { transition: none !important; } }
  </style>
</head>
<body>
  <div class="yc-app t-app" id="app">
    <div class="yc-app__body">
      <nav class="t-nav" id="nav" aria-label="Lists"></nav>
      <div class="t-scrim" data-act="nav-close"></div>
      <main class="t-main" id="main"></main>
      <aside class="t-detail" id="detail" aria-label="Task details" hidden></aside>
    </div>
  </div>
  <div id="bulk"></div>
  <div id="modal"></div>
  <div id="pop"></div>
  <div id="toast"></div>
  <div class="t-alerts" id="alerts"></div>
  <script>
// Tasks page — the rules, with no screen in them (dates, typed shortcuts, repeats, saved shape).
// WHY separate from ui.js: everything here runs in plain Node, so tests/core.test.mjs can prove
// "every 2 weeks" or "tomorrow 5pm p1" without opening a browser. build.mjs pastes both files
// into page.html, because a page must be one document with no outside files.
var TasksCore = (function () {
  'use strict';

  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // Content colours (a project's or label's own dot). Hard-coded on purpose: they identify a
  // thing, like a chart series, and must stay the same in every theme.
  var COLORS = {
    grey: '#8a8f98', red: '#e5484d', orange: '#f2762e', yellow: '#e2a400', green: '#3fa34d',
    teal: '#12a594', blue: '#3b82f6', indigo: '#6366f1', purple: '#9b59d0', pink: '#e0569b'
  };

  // ── dates: a day is always the text 'YYYY-MM-DD' in the person's own time zone ──────────────
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function isYmd(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(fromYmd(s)); }
  function isTime(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  function addDays(s, n) { var d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  // WHY anchorDay: a task due on the 31st that repeats monthly lands on Feb 28, and without the
  // remembered 31 it would stay on the 28th for ever after.
  function addMonths(s, n, anchorDay) {
    var d = fromYmd(s), day = anchorDay || d.getDate();
    var y = d.getFullYear(), m = d.getMonth() + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return ymd(new Date(y, m, Math.min(day, daysInMonth(y, m))));
  }
  function diffDays(a, b) { return Math.round((fromYmd(a) - fromYmd(b)) / 86400000); }
  function dow(s) { return fromYmd(s).getDay(); }
  function startOfWeek(s, weekStart) { return addDays(s, -((dow(s) - (weekStart || 0) + 7) % 7)); }

  var seq = 0;
  function uid() { seq += 1; return Date.now().toString(36) + seq.toString(36) + Math.random().toString(36).slice(2, 6); }

  // ── repeats ─────────────────────────────────────────────────────────────────────────────
  // { every: 2, unit: 'day'|'week'|'month'|'year', days?: [0..6] (week only), after?: true
  //   (count from the day it was done, not the day it was due), anchor?: day of month }
  function stepRepeat(base, r) {
    var n = Math.max(1, r.every || 1);
    if (r.unit === 'day') return addDays(base, n);
    if (r.unit === 'week') {
      if (!r.days || !r.days.length) return addDays(base, 7 * n);
      var week0 = startOfWeek(base, 0);
      for (var i = 1; i <= 7 * n + 7; i++) {
        var c = addDays(base, i);
        var weeks = Math.round(diffDays(startOfWeek(c, 0), week0) / 7);
        if (r.days.indexOf(dow(c)) >= 0 && weeks % n === 0) return c;
      }
      return addDays(base, 7 * n);
    }
    if (r.unit === 'month') return addMonths(base, n, r.anchor);
    if (r.unit === 'year') return addMonths(base, 12 * n, r.anchor);
    return addDays(base, n);
  }
  // The next due day after finishing a repeating task on `doneDay`.
  // WHY the loop: a daily task left three days overdue should come back tomorrow, not three
  // days ago; one finished early should still skip to the occurrence after its own due day.
  function nextDue(dueDay, r, doneDay) {
    if (r.after) return stepRepeat(doneDay, r);
    var next = stepRepeat(dueDay, r), guard = 0;
    while (next <= doneDay && guard++ < 5000) next = stepRepeat(next, r);
    return next;
  }
  function ordinal(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function describeRepeat(r) {
    if (!r) return '';
    var n = Math.max(1, r.every || 1), out;
    if (r.unit === 'week' && r.days && r.days.length) {
      var d = r.days.slice().sort();
      if (n === 1 && d.join() === '1,2,3,4,5') out = 'Every weekday';
      else out = (n === 1 ? 'Every ' : 'Every ' + n + ' weeks on ') + d.map(function (x) { return DAY_SHORT[x]; }).join(', ');
    } else {
      out = n === 1 ? 'Every ' + r.unit : 'Every ' + n + ' ' + r.unit + 's';
      if (r.unit === 'month' && r.anchor) out += ' on the ' + ordinal(r.anchor);
    }
    if (r.after) out += ', after it is done';
    return out;
  }

  // ── how a due day reads ────────────────────────────────────────────────────────────────
  function formatTime(t, h12) {
    if (!t) return '';
    var h = +t.slice(0, 2), m = t.slice(3);
    if (!h12) return pad(h) + ':' + m;
    return ((h % 12) || 12) + (m === '00' ? '' : ':' + m) + (h < 12 ? ' AM' : ' PM');
  }
  function formatDay(day, today, long) {
    var diff = diffDays(day, today), d = fromYmd(day);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    if (diff > 1 && diff < 7) return long ? DAY_NAMES[d.getDay()] : DAY_SHORT[d.getDay()];
    var out = MONTH_SHORT[d.getMonth()] + ' ' + d.getDate();
    if (d.getFullYear() !== fromYmd(today).getFullYear()) out += ', ' + d.getFullYear();
    return out;
  }
  // now: { day: 'YYYY-MM-DD', time: 'HH:MM' }
  function dueInfo(due, now, h12) {
    if (!due || !due.date) return null;
    var diff = diffDays(due.date, now.day);
    var late = diff < 0 || (diff === 0 && due.time && now.time && due.time < now.time);
    var tone = late ? 'overdue' : diff === 0 ? 'today' : diff === 1 ? 'tomorrow' : diff < 7 ? 'week' : 'later';
    return { text: formatDay(due.date, now.day) + (due.time ? ' ' + formatTime(due.time, h12) : ''), tone: tone, diff: diff };
  }
  function isOverdue(t, now) { var i = dueInfo(t.due, now); return !!i && i.tone === 'overdue'; }

  // ── typed shortcuts: "Pay rent tomorrow 5pm p1 #Home @bills every month" ────────────────────
  var MONTH_RE = 'jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?';
  var DAY_RE = 'mon(?:day)?|tue(?:s(?:day)?)?|wed(?:nesday)?|thu(?:r(?:s(?:day)?)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?';
  function monthIndex(w) { return MONTH_SHORT.map(function (m) { return m.toLowerCase(); }).indexOf(w.slice(0, 3).toLowerCase()); }
  function dayIndex(w) { return DAY_SHORT.map(function (m) { return m.toLowerCase(); }).indexOf(w.slice(0, 3).toLowerCase()); }
  function nextWeekday(today, idx, allowToday) {
    var d = (idx - dow(today) + 7) % 7;
    if (d === 0 && !allowToday) d = 7;
    return addDays(today, d);
  }

  // ctx: { today, projects: [{id,name}], ignore: ['words the person un-picked'] }
  // Returns { title, due, repeat, priority, projectId, labels, found: [{start,end,kind,text}] }.
  function parseQuickAdd(text, ctx) {
    var today = ctx.today, found = [], src = String(text || '');
    var ignore = (ctx.ignore || []).map(function (s) { return s.toLowerCase(); });
    var out = { title: '', due: null, repeat: null, priority: 4, projectId: undefined, labels: [] };
    var date = null, time = null;

    function free(start, end) {
      for (var i = 0; i < found.length; i++) if (start < found[i].end && end > found[i].start) return false;
      return true;
    }
    // Runs one pattern over the text; `use` returns false to leave a match as plain words.
    function scan(kind, re, use, many) {
      var m, r = new RegExp(re, 'gi');
      while ((m = r.exec(src))) {
        if (m[0] === '') { r.lastIndex++; continue; }
        // A pattern may start with (^|\s): keep that space out of the highlighted span.
        var lead = m[0].length - m[0].replace(/^\s+/, '').length;
        var start = m.index + lead, end = m.index + m[0].length, word = src.slice(start, end);
        if (!free(start, end) || ignore.indexOf(word.toLowerCase()) >= 0) continue;
        if (use(m) === false) continue;
        found.push({ start: start, end: end, kind: kind, text: word });
        if (!many) return;
      }
    }

    // 1. repeats (before dates: "every monday" must not also read as "monday")
    scan('repeat', '\\bevery(!)?\\s+(other\\s+)?(?:(\\d{1,3})\\s+)?(days?|weekdays?|weeks?|months?|years?|(?:(?:' + DAY_RE + ')(?:\\s*(?:,|and|&)\\s*|\\s+)?)+)(?![a-z])', function (m) {
      var n = m[3] ? +m[3] : m[2] ? 2 : 1, w = m[4].toLowerCase().trim(), r;
      if (n < 1) return false;
      if (/^day/.test(w)) r = { every: n, unit: 'day' };
      else if (/^weekday/.test(w)) r = { every: 1, unit: 'week', days: [1, 2, 3, 4, 5] };
      else if (/^week/.test(w)) r = { every: n, unit: 'week' };
      else if (/^month/.test(w)) r = { every: n, unit: 'month' };
      else if (/^year/.test(w)) r = { every: n, unit: 'year' };
      else {
        var days = [];
        w.split(/\s*(?:,|and|&|\s)\s*/).forEach(function (x) { var i = x ? dayIndex(x) : -1; if (i >= 0 && days.indexOf(i) < 0) days.push(i); });
        if (!days.length) return false;
        r = { every: n, unit: 'week', days: days.sort() };
      }
      if (m[1]) r.after = true;
      out.repeat = r;
    });
    if (!out.repeat) scan('repeat', '\\b(daily|weekly|monthly|yearly|annually)\\b', function (m) {
      var w = m[1].toLowerCase();
      out.repeat = { every: 1, unit: w === 'daily' ? 'day' : w === 'weekly' ? 'week' : w === 'monthly' ? 'month' : 'year' };
    });

    // 2. the day
    function setDate(d) { if (date) return false; date = d; }
    scan('date', '\\b(today|tod|tonight|tomorrow|tmrw|tmr|tom)\\b', function (m) {
      var w = m[1].toLowerCase();
      if (date) return false;
      date = /^to(d|day|night)$/.test(w) ? today : addDays(today, 1);
      if (w === 'tonight' && !time) time = '20:00';
    });
    scan('date', '\\bnext\\s+(week|month|weekend)\\b', function (m) {
      var w = m[1].toLowerCase();
      if (w === 'week') return setDate(addDays(startOfWeek(today, 1), 7));
      if (w === 'weekend') return setDate(addDays(nextWeekday(today, 6, true), 7));
      var d = fromYmd(today); return setDate(ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1)));
    });
    scan('date', '\\b(?:this\\s+)?weekend\\b', function () { return setDate(nextWeekday(today, 6, true)); });
    scan('date', '\\bin\\s+(\\d{1,3})\\s+(days?|weeks?|months?)\\b', function (m) {
      var n = +m[1], u = m[2].toLowerCase();
      return setDate(/^day/.test(u) ? addDays(today, n) : /^week/.test(u) ? addDays(today, 7 * n) : addMonths(today, n));
    });
    function monthDay(mi, day, year) {
      if (mi < 0 || day < 1 || day > 31) return false;
      var y = year || fromYmd(today).getFullYear();
      if (day > daysInMonth(y, mi)) return false;
      var d = ymd(new Date(y, mi, day));
      // No year typed and the day has passed: the person means next year.
      if (!year && d < today) d = ymd(new Date(y + 1, mi, day));
      return setDate(d);
    }
    scan('date', '\\b(' + MONTH_RE + ')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?\\b', function (m) { return monthDay(monthIndex(m[1]), +m[2], m[3] ? +m[3] : 0); });
    scan('date', '\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?(' + MONTH_RE + ')(?:,?\\s+(\\d{4}))?\\b', function (m) { return monthDay(monthIndex(m[2]), +m[1], m[3] ? +m[3] : 0); });
    scan('date', '(?:^|\\s)(\\d{1,2})/(\\d{1,2})(?:/(\\d{2}|\\d{4}))?(?=\\s|$)', function (m) {
      var y = m[3] ? +m[3] : 0; if (y && y < 100) y += 2000;
      return monthDay(+m[1] - 1, +m[2], y);
    });
    scan('date', '\\b(?:(?:next|this|on)\\s+)?(' + DAY_RE + ')\\b', function (m) { return setDate(nextWeekday(today, dayIndex(m[1]), false)); });

    // 3. the time
    scan('time', '(?:\\bat\\s+|@\\s?)?\\b(\\d{1,2})(?::([0-5]\\d))?\\s?(am|pm|a\\.m\\.|p\\.m\\.)(?![a-z])', function (m) {
      var h = +m[1]; if (h < 1 || h > 12 || time) return false;
      var pm = /^p/i.test(m[3]); h = (h % 12) + (pm ? 12 : 0);
      time = pad(h) + ':' + (m[2] || '00');
    });
    scan('time', '(?:\\bat\\s+)?\\b([01]?\\d|2[0-3]):([0-5]\\d)\\b', function (m) { if (time) return false; time = pad(+m[1]) + ':' + m[2]; });
    scan('time', '\\b(?:at\\s+)?(noon|midnight)\\b', function (m) { if (time) return false; time = m[1].toLowerCase() === 'noon' ? '12:00' : '00:00'; });

    // 4. priority, project, labels
    scan('priority', '(?:^|\\s)p([1-4])(?=\\s|$)', function (m) { out.priority = +m[1]; });
    var projects = (ctx.projects || []).slice().sort(function (a, b) { return b.name.length - a.name.length; });
    (function () {
      var r = /(^|\s)#/g, m;
      while ((m = r.exec(src))) {
        var at = m.index + m[1].length, rest = src.slice(at + 1).toLowerCase();
        for (var i = 0; i < projects.length; i++) {
          var name = projects[i].name.toLowerCase(), tail = rest.charAt(name.length);
          var compact = name.replace(/\s+/g, ''), tail2 = rest.charAt(compact.length);
          var len = rest.indexOf(name) === 0 && (tail === '' || /\s/.test(tail)) ? name.length
            : rest.indexOf(compact) === 0 && (tail2 === '' || /\s/.test(tail2)) ? compact.length : 0;
          var word = src.slice(at, at + 1 + len);
          if (len && free(at, at + 1 + len) && ignore.indexOf(word.toLowerCase()) < 0) {

            found.push({ start: at, end: at + 1 + len, kind: 'project', text: word });
            return;
          }
        }
        if (rest.indexOf('inbox') === 0 && free(at, at + 6)) { out.projectId = null; found.push({ start: at, end: at + 6, kind: 'project', text: src.slice(at, at + 6) }); return; }
      }
    })();
    scan('label', '(?:^|\\s)@([A-Za-z][\\w-]{0,30})(?=\\s|$)', function (m) {
      var name = m[1]; if (out.labels.map(function (l) { return l.toLowerCase(); }).indexOf(name.toLowerCase()) < 0) out.labels.push(name);
    }, true);

    // A repeat or a time with no day typed still needs a day to start from.
    if (!date && out.repeat) {
      date = out.repeat.unit === 'week' && out.repeat.days ? nextWeekday(addDays(today, -1), out.repeat.days.filter(function (d) { return d >= dow(today); })[0] !== undefined ? out.repeat.days.filter(function (d) { return d >= dow(today); })[0] : out.repeat.days[0], false) : today;
    }
    if (!date && time) date = today;
    if (date) out.due = { date: date, time: time || null };
    if (out.repeat && out.repeat.unit === 'month' && date) out.repeat.anchor = fromYmd(date).getDate();
    if (out.repeat && out.repeat.unit === 'year' && date) out.repeat.anchor = fromYmd(date).getDate();

    found.sort(function (a, b) { return a.start - b.start; });
    var title = '', pos = 0;
    found.forEach(function (f) { title += src.slice(pos, f.start); pos = f.end; });
    out.title = (title + src.slice(pos)).replace(/\s+/g, ' ').trim();
    out.found = found;
    return out;
  }

  // ── the saved shape ─────────────────────────────────────────────────────────────────────
  function emptyState() {
    return {
      v: 1, tasks: [], projects: [], labels: [], filters: [], log: [],
      settings: { weekStart: 0, h12: true, dailyGoal: 5, startView: 'today', views: {}, navOpen: {} },
      stats: { days: {} }
    };
  }
  function str(v, max) { return typeof v === 'string' ? v.slice(0, max || 2000) : ''; }
  function cleanRepeat(r) {
    if (!r || typeof r !== 'object' || ['day', 'week', 'month', 'year'].indexOf(r.unit) < 0) return null;
    var o = { every: Math.max(1, Math.min(999, Math.round(+r.every) || 1)), unit: r.unit };
    if (r.unit === 'week' && Array.isArray(r.days)) {
      var d = r.days.filter(function (x) { return x === (x | 0) && x >= 0 && x <= 6; });
      if (d.length) o.days = d.sort();
    }
    if (r.after) o.after = true;
    if (+r.anchor >= 1 && +r.anchor <= 31) o.anchor = Math.round(+r.anchor);
    return o;
  }
  function cleanDue(d) {
    if (typeof d === 'string') d = { date: d };
    if (!d || !isYmd(d.date)) return null;
    return { date: d.date, time: isTime(d.time) ? d.time : null };
  }
  // WHY so forgiving: the app's assistant can write this page's saved data directly (and so can
  // an older copy on another device). Whatever arrives — a task with only a title, an unknown
  // project, a missing list — becomes a valid state instead of a broken page.
  function normalize(raw) {
    var s = emptyState();
    if (!raw || typeof raw !== 'object') return s;
    var ids = {};
    function freshId(v) { var id = typeof v === 'string' && v && !ids[v] ? v : uid(); ids[id] = 1; return id; }
    var set = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
    s.settings.weekStart = set.weekStart === 1 ? 1 : 0;
    s.settings.h12 = set.h12 !== false;
    s.settings.dailyGoal = Math.max(1, Math.min(99, Math.round(+set.dailyGoal) || 5));
    s.settings.startView = ['inbox', 'today', 'upcoming'].indexOf(set.startView) >= 0 ? set.startView : 'today';
    s.settings.views = set.views && typeof set.views === 'object' ? set.views : {};
    s.settings.navOpen = set.navOpen && typeof set.navOpen === 'object' ? set.navOpen : {};

    var projectIds = {}, sectionIds = {};
    (Array.isArray(raw.projects) ? raw.projects : []).forEach(function (p, i) {
      if (!p || typeof p !== 'object' || !str(p.name).trim()) return;
      var proj = {
        id: freshId(p.id), name: str(p.name, 120).trim(), color: COLORS[p.color] ? p.color : 'grey',
        favorite: !!p.favorite, archived: !!p.archived, layout: p.layout === 'board' ? 'board' : 'list',
        order: isFinite(p.order) ? +p.order : i, sections: []
      };
      (Array.isArray(p.sections) ? p.sections : []).forEach(function (sec, j) {
        if (!sec || !str(sec.name).trim()) return;
        var so = { id: freshId(sec.id), name: str(sec.name, 120).trim(), order: isFinite(sec.order) ? +sec.order : j, collapsed: !!sec.collapsed };
        sectionIds[so.id] = proj.id; proj.sections.push(so);
      });
      projectIds[proj.id] = proj; s.projects.push(proj);
    });

    var labelSeen = {};
    function addLabel(name, color) {
      name = str(name, 40).trim().replace(/^@/, '').replace(/\s+/g, '-');
      if (!name) return null;
      var key = name.toLowerCase();
      if (!labelSeen[key]) { labelSeen[key] = { name: name, color: COLORS[color] ? color : 'grey' }; s.labels.push(labelSeen[key]); }
      return labelSeen[key].name;
    }
    (Array.isArray(raw.labels) ? raw.labels : []).forEach(function (l) { if (l) addLabel(typeof l === 'string' ? l : l.name, l.color); });

    var taskIds = {};
    (Array.isArray(raw.tasks) ? raw.tasks : []).forEach(function (t, i) {
      if (!t || typeof t !== 'object' || !str(t.title).trim()) return;
      var task = {
        id: freshId(t.id), title: str(t.title, 500).trim(), notes: str(t.notes, 20000),
        projectId: projectIds[t.projectId] ? t.projectId : null, sectionId: null,
        parentId: typeof t.parentId === 'string' ? t.parentId : null,
        order: isFinite(t.order) ? +t.order : i,
        priority: [1, 2, 3, 4].indexOf(+t.priority) >= 0 ? +t.priority : 4,
        labels: [], due: cleanDue(t.due), repeat: cleanRepeat(t.repeat),
        remind: isFinite(t.remind) && t.remind !== null && +t.remind >= 0 ? Math.round(+t.remind) : null,
        done: !!t.done, doneAt: typeof t.doneAt === 'string' ? t.doneAt : null,
        createdAt: typeof t.createdAt === 'string' ? t.createdAt : new Date().toISOString(),
        comments: []
      };
      if (sectionIds[t.sectionId] && sectionIds[t.sectionId] === task.projectId) task.sectionId = t.sectionId;
      (Array.isArray(t.labels) ? t.labels : []).forEach(function (l) { var n = addLabel(l); if (n && task.labels.indexOf(n) < 0) task.labels.push(n); });
      (Array.isArray(t.comments) ? t.comments : []).forEach(function (c) {
        if (c && str(c.text).trim()) task.comments.push({ id: freshId(c.id), text: str(c.text, 5000), at: typeof c.at === 'string' ? c.at : new Date().toISOString() });
      });
      if (!task.due) { task.repeat = null; task.remind = null; }
      if (task.done && !task.doneAt) task.doneAt = new Date().toISOString();
      taskIds[task.id] = task; s.tasks.push(task);
    });
    // One level of sub-tasks: a sub-task whose parent is missing, or is itself a sub-task,
    // becomes an ordinary task; a sub-task always lives where its parent lives.
    s.tasks.forEach(function (t) {
      var p = t.parentId ? taskIds[t.parentId] : null;
      if (!p || p === t || p.parentId) { t.parentId = null; return; }
      t.projectId = p.projectId; t.sectionId = p.sectionId;
    });

// ── drawing: the right column (one task) ────────────────────────────────────────────────

  liveProjects().forEach(function (p) {

    sections(p).forEach(function (s) { var v = p.id + '|' + s.id; h += '<option value="' + v + '"' + (sel === v ? ' selected' : '') + '>' + esc(p.name + ' › ' + s.name) + '</option>'; });

}

}

}
function stamp(iso) {

function renderDetail() {

  if (!parent) h += '<label for="d-project">Project</label><select class="yc-select" id="d-project" data-change="d-project">' + destOptions((t.projectId || '') + '|' + (t.sectionId || '')) + '</select>';

function growTitle() { var ta = $('d-title'); if (ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; } }
function remindText(m) { return m === 0 ? 'At the time it is due' : m < 60 ? m + ' minutes before' : m === 60 ? '1 hour before' : m === 1440 ? '1 day before' : Math.round(m / 60) + ' hours before'; }

// Redraws everything, keeping the cursor (and any half-typed words) in a box marked data-keep.
function render() {
  clearTimeout(renderTimer);
  var a = document.activeElement, keep = a && a.id && a.hasAttribute && a.hasAttribute('data-keep') ? { id: a.id, value: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  if (ui.editor && $('ed-title')) { ui.editor.text = $('ed-title').value; ui.editor.notes = $('ed-notes').value; }
  var edFocus = a && (a.id === 'ed-title' || a.id === 'ed-notes') ? a.id : null;
  renderNav(); renderMain(); renderDetail();
  if (ui.modal && ui.modal.editor) renderModal();
  if (keep && $(keep.id)) { var el = $(keep.id); el.value = keep.value; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} if (keep.id === 'd-title') growTitle(); }
  if (edFocus && $(edFocus)) { $(edFocus).focus(); var len = $(edFocus).value.length; try { $(edFocus).setSelectionRange(len, len); } catch (e) {} }
}

// Tasks page — screens, part B: the add-task box, and everything that floats over the page
// (menus, the date picker, the label picker, pop-ups, the undo line, reminders).
// WHY the page draws its own pop-ups: a page's frame cannot show the browser's own
// confirm/prompt boxes, so "Delete this project?" has to be a box the page draws.

// ── the add-task box ────────────────────────────────────────────────────────────────────
function openEditor(slot, d) {
  d = d || {};
  ui.editor = {
    slot: slot, text: '', notes: '', due: d.due || null, repeat: null, remind: null, priority: d.priority || 4,
    projectId: d.projectId || null, sectionId: d.sectionId || null, parentId: d.parentId || null,
    labels: (d.labels || []).slice(), ignore: []

}
// What the box would add right now: typed shortcuts first, then the buttons' choices.
function editorValue() {
  var e = ui.editor, p = C.parseQuickAdd(e.text, { today: now().day, projects: liveProjects(), ignore: e.ignore });
  var due = p.due || e.due, labels = e.labels.slice();
  p.labels.forEach(function (l) { if (labels.map(function (x) { return x.toLowerCase(); }).indexOf(l.toLowerCase()) < 0) labels.push(l); });
  var typedProject = p.projectId !== undefined && !e.parentId;
  return {
    title: p.title, notes: e.notes, due: due, repeat: due ? p.repeat || e.repeat : null,
    remind: due && due.time ? (e.remind != null ? e.remind : 0) : null,
    priority: p.priority !== 4 ? p.priority : e.priority,

    parentId: e.parentId, labels: labels, found: p.found

}
function editorHtml() {
  var e = ui.editor, modal = e.slot === 'modal';
  return '<div class="t-editor" id="editor"' + (modal ? ' style="border:0;padding:0;background:none"' : '') + '>' +
    '<input class="t-plain" id="ed-title" autocomplete="off" placeholder="' + (e.parentId ? 'Sub-task name' : 'Task name') + '" aria-label="Task name" value="' + esc(e.text) + '">' +
    '<input class="t-plain" id="ed-notes" autocomplete="off" placeholder="Notes" aria-label="Notes" value="' + esc(e.notes) + '">' +
    '<div class="t-found" id="ed-found">' + editorFound() + '</div>' +
    '<div class="t-editor__row" id="ed-controls">' + editorControls() + '</div>' +
    '<div class="t-editor__foot"><span class="t-editor__hint">Try typing “tomorrow 5pm p1 @errands every week”</span>' +
    '<button class="yc-button yc-button--ghost" data-act="ed-cancel">Cancel</button>' +
    '<button class="yc-button' + (modal ? ' yc-button--primary' : '') + '" data-act="ed-submit">Add task</button></div></div>';
}
function editorFound() {
  var names = { date: 'calendar', time: 'calendar', repeat: 'repeat', priority: 'flag', project: 'move', label: 'tag' };
  return editorValue().found.map(function (f) {
    return '<button class="yc-chip" data-act="ed-ignore" data-text="' + esc(f.text) + '" title="Understood as a ' + f.kind + '. Click to keep these words in the name instead.">' + icon(names[f.kind]) + esc(f.text) + ' ' + icon('x') + '</button>';
  }).join('');
}
function editorControls() {
  var v = editorValue(), e = ui.editor, info = C.dueInfo(v.due, now(), state.settings.h12);

    '<select class="yc-select" data-change="ed-priority" aria-label="Priority">' + priorityOptions(v.priority) + '</select>';
  if (!e.parentId) h += '<select class="yc-select" data-change="ed-project" aria-label="Project">' + destOptions((v.projectId || '') + '|' + (v.sectionId || '')) + '</select>';
  h += '<button class="yc-button yc-button--ghost yc-button--sm" data-act="ed-labels">' + icon('tag') + (v.labels.length ? esc(v.labels.join(', ')) : 'Labels') + '</button>';

}

  $('ed-controls').innerHTML = editorControls();
}
// A button's choice beats a typed shortcut of the same kind: the typed words go back to being
// part of the name, so the two never disagree.
function editorOverride(kinds) {
  editorValue().found.forEach(function (f) { if (kinds.indexOf(f.kind) >= 0 && ui.editor.ignore.indexOf(f.text) < 0) ui.editor.ignore.push(f.text); });
}
function closeEditor() {
  var wasModal = ui.editor && ui.editor.slot === 'modal';
  ui.editor = null;
  if (wasModal) closeModal(); else render();
}
function submitEditor() {
  if (!ui.editor) return;
  if ($('ed-title')) { ui.editor.text = $('ed-title').value; ui.editor.notes = $('ed-notes').value; }
  var v = editorValue(), e = ui.editor;
  if (!v.title) { if ($('ed-title')) $('ed-title').focus(); return; }
  var made;
  commit(function () { made = C.addTask(state, v, now().iso); });
  if (e.slot === 'modal') { ui.editor = null; closeModal(); toast('Added to ' + whereText(made)); return; }
  // The box stays open, cleared, for the next task: adding five things in a row is the common case.
  e.text = ''; e.notes = ''; e.ignore = [];
  render();
  if ($('ed-title')) { $('ed-title').value = ''; $('ed-title').focus(); refreshEditor(); }
}

// ── floating menus ──────────────────────────────────────────────────────────────────────
function openPop(anchor, pop) {
  var r = anchor.getBoundingClientRect();
  pop.rect = { l: r.left, t: r.top, b: r.bottom };
  ui.pop = pop; renderPop();
}
function swapPop(pop) { pop.rect = ui.pop.rect; ui.pop = pop; renderPop(); }
function closePop() { ui.pop = null; $('pop').innerHTML = ''; }
function renderPop() {
  var p = ui.pop;
  if (!p) return closePop();
  var a = document.activeElement, focusId = a && a.id && $('pop').contains(a) ? a.id : null;
  var html = p.type === 'menu' ? menuHtml(p) : p.type === 'date' ? dateHtml(p) : labelsHtml(p);
  $('pop').innerHTML = '<div class="t-pop' + (p.type === 'date' ? ' t-date' : '') + '" id="pop-box" role="dialog" aria-label="' + esc(p.title || 'Menu') + '">' + html + '</div>';
  var box = $('pop-box'), w = box.offsetWidth, h = box.offsetHeight;
  var left = Math.max(8, Math.min(p.rect.l, window.innerWidth - w - 8));
  var top = p.rect.b + 4;
  if (top + h > window.innerHeight - 8) top = Math.max(8, p.rect.t - h - 4 > 8 ? p.rect.t - h - 4 : window.innerHeight - h - 8);
  box.style.left = left + 'px'; box.style.top = top + 'px';
  if (focusId && $(focusId)) $(focusId).focus();
}
// items: { label, icon, color, hint, checked, danger, fn } | { sep: true } | { title } | { flags: current, fn(p) }
function menuHtml(p) {
  return p.items.map(function (it, i) {
    if (it.sep) return '<hr class="yc-divider">';
    if (it.title) return '<div class="t-pop__title">' + esc(it.title) + '</div>';
    if (it.flags) return '<div class="t-flags" role="group" aria-label="Priority">' + [1, 2, 3, 4].map(function (n) {
      return '<button class="t-iconbtn t-flag-' + n + '" data-act="pop-flag" data-i="' + i + '" data-p="' + n + '" aria-pressed="' + (it.flags === n) + '" aria-label="' + (n === 4 ? 'No priority' : 'Priority ' + n) + '" title="' + (n === 4 ? 'No priority' : 'Priority ' + n) + '">' + icon('flag') + '</button>';
    }).join('') + '</div>';
    return '<button class="t-pop__item' + (it.danger ? ' is-danger' : '') + '" data-act="pop-item" data-i="' + i + '">' +
      (it.color ? dot(it.color) : it.icon ? icon(it.icon) : '') + '<span>' + esc(it.label) + '</span>' +
      (it.hint ? '<span class="t-pop__hint">' + esc(it.hint) + '</span>' : '') + (it.checked ? icon('tick', 't-tick') : '') + '</button>';
  }).join('');
}
function destItems(fn) {
  var items = [{ label: 'Inbox', icon: 'inbox', fn: function () { fn(null, null); } }];
  liveProjects().forEach(function (p) {
    items.push({ label: p.name, color: p.color, fn: function () { fn(p.id, null); } });
    sections(p).forEach(function (s) { items.push({ label: p.name + ' › ' + s.name, color: p.color, fn: function () { fn(p.id, s.id); } }); });
  });
  return items;
}

// ── the date picker: day, time, repeat, reminder ────────────────────────────────────────
// p.get() -> { due, repeat, remind }; p.set(value) stores it wherever it belongs (a task, the
// add box, or several selected tasks).
function repeatKey(r) {
  if (!r) return '';
  if (r.after) return 'custom';
  if (r.unit === 'week' && r.days) return r.every === 1 && r.days.join() === '1,2,3,4,5' ? 'weekday' : 'custom';
  if (r.every === 1) return r.unit;
  return r.every === 2 && r.unit === 'week' ? '2week' : 'custom';
}
function dateHtml(p) {
  var v = p.get(), n = now(), picked = v.due ? v.due.date : null, ws = state.settings.weekStart;
  if (!p.month) p.month = (picked || n.day).slice(0, 7) + '-01';
  var sat = C.addDays(n.day, (6 - C.dow(n.day) + 7) % 7), mon = C.addDays(C.startOfWeek(n.day, 1), 7);
  function quick(label, day, ic) {
    var d = day ? C.fromYmd(day) : null;
    return '<button class="t-pop__item" data-act="dp-quick" data-day="' + (day || '') + '">' + icon(ic) + '<span>' + label + '</span>' + (d ? '<span class="t-pop__hint">' + C.DAY_SHORT[d.getDay()] + ' ' + C.MONTH_SHORT[d.getMonth()] + ' ' + d.getDate() + '</span>' : '') + '</button>';
  }
  var h = quick('Today', n.day, 'today') + quick('Tomorrow', C.addDays(n.day, 1), 'calendar') +
    quick(sat === n.day ? 'Next weekend' : 'This weekend', sat === n.day ? C.addDays(sat, 7) : sat, 'calendar') + quick('Next week', mon, 'upcoming') +
    (v.due ? quick('No date', '', 'x') : '') + '<hr class="yc-divider">';
  var first = C.fromYmd(p.month), busy = {};
  openTasks().forEach(function (t) { if (t.due) busy[t.due.date] = 1; });
  h += '<div class="t-cal__head"><button class="t-iconbtn" data-act="dp-month" data-step="-1" aria-label="Previous month">' + icon('left') + '</button>' +
    '<span>' + C.MONTH_NAMES[first.getMonth()] + ' ' + first.getFullYear() + '</span>' +
    '<button class="t-iconbtn" data-act="dp-month" data-step="1" aria-label="Next month">' + icon('chev') + '</button></div><div class="t-cal">';
  for (var i = 0; i < 7; i++) h += '<span>' + C.DAY_SHORT[(i + ws) % 7].slice(0, 2) + '</span>';
  var day = C.startOfWeek(p.month, ws);
  for (var c = 0; c < 42; c++) {
    var d = C.fromYmd(day), cls = 't-day' + (day.slice(0, 7) !== p.month.slice(0, 7) ? ' is-out' : '') + (day < n.day ? ' is-past' : '') + (day === n.day ? ' is-today' : '') + (day === picked ? ' is-picked' : '') + (busy[day] ? ' has-tasks' : '');
    h += '<button class="' + cls + '" data-act="dp-day" data-day="' + day + '" aria-label="' + C.MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() + '"' + (day === picked ? ' aria-pressed="true"' : '') + '>' + d.getDate() + '</button>';
    day = C.addDays(day, 1);
    if (c >= 34 && day.slice(0, 7) !== p.month.slice(0, 7) && C.dow(day) === ws) break;
  }
  h += '</div><hr class="yc-divider" style="margin:6px 0"><div class="t-pop__pad">';
  h += '<div class="t-date__row"><label for="dp-time">Time</label><input type="time" class="yc-input" id="dp-time" data-change="dp-time" value="' + (v.due && v.due.time ? v.due.time : '') + '"></div>';
  var rk = p.custom ? 'custom' : repeatKey(v.repeat);
  h += '<div class="t-date__row"><label for="dp-repeat">Repeat</label><select class="yc-select" id="dp-repeat" data-change="dp-repeat">' +
    [['', 'Does not repeat'], ['day', 'Every day'], ['weekday', 'Every weekday (Mon–Fri)'], ['week', 'Every week'], ['2week', 'Every 2 weeks'], ['month', 'Every month'], ['year', 'Every year'], ['custom', 'Custom…']]
      .map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === rk ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>';
  if (rk === 'custom') {
    var r = v.repeat || { every: 1, unit: 'week' };
    h += '<div class="yc-box t-date__custom"><div class="yc-row"><span>Every</span><input type="number" min="1" max="999" class="yc-input" id="dp-every" data-change="dp-every" value="' + r.every + '" aria-label="How many">' +
      '<select class="yc-select" id="dp-unit" data-change="dp-unit" aria-label="Unit">' + ['day', 'week', 'month', 'year'].map(function (u) { return '<option value="' + u + '"' + (u === r.unit ? ' selected' : '') + '>' + u + (r.every === 1 ? '' : 's') + '</option>'; }).join('') + '</select></div>';
    if (r.unit === 'week') h += '<div class="t-weekdays" role="group" aria-label="On these days">' + [0, 1, 2, 3, 4, 5, 6].map(function (x) { var dd = (x + ws) % 7; return '<button class="yc-filter" data-act="dp-wd" data-d="' + dd + '" aria-pressed="' + (!!r.days && r.days.indexOf(dd) >= 0) + '">' + C.DAY_SHORT[dd].slice(0, 2) + '</button>'; }).join('') + '</div>';
    h += '<div class="yc-row yc-row--between"><span>Count from the day I finish it</span><button class="yc-switch" id="dp-after" role="switch" data-change="dp-after" aria-checked="' + !!r.after + '" aria-label="Count from the day I finish it"></button></div></div>';
  }
  if (v.due && v.due.time) h += '<div class="t-date__row"><label for="dp-remind">Remind</label><select class="yc-select" id="dp-remind" data-change="dp-remind">' +
    [['', 'No reminder'], ['0', 'At the time it is due'], ['10', '10 minutes before'], ['30', '30 minutes before'], ['60', '1 hour before'], ['1440', '1 day before']]
      .map(function (o) { return '<option value="' + o[0] + '"' + (String(v.remind == null ? '' : v.remind) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    '<div class="yc-caption">Reminders appear while Tasks is open in YouCoded.</div>';
  if (v.repeat) h += '<div class="yc-caption">' + icon('repeat') + ' ' + esc(C.describeRepeat(v.repeat)) + '</div>';
  return h + '<div class="yc-row yc-row--end"><button class="yc-button yc-button--sm" data-act="dp-close">Done</button></div></div>';
}
function dpChange(fn) {
  var p = ui.pop;
  if (!p || p.type !== 'date') return;
  var cur = p.get(), v = { due: cur.due ? { date: cur.due.date, time: cur.due.time } : null, repeat: cur.repeat ? JSON.parse(JSON.stringify(cur.repeat)) : null, remind: cur.remind };
  var hadTime = !!(v.due && v.due.time);
  fn(v);
  // A time or a repeat needs a day to hang on: today, unless one is picked.
  if (!v.due && v.wantDay) v.due = { date: now().day, time: v.wantTime || null };
  delete v.wantDay; delete v.wantTime;
  if (!v.due) { v.repeat = null; v.remind = null; }
  else {
    if (!v.due.time) v.remind = null;
    else if (!hadTime && v.remind == null) v.remind = 0;
    if (v.repeat) {
      v.repeat = C.cleanRepeat(v.repeat);
      if (v.repeat && (v.repeat.unit === 'month' || v.repeat.unit === 'year')) v.repeat.anchor = C.fromYmd(v.due.date).getDate(); else if (v.repeat) delete v.repeat.anchor;
    }
  }
  p.set(v);
  if (ui.pop === p) renderPop();
}
function taskDateTarget(id) {
  return {

// WHY only while open: a page has no way to notify when it is closed — that needs the app.
function checkReminders() {
  var n = now(), changed = false;
  openTasks().forEach(function (t) {
    if (!t.due || !t.due.time || t.remind == null) return;
    var key = t.id + '|' + t.due.date + t.due.time + '|' + t.remind;
    var d = C.fromYmd(t.due.date); d.setHours(+t.due.time.slice(0, 2), +t.due.time.slice(3), 0, 0);
    var at = ui.snooze[key] || (+d - t.remind * 60000);
    // Something that came due long before the page was opened is already in Overdue; no pop-up.
    if (ui.fired[key] || n.ms < at || at < ui.openedAt - 5 * 60000) return;
    ui.fired[key] = { id: t.id, key: key }; changed = true;
  });
  if (changed) renderAlerts();
}
function renderAlerts() {
  var h = '';

    var f = ui.fired[key], t = f && f.id ? task(f.id) : null;
    if (!t || t.done || f.closed) return;
    var info = C.dueInfo(t.due, now(), state.settings.h12);
    h += '<div class="yc-notice yc-notice--warning" role="alert"><div class="yc-notice__text"><span class="yc-notice__title">' + esc(t.title) + '</span>' + (info ? 'Due ' + esc(info.text) : '') + '</div>' +

      '<button class="yc-button yc-button--sm yc-button--ghost" data-act="alert-snooze" data-key="' + esc(key) + '">In 10 minutes</button>' +
      '<button class="yc-button yc-button--sm" data-act="alert-done" data-key="' + esc(key) + '">Mark done</button></div></div>';
  });
  $('alerts').innerHTML = h;
}

// ── listening ───────────────────────────────────────────────────────────────────────────
document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t.closest) return;
  // A click anywhere else puts a floating menu away and does nothing more.
  if (ui.pop && !t.closest('#pop') && !t.closest('.yc-menu')) { closePop(); e.preventDefault(); return; }
  var el = t.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el, e);
});
document.addEventListener('change', function (e) {
  var el = e.target.closest ? e.target.closest('[data-change]') : null;
  if (el && CHANGE[el.getAttribute('data-change')]) CHANGE[el.getAttribute('data-change')](el);
});
document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'ed-title') { ui.editor.text = e.target.value; refreshEditor(); }
  else if (id === 'ed-notes') ui.editor.notes = e.target.value;
  else if (id === 'd-title') growTitle();
  else if (id === 'search') {
    var q = e.target.value;
    if (q || ui.view.kind === 'search') { ui.view = { kind: 'search', q: q }; ui.selecting = false; render(); }
  }
});
document.addEventListener('keydown', function (e) {
  var t = e.target, id = t.id, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if (e.key === 'Escape') {
    // The app's own dropdown list (an open <select>) closes itself first.
    if (document.querySelector('.yc-menu[role="listbox"]')) return;
    var used = true;
    if (ui.pop) closePop();
    else if (ui.modal) { closeModal(); render(); }
    else if (ui.editor) closeEditor();
    else if ($('app').classList.contains('is-nav-open')) $('app').classList.remove('is-nav-open');
    else if (ui.selecting) { endSelecting(); renderMain(); }
    else if (ui.detailId) { ui.detailId = null; render(); }
    else if (ui.view.kind === 'search') go({ kind: state.settings.startView });
    else used = false;
    // WHY preventDefault: the app treats an unused Escape as "leave this page".
    if (used) e.preventDefault();
    return;
  }
  if (e.key === 'Enter' && !e.isComposing) {
    if (id === 'ed-title' || id === 'ed-notes') { e.preventDefault(); submitEditor(); }
    else if (id === 'd-title') { e.preventDefault(); t.blur(); }
    else if (id === 'd-sub') {
      var title = t.value.trim(), parent = ui.detailId;
      if (title) { t.value = ''; commit(function () { C.addTask(state, { title: title, parentId: parent }, now().iso); }); }
    }
    else if (id === 'd-comment' && (e.ctrlKey || e.metaKey)) ACT['d-comment-add']();
    else if (id === 'lp-new') {
      var p = ui.pop, name, raw = t.value;
      if (!raw.trim() || !p) return;
      commit(function () { name = C.ensureLabel(state, raw); });
      var on = p.get().slice();
      if (name && on.indexOf(name) < 0) { on.push(name); p.set(on); }
      if (ui.pop === p) { renderPop(); if ($('lp-new')) $('lp-new').focus(); }
    }
    else if (t.hasAttribute && t.hasAttribute('data-enter')) { e.preventDefault(); ACT['modal-ok'](); }
    else if (t.classList && (t.classList.contains('t-task') || t.classList.contains('t-sub'))) ACT.open(t);
    return;
  }
  if (e.key === ' ' && t.classList && (t.classList.contains('t-task') || t.classList.contains('t-sub'))) { e.preventDefault(); ACT.open(t); return; }
  if (typing || ui.modal || ui.pop || e.altKey) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey) return;
  if (e.key === 'q' || e.key === 'n') { e.preventDefault(); ACT['quick-add'](); }
  else if (e.key === '/') { e.preventDefault(); $('app').classList.add('is-nav-open'); $('search').focus(); }
});

// ── dragging a task: onto another to reorder, into a section, a project, or a day ───────
function clearDropMarks() {
  Array.prototype.forEach.call(document.querySelectorAll('.drop-before, .drop-after, .is-drop'), function (el) { el.classList.remove('drop-before', 'drop-after', 'is-drop'); });
}

  if (zone.hasAttribute('data-drop-due')) return { el: zone, due: zone.getAttribute('data-drop-due') };
  var row = t.closest('.t-task'), out = { el: zone, where: JSON.parse(zone.getAttribute('data-drop')) };

    var r = row.getBoundingClientRect();
    out.row = row; out.before = e.clientY < r.top + r.height / 2;

}

    else if (over && over.parentId) over = task(over.parentId);
    if (over) {
      var sibs = state.tasks.filter(function (x) { return x.id !== id && x.projectId === over.projectId && x.sectionId === over.sectionId && x.parentId === over.parentId; }).sort(function (a, b) { return a.order - b.order; });
