name: Workspace CI

# Runs the two workspace-owned verdict tools that previously ran nowhere
# automatically: the doc/rule anchor checker and the ast-grep invariant scan.
#
# WHY THIS EXISTS: CLAUDE.md ranks "a pinning test > an ast-grep rule" at the top
# of where knowledge should live, and both of those tiers are supposed to
# *execute*. They didn't. `scripts/audit-anchors.mjs` only ran when Destin typed
# `/audit`, and `scripts/ast-grep/check.sh` only when a session remembered it. A
# rule whose `verify:` path moved stayed silently wrong in the meantime, and a
# stale rule is worse than no rule because it auto-injects and is believed.
#
# THE CRON IS THE POINT. Anchors here reference files inside the SUB-repos, so
# they break when `youcoded` moves — which never triggers a push to this repo.
# Push/PR runs only catch drift someone introduces while editing the workspace;
# the daily run is what actually catches the common case.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose — GitHub delays cron jobs
    # scheduled at :00 under load.
    - cron: '17 6 * * *'
  workflow_dispatch:

# The introducing push (d53f4f7) dispatched TWO runs — same workflow id, same
# commit, same second, both attempt=1 — with only one workflow file and one ref
# on the remote. Cause unknown and GitHub-side; this collapses duplicates rather
# than explaining them, and also stops a rapid second push from paying for a run
# whose result is already stale.
concurrency:
  group: workspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anchors:
    name: Anchors and invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Sub-repos are gitignored here and cloned by setup.sh, so a bare checkout
      # of this repo cannot resolve a single anchor — every one of the 100+ MAP
      # paths would report missing and the run would be noise.
      #
      # NOT `bash setup.sh`: that also clones itsdestin/youcoded-admin (the one
      # PRIVATE repo, which would need a PAT) and then tries to `git pull` this
      # repo over itself, which is wrong inside a CI checkout. Verified that no
      # rule `paths:` glob and no docs/MAP.md path references youcoded-admin, so
      # omitting it costs no coverage. If that ever changes, audit-anchors
      # reports it as `repo youcoded-admin not found on disk` rather than
      # silently passing.
      #
      # --depth 1: the checks are file-existence, regex-contains, and
      # `git ls-files`. None of them read history.
      - name: Clone public sub-repos
        run: |
          set -euo pipefail
          for entry in youcoded:master youcoded-core:master \
                       wecoded-themes:main wecoded-marketplace:master; do
            name="${entry%%:*}"
            branch="${entry##*:}"
            git clone --depth 1 --branch "$branch" \
              "https://github.com/itsdestin/$name.git" "$name"
          done

      # The checker's own unit tests. If its parsers regress, every anchor result
      # below is untrustworthy — so this runs first and gates the rest.
      - name: Test the anchor checker
        run: node --test scripts/audit-anchors.test.mjs

      # The SessionStart/PreToolUse hooks are code that reports on state, and both
      # already have suites — neither of which ran anywhere. That is the failure
      # shape context-inject.test.mjs was written about: a check that stops
      # checking goes quiet, not red. !cancelled() so a red anchors step above
      # does not silently skip them.
      - name: Test the workspace hooks
        if: ${{ !cancelled() }}
        run: node --test .claude/hooks/context-inject.test.mjs .claude/hooks/glob-guard.test.mjs .claude/hooks/roadmap-edit-check.test.mjs

      # The workbench boot check reported "All 16 workbench routes mount cleanly"
      # against a port nothing was serving — verified 2026-09-02 on a dead port,
      # exit 0. CLAUDE.md tells every session to trust that check. These two cases
      # need no Chrome (the preflight now runs before the browser launches), so
      # they belong on this runner.
      # The two guards that keep the SHARED checkout from drifting: the commit
      # guard and workspace-sync.sh. Both are only ever exercised on Destin's
      # machine, so CI is the only thing that would notice them rotting.
      - name: Test the workspace drift guards
        run: node --test scripts/workspace-drift-guards.test.mjs scripts/workspace-mcp.test.mjs

      - name: Test the workbench boot check
        if: ${{ !cancelled() }}
        run: node --test scripts/workbench-boot-check.test.mjs

      # The review deck — the tool Destin approves every UI change on — had ten
      # test files and no caller: not this workflow, not a script, not its README.
      # Asked for the first time on 2026-08-31 they were not merely unrun but RED
      # (eight theme colours in deck/tokens.json had drifted from the app's
      # globals.css), and the command the docs carried could not even start
      # (`-t .` cannot import a directory with no __init__.py). Same shape as the
      # hooks above: a check that stops checking goes quiet, not red.
      #
      # ONLY these five suites. Every other one shells out to `magick` (test_boxes,
      # test_build, test_crops, test_cli, test_serve) or drives Chrome/ffmpeg (the
      # three *.test.mjs), none of which this runner has — so they stay local and
      # scripts/ui-review/README.md says so. test_live, test_words and test_contract
      # are written picture-free on purpose to keep the new coverage on this side of
      # that line.
      #
      # working-directory, not `-t`: the suites live outside a package, so each one
      # bootstraps its own sys.path and must be imported as a top-level module.
      - name: Test the review deck
        if: ${{ !cancelled() }}
        working-directory: scripts/ui-review/tests
        run: python3 -m unittest -v test_spec test_tokens test_live test_words test_contract

      # close-out.sh is the one script in here that a session is TOLD to obey line by
      # line (the wrap-up skill: "finish every line it reports"), so a wrong TODO in it
      # is an instruction, not a suggestion. On 2026-09-03 it told a session to delete
      # master and remove the main checkout. Needs only git, so unlike the deck's picture
      # suites it belongs on this runner.
      - name: close-out.sh refuses the default branch
        if: ${{ !cancelled() }}
        run: bash scripts/ui-review/tests/close-out-default-branch.test.sh

      # Same reasoning, the other direction: the script must not report MERGED work as
      # lost. Run without its optional repo argument on a workspace docs branch — the
      # shape every wrap-up produces — it used to print "never pushed", which reads as
      # an instruction to go and redo the work.
      - name: close-out.sh names the right repo instead of crying "never pushed"
        if: ${{ !cancelled() }}
        run: bash scripts/ui-review/tests/close-out-wrong-repo.test.sh

      # The pre-merge report must say whether the branch still merges cleanly — two branches
      # passed every check on 2026-09-04 and conflicted on the generated roadmap table at merge.
      - name: close-out.sh reports a merge conflict before anyone asks "ready to merge?"
        if: ${{ !cancelled() }}
        run: bash scripts/ui-review/tests/close-out-conflict.test.sh

      # A command printed in a doc is a promise nobody checks. The deck's test command sat
      # WRONG in two docs for months — `-t .` cannot start at all — which is why that suite
      # went unrun and eight theme colours drifted. Blocks marked `<!-- runnable -->` are
      # executed here; `<!-- runnable: local -->` ones need magick/ffmpeg/Chrome and are
      # skipped. Marking is opt-in per block, so this only ever runs what a doc claimed.
      - name: Run the commands the docs tell you to run
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-commands.mjs

      # --no-diff skips the "which subsystems changed since the last audit
      # report" computation. That is a scoping aid for the /audit agent and needs
      # git history plus a dated report; the mechanical anchor pass does not.
      - name: Verify anchors, MAP paths, and store budgets
        run: node scripts/audit-anchors.mjs --no-diff

      # The roadmap tool's own tests gate its run, same reasoning as the anchor checker.
      - name: Test roadmap-check
        if: ${{ !cancelled() }}
        run: node --test scripts/roadmap-check.test.mjs

      # Structure errors fail CI. Broken claims and count drift are LISTED and never fail
      # it — a rotted claim is the roadmap asking to be re-verified, which is the design
      # working, and a count drift must not go red for every other session (spec §5).
      # Dormant (one line, exit 0) until the migration branch creates docs/roadmap/.
      - name: Roadmap structure
        if: ${{ !cancelled() }}
        run: node scripts/roadmap-check.mjs --quiet

      # check.sh falls back to `npx --yes @ast-grep/cli` when the binary is
      # absent, which re-resolves the package on every invocation. Installing it
      # once is faster and makes a network failure a clear install error rather
      # than a confusing scan error.
      # !cancelled() on both ast-grep steps: they are INDEPENDENT of the anchor
      # pass, and steps fail-fast by default. Without this, a red anchors step
      # (which is the state today — see the commit that added this workflow)
      # means the invariant scan silently never runs at all, and a run reports
      # one finding when there might be two.
      - name: Install ast-grep
        if: ${{ !cancelled() }}
        run: npm install -g @ast-grep/cli

      # Scans youcoded/desktop/src (the clone above) against scripts/ast-grep/rules,
      # and the violation fixtures in the same pass — a rule that has silently
      # stopped matching fails this step instead of passing quietly.
      - name: Executable invariants (ast-grep)
        if: ${{ !cancelled() }}
        run: bash scripts/ast-grep/check.sh
