<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacing Test</title>
<style>
  body {
    margin: 0;
    padding: 2rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #14161a;
    color: #f2f4f8;
  }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  .rail { background: #1e2229; border-radius: 12px; padding: 1px 0; }
  .box {
    height: 72px;
    border-radius: 10px;
    background: #4a8fe8;
    color: #14161a;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    padding-left: 0.75rem;
  }
  .m-sm { margin: 8px; }
  .m-md { margin: 24px; }
  .m-lg { margin: 48px; }
</style>
</head>
<body>
  <h1>Spacing Test</h1>
  <div class="rail">
    <div class="box m-sm">margin: 8px</div>
    <div class="box m-md">margin: 24px</div>
    <div class="box m-lg">margin: 48px</div>
  </div>
</body>
</html>
